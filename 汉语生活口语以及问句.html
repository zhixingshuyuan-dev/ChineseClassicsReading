      return qData.qTransZh[idx] || qData.qWords[idx];
    }
    function getQuestionSentenceTranslation(qData) {
      const key = `wholeQ${currentLang.charAt(0).toUpperCase() + currentLang.slice(1)}`;
      return qData[key] || qData.wholeQZh || qData.qWords.join('');
    }

    function renderAll() {
      const root = document.getElementById('dynamic-sentences-root');
      root.innerHTML = '';
      let lastCategory = '';
      for (let s of sentencesData) {
        if (s.category !== lastCategory) {
          lastCategory = s.category;
          const catDiv = document.createElement('div'); catDiv.className = 'section-category';
          catDiv.innerHTML = `<span class="category-title">${s.category}</span>`; root.appendChild(catDiv);
        }
        const block = document.createElement('div'); block.className = 'sentence-block';
        const header = document.createElement('div'); header.className = 'sentence-header';
        header.innerHTML = `<span class="sentence-number">#${s.id}</span>
          <button class="action-btn show-translations"><i class="fas fa-language"></i> 词译</button>
          <button class="action-btn translate-sentence"><i class="fas fa-globe"></i> 整句翻译</button>
          <button class="action-btn hide-original-btn"><i class="fas fa-eye-slash"></i> 隐藏原文</button>
          <button class="action-btn play-sentence"><i class="fas fa-volume-up"></i> <span class="speed-badge">原速</span></button>`;
        const lineDiv = document.createElement('div'); lineDiv.className = 'line';
        for (let i=0; i<s.words.length; i++) {
          const w=s.words[i]; const wc=document.createElement('span'); wc.className='word-container';
          const cn=document.createElement('span'); cn.className='chinese-word'; cn.textContent=w;
          const tr=document.createElement('span'); tr.className='word-translation-popup'; tr.textContent=getWordTranslation(s,i);
          wc.appendChild(cn); wc.appendChild(tr); lineDiv.appendChild(wc);
          cn.addEventListener('mouseenter',(e)=>showPinyin(s.pinyin[i],e)); cn.addEventListener('mouseleave',hidePinyin);
          cn.addEventListener('click',(e)=>{e.stopPropagation(); speakChinese(w);});
          tr.addEventListener('click',(e)=>{e.stopPropagation(); cn.classList.toggle('hidden-word');});
        }
        const transDiv=document.createElement('div'); transDiv.className='sentence-translation';
        const transSpan=document.createElement('span'); transSpan.textContent=getSentenceTranslation(s);
        const voiceBtn=document.createElement('button'); voiceBtn.className='translation-voice-btn'; voiceBtn.innerHTML='<i class="fas fa-head-side-vr"></i> 朗读';
        voiceBtn.addEventListener('click',(e)=>{e.stopPropagation(); speakTextInLang(getSentenceTranslation(s),currentLang);});
        transDiv.appendChild(transSpan); transDiv.appendChild(voiceBtn);
        block.appendChild(header); block.appendChild(lineDiv); block.appendChild(transDiv);

        const qData=getQAData(s.id); const qWrapper=document.createElement('div'); qWrapper.className='question-wrapper';
        const qHeader=document.createElement('div'); qHeader.className='question-header';
        qHeader.innerHTML=`<span style="color:#9bcd6c; margin-right:8px;"><i class="fas fa-question-circle"></i> 口语问句</span>
          <button class="action-btn question-show-translations" style="color:#9bcd6c;"><i class="fas fa-language"></i> 词译</button>
          <button class="action-btn question-translate-sentence" style="color:#9bcd6c;"><i class="fas fa-globe"></i> 整句翻译</button>
          <button class="action-btn question-hide-original" style="color:#9bcd6c;"><i class="fas fa-eye-slash"></i> 隐藏原文</button>
          <button class="action-btn play-sentence" style="color:#9bcd6c;"><i class="fas fa-volume-up"></i> <span class="speed-badge">原速</span></button>`;
        const qLineDiv=document.createElement('div'); qLineDiv.className='question-line';
        for (let i=0;i<qData.qWords.length;i++) {
          const w=qData.qWords[i]; const container=document.createElement('span'); container.className='question-word-container';
          const charSpan=document.createElement('span'); charSpan.className='chinese-word'; charSpan.textContent=w;
          const qTransSpan=document.createElement('span'); qTransSpan.className='word-translation-popup'; qTransSpan.textContent=getQuestionWordTranslation(qData,i);
          container.appendChild(charSpan); container.appendChild(qTransSpan); qLineDiv.appendChild(container);
          charSpan.addEventListener('mouseenter',(e)=>showPinyin(qData.qPinyin[i],e)); charSpan.addEventListener('mouseleave',hidePinyin);
          charSpan.addEventListener('click',(e)=>{e.stopPropagation(); speakChinese(w);});
          qTransSpan.addEventListener('click',(e)=>{e.stopPropagation(); charSpan.classList.toggle('hidden-word');});
        }
        const qTransDiv=document.createElement('div'); qTransDiv.className='question-sentence-translation';
        const qTransSpan=document.createElement('span'); qTransSpan.textContent=getQuestionSentenceTranslation(qData);
        const qVoiceBtn=document.createElement('button'); qVoiceBtn.className='translation-voice-btn'; qVoiceBtn.innerHTML='<i class="fas fa-volume-up"></i> 朗读';
        qVoiceBtn.addEventListener('click',(e)=>{e.stopPropagation(); speakChinese(qData.qWords.join(''));});
        qTransDiv.appendChild(qTransSpan); qTransDiv.appendChild(qVoiceBtn);
        const ansArea=document.createElement('div'); ansArea.className='question-answer-area';
        const ansBtn=document.createElement('button'); ansBtn.className='answer-btn'; ansBtn.innerHTML='<i class="fas fa-reply"></i> 显示答案';
        const ansDisplay=document.createElement('div'); ansDisplay.className='answer-text';
        ansBtn.addEventListener('click',(e)=>{
          e.stopPropagation();
          ansDisplay.innerHTML = `<span>🗣️ ${qData.a}</span> <button class="answer-play"><i class="fas fa-play"></i></button>`;
          ansDisplay.style.display = 'inline-flex';
          const playBtn = ansDisplay.querySelector('.answer-play');
          if (playBtn) {
            playBtn.addEventListener('click', (ev) => {
              ev.stopPropagation();
              speakChinese(qData.a);
            });
          }
          speakChinese(qData.a);
        });
        ansArea.appendChild(ansBtn); ansArea.appendChild(ansDisplay);
        qWrapper.appendChild(qHeader); qWrapper.appendChild(qLineDiv); qWrapper.appendChild(qTransDiv); qWrapper.appendChild(ansArea);
        block.appendChild(qWrapper); root.appendChild(block);

        const mainTransSpans=block.querySelectorAll('.line .word-translation-popup');
        block.querySelector('.show-translations').addEventListener('click',(e)=>{e.stopPropagation(); const s=mainTransSpans[0]?.style.display==='block'; mainTransSpans.forEach(t=>t.style.display=s?'none':'block');});
        block.querySelector('.translate-sentence').addEventListener('click',(e)=>{e.stopPropagation(); transDiv.style.display=transDiv.style.display==='flex'?'none':'flex';});
        block.querySelector('.hide-original-btn').addEventListener('click',(e)=>{e.stopPropagation(); lineDiv.classList.toggle('hidden-original');});
        const mainPlay=block.querySelector('.play-sentence'); const mainBadge=mainPlay.querySelector('.speed-badge'); let ms=0; const speeds=[0.85,0.6,0.45]; const labels=['原速','慢30%','慢50%'];
        mainPlay.addEventListener('click',(e)=>{e.stopPropagation(); speakChinese(s.words.join(''),speeds[ms]); mainBadge.textContent=labels[ms]; ms=(ms+1)%3;});
        const qTransSpans=qWrapper.querySelectorAll('.question-line .word-translation-popup');
        qWrapper.querySelector('.question-show-translations').addEventListener('click',(e)=>{e.stopPropagation(); const s=qTransSpans[0]?.style.display==='block'; qTransSpans.forEach(t=>t.style.display=s?'none':'block');});
        qWrapper.querySelector('.question-translate-sentence').addEventListener('click',(e)=>{e.stopPropagation(); qTransDiv.style.display=qTransDiv.style.display==='flex'?'none':'flex';});
        qWrapper.querySelector('.question-hide-original').addEventListener('click',(e)=>{e.stopPropagation(); qLineDiv.classList.toggle('hidden-original');});
        const qPlay=qWrapper.querySelector('.play-sentence'); const qBadge=qPlay.querySelector('.speed-badge'); let qs=0;
        qPlay.addEventListener('click',(e)=>{e.stopPropagation(); speakChinese(qData.qWords.join(''),speeds[qs]); qBadge.textContent=labels[qs]; qs=(qs+1)%3;});
      }
    }

    function setLanguage(lang) { currentLang=lang; document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang)); renderAll(); }
    document.getElementById('langBar').addEventListener('click',(e)=>{const b=e.target.closest('.lang-btn'); if(b) setLanguage(b.dataset.lang);});
    document.body.addEventListener('click',function init(){initSpeech();},{once:true});
    document.addEventListener('click',hidePinyin);
    setLanguage('zh');
  })();
</script>
</body>
</html>
