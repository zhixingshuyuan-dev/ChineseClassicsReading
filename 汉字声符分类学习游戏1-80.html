        // 全局变量
        let currentRadicalIndex = 0;
        let currentRadical = null;
        let currentCharacters = [];
        let currentIndex = 0;
        let currentPage = 1;
        let timer = null;
        let isPaused = false;
        let charactersPerPage = 10; // 每页显示的汉字数量

        // 将所有声符合并到一个数组中
        const allRadicals = radicalsData.flat();

        // 开始学习
        function startLearning() {
            currentRadicalIndex = 0;
            currentRadical = allRadicals[currentRadicalIndex];
            currentCharacters = currentRadical.characters;
            currentIndex = 0;
            currentPage = 1;
            
            // 显示学习区域
            document.getElementById('initialMessage').style.display = 'none';
            document.getElementById('radicalInfo').style.display = 'block';
            document.getElementById('characterDisplay').style.display = 'block';
            document.getElementById('pinyinDisplay').style.display = 'block';
            document.getElementById('counter').style.display = 'block';
            document.getElementById('progressBar').style.display = 'block';
            document.getElementById('controls').style.display = 'flex';
            document.getElementById('pagination').style.display = 'flex';
            
            // 开始显示汉字
            startDisplay();
        }

        // 开始显示汉字
        function startDisplay() {
            clearInterval(timer);
            isPaused = false;
            document.getElementById('pauseBtn').textContent = '暂停';
            
            // 更新声符信息
            document.getElementById('radicalInfo').textContent = `当前声符: ${currentRadical.radical} (${currentRadicalIndex + 1}/${allRadicals.length})`;
            
            // 计算当前页的起始和结束索引
            const startIndex = (currentPage - 1) * charactersPerPage;
            const endIndex = Math.min(startIndex + charactersPerPage, currentCharacters.length);
            const pageCharacters = currentCharacters.slice(startIndex, endIndex);
            
            // 更新分页信息
            updatePaginationInfo();
            
            // 重置进度
            currentIndex = 0;
            updateProgress();
            
            // 开始显示当前页的汉字
            displayNextCharacter(pageCharacters);
        }

        // 显示下一个汉字
        function displayNextCharacter(characters) {
            if (currentIndex >= characters.length) {
                // 当前页显示完毕，自动翻到下一页或下一个声符
                autoAdvance();
                return;
            }
            
            const character = characters[currentIndex];
            const pinyin = pinyinData[character] || "未知";
            
            document.getElementById('characterDisplay').textContent = character;
            document.getElementById('pinyinDisplay').textContent = pinyin;
            document.getElementById('counter').textContent = `当前: ${currentIndex + 1}/${characters.length}`;
            
            // 朗读当前汉字
            speakCharacter(character);
            
            currentIndex++;
            updateProgress(characters.length);
            
            // 设置定时器显示下一个汉字
            if (!isPaused) {
                timer = setTimeout(() => {
                    displayNextCharacter(characters);
                }, 3000);
            }
        }

        // 自动翻页或翻到下一个声符
        function autoAdvance() {
            const totalPages = Math.ceil(currentCharacters.length / charactersPerPage);
            
            if (currentPage < totalPages) {
                // 还有下一页，翻到下一页
                currentPage++;
                startDisplay();
            } else if (currentRadicalIndex < allRadicals.length - 1) {
                // 当前声符已学完，翻到下一个声符
                currentRadicalIndex++;
                currentRadical = allRadicals[currentRadicalIndex];
                currentCharacters = currentRadical.characters;
                currentPage = 1;
                startDisplay();
            } else {
                // 所有声符已学完
                document.getElementById('characterDisplay').textContent = "完成";
                document.getElementById('pinyinDisplay').textContent = "恭喜您已完成所有学习内容";
                document.getElementById('counter').textContent = "学习完成";
                updateProgress(100);
            }
        }

        // 朗读汉字
        function speakCharacter(character) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(character);
                utterance.lang = 'zh-CN';
                utterance.rate = 0.8; // 稍微放慢语速
                speechSynthesis.speak(utterance);
            }
        }

        // 手动朗读当前汉字
        function speakCurrentCharacter() {
            const character = document.getElementById('characterDisplay').textContent;
            if (character && character !== "完成") {
                speakCharacter(character);
            }
        }

        // 更新进度条
        function updateProgress(total = 0) {
            const progressFill = document.getElementById('progressFill');
            if (total > 0) {
                const progress = (currentIndex / total) * 100;
                progressFill.style.width = `${progress}%`;
            } else {
                progressFill.style.width = '0%';
            }
        }

        // 更新分页信息
        function updatePaginationInfo() {
            const totalPages = Math.ceil(currentCharacters.length / charactersPerPage);
            document.getElementById('currentRadicalIndex').textContent = currentRadicalIndex + 1;
            document.getElementById('totalRadicals').textContent = allRadicals.length;
            document.getElementById('currentPage').textContent = currentPage;
            document.getElementById('totalPages').textContent = totalPages;
            
            // 更新按钮状态
            document.getElementById('prevRadicalBtn').disabled = currentRadicalIndex <= 0;
            document.getElementById('nextRadicalBtn').disabled = currentRadicalIndex >= allRadicals.length - 1;
            document.getElementById('prevBtn').disabled = currentPage <= 1;
            document.getElementById('nextBtn').disabled = currentPage >= totalPages;
        }

        // 上一个声符
        function prevRadical() {
            if (currentRadicalIndex > 0) {
                currentRadicalIndex--;
                currentRadical = allRadicals[currentRadicalIndex];
                currentCharacters = currentRadical.characters;
                currentPage = 1;
                startDisplay();
            }
        }

        // 下一个声符
        function nextRadical() {
            if (currentRadicalIndex < allRadicals.length - 1) {
                currentRadicalIndex++;
                currentRadical = allRadicals[currentRadicalIndex];
                currentCharacters = currentRadical.characters;
                currentPage = 1;
                startDisplay();
            }
        }

        // 上一页
        function prevPage() {
            if (currentPage > 1) {
                currentPage--;
                startDisplay();
            }
        }

        // 下一页
        function nextPage() {
            const totalPages = Math.ceil(currentCharacters.length / charactersPerPage);
            if (currentPage < totalPages) {
                currentPage++;
                startDisplay();
            }
        }

        // 暂停/继续
        function togglePause() {
            isPaused = !isPaused;
            document.getElementById('pauseBtn').textContent = isPaused ? '继续' : '暂停';
            
            if (!isPaused) {
                // 计算当前页的起始和结束索引
                const startIndex = (currentPage - 1) * charactersPerPage;
                const endIndex = Math.min(startIndex + charactersPerPage, currentCharacters.length);
                const pageCharacters = currentCharacters.slice(startIndex, endIndex);
                
                // 继续显示当前页的汉字
                displayNextCharacter(pageCharacters);
            } else {
                clearTimeout(timer);
            }
        }

        // 重新开始
        function restart() {
            currentPage = 1;
            startDisplay();
        }

        // 初始化事件监听
        function initEventListeners() {
            document.getElementById('startButton').addEventListener('click', startLearning);
            document.getElementById('prevRadicalBtn').addEventListener('click', prevRadical);
            document.getElementById('nextRadicalBtn').addEventListener('click', nextRadical);
            document.getElementById('prevBtn').addEventListener('click', prevPage);
            document.getElementById('nextBtn').addEventListener('click', nextPage);
            document.getElementById('pauseBtn').addEventListener('click', togglePause);
            document.getElementById('restartBtn').addEventListener('click', restart);
            document.getElementById('speakBtn').addEventListener('click', speakCurrentCharacter);
        }

        // 初始化应用
        function initApp() {
            initEventListeners();
        }

        // 当页面加载完成后初始化应用
        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
