<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", "SimSun", serif;
        }
        body {
            background-color: #f5f2e9;
            color: #333;
            line-height: 1.6;
            font-size: 3em;
            padding: 20px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" opacity="0.05"><rect fill="%23333" width="100" height="100"/></svg>');
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            border: 1px solid #d9d2c2;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #c8b090;
        }
        h1 {
            color: #8c2e0b;
            font-size: 1.5em;
            margin-bottom: 10px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }
        h2 {
            color: #5e3a1e;
            font-size: 1.0em;
            margin: 25px 0 15px;
            padding-left: 10px;
            border-left: 4px solid #c8b090;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px;
            background-color: #f9f5ed;
            border-radius: 6px;
            border: 1px solid #e0d6c2;
        }
        .settings {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        select, button {
            padding: 8px 15px;
            border: 1px solid #c8b090;
            border-radius: 4px;
            background-color: #fff;
            font-size: 14px;
            cursor: pointer;
        }
        button {
            background-color: #8c2e0b;
            color: white;
            border: none;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #6d2409;
        }
        .content {
            font-size: 40px;
            line-height: 1.8;
            text-align: justify;
        }
        .sentence {
            margin-bottom: 15px;
            padding: 8px;
            border-radius: 4px;
            transition: background-color 0.2s;
        }
        .sentence:hover {
            background-color: #f9f5ed;
        }
        .char {
            display: inline-block;
            padding: 2px 1px;
            cursor: pointer;
            border-radius: 2px;
            transition: background-color 0.2s;
        }
        .char:hover {
            background-color: #e8dfce;
        }
        .char.highlight {
            background-color: #ffeb3b;
        }
        .play-btn {
            display: inline-block;
            margin-left: 10px;
            padding: 2px 8px;
            font-size: 8px;
            background-color: #5e3a1e;
            color: white;
            border-radius: 3px;
            cursor: pointer;
            vertical-align: middle;
        }
        .play-btn:hover {
            background-color: #4a2d17;
        }
        .selection-info {
            margin-top: 20px;
            padding: 10px;
            background-color: #f0e9db;
            border-radius: 4px;
            border-left: 4px solid #8c2e0b;
            display: none;
        }
        footer {
            margin-top: 30px;
            text-align: center;
            color: #777;
            font-size: 8px;
            padding-top: 15px;
            border-top: 1px solid #e0d6c2;
        }
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }
            h1 {
                font-size: 2.0em;
            }
            .content {
                font-size: 16px;
            }
            .controls {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>

            <button id="readAllBtn">朗读全文</button>

    </div>

        第三回　黄沙莽莽

寺里僧众见焦木圆寂，尽皆悲哭。有的便为伤者包扎伤处，抬入客舍。

忽听得巨钟下的铜缸内当当当响声不绝，不知里面是何怪物，众僧面面相觑，手足无措，齐声口诵《高王经》，不料“救苦救难”、“阿弥陀佛”声中，缸内响声不停，最后终于大了胆子，十多个和尚合力用粗索吊起大钟，刚将铜缸掀起少许，里面滚出来一个巨大肉团。众僧大惊，四散逃开。只见那肉团站立在地，呼呼喘气，却是韩宝驹。他给罩在铜缸之中，不知后半段的战局，眼见焦木圆寂，义兄弟个个重伤，急得哇哇大叫。提起金龙鞭便欲向丘处机头顶击落。全金发叫道：“三哥，不可！”韩宝驹怒道：“为什么？”全金发腰间剧痛，只道：“千……千万不可。”

柯镇恶双腿中剑，受伤不轻，神智却仍清明，从怀中摸出解毒药来，命僧人分别去给丘处机及韩小莹服下，一面将经过告知韩宝驹。韩宝驹大怒，转身奔出，要去追杀段天德。柯镇恶喝住，说道：“那恶徒慢慢再找不迟，你快救助受了内伤的众兄弟。”

朱聪与南希仁所受内伤甚重。全金发腰间所受的这一脚也着实不轻。张阿生胳臂折断，胸口受震，一时痛晕过去，醒转之后，却无大碍。当下众人在寺里养伤。

法华寺监寺派人到临安云栖寺去向枯木禅师报信，并为焦木禅师料理后事。

过了数日，丘处机与韩小莹身上所中的毒都消解了。丘处机精通医道，开了药方给朱聪等人调治，又分别给各人推拿按摩。幸得各人根柢均厚，内伤外伤逐渐痊可，又过数日，已能坐起。这日八人聚集在一间僧房之中，想起受了奸人从中播弄，这许多江湖上的大行家竟至误打误杀，个个重伤，还赔了焦木禅师一条性命，都黯然不语。

过了一会，韩小莹首先说道：“丘道长能干英明，天下皆知，我们七兄弟也不是初走江湖之人，这次大家竟胡里胡涂的栽在这无名之辈手里，流传出去，定教江湖上好汉耻笑。这事如何善后，还得请道长示下。”

丘处机这几日也深责自己激于义愤，太过鲁莽，如不是这般性急，只消平心静气的跟焦木交涉，必可弄个水落石出，便对柯镇恶道：“柯大哥，你说怎么办？”

柯镇恶脾气本就怪僻，瞎了双眼之后更加乖戾，这次七兄弟给丘处机一人打倒，实是生平罕遇的奇耻大辱，再加腿上剑创兀自疼痛难当，气恼愈甚，冷笑道：“丘道长仗剑横行天下，怎把别人瞧在眼里？这事又何必再问我们兄弟？”

丘处机一楞，知他气愤未消，站起身来向七人团团行了一礼，说道：“贫道无状，行事胡涂，得罪了各位，确是贫道的不是，这里向各位谢过，尚请原宥！”

朱聪等都还了礼。柯镇恶却装作不知，冷冷的道：“江湖上的事，我兄弟再也没面目理会啦。我们在这里打鱼的打鱼，砍柴的砍柴，只要道长放我们一马，不再前来寻事，我们总可安安稳稳的过这下半辈子。”

丘处机给他冷言抢白，脸上微红，默不作声，僵了半晌，站起来说道：“贫道这次坏了事，诚心认错，此后决不敢再向各位啰唣。焦木大师不幸遭难，着落在贫道身上，我必手刃奸徒，出这口恶气。现下就此别过。”说着又团团行礼，转身出外。

柯镇恶喝道：“且慢！”丘处机转身道：“柯大哥有何吩咐？”柯镇恶道：“你把我们兄弟个个打得重伤，单凭这么一句话，就算了事么？”丘处机道：“柯大哥意思怎样？贫道只要力所能及，无有不遵。”

柯镇恶低沉了声音道：“这口气我们咽不下去，还求道长再予赐教。”

江南七怪虽行侠仗义，却个个心高气傲，行止怪异，要不怎会得了“七怪”的名头？他们武功既高，又人多势众，在武林中与人争斗从未吃过亏。当年与淮阳帮失和动手，七个人在长江边上打败了淮阳帮的一百多条好汉，其时韩小莹年纪尚幼，却也杀了两名敌人，江南七怪端的是名震江湖。这一次败在丘处机一人手里，自是异常难堪。何况焦木是七怪好友，无端丧生，也可说是由丘处机行事鲁莽而起。但法华寺中明明藏着女人，而且确是郭啸天的遗孀，这一节是己方理亏，江南七怪却又置之不理了。

丘处机道：“贫道中了暗器，要不是柯大哥赐予解药，这时早登鬼域。咱们双方拼斗了一场，贫道自当认输。”柯镇恶道：“既是如此，你把背上长剑留下，作个凭证，免得将来更有纷争。”他明知此时若再动手，己方只韩氏兄妹能够下场，胜负之数那也不用提了，但说就此罢休，宁可七怪一齐命丧于他剑底。如留得对方兵刃，这一役江南七怪虽以七敌一，终究还是赢了。

丘处机怒气上冲，心想：“我给你们面子，已给得十足，又已赔罪认输，还待怎地？”说道：“这是贫道护身的兵器，就如柯大哥的铁杖一般。”柯镇恶大声道：“你讥笑我眼盲么？”丘处机道：“不敢。”柯镇恶怒道：“现下咱们大家受伤，难决胜负。明年今日，请道长再在醉仙楼相会。”

丘处机眉头一皱，心想这七怪并非歹人，我何苦跟他们争这闲气？那日焦木死后，韩宝驹从铜缸中脱身而出，如要杀我，易如反掌。再说这件事总究是自己莽撞了，大丈夫是非分明，错了便当认错，但如何摆脱他们纠缠，却也不易，沉吟了一会儿，心念一动，说道：“各位既要与贫道再决胜负，也无不可，但办法却要由贫道规定。否则的话，贫道在醉仙楼头斗酒，已输了给朱二侠；法华寺较量武功，又输了给七位，连输两场。第三场也不必再比了。”

韩宝驹、韩小莹、张阿生三人当即站起，朱聪等躺卧在床，也昂起头来，齐声道：“再比一场，又有何妨？江南七怪跟人较量，时刻与所在，向来任由对方自择。”

丘处机见他们如此好胜，微微一笑，问道：“不论如何赌法，都能听贫道的主意？”朱聪与全金发均想就算你有什么诡道奸计，也不致就输了给你，齐声说道：“由你说好了。”丘处机道：“君子一言？”韩小莹接口道：“快马一鞭。”柯镇恶还在沉吟。丘处机道：“我这主意要是各位觉得不妥，贫道话说在先，就算我输。”这是摆明了以退为进，心知七怪要强，决不肯轻易让他认输，柯镇恶果然接口道：“不用言语相激，快说罢。”

丘处机坐了下来，说道：“我这个法子，时候是拖得长些，但赌的却是真功夫真本事，并非单拼一时的血气之勇。刀剑拳脚上争先决胜，凡是学武的个个都会。咱们都是武林中的成名人物，决不能再像后生小子们那样不成器。”

江南七怪都想：“不用刀剑拳脚决胜负，又用什么怪法子？难道再来比喝酒？”

丘处机昂然道：“咱们来个大比赛，我一人对你们七位，不但比武功，还得斗恒心毅力，斗智巧计谋，这一场大比拼下来，要看到得头来，到底谁是真英雄、真豪杰。”

这番话只听得江南七怪个个血脉贲张。

韩小莹道：“快说，快说，越难的事儿越好。”朱聪笑道：“比赛修仙炼丹，画符捉鬼，我们可不是你道爷的对手。”丘处机也笑道：“贫道也不敢跟朱二侠比赛探囊取物，顺手牵羊。”韩小莹嘻嘻一笑，跟着又一迭连声的催促：“快说，快说。”

丘处机道：“推本溯源，咱们误打误伤，是为了拯救忠义的后代而起，那么这件事还得归结在这上面。”于是把如何结识郭杨二人、如何追赶段天德的经过说了。江南七怪听在耳中，不住口的痛骂金人暴虐，朝廷职官无耻，心中也均暗佩丘处机侠骨义行，都觉大家心志相同，其实均是同道中人。

丘处机述毕，说道：“那段天德带出去的，便是郭啸天的妻子李氏，除了柯大哥与韩家兄妹，另外四位都见到他们了。”柯镇恶道：“我记得她的声音，永世不会忘记。”丘处机道：“很好。至于杨铁心的妻子包氏，却不知落在何方。那包氏贫道曾经见过，各位却不认得。贫道与各位赌的就是这回事。因此法子是这样……”韩小莹抢着道：“我们七人去救李氏，你去救包氏，谁先成功谁胜，是不是？”

丘处机微微一笑道：“说到救人吗，虽然不易，却也难不倒英雄好汉。贫道的主意却还要难得多，费事得多。”柯镇恶道：“还要怎地？”

丘处机道：“那两个女子都已怀了身孕，救了她们之后，须得好好安顿，待她们产下孩子，然后我教姓杨的孩子，你们七位教姓郭的孩子……”江南七怪听他越说越奇，都张大了口。韩宝驹道：“怎样？”丘处机道：“过得一十八年，孩子们都十八岁了，咱们再在嘉兴府醉仙楼头相会，大邀江湖上的英雄好汉，欢宴一场。酒醉饭饱之余，让两个孩子比试武艺，瞧是贫道的徒弟高明呢，还是七侠的徒弟了得？”江南七怪面面相觑，哑口无言。

丘处机又道：“要是七位亲自跟贫道比试，就算再胜一场，也不过是以多赢少，也没太大光彩。待得贫道把全身本事教给了一人，七位也将艺业传给一人。让他二人一对一的比拼，那时要是贫道的徒弟得胜，七侠可非得心服口服不可。”

柯镇恶豪气充塞胸臆，铁杖重重在地下一顿，叫道：“好，咱们赌了。”

全金发道：“要是这时候那李氏已给段天德害死，那怎么办？”

丘处机道：“这就是赌一赌运气了。天老爷要贫道得胜，有什么可说的？”

韩宝驹道：“好，救孤恤寡，本是侠义道该做之事，就算比你不过，我们总也是做了一件好事。”丘处机大拇指一翘，朗声道：“韩三爷说得不错。七位肯承担将郭氏的孤儿教养成人，贫道先代死去的郭兄谢谢。”说着团团作揖。朱聪道：“你这法子未免过于狡狯。凭这么几句话，就要我兄弟为你费心一十八年？”

丘处机脸上变色，仰天大笑。韩小莹愠道：“有什么好笑？”丘处机道：“我久闻江南七怪大名，江湖上都道七侠急人之难，真是行侠仗义的英雄豪杰，岂知今日一见，嘿嘿！”韩宝驹与张阿生齐声问道：“怎样？”丘处机道：“只怕有点儿有名无实，见面不如闻名！”

江南七怪怒火上冲。韩宝驹在板凳上猛击一掌，正待开言，丘处机道：“古来大英雄真侠士，跟人结交是为朋友卖命，所谓‘不爱其躯，赴士之厄困’，只要是义所当为，就是把性命交给了他，又算得什么？可不曾听说当年荆轲、聂政，有什么斤斤计较。朱家、郭解扶危济困、急人之难，不见得又讨价还价了。贫道虽然不肖，却也想学一学古人。”听了这番抢白，朱聪是读书人，知道史记《游侠列传》上所述古时的侠士行径，不由得心下惭愧，当即扇子一张，朗声道：“道长指点得不错，兄弟知罪了。我们七怪担当这件事就是。”

丘处机站起身来，说道：“今日是三月廿四，十八年后的今日正午，大伙儿在醉仙楼相会，让普天下英雄见见，谁是真正的好汉子！”袍袖一拂，满室生风，当即扬长出门。

韩宝驹道：“我这就追那段天德去，要是给他躲进了乌龟洞，从此无影无踪，那可要大费手脚了。”七怪中只他一人没受伤，当下抢出山门，跨上追风黄名驹，急去追赶段天德和李氏。朱聪急叫：“三弟，三弟，你不认得他们啊！”但韩宝驹性子极急，追风黄又是马如其名，果真奔驰如风，早去得远了。

段天德拉了李萍，向外急奔，回头见寺里没人追赶出来，才稍放心，奔到河边，见到一艘小船，跳上船头，举刀喝令船夫开船。江南水乡之地，河道密如蛛网，小船是寻常代步之具，犹如北方的马匹骡车一般，是以向来有“北人乘马，南人乘船”之说。那船夫见是个恶狠狠的武官，哪敢违拗，当即解缆运橹，摇船出城往北。

段天德心想：“我闯了这个大祸，若回临安，别的不说，我伯父立时就要取我性命，只得且到北边去避一避风头。最好那贼道和江南七怪都伤重身死，我伯父又气得一命呜呼，那时再回去作官不迟。”督着船夫一路往北。韩宝驹坐骑脚程虽快，但他尽在旱道上东问西找，自然寻他不着。

段天德连转了几次船，更换了身上军官装束，勒逼李萍也换了衣衫。十多日后过江来到扬州，投了客店，正想安顿个处所，以作暂居之计，说也凑巧，忽听到有人在向客店主人打听自己的踪迹。段天德大吃一惊，凑眼从门缝中张望，见是一个相貌奇丑的矮胖子和一个美貌少女，两人都是一口嘉兴土音，料想是江南七怪中的人物，幸好扬州掌柜不大懂两人言语，双方一时说不明白，忙拉了李萍，从后门溜出，李萍张口欲叫，段天德伸手按住她嘴，重重打了她一个耳光，忍着自己断臂剧痛，忙雇船再行。

他不敢稍有停留，沿运河北上，一口气到了山东境内微山湖畔的利国镇。

李萍是乡村贫妇，粗手大脚，容貌本陋，这时肚腹隆起，整日价詈骂啼哭，段天德虽是下流胚子，对之却不起非礼之念。两人日常相对，只是相打相骂，没一刻安宁。段天德的右臂给丘处机打断了臂骨，虽请跌打医生接上了骨，一时却不得便愈，他虽是武官，但武艺低浅，又只剩单臂，李萍出力和他厮打，段天德也极感吃力。

过不了几天，那矮胖子和那少女又追到了。段天德只想在屋里悄悄躲过，不料李萍得知来了救星，高声大叫起来。段天德忙用棉被塞住她嘴，打了她一顿，李萍拼命挣扎呼叫，虽然没让韩宝驹、小莹兄妹发现，却已惊险之极。

段天德带了她同逃，本来想以她为质，危急时好令敌人不敢过于紧逼，但眼前情势已变，心想自己单身一人易于逃脱，留着这泼妇在身边实是个大大的祸胎，不如一刀杀却，干手净脚，待韩氏兄妹走后，当即拔出刀来。

李萍时时刻刻在找寻机会，要跟这杀夫仇人同归于尽，但每到晚间睡觉之时，就给他缚住了手足，不得其便，这时见他目露凶光，心中暗暗祝祷：“啸哥，啸哥，求你阴灵佑护，让我杀了这个恶贼。我这就来跟你相会了。”暗暗从怀中取出丘处机所赠的那柄短剑。这短剑她贴肉而藏，倒没给段天德搜去。

段天德冷笑一声，举刀砍将下来。李萍死志已决，丝毫不惧，出尽平生之力，挺短剑向段天德扎去。段天德只觉寒气直逼面门，回刀一挑，想把短剑打落，哪知短剑锋利已极，只听得当啷声响，腰刀断了半截，跌在地下，短剑剑头已抵向自己胸前。段天德大骇，往后便跌，嗤的一声，胸前衣服已划破了一条大缝，自胸至腹，割了长长的一条血痕，只要李萍力气稍大得半分，已遭了破胸开膛之祸。他惊惶之下，忙举椅子挡住，叫道：“快收起刀子，我不杀你！”李萍这时也已手酸足软，全身乏力，同时腹内胎儿不住跳动，再也不能跟他厮拼，坐在地下不住喘息，手里却紧紧抓住短剑不放。

段天德怕韩宝驹等回头再来，如独自逃走，又怕李萍向对头泄露自己形迹，忙逼着她上船又行，仍沿运河北上，经临清、德州，到了河北境内。

每次上陆小住，不论如何偏僻，过不多时总有人找寻前来，后来除了那矮胖子与女子之外，又多了个手持铁杖的盲人。总算这三人不认得他，都是他在暗而对方在明，得能及时躲开，却也已险象环生。

不久又多了一件大头痛事，李萍忽然疯颠，客店之中，旅途之上，时时大声胡言乱语，引得人人注目，有时扯发撕衣，怪状百出。段天德初时还道她迭遭大变，神智迷糊，但过了数日，猛然省悟，原来她是怕追踪的人失了线索，故意留下形迹，这样一来，要想摆脱敌人的追踪可更难了。这时盛暑渐过，金风初动，段天德逃避追踪，已远至北国，所带的银子也用得快要告罄，而仇人仍穷追不舍，不禁自怨自艾：“老子当初在临安当官，鱼肉老酒，钱财粉头，那是何等快活，没来由的贪图了人家一千两银子，到牛家村去杀这贼泼妇的恶强盗老公，却来受这活罪。”他几次便欲撇下李萍，自行偷偷溜走，但转念更想，总是不敢，对她暗算加害，又没一次成功。这道护身符竟变成了甩不脱、杀不掉的大累赘，反要提心吊胆的防她来报杀夫之仇，当真苦恼万分。

不一日来到金国的京城中都大兴府，段天德心想大金京师，地大人多，找个僻静所在躲了起来，只消俟机杀了这泼妇，仇人便有天大本事也找不到自己了。

他满肚子打的如意算盘，不料刚到城门口，城中走出一队金兵，不问情由，便将二人抓住，逼令二人挑担。这时李萍穿了男装，她身材较为矮小，金兵给她的担子轻些。段天德肩头却是一副百来斤的重担，只压得他叫苦连天。

这队金兵随着一名官员一路向北。原来那官是派赴蒙古部族宣示金主敕令的使者。随行护送的金兵乱拉汉人百姓当脚夫，挑送行李粮食。段天德抗辩得几句，金兵的皮鞭便夹头夹脑的抽将下来。这般情形他倒也阅历甚多，不足为奇，只不过向来是他以皮鞭抽百姓之头，今日却是金兵以皮鞭抽其本人之头而已。皮鞭无甚分别，脑袋也无甚分别，不过痛的是别人之头还是自己之头，这中间却大有不同了。

这时李萍肚子越来越大，挑担跋涉，委实疲累欲死，但她决意要手刃仇人，一路上竭力掩饰，不让金兵发现破绽，好在她自幼务农，习于劳苦，身子又甚壮健，豁出了性命，勉力支撑。数十日中，尽在沙漠苦寒之地行走。

这时虽是十月天时，但北国奇寒，这一日竟满天洒下雪花，黄沙莽莽，无处可避风雪。三百余人排成一列，在广漠无垠的原野上行进。正行之间，突然北方传来隐隐喊声，尘土飞扬中只见无数兵马急冲而来。

众人正惊惶间，大队兵马已拥将过来，却是一群败兵。众兵将身穿皮裘，也不知是漠北的一个什么部族，但见行伍大乱，士众抛弓掷枪，争先恐后的急奔，人人脸现惊惶。有的没了马匹，徒步狂窜，给后面乘马的拥将上来，转眼间倒在马蹄之下。

金国官兵见败兵势大，当即四散奔逃。李萍本与段天德同在一起，众败兵犹如潮水般涌来，混乱中段天德已不知去向。李萍抛下担子，拼命往人少处逃去，幸而人人只管自行逃命，倒也没人加害。

她跑了一阵，只觉腹中阵阵疼痛，再也支持不住，伏倒在一个沙丘之后，腹中大痛，就此晕了过去。过了良久，悠悠醒转，昏迷中听得一阵阵婴儿啼哭之声。她尚自迷迷糊糊，不知是已归地府，还是尚在人间，但婴儿哭声越来越响，她身子一动，忽觉胯间暖暖的似有一物。这时已是夜半，大雪初停，一轮明月从云间钻了出来，她陡然觉醒，不禁失声痛哭，原来腹中胎儿已在患难流离之际诞生出来了。

她疾忙坐起，抱起孩儿，见是一个男孩，喜极流泪，当下用牙齿咬断脐带，贴肉抱在怀里。月光下见这孩子浓眉大眼，啼声洪亮，面目依稀是亡夫的模样。她雪地产子，本来非死不可，但一见到孩子，竟不知如何忽尔生出一股力气，挣扎着爬起，躲入沙丘旁的一个浅坑中以蔽风寒，眼瞧婴儿，想起亡夫，不禁悲喜交集，忍不住放声大哭。

在沙坑中躲了一晚，到第二天中午，听得四下无声，鼓勇出去，只见遍地都是死人死马，黄沙白雪之中，抛满了刀枪弓箭，环首四望，竟没一个活人。

她从死兵的背囊中找到些干粮吃了，又从死兵身上找到了火刀火石，割了一块马肉，生火烤了。剥下死兵的皮裘，一件裹住孩子，自己也穿了一件。好在天时酷寒，尸体不腐，她以马肉为食，在战场上挨了十来天，以乳水喂养孩子，两人竟活了下来。她精力渐复，抱了孩子，迎着阳光，信步往东走去。这时怀中抱着的是亲生孩儿，那恨之切骨的段天德已不知去向，本来的满腔悲痛愤恨，登时化为温柔慈爱。大漠中风沙如刀，她只求不刮到孩儿脸上，自己丝毫不以为苦。

行了数日，地下草木渐多，这日向晚，忽见前面两骑马奔驰而来。乘者见到她的模样，便勒马询问。她连说带比，将遇到败兵、雪地产儿的事说了。那两人是蒙古牧民，虽不懂她言语，但蒙古人生性好客，怜贫恤孤，见她母子可怜，就邀她到蒙古包去饱餐了一顿，好好睡了一觉。蒙古人以游牧为生，赶了牲口东迁西徙，追逐水草，并无定居，用毛毡搭成帐篷以蔽风雪，就叫做蒙古包。这群牧民离去时留下了四头小羊给她。

李萍含辛茹苦的抚养婴儿，在大漠中熬了下来。她在水草旁用树枝搭了一所茅屋，畜养牲口，又将羊毛纺条织毡，与牧人交换粮食。蒙古人传统善待旅客、外人，见她可怜，常送些羊乳、乳酪、羊肉给她。

忽忽数年，孩子已经六岁了。李萍依着丈夫的遗言，给他取名为郭靖。这孩子学话甚慢，有点儿呆头呆脑，直到四岁时才会说话，好在身子粗壮，筋骨强健，已能在草原上放牧牛羊。母子两人相依为命，勤勤恳恳，牲口渐繁，生计也过得好些了，又都学会了蒙古话，但母子对话，说的却仍是临安故乡言语。李萍瞧着儿子憨憨的模样，说着什么“羊儿、马儿”，全带着自己柔软的临安乡下土音，时时不禁心酸：“你爹是山东好汉，你也该当说山东话才是。只可惜我跟随你爹的时日太短，没学会他的卷舌头说话，没法教你。”

这一年方当十月，天日渐寒，郭靖骑了一匹小马，带了一条牧羊犬出去牧羊。中午时分，空中忽然飞来一头黑雕，向羊群猛扑下来，一头小羊受惊，向东疾奔而去。郭靖连声呼喝，那小羊却头也不回的急逃。

他忙骑上小马追去，直追了七八里路，才将小羊赶上，正想牵了小羊回来，突然间前面传来一阵阵隐隐的轰隆之声。郭靖吃了一惊，他小小的心中也不知是什么，心想或许是打雷。只听得轰雷之声愈来愈响，过了一会，又听得轰隆声中夹着阵阵人喧马嘶。

他从未听到过这般声音，心里害怕，忙牵了小马小羊，走上一个土山，钻入灌木丛里，躲好后再探出头来。

只见远处尘土蔽天，无数军马奔驰而至，领队的长官发施号令，军马排列成阵，东一队，西一队，不计其数。众兵将有的头上缠了白色头巾，有的插了五色翎毛。郭靖这时不再害怕，只觉甚是好看。

又过一阵，忽听左首远处号角声响，几排兵马冲将过来，当先的将官是个瘦长青年，身披红色斗篷，高举长刀，领头冲锋。双方兵马冲近，厮杀起来。攻过来的那一队人数较少，不久便抵敌不住，退了下去，后面随即有援兵抵达，双方杀声震天。眼见攻来的兵马渐渐支持不住，士卒不断倒毙。忽然数十支号角齐声吹动，一阵急鼓，进攻的军士大声欢呼：“铁木真大汗来了，大汗到啦！”双方军士手不停斗，却不住转头向东方张望。

郭靖顺着各人眼光望去，只见黄沙蔽天之中，一队人马急驰而来，队中高高举起一根长杆，杆上挂着几丛白毛。欢呼声由远而近，进攻的兵马勇气百倍，先到的兵马阵脚登时散乱。那长杆直向土山移来，郭靖忙缩向灌木深处，一双光溜溜的小眼仍往外望，只见一个身材高大的中年汉子纵马上了土山。他头戴铁盔，下颏生了一丛褐色胡子，双目一转，精光四射。郭靖自不知他便是蒙古部落的酋长铁木真，就算知道，也不懂“大汗”是什么，但觉此人甚有威势，心里对他有点害怕。

铁木真骑在马上凝望山下的战局，身旁有十余骑随从。过了一会，那身披红色斗篷的少年将军纵马上山，叫道：“父王，敌兵人数多，咱们退一下吧！”

铁木真这时已看清楚双方形势，低沉了嗓子道：“你带队向东退却！”他双眼望着双方兵马交战，口中传令：“木华黎，你与二王子带队向西退却。博尔术，你与赤老温带队向北退却。忽必来，你与速不台带队向南退却。等得见到这里大纛高举，号角吹动，一齐回头冲杀。”众将齐声答应，下山率领部属，片刻之间，蒙古兵四下退散。

敌兵齐声欢呼，见到铁木真的白毛大纛仍竖在山上，四下里都大叫起来：“活捉铁木真，活捉铁木真！”密密麻麻的兵马争先恐后向土山涌来，都不去理会四下退开的蒙古兵卒。万马践沙扬尘，土山四周涌起了一团团黄雾。

铁木真站在土山高处，凛然不动，十余名劲卒举起铁盾，在他四周挡开射来的箭枝。铁木真的义弟忽都虎与猛将者勒米率领三千精兵守在土山周围，箭射刀砍，死守不退。

刀光矛影中杀声震天。郭靖瞧得又兴奋，又害怕。

激战了半个多时辰，数万名敌兵轮番冲击，铁木真部下三千精兵已伤亡四百余名，敌兵也给他们杀伤了千余名。铁木真放眼望去，但见原野上敌军遗尸遍地，鞍上无人的马匹四散奔驰，但敌兵射过来的羽箭兀自力道强劲。眼见东北角敌兵攻得尤猛，守军渐渐抵挡不住，铁木真的第三子窝阔台很是焦急，问道：“爹爹，可以举纛吹号了么？”铁木真双眼如鹰，一瞬也不瞬的望着山下敌兵，低沉了嗓子道：“敌兵还没有疲！”

这时东北角上敌军调集重兵猛攻，竖了三杆黑纛，显是有三名大将在那里督战。蒙古兵渐渐后退。者勒米奔上土山，叫道：“大汗，孩儿们抵挡不住啦！”铁木真怒道：“挡不住？你夸什么英雄好汉？”

者勒米脸上变色，从军士手中抢了一柄大刀，嗬嗬狂叫，冲入敌阵，杀开一条血路，直冲到黑纛之前。敌军主将见他来势凶猛，勒马退开。者勒米手起刀落，将三名持纛大汉一一砍死，敌军见他如此悍勇，尽皆骇然。者勒米抛下大刀，双手抱住三杆黑纛回上土山，倒转了插入土中。蒙古兵欢呼狂叫，将东北角上的缺口又堵住了。

又战良久，西南角上敌军中忽有一名黑袍将军越众而出，箭无虚发，接连将蒙古兵射倒了十余人。两名蒙古将官持矛冲上前去，给他飕飕两箭，都射倒落马。铁木真夸道：“好箭法！”话声未毕，那黑袍将军已冲近土山，弓弦响处，一箭正射在铁木真颈上，接着又是一箭，直向铁木真肚腹上射来。

铁木真左颈中箭，眼见又有箭到，急提马缰，坐骑倏地人立，这一箭劲力好生厉害，从马胸插入，直穿没羽，那马扑地倒了。蒙古军见主帅中箭落马，人人大惊失色。敌军呐喊声中，如潮水般冲杀上来。窝阔台为父亲拔出颈中羽箭，撕下衣襟，要为他裹伤。铁木真喝道：“别管我，守住了山口。”窝阔台应命转身，抽箭射倒了两名敌兵。

忽都虎从西边率队迎战，只打得箭尽枪折，只得退了回来。者勒米红了眼，叫道：“忽都虎，像兔子般逃跑么？”忽都虎笑道：“谁逃呀？我没了箭。”铁木真坐倒在地，从箭袋里抽出一把羽箭掷过去。忽都虎接过箭来，弓弦连响，对面黑纛下一名将军中箭落马。忽都虎猛冲下山，抢过那将军的骏马，回上山来。

铁木真赞道：“好兄弟，真有你的！”忽都虎满身是血，低声道：“可以举纛吹号了么？”铁木真伸手按住颈里创口，鲜血从手掌里直流出来，说道：“敌军还没疲，再支持一会。”忽都虎跪下，求道：“我们甘愿为你战死，但大汗你身子要紧。”

铁木真牵过一匹马来，奋力上鞍，叫道：“大家牢牢守住了！”挥动长刀，劈死了三名冲上土山的敌兵。敌军忽见铁木真重行上马，不禁气为之夺，败退下山，攻势顿缓。

铁木真见敌势少衰，叫道：“举纛，吹号！”

蒙古兵大叫声中，一名卫士站上马背，将白毛大纛高高举起，号角呜呜吹动。四下里杀声震天，远处一排排蒙古兵势若奔雷般冲将过来。

敌军人数虽众，但都聚集在土山四周围攻，外围的队伍一溃，中间你推我挤，乱成一团。那黑袍将军见势头不对，大声喝令约束，但阵势已乱，士无斗志，不到半个时辰，大军已给冲得散乱，大股退却，小股逃散，顷刻间土崩瓦解。那黑袍将军骑了一匹黑马，落荒而走。

铁木真叫道：“抓住这贼子的，赏黄金三斤。”数十名蒙古健儿大呼追去。那黑袍将军箭无虚发，当者落马，一口气射倒了十余人。余人不敢迫近，见他催马急奔，竟尔逃去。

郭靖躲在树丛中遥遥望见，小心灵中对那黑袍将军好生钦仰。

这一仗铁木真大获全胜，把世仇泰亦赤兀部的主力歼灭大半，料得从此不足为患，回想当年为泰亦赤兀部所擒，痛受殴辱，颈带木枷，在大草原上委顿蹒跚，濒临死亡，这场大仇今日方雪，颈中创口兀自流血不止，但心中欢畅，忍不住仰天长笑。众将士欢声动地，拥着大汗收兵凯旋。

郭靖待大众走远，清理战场的士卒也因天黑归去，这才从树丛中溜将出来，回到家里时已是半夜，母亲正急得犹如热锅上的蚂蚁，不知如何是好，见儿子回来，喜从天降。郭靖说起刚才所见，虽结结巴巴的口齿不清，却也说了个大概。李萍见他眉飞色舞，说到双方交战时并无惧色，心想孩子虽小，人又蠢笨，终是将门之后，倒也大有父风，不禁又喜又悲。

第三日早上，李萍拿了手织的两条毛毡，到三十里外的市集去换粮食。郭靖自在门外放羊，想起前日在土山上所见的恶战，觉得好玩之极，举起赶羊的鞭子，骑在马背上使将起来，口中大声吆喝，驱赶羊群，俨然是大将军领兵打仗一般。

正玩得高兴，忽听得东边马蹄声响，一匹马慢慢踱来，马背一人俯首伏在鞍上。那马踱到临近，停了脚步，马上那人抬起头来。郭靖吓了一跳，不禁惊叫出声。

只见那人满脸都是泥沙血污，正是前日所见的那个黑袍将军。他左手拿着一柄刀头已断的半截马刀，刀上凝结了紫红的血渍，力毙追敌的弓箭却已不知去向，想是前日逃脱后又曾遭遇过敌人。右颊上老大一个伤口，正不住流血，马腿上也受了伤。他身子摇晃，眼中布满红丝，嘶嗄了声音叫道：“水，水……给我水！”

郭靖忙进屋去，在水缸里舀了一碗清水，捧到门口。那人夹手夺过，骨都骨都全喝了下去，说道：“再拿一碗来！”郭靖又去倒了一碗。那人喝到一半，脸上血水滴在碗里，半碗清水全成红色。那人哈哈一笑，忽然脸上筋肉扭动，一个倒栽葱跌下马来，晕了过去。

郭靖大声惊呼，不知如何是好。过了一阵，那人悠悠醒转，叫道：“你给马喝水，有吃的没有？”郭靖拿了几块熟羊肉给他吃了，又提水给马饮了。

那人一顿大嚼，登时精神勃勃，一骨碌跳起身来，叫道：“好兄弟，多谢你！”从手腕上褪下一只粗大的黄金镯子，递给郭靖，道：“给你！”郭靖摇头道：“妈妈说的，应当接待客人，不可要客人东西。”那人哈哈大笑，叫道：“好孩子，好孩子！”将金镯套回手腕，撕下半幅衣襟，包扎好自己脸上与马腿的伤口。

突然东边隐隐传来马群奔驰之声，那人满脸怒容，喝道：“哼，竟仍放不过我！”两人出门向东遥望，见远处尘土飞扬，人马不计其数，正向这里奔来。

那人道：“好孩子，你家里有弓箭么？”郭靖道：“有！”转身入内。那人听了，脸露喜色，却见郭靖拿了自己玩耍的小弓小箭出来。那人哈哈一笑，随即眉头一皱，道：“我要跟人打仗，要大的！”郭靖摇了摇头。

这时追兵愈来愈近，远远已望得见旗帜晃动。那人心想坐骑受伤，大漠上奔逃不远，在此处躲藏虽然危险，却已无第二条路可走，便道：“我一个人打他们不过，要躲起来。”见茅屋内外委实无地可躲，情势紧迫，便向屋旁一个大干草堆指了指，说道：“我躲在这里。你把我的马赶得越远越好。你也远远躲开，别让他们见到。”说着钻进了干草堆中。蒙古人一过炎夏，便割草堆积，冬日饲养牲口，烧火取暖，全凭干草，是以草堆往往比住人的蒙古包还大。那将军躲入了草堆，若非仔细搜索，倒也不易发觉。

郭靖在黑马臀上唰唰两鞭，那黑马纵蹄狂奔，跑得远远的才停下来吃草。郭靖骑了小马，向西驰去。

追兵望见有人，两名军士骑马赶来。郭靖的小马奔跑不快，不久便给追上了。两名军士喝问：“孩子，见到一个骑黑马的汉子么？”郭靖不会说谎，张大了嘴不答。两名军士又问几句，见他傻里傻气，始终不答，便道：“带他见大王子去！”拉着小马的缰绳，将他带到茅屋之前。

郭靖心中打定了主意：“我只不说。”只见无数蒙古战士簇拥着一个身披红色斗篷的瘦长青年。郭靖记得他脸孔，这人前天曾领兵大战，士卒都听他号令，知他是黑袍将军的敌人。那大王子大声喝道：“小孩怎么说？”两名军士道：“这小孩吓坏了，话也不会说。”大王子凝目四望，见到那匹黑马在远处吃草，低沉了声音道：“是他的马么？去拉来瞧瞧。”十名蒙古兵分成五组，从五个不同的方向悄悄朝黑马围去。待那黑马惊觉，昂头想逃，已没了去路。

大王子见了牵过来的黑马，哼了一声道：“这不是哲别的马么？”众军士齐声道：“正是！”大王子提起马鞭，唰的一声，在郭靖的小脑袋上轻轻抽了一下，喝道：“他躲在哪里？快说。你可别想骗我！”

哲别躲在干草堆里，手中紧紧握住长刀，眼见郭靖吃了一鞭，额上登时起了一道殷红的血痕，心中突突乱跳。他知这人是铁木真的长子术赤，残酷狠辣，名闻大漠，心想孩子定会受不住恐吓而说出来，那只有跳出来决死一拼。

郭靖痛得要哭，却拼命忍住眼泪，昂头道：“你为什么打我？我又没做坏事！”他只知做了坏事才该挨打。术赤怒道：“你还倔强！”唰的又是一鞭，郭靖放声大哭。

这时众兵丁已在郭靖家中搜查一遍，两名军士挺着长矛往干草堆中乱刺，幸好那草堆甚大，没刺到哲别藏身的所在。

术赤道：“坐骑在这里，他一定不会逃远。小孩，你说不说？”唰唰唰，接连又是三鞭，出手已加重了些。郭靖伸手想去抓他鞭子，却哪里抓得着？

突然间远处号角声响，众军士道：“大汗来啦！”术赤住手不打，拍马前迎。众军士拥着铁木真驰来。术赤迎上去叫了一声：“爹爹！”

前日铁木真给哲别这一箭射得伤势极重，在激战时强行忍住，收兵之后，竟痛晕了数次。大将者勒米和铁木真的三子窝阔台轮流用口吸吮他创口瘀血，或咽或吐。众将士与他的四个儿子在床边守候了一夜，到第二日清晨，方脱险境。

蒙古兵侦骑四出，众人立誓要抓住哲别，将他四马裂体，乱刀分尸，为大汗报那一箭之仇。次日傍晚，一小队蒙古兵终于遇上哲别，却给他杀伤数人逃脱，但哲别也受了伤。铁木真得讯，先派长子追赶，再亲率次子察合台、三子窝阔台、幼子拖雷赶来。

术赤向黑马一指，道：“爹爹，找到那贼子的黑马啦！”铁木真道：“我不要马，要人。”术赤道：“是，咱们一定能找到。”奔回到郭靖面前，拔出腰刀，在空中虚劈两刀，喝道：“你说不说？”郭靖给他打得满脸是血，反而更加倔强，不住叫道：“我不说，我不说！”铁木真听这孩子说话天真，不说“不知道”而说“我不说”，那必是知晓哲别的所在，低声对三子窝阔台道：“你去骗这小孩说出来。”

窝阔台笑嘻嘻的走到郭靖面前，从自己头盔上拔下两根金碧辉煌的孔雀翎毛，拿在手里，笑道：“你说出来，我把这个给你。”郭靖仍道：“我不说。”

铁木真的二子察合台道：“放狗！”他的随从军士当即从后队牵了六头巨獒过来。

蒙古人性喜打猎，酋长贵人无不畜养猎犬猎鹰。察合台尤其爱狗，这次追踪哲别，正用得着猎狗，是以带了六头獒犬，这时放将出来，先命六犬环绕着黑马周围一阵乱嗅，然后找寻哲别藏身的所在。六头巨獒汪汪吠叫，在茅屋中不住的奔进奔出。

郭靖与哲别本不相识，但前日见他在战阵英勇异常，不禁钦佩，而给术赤抽了这几鞭之后，心里怒极，激发了天性中的一股倔强之气，出声唿哨，呼出自己的牧羊犬来。这时察合台的六犬已快嗅到干草堆前，那牧羊犬听了郭靖的号令，守在草堆前，不许六犬过去。察合台大声呼叱，六头巨犬同时扑了上去，一时犬吠之声大作，七头狗狂吠乱咬的打了起来。那牧羊犬身形既小，又是以一敌六，转瞬间就给咬得遍体鳞伤，可是十分勇敢，竟自不退，负隅死斗。郭靖一面哭，一面呼喝着鼓励爱犬力战。铁木真和窝阔台等见状，早知哲别必是躲在草堆之中，此时已然合围，料得敌人难以脱身，也不心急，都笑吟吟的瞧着七犬相斗。

术赤大怒，举起马鞭又是唰唰数鞭，打得郭靖痛彻心肺。他满地打滚，滚到术赤身边，忽地跃起，抱住他的右腿，死命不放。术赤用力抖动，哪知这孩子抱得极紧，竟抖不下来。察合台、窝阔台、拖雷三人见了兄长的狼狈样子，都哈哈大笑。铁木真也不禁莞尔。术赤胀红了脸，拔出腰间长刀，往郭靖头顶劈了下去。眼见这孩子就要身首异处，突然草堆中一柄断头马刀疾伸出来，当啷声响，双刀相交，术赤只觉手指剧震，险些把捏不定。众军士齐声呼叫，哲别已从草堆里跃了出来。

他左手将郭靖一扯，拉到身后，冷笑道：“欺侮孩子，不害臊么？”众军士刀矛齐举，围在哲别身周。哲别见无可抵挡，抛下手中马刀。术赤上去当胸一拳，哲别并不还手，喝道：“快杀我！”随即低沉了声音道：“可惜我不能死在英雄好汉手里！”

铁木真问道：“你说什么？”哲别道：“要是我在战场之上，给胜过我的好汉杀了，那是死得心甘情愿。现今却是大鹰落在地下，为蚂蚁咬死！”说着圆睁双眼，猛喝一声。察合台的六犬这时已把牧羊犬压在地下乱咬，陡然间听到这一声威猛异常的大喝，吓得一齐跳起，尾巴夹在后腿之间，畏畏缩缩的逃开。

铁木真身旁闪出一人，叫道：“大汗，别让这小子夸口，我来斗他。”铁木真见是大将博尔术，心中甚喜，道：“好，你跟他比比。咱们别的没有，有的是英雄好汉。”

博尔术上前数步，喝道：“我一个人杀你，教你死得心甘情愿。”哲别见他身材魁梧，声音洪亮，喝问：“你是谁？”博尔术道：“我是博尔术。你没听见过么？”哲别心中一凛：“早听说博尔术是蒙古人中的大英雄，原来是他。”横目斜睨，哼了一声。

铁木真道：“你自夸弓箭了得，人家叫你做哲别。你就和我这好朋友比比箭吧。”蒙古语中，“哲别”两字既指“枪矛”，又是“神箭手”之意。哲别本来另有名字，只因他箭法如神，人人叫他哲别，真名反而无人知晓了。

哲别听铁木真叫博尔术为“好朋友”，叫道：“你是大汗的好朋友，我先杀了你。”蒙古众军士听了，都哈哈大笑起来。人人都知博尔术武艺精熟，所向无敌，威名扬于大漠，众人虽见过哲别的箭法高强，但说要杀博尔术，那真叫做不自量力了。

当初铁木真年轻之时，为仇敌泰亦赤兀部人捉去，头颈里套了木枷。泰亦赤兀部众在斡难河滨宴会，一面喝酒，一面用马鞭抽打，要恣意侮辱他之后，再加杀害。后来与宴人众喝得大醉，铁木真用枷头打晕了看守兵卒，逃入树林。

泰亦赤兀人大举挨户搜查。有个青年名叫赤老温，不怕危险，仗义留他，打碎木枷，用火烧毁，把他藏入一辆装羊毛的大车。追兵在赤老温家里到处搜查，搜到大车前，拉去了几把羊毛，快要露出铁木真的脚了。赤老温的父亲情急智生，笑道：“这样大热天，羊毛里怎能藏人？热也热死了他。”其时正当盛暑，人人汗下如雨，追兵心想有理，放过不搜。铁木真生平经历危难无数，以这一次最是千钧一发的大险。

铁木真逃得性命后狼狈之极，与母亲弟弟靠捕杀野鼠过活。

有一天，他养的八匹白马让别的部落盗了去，铁木真单身去追，遇到一个青年在挤马乳。铁木真问起盗贼的消息。那青年就是博尔术，说道：“男儿的苦难都是一样，我和你结成朋友。”两人骑马一起追赶，追了三天，赶上盗马的部落。两人箭无虚发，杀败数百名敌人，夺回了八匹马。铁木真要分马给他，问他要几匹。博尔术道：“我为好朋友出力，一匹也不要。”自此两人一起创业，铁木真一直叫他做好朋友，实是患难之交。

铁木真素知博尔术箭法如神，取下自己腰里弓箭递给了他，随即跳下马来，说道：“你骑我的马，用我的弓箭，就算是我射杀了他。”博尔术道：“遵命！”左手持弓，右手拿箭，跃上铁木真的白口宝马。铁木真对窝阔台道：“你把坐骑借给哲别。”窝阔台道：“便宜了他。”跃下马来，一名亲兵将马牵给哲别。

哲别跃上马背，向铁木真道：“我已给你包围住，你要杀我，便如宰羊一般容易。你既放我跟他比箭，我不能不知好歹，再跟他平比。我只要一张弓，不用箭。”

博尔术怒道：“你不用箭？”哲别道：“不错，我一张空弓也能杀得了你！”

蒙古众军士又大声鼓噪：“这家伙好会吹大气。”铁木真吩咐取一张好弓给他。

博尔术在阵上见过哲别的本事，知他箭法了得，本来不敢怠慢，但他此刻有弓无箭，箭法再高，却又如何施展？料知他必是要接了自己射去的羽箭使用，两腿一夹，胯下的白口宝马泼剌剌的跑了开去。这匹马奔跑迅速，久经战阵，在战场上乘者双腿稍加示意，即能进退自如，铁木真向来十分喜爱。

哲别见对手马快，勒马反走，博尔术弯弓搭箭，飕的一声，发箭往哲别头颈射去。哲别侧过身子，眼明手快，抓住了箭尾。博尔术暗叫一声：“好！”又是一箭。哲别听得箭声，知来势劲急，不能手接，俯低身子，伏在鞍上，那箭从头顶擦过。他纵马转头，仰身坐直，哪知博尔术有一手连珠箭神技，嗤嗤两箭，接着从两侧射来，箭势如风，又急又准。哲别料不到对方如此厉害，猛地溜下马鞍，右足钩住镫子，身子几乎着地，那坐骑跑得正急，把他拖得犹如一只傍地飞舞的纸鹞一般。他腰间一扭，身子刚转过一半，已将适才接来的箭扣上弓弦，拉弦射出，羽箭向博尔术肚腹上射去，随即又翻上马背。

博尔术喝声：“好！”觑准来箭，也是一箭射出，双箭箭头相撞，余势不衰，斜飞出去，并排插入沙地。铁木真与众人齐声喝采。

博尔术虚拉一弓，待哲别往右边闪避，突然发箭向右射去。哲别左手拿弓轻拨，那箭落在地下，博尔术连射三箭，都让他躲了开去。哲别纵马急驰，俯身在地下拾起三枝羽箭，搭上弓回身射出。

博尔术要显本事，跃身站上马背，左脚立鞍，眼见箭来如流星，飞右脚踢开来箭，跟着居高临下，发箭猛射过去。哲别催马旁闪，还射一箭，喀喇一声，将来箭的箭杆劈为两截。

博尔术心想：“我有箭而他无箭，到现下仍打个平手，如何能报大汗之仇？”焦躁起来，连珠箭发，飕飕飕的不断射去，众人瞧得眼都花了。哲别来不及接箭，只得东闪西避，无奈来箭紧密，又多又快，突然噗的一声，左肩竟自中箭。众人齐声欢呼。

博尔术大喜，正要再射数箭，结果他性命，伸手往箭袋里一抽，却摸了个空，原来适才一轮连珠急射，竟把铁木真交给他的羽箭都用完了。他上阵向来携箭极多，腰间两袋，马上六袋，共携八袋羽箭，这次所使是大汗自用的弓矢，激斗之中，竟依着平时习性使用，忘了箭数有限，待得惊觉箭已用完，疾忙回马，俯身去拾地下箭枝。

哲别瞧得亲切，飕的一箭，响声未歇，羽箭已中博尔术后心。旁观众人惊叫起来，只道博尔术势必中箭丧命，但说也奇怪，这一箭虽劲力奇大，着身时发声极响，把博尔术后心撞得一阵疼痛，但竟透不进去，滑在地下。博尔术顺手将箭拾起，一看之下，那箭头竟是给哲别拗去了的，原来是手下留情。他翻上马背，叫道：“我是为大汗报仇，不领你这个情！”

哲别道：“哲别向来不饶敌人！刚才这一箭是一命换一命！”

铁木真见博尔术背心中箭，心里一阵剧烈酸痛，几乎便要放声号哭，待见他竟然不死，不禁大喜若狂，这时便要他将部族中成千成万的牛羊马匹都拿出去换博尔术的性命，他也毫不犹豫的换了，听哲别如此说，急忙叫道：“好，大家别比了。他一命换你一命！”

哲别道：“不是换我的命。”铁木真道：“什么？”哲别指着站在屋门口的郭靖，说道：“换他的性命！求大汗别难为这孩子。至于我，”他眉毛一扬，道：“我射伤大汗，罪有应得。博尔术，你来吧！”伸手拔下肩头羽箭，血淋淋的搭在弓上。

这时博尔术的部下早已呈上六袋羽箭，博尔术道：“好，咱们再比过！”飕飕飕飕，一阵连珠急射。前箭后箭几乎相续，在空中便如接成了一条箭链。

哲别见来势甚急，一个镫里藏身，钻到了马腹之下，斜眼觑准，一箭往博尔术腿上射去，那白口名驹见羽箭疾到，不待主人拉缰，往左急闪。哪知哲别这一箭来势奇快，非比平常，噗的一声，插入名驹脑袋，那马登时滚倒在地。

博尔术卧倒在地，怕他追击，反身一箭，将哲别手中硬弓的弓杆劈为两截。哲别失了武器，更无还击之能，暗暗叫苦，只得纵马曲曲折折的奔跑闪避。蒙古众军士齐声呐喊，为博尔术助威。博尔术心想：“此人真是一条好汉子！”不禁起了英雄惜英雄之心，不欲伤他性命，搭箭上弓，瞄准他后心，运足了劲，羽箭飞出。

当真是将军神箭，更无虚发，那箭正中哲别后颈。哲别身子一晃，摔下马来，那箭掉在他身畔，却原来箭头也是拗去了的。博尔术又抽一枝箭搭在弓上，对准了哲别，转头对铁木真道：“大汗，求你开恩，饶了他罢！”

铁木真看到这时，早已爱惜哲别神勇，叫道：“你还不投降吗？”哲别望着铁木真威风凛凛的神态，不禁折服倾倒，奔将过来，跪倒在地。铁木真哈哈大笑，道：“好好，以后你跟着我罢！”

蒙古人表达心情，多喜唱歌。哲别拜伏在地，大声唱了起来：“大汗饶我一命，以后赴汤蹈火，我也愿意。横断黑水，粉碎岩石，扶保大汗。征讨外敌，挖取人心！叫我到哪里，我就到哪里。为大汗冲锋陷阵，奔驰万里，日夜不停！”

铁木真大喜，取出两块金子，赏给博尔术一块，给哲别一块。哲别谢了，道：“大汗，我转送给这孩子，可以么？”铁木真笑道：“是我的金子，我爱给谁就给谁。是你的金子，你爱给谁就给谁！”哲别拿金子送给郭靖，郭靖仍摇头不要，说道：“妈妈说的，须得帮助客人，不可要客人的东西。”

铁木真先前见郭靖力抗术赤不屈，早就喜爱这孩子的风骨，听了这几句话，更是高兴，赞道：“好孩儿！”对哲别道：“回头你带这孩子到我这里。”率领队伍，向来路去了。几名随从军士把那匹白口名驹的尸体放在两匹马上，跟在后面。

哲别死里逃生，更得投明主，十分高兴，躺在草地上休息，等李萍从市集回来，说明经过。李萍见儿子头上脸上鞭痕累累，好不心疼，但听哲别说起儿子的刚强侠义，便道：“乖孩子，为人该当如此。”心想儿子若是一生在草原牧羊，如何能报父仇，不如到军中多加历练，图个机遇。母子两人随同哲别到了铁木真军中。

铁木真命哲别在三子窝阔台部下当一名十夫长。哲别见过三王子后，再去拜谢博尔术。两人互相敬佩，结成了好友。

哲别感念郭靖的恩义，对他母子照顾周到，准拟郭靖年纪稍大，就把自己的箭法武功倾囊相授。

这日郭靖正在和几个蒙古孩子摔跤游戏，忽见远处两骑蒙古兵急驰奔来，显是有急讯向大汗禀报。两兵进入铁木真帐中不久，号角呜呜响起，各处营房中的兵丁飞奔涌出。

铁木真训练部众，约束严峻，军法如铁。十名蒙古兵编为一小队，由一名十夫长率领，十个十夫队由一名百夫长率领，十个百夫队由一名千夫长率领，十个千夫队由一名万夫长率领。铁木真号令一出，数万人如心使臂，如臂使指，直似一人。

郭靖和众孩在旁观看，听号角第一遍吹罢，各营士卒都已拿了兵器上马。第二遍号角吹动时，四野里蹄声杂沓，人头攒动。第三遍号角停息，辕门前大草原上已黑压压一片，整整齐齐的排列了五个万人队，除了马匹呼吸喘气之外，更无半点耳语和兵器撞碰之声。

铁木真在三个儿子陪同下走出辕门，大声说道：“咱们打败了许多敌人，大金国也已知道了。现今大金国皇帝派了他三太子、六太子到咱们这里，来封你们大汗的官职！”

蒙古兵举起马刀，齐声欢呼。当时金人统有中国北方，东及大海，西至西域，版图辽广，兵势雄强，威声远震。蒙古人还只是草原大漠中的一个小部落，是以铁木真颇以得到大金国的封号为荣。

铁木真号令传下，大王子术赤率领一个万人队前去迎接，其余四个万人队在草原上布了开来。

其时金国明昌皇帝完颜璟在位，得悉漠北王罕、铁木真等部强盛，生怕成为北方之患，于是派了三子荣王完颜洪熙、六子赵王完颜洪烈前去册封官职，一来加以羁縻，二来察看各部虚实，或以威服，或以智取，相机行事。那赵王完颜洪烈便是曾出使临安、在牛家村为丘处机所伤、在嘉兴遇到过江南七怪之人。

郭靖和众小孩远远的站在一旁看热闹，过了好一阵，只见远处尘头飞扬，术赤已接了完颜洪熙、完颜洪烈两人过来。

完颜兄弟带领了一万名精兵，个个锦袍铁甲，左队执长矛，右队持狼牙棒，胯下高头大马，铁甲上铿锵之声里许外即已听到。待到临近，更见锦衣灿烂，盔甲鲜明，刀枪耀日，军容极盛。完颜洪熙兄弟并辔而来，铁木真和众子诸将站在道旁迎接。

完颜洪熙见郭靖等许多蒙古小孩站在远处，睁大了小眼，目不转瞬的瞧着，便哈哈大笑，探手入怀，抓了一把金钱，用力往小孩群中掷去，笑道：“赏给你们！”他把金钱撒得远远地，满拟众小孩定会群起欢呼抢夺，那时既显得自己气派豪阔，且可引为笑乐。但蒙古人最注重的是主客相敬之礼，他这举动固十分轻浮，也颇为不敬。蒙古诸将士卒，无不相顾愕然。

这群小孩都是蒙古兵将的儿女，年纪虽小，却个个自尊，对掷来的金币没人加以理睬。完颜洪熙讨了个老大没趣，又用劲掷出一把金币，以蒙古话叫道：“大家抢啊，他妈的小鬼！”蒙古众人听了，更愤然变色。

当时蒙古人尚无文字，风俗粗犷，却最重信义礼节，尤其尊敬客人。蒙古人自来不说污言秽语，即是对于深仇大寇，或在游戏笑谑之际，也从不咒诅谩骂。客人来到蒙古包里，不论识与不识，必定罄其所有的招待，而做客人的也决不可对主人有丝毫侮慢，如不遵主客之礼，皆以为莫大罪恶。完颜洪熙说的蒙古话虽语音不正，蒙古兵将大都不明其意，但他的神态举止，显有侮辱群孩的含意。

郭靖平时常听母亲讲金人残暴的故事，在中国如何奸淫掳掠，虐杀百姓，如何与汉奸勾结，害死中国的名将岳飞等等，小小心灵中早深深种下对金人的仇恨，这时见这金国王子如此无礼，在地下捡起几枚金币，奔近去猛力往完颜洪熙脸上掷去，叫道：“谁要你的钱！”完颜洪熙偏头相避，但终有一枚金币打上他颧骨，虽郭靖力弱，这一下并不疼痛，但总是在数万人之前出了个丑。蒙古人自铁木真以下，个个心中称快。

完颜洪熙大怒，喝道：“你这小鬼讨死！”他在中国时稍不如意，便即举手杀人，谁敢对他如此侮辱，这时怒火上冲，从身旁侍卫手里抢过一枝长矛，往郭靖胸口掷去。

完颜洪烈知道不妥，忙叫：“三哥住手！”然那长矛已经掷出，去势虽不劲急，但郭靖只转身逃避，并不向旁闪开，方向未变，眼见这小孩要死于矛下，突然左边蒙古军万人队中飞出一箭，犹如流星赶月，当的一声，射中了长矛矛头。这一箭劲力好大，虽箭轻矛重，仍把长矛荡开，箭矛双双落地。郭靖急忙逃开。蒙古兵齐声喝采，声震草原。射箭之人，正是哲别。

完颜洪烈低声道：“三哥，莫再理他！”完颜洪熙见了蒙古兵的声势，心里也有些害怕，狠狠瞪了郭靖一眼，又低骂一声：“小杂种！”

这时铁木真和诸子迎了上来，迎接两位金国王子入帐，献上马乳酒、牛羊马肉等食物。双方各有通译，传译女真和蒙古言语。完颜洪熙宣读金主敕令，册封铁木真为大金国北强招讨使，子孙世袭，永为大金国北方屏藩。铁木真跪下谢恩，收了金主的敕书和金带。

当晚蒙古人大张筵席，款待上国天使。饮酒半酣，完颜洪熙道：“明日我兄弟要去册封王罕，请招讨使跟我们同去。”铁木真听了甚喜，连声答应。

王罕是草原上诸部之长，兵多财丰，待人宽厚，颇得各部酋长贵人爱戴。所谓“罕”，也即是“大汗”之意，再加一个“王”字，可说是大草原诸部落中以他为首。王罕当年曾与铁木真的父亲结拜为兄弟。后来铁木真的父亲为仇人毒死，铁木真沦落无依，便拜王罕为义父，归附于他。铁木真新婚不久，妻子就为蔑尔乞惕人掳去，全仗王罕与铁木真的义弟札木合共同出兵，打败蔑尔乞惕人，才把他妻子抢回。

因此铁木真听说义父王罕也有册封，很是高兴，问道：“大金国还册封谁么？”完颜洪熙道：“没有了。”完颜洪烈加上一句道：“北方就只大汗与王罕两位是真英雄真豪杰，余人皆不足道。”铁木真道：“我们这里还有一位人物，两位王爷或许还没听说过。”完颜洪烈道：“是么？是谁？”铁木真道：“那就是小将的义弟札木合。他为人仁义，善能用兵，小将求三王爷、六王爷也封他一个官职。”

铁木真和札木合是总角之交，两人结义为兄弟时，铁木真还只十一岁。蒙古结义为兄弟，称为“结安答”，“安答”即是义兄、义弟。蒙古人习俗，结安答时要互送礼物。那时札木合送给铁木真一个麅子髀石，铁木真送给札木合一个铜灌髀石。髀石是蒙古人射打兔子之物，儿童常用以抛掷玩耍。两人结义后，就在结了冰的斡难河上抛掷髀石游戏。第二年春天，两人用小木弓射箭，札木合送给铁木真一个响箭头，那是他用两只小牛角钻了孔制成的，铁木真回赠一个柏木顶的箭头，又结拜了一次。两人长大之后，都住在王罕部中，始终相亲相爱，天天比赛早起，谁起得早，就用义父王罕的青玉杯饮酸奶。后来铁木真的妻子被掳，王罕与札木合出兵帮他夺回，铁木真与札木合互赠金带马匹，第三次结义。两人日间同在一只杯子里饮酒，晚上同在一条被里睡觉。后来因追逐水草，各领牧队分离，铁木真威名日盛，札木合麾下部族也不断增多，两人情好不渝，胜于骨肉兄弟。这时铁木真想起自己已得荣封而义弟未有，是以代他索讨。

完颜洪熙酒已喝得半醺，顺口答道：“蒙古人这么多，个个都封官，我们大金国哪有这许多官儿？”完颜洪烈向他连使眼色，完颜洪熙只是不理。

铁木真听了，怫然不悦，说道：“那么把小将的官职让了给他，也没打紧。”完颜洪熙一拍大腿，厉声道：“你这是小觑大金的官职么？”铁木真瞪起双眼，便欲拍案而起，终于强忍怒气，不再言语，拿起酒杯，一饮而尽。完颜洪烈忙说笑话，岔了开去。

次日一早，铁木真带同四个儿子，领了五千人马，护送完颜洪熙、洪烈去册封王罕。

其时太阳刚从草原远处天地交界线升起，铁木真上了马，五个千人队早整整齐齐的排列在草原之上。金国兵将却兀自在帐幕中酣睡未醒。

铁木真初时见金兵人强马壮，兵甲犀利，颇有敬畏之心，这时见他们贪图逸乐，鼻中哼了一声，转头问木华黎道：“你瞧金兵怎样？”木华黎道：“咱们蒙古兵一千人可以破他们五千人。”铁木真笑道：“我正也这么想。只是听说大金国有兵一百余万，咱们可只有五万人。”木华黎道：“一百万兵不能一起上阵。咱们分开来打，今天干掉他十万，明天又扫去他十万。”铁木真拍拍他肩膀，笑道：“说到用兵，你的话总是最合我心意。一百多斤的一个人，可以吃掉十头一千斤的肥牛，只不过不是一天吃。”两人同声大笑。

铁木真按辔徐行，忽见第四子拖雷的坐骑鞍上无人，怒道：“拖雷呢？”拖雷这时还只九岁，虽年纪尚幼，但铁木真不论训子练兵，都严峻之极，犯规者决不宽贷，他大声喝问，众兵将个个悚栗不安。大将博尔忽是拖雷的师傅，见大汗怪责，心下惶恐，说道：“这孩子从来不敢晏起，我去瞧瞧。”刚要转马去寻，只见两个孩子手挽手的奔来。一个头上裹着一块锦缎，正是铁木真的幼子拖雷，另一个却是郭靖。

拖雷奔到铁木真跟前，叫了声：“爹！”铁木真厉声道：“你到哪里去啦！”拖雷道：“我刚才和郭兄弟在河边结安答，他送了我这个。”说着手里一扬，那是一块红色的汗巾，上面绣了花纹，原来是李萍给儿子做的。铁木真想起自己幼时与札木合结义之事，心中感到一阵温暖，脸上登现慈和之色，又见马前两个孩子天真烂漫，温言问道：“你送了他什么？”郭靖指着自己头颈道：“这个！”铁木真见是幼子平素在颈中所带的黄金项圈，微微一笑，道：“你们两个以后可要相亲相爱，互相扶助。”拖雷和郭靖点头答应。

铁木真道：“都上马吧，郭靖这小子也跟咱们去。”拖雷和郭靖大喜，各自上马。

又等了大半个时辰，完颜洪熙兄弟才梳洗完毕，走出帐幕。完颜洪烈见蒙古兵早已列队相候，忙下令集队。完颜洪熙却摆弄上国王子的威风，自管喝了几杯酒，吃了点心才慢慢上马，又耗了半个时辰，才将一万名兵马集好。

大队向北而行，走了六日，王罕派了儿子桑昆和义子札木合先来迎接。铁木真得报札木合到了，忙抢上前去。两人下马拥抱。铁木真的诸子都过来拜见叔父。

完颜洪烈瞧那札木合时，见他身材高瘦，上唇稀稀的几茎黄须，双目炯炯有神，显得十分的精明强悍。那桑昆却肥肥白白，多半平时养尊处优，竟不像是在大漠中长大之人，又见他神态傲慢，对铁木真爱理不理的，浑不似札木合那么亲热。

又行了一日，离王罕的住处已经不远，铁木真部下的两名前哨忽然急驰回来，报道：“前面有乃蛮部拦路，约有三万人。”

完颜洪熙听了传译的言语，大吃一惊，忙问：“他们要干什么？”哨兵道：“好像是要跟咱们打仗。”完颜洪熙道：“他……他们人数……当真有三万？岂不是多过咱们的……这……这……”铁木真不等他话说完，向木华黎道：“你去问问。”

木华黎带了十名亲兵，向前驰去，蒙古大队停下，列成阵势，金兵原队候命。过了一会，木华黎回来禀报：“乃蛮人听说大金国太子来封大汗官职，他们也要讨封。若是不封，他们说要把两位太子留下来抵押，待大金国封了他们官职之后才放还。那些乃蛮人又说，他们的官职一定要大过铁木真大汗的。”

完颜洪熙听了，脸上变色，说道：“官职岂有强讨的？这……这可不是要造反了么？那怎么办？”完颜洪烈即命统兵的将军布开队伍，以备不测。

札木合对铁木真道：“哥哥，乃蛮人时时来抢咱们牲口，跟咱们为难，今日还放过他们么？不知大金国两位太子又如何吩咐？”

铁木真眼瞧四下地形，已成竹在胸，说道：“今日叫大金国两位太子瞧一瞧咱兄弟的手段！”提气纵声长啸，高举马鞭，在空中虚击两鞭。啪啪两下响过，五千名蒙古兵突然“嗬，嗬，嗬”的齐声大叫。完颜兄弟出其不意，吓了一跳。

只见前面尘头大起，敌军渐渐逼近，蒙古兵的前哨已退回本阵。完颜洪熙道：“六弟，快叫咱们的儿郎冲上去，这些蒙古人没用。”完颜洪烈低声道：“让他们打头阵。”完颜洪熙登时醒悟，点了点头。蒙古兵齐声大叫，却不移动。完颜洪熙皱起了眉头，说道：“这些蒙古兵叫得牛鸣马嘶一般，不知干什么。就算喊得惊天动地，能把敌兵吓退吗？”

博尔忽领兵在左，对拖雷道：“你跟着我，可别落后了，瞧咱们怎生杀敌。”拖雷和郭靖随着众兵，也放开了小喉咙大叫。

顷刻之间，尘沙中敌兵已冲到跟前数百步远，蒙古兵仍只呐喊。

这时完颜洪烈也感诧异，见到乃蛮人来势凌厉，生怕冲动阵脚，喝令：“放箭！”金兵几排箭射了出去，但相距尚远，箭枝未到敌兵跟前，便已纷纷跌落。完颜洪熙见敌兵面目渐渐清楚，个个相貌狰狞，咬牙切齿的催马冲来，只吓得心中怦怦乱跳，转头向完颜洪烈道：“不如依从他们，胡乱封他一个官职便了。大些便大些，又不用花本钱！”

铁木真挥动长鞭，又在空中啪啪数响，蒙古兵喊声顿息，分成两翼。铁木真和札木合各领一翼，风驰电掣的往两侧高地上抢去。两人伏鞍奔跑，大声发施号令。蒙古兵一队一队的散开，片刻之间，已将四周高地尽数占住，居高临下，羽箭扣在弓上，箭头瞄准了敌人，却不发射。

乃蛮兵的统帅见形势不利，带领人马往高地上抢来。蒙古兵竖起了软墙。那是数层羊毛厚毡所制，用以挡箭。乃蛮兵向高地上的蒙古兵射箭，一来从低处仰射，箭势不劲，二来大都为软墙挡开，难以伤敌。蒙古弓箭手在毡后发箭射敌，附近高地上的蒙古兵又发箭支援，攻敌侧翼。乃蛮兵东西驰突，登时溃乱。

铁木真在左首高地上观看战局，见敌兵已乱，叫道：“者勒米，冲他后队。”

者勒米手执大刀，领了一个千人队从高地上直冲下来，径抄敌兵后路。

哲别挺着长矛，一马当先。他刚归顺铁木真，决心要斩将立功，报答大汗不杀之恩，俯身马背，直冲入敌阵之中。

两员勇将这么一阵冲击，乃蛮后军登时大乱，前军也不由得军心摇动。统兵的将军正自犹豫不决，札木合和桑昆也领兵冲下。乃蛮部左右受攻，战不多时，便即溃败，主将拨转马头便走，部众跟着纷纷往来路败退。

者勒米勒兵不追，放大队过去，等敌兵退到还剩两千余人时，蓦地唿哨冲出，截住路口。乃蛮残兵陷入了重围，无路可走，勇悍的奋力抵抗，尽被斫杀，余下的抛弓下马，弃枪投降。

        // 初始化函数
        function init() {
            const contentElement = document.getElementById('content');
            const sentences = contentText.split(/(?<=[。！？；\n])/);
            
            sentences.forEach(sentence => {
                if (sentence.trim() === '') return;
                
                const sentenceDiv = document.createElement('div');
                sentenceDiv.className = 'sentence';
                
                // 为每个汉字添加拼音功能
                const chars = Array.from(sentence);
                chars.forEach(char => {
                    const charSpan = document.createElement('span');
                    charSpan.className = 'char';
                    charSpan.textContent = char;
                    
                    // 添加点击事件显示拼音
                    charSpan.addEventListener('click', function() {
                        // 移除其他汉字的高亮
                        document.querySelectorAll('.char.highlight').forEach(el => {
                            el.classList.remove('highlight');
                        });
                        
                        // 高亮当前汉字
                        this.classList.add('highlight');
                        
                        // 获取拼音并朗读
                        const pinyin = pinyinDict[char] || '?';
                        speakText(char, 0.8);
                        
                        // 显示拼音提示
                        showPinyinTooltip(this, pinyin);
                    });
                    
                    sentenceDiv.appendChild(charSpan);
                });
                
                // 添加句子朗读按钮
                const playBtn = document.createElement('span');
                playBtn.className = 'play-btn';
                playBtn.textContent = '🔊';
                playBtn.title = '朗读此句';
                playBtn.addEventListener('click', function() {
                    speakText(sentence, 1);
                });
                
                sentenceDiv.appendChild(playBtn);
                contentElement.appendChild(sentenceDiv);
            });
            
            // 全文朗读按钮
            document.getElementById('readAllBtn').addEventListener('click', function() {
                speakText(contentText, 1);
            });
            
            // 选中内容朗读
            document.getElementById('readSelectionBtn').addEventListener('click', function() {
                const selectedText = document.getElementById('selectedText').textContent;
                if (selectedText) {
                    speakText(selectedText, 1);
                }
            });
            
            // 文本选择事件
            document.addEventListener('selectionchange', function() {
                const selection = window.getSelection();
                const selectedText = selection.toString().trim();
                
                if (selectedText) {
                    document.getElementById('selectedText').textContent = selectedText;
                    document.getElementById('selectionInfo').style.display = 'block';
                } else {
                    document.getElementById('selectionInfo').style.display = 'none';
                }
            });
        }

        // 显示拼音提示
        function showPinyinTooltip(element, pinyin) {
            // 移除现有提示
            const existingTooltip = document.querySelector('.pinyin-tooltip');
            if (existingTooltip) {
                existingTooltip.remove();
            }
            
            // 创建新提示
            const tooltip = document.createElement('div');
            tooltip.className = 'pinyin-tooltip';
            tooltip.textContent = pinyin;
            tooltip.style.position = 'absolute';
            tooltip.style.background = '#333';
            tooltip.style.color = 'white';
            tooltip.style.padding = '5px 10px';
            tooltip.style.borderRadius = '4px';
            tooltip.style.zIndex = '1000';
            tooltip.style.fontSize = '14px';
            
            document.body.appendChild(tooltip);
            
            // 定位提示
            const rect = element.getBoundingClientRect();
            tooltip.style.left = `${rect.left + window.scrollX}px`;
            tooltip.style.top = `${rect.top + window.scrollY - 30}px`;
            
            // 2秒后自动移除提示
            setTimeout(() => {
                tooltip.remove();
            }, 2000);
        }

        // 语音合成函数
        function speakText(text, rate) {
            // 检查浏览器是否支持语音合成
            if (!('speechSynthesis' in window)) {
                alert('您的浏览器不支持语音合成功能，请使用Chrome、Edge或Safari浏览器。');
                return;
            }
            
            // 停止当前语音
            window.speechSynthesis.cancel();
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = document.getElementById('voiceSelect').value;
            utterance.rate = parseFloat(document.getElementById('speedSelect').value) * rate;
            
            // 开始朗读
            window.speechSynthesis.speak(utterance);
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', init);
    </script>
