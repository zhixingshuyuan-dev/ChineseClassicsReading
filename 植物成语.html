  const pageSize = 20;
  let currentPage = 1;
  let totalPages = Math.ceil(plantIdioms.length / pageSize);

  function renderPage() {
    const container = document.getElementById("idiomContainer");
    container.innerHTML = "";
    const start = (currentPage - 1) * pageSize;
    const end = Math.min(start + pageSize, plantIdioms.length);
    plantIdioms.slice(start, end).forEach(i => {
      const card = document.createElement("div");
      card.className = "card";
      card.textContent = i.name;
      card.onclick = () => openModal(i);
      container.appendChild(card);
    });
    document.getElementById("pageInfo").textContent = `${currentPage} / ${totalPages}`;
    document.getElementById("prevBtn").disabled = currentPage === 1;
    document.getElementById("nextBtn").disabled = currentPage === totalPages;
  }

  function openModal(idiom) {
    document.getElementById("modalTitle").textContent = idiom.name;
    document.getElementById("modalPinyin").textContent = idiom.pinyin;
    document.getElementById("modalMeaning").textContent = "释义：" + idiom.meaning;
    document.getElementById("modalExample").textContent = "例句：" + idiom.example;
    document.getElementById("modalExampleEn").textContent = idiom.example_en;
    document.getElementById("modalEnglish").textContent = "English: " + idiom.english;
    document.getElementById("idiomModal").classList.add("active");

    // 朗读：仅读成语和中文释义
    document.getElementById("readBtn").onclick = () => {
      const text = `${idiom.name}，${idiom.meaning}`;
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "zh-CN";
      u.rate = 0.95;
      speechSynthesis.cancel();
      speechSynthesis.speak(u);
    };
  }

  document.getElementById("closeBtn").onclick = () => {
    document.getElementById("idiomModal").classList.remove("active");
    speechSynthesis.cancel();
  };
  document.getElementById("prevBtn").onclick = () => { if(currentPage>1){ currentPage--; renderPage(); } };
  document.getElementById("nextBtn").onclick = () => { if(currentPage<totalPages){ currentPage++; renderPage(); } };

  renderPage();
  </script>
