<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>秦地互动文本 · 大字版</title>
    <style>
        :root {
            --bg: #f5f0e8;
            --text: #2c2416;
            --accent: #8b4513;
            --hover-bg: #fff8e7;
            --border: #c4a97d;
            --sentence-bg: #fdfaf3;
            --ruby-color: #a0522d;
            --btn-bg: #8b4513;
            --btn-hover: #6b3410;
            --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            --tooltip-bg: #2c2416;
            --tooltip-text: #f5efe0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #f5f0e8 0%, #ede4d3 30%, #f3ece0 60%, #e8ddc8 100%);
            font-family: "Noto Serif SC", "Songti SC", "SimSun", "STSong", "华文宋体", "Georgia", "Times New Roman", serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 2rem 1rem 4rem;
            color: var(--text);
            line-height: 2.2;
        }

        .container {
            max-width: 1100px;
            width: 100%;
            background: rgba(255, 252, 245, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 2.5rem 2rem;
            box-shadow: var(--card-shadow), 0 0 0 1px rgba(180, 140, 100, 0.15);
            border: 1px solid rgba(180, 140, 100, 0.2);
        }

        h1 {
            text-align: center;
            font-size: 1.8rem;
            font-weight: 600;
            color: #5c3a1e;
            margin-bottom: 0.3rem;
            letter-spacing: 0.08em;
            font-family: "Noto Serif SC", "STSong", serif;
        }

        .subtitle {
            text-align: center;
            font-size: 0.95rem;
            color: #8b7355;
            margin-bottom: 2rem;
            letter-spacing: 0.05em;
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            flex-wrap: wrap;
            margin-bottom: 1.8rem;
            font-size: 0.85rem;
            color: #7a6248;
        }
        .legend span {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            background: rgba(255, 248, 235, 0.6);
            padding: 0.35rem 0.9rem;
            border-radius: 20px;
            border: 1px solid #dcc8a8;
        }
        .legend .icon {
            font-style: normal;
            font-size: 1rem;
        }
        .legend .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 2px;
        }
        .dot.chinese {
            background: #b87333;
        }
        .dot.english {
            background: #3a6b8c;
        }

        .divider {
            border: none;
            border-top: 1px dashed #d4bfa0;
            margin: 1.5rem 0;
            opacity: 0.7;
        }
        .divider.thin {
            margin: 1rem 0;
            border-top-style: dotted;
            opacity: 0.5;
        }

        .section-label {
            font-size: 0.9rem;
            font-weight: 600;
            color: #8b6914;
            letter-spacing: 0.1em;
            margin-bottom: 0.8rem;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .section-label::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(to right, #c4a97d, transparent);
        }

        /* ---------- 中文段落（带拼音）· 字体放大一倍 ---------- */
        .chinese-block {
            background: rgba(255, 250, 240, 0.7);
            border-radius: 16px;
            padding: 2rem 1.8rem;
            margin-bottom: 2rem;
            border: 1px solid rgba(180, 140, 100, 0.25);
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.03);
            font-size: 2.5rem;          /* 原1.25rem → 放大一倍 (2.5rem) */
            line-height: 3.6;
            letter-spacing: 0.03em;
            text-align: justify;
        }

        /* ruby 悬停显示拼音：位置提高一倍 (bottom 从默认调高) */
        .chinese-block ruby {
            ruby-align: center;
            cursor: default;
            transition: all 0.2s ease;
            position: relative;
        }
        .chinese-block ruby rt {
            font-size: 0.7rem;           /* 拼音字体适当放大 */
            font-weight: 400;
            color: var(--ruby-color);
            letter-spacing: 0;
            opacity: 0;
            transition: opacity 0.25s ease, transform 0.25s ease;
            transform: translateY(4px);
            font-family: "Noto Serif SC", "STKaiti", "KaiTi", "楷体", serif;
            user-select: none;
            pointer-events: none;
            /* 位置提高一倍：原默认在底部，现向上偏移 */
            position: absolute;
            bottom: 100%;               /* 从底部向上对齐 */
            left: 50%;
            transform: translateX(-50%) translateY(10px); /* 初始隐藏向下偏移 */
            white-space: nowrap;
            background: rgba(255, 248, 235, 0.85);
            padding: 0.1rem 0.4rem;
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            border: 1px solid #e0cfb8;
            font-size: 0.75rem;
        }
        .chinese-block ruby:hover rt {
            opacity: 1;
            transform: translateX(-50%) translateY(0);  /* 悬停时上移显示 */
        }
        .chinese-block ruby:hover {
            background: rgba(210, 160, 100, 0.12);
            border-radius: 4px;
            padding: 0 2px;
        }

        /* ---------- 英文段落 · 字体放大50% ---------- */
        .english-block {
            background: rgba(245, 248, 252, 0.55);
            border-radius: 16px;
            padding: 2rem 1.8rem;
            border: 1px solid rgba(120, 150, 180, 0.2);
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.02);
        }

        .sentence-wrapper {
            display: flex;
            align-items: flex-start;
            gap: 0.6rem;
            margin-bottom: 1.2rem;
            padding: 0.8rem 1rem;
            border-radius: 12px;
            background: var(--sentence-bg);
            border: 1px solid rgba(180, 160, 130, 0.15);
            transition: background 0.3s, box-shadow 0.3s;
            flex-wrap: wrap;
        }
        .sentence-wrapper:hover {
            background: #fffdf7;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }
        .sentence-wrapper:last-child {
            margin-bottom: 0;
        }

        .sentence-text {
            flex: 1;
            font-size: 1.575rem;        /* 原1.05rem → 放大50% (1.575rem) */
            line-height: 2.4;
            color: #3b3b3b;
            min-width: 200px;
        }

        /* 英文单词可点击朗读 + 悬停显示释义 */
        .en-word {
            display: inline;
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 3px;
            padding: 1px 3px;
            margin: 0 1px;
            color: #2c3e50;
            position: relative;
            white-space: nowrap;
        }
        .en-word:hover {
            background: #d4e6f9;
            color: #1a3a5c;
            outline: 1px solid #8bb8d6;
            outline-offset: 1px;
        }
        .en-word:active {
            background: #b8d4f0;
            transform: scale(0.97);
        }
        .en-word::after {
            content: '🔊';
            font-size: 0.65rem;
            opacity: 0;
            margin-left: 2px;
            transition: opacity 0.2s;
            vertical-align: super;
            pointer-events: none;
        }
        .en-word:hover::after {
            opacity: 0.7;
        }

        /* 英文单词释义 tooltip */
        .en-word .word-tooltip {
            position: absolute;
            bottom: calc(100% + 8px);
            left: 50%;
            transform: translateX(-50%);
            background: var(--tooltip-bg);
            color: var(--tooltip-text);
            padding: 0.3rem 0.7rem;
            border-radius: 6px;
            font-size: 0.9rem;          /* 稍大 */
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.25s ease, transform 0.25s ease;
            transform: translateX(-50%) translateY(4px);
            z-index: 10;
            font-family: "Noto Serif SC", "STKaiti", "KaiTi", "楷体", serif;
            font-weight: 400;
            letter-spacing: 0.03em;
        }
        .en-word .word-tooltip::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border-width: 5px;
            border-style: solid;
            border-color: var(--tooltip-bg) transparent transparent transparent;
        }
        .en-word:hover .word-tooltip {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* 句子朗读按钮 */
        .btn-speak-sentence {
            flex-shrink: 0;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--btn-bg);
            color: #fff;
            border: none;
            cursor: pointer;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
            align-self: center;
            position: relative;
        }
        .btn-speak-sentence:hover {
            background: var(--btn-hover);
            transform: scale(1.08);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
        }
        .btn-speak-sentence:active {
            transform: scale(0.94);
            transition: transform 0.1s;
        }
        .btn-speak-sentence.speaking {
            animation: pulse 0.6s infinite alternate;
            background: #c0392b;
        }
        @keyframes pulse {
            from {
                box-shadow: 0 0 0 0 rgba(180, 60, 40, 0.6);
            }
            to {
                box-shadow: 0 0 0 14px rgba(180, 60, 40, 0);
            }
        }

        .tooltip-hint {
            font-size: 0.85rem;
            color: #9b8b7a;
            text-align: center;
            margin-top: 0.8rem;
            font-style: italic;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .container {
                padding: 1.5rem 1rem;
            }
            .chinese-block {
                font-size: 1.8rem;      /* 移动端适当缩小，但保持放大比例 */
                padding: 1.5rem 1rem;
                line-height: 3.0;
            }
            .chinese-block ruby rt {
                font-size: 0.6rem;
            }
            .sentence-wrapper {
                flex-direction: column;
                align-items: stretch;
            }
            .btn-speak-sentence {
                align-self: flex-end;
                margin-top: 0.4rem;
            }
            .sentence-text {
                font-size: 1.2rem;       /* 移动端放大50% */
            }
            .en-word .word-tooltip {
                font-size: 0.7rem;
                padding: 0.25rem 0.5rem;
            }
        }

        @media (max-width: 480px) {
            .chinese-block {
                font-size: 1.5rem;
                line-height: 2.6;
                padding: 1rem 0.8rem;
            }
            h1 {
                font-size: 1.4rem;
            }
            .sentence-text {
                font-size: 1.0rem;
            }
        }
    </style>
</head>

            // ==================== 渲染中文 ====================
            const chineseBlock = document.getElementById('chineseBlock');
            chineseData.forEach(item => {
                if (item.py === '') {
                    const span = document.createElement('span');
                    span.textContent = item.char;
                    chineseBlock.appendChild(span);
                } else {
                    const ruby = document.createElement('ruby');
                    ruby.textContent = item.char;
                    const rt = document.createElement('rt');
                    rt.textContent = item.py;
                    ruby.appendChild(rt);
                    chineseBlock.appendChild(ruby);
                }
            });

            // ==================== 渲染英文 ====================
            const englishBlock = document.getElementById('englishBlock');

            englishSentences.forEach((sentenceObj, idx) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'sentence-wrapper';

                const textSpan = document.createElement('span');
                textSpan.className = 'sentence-text';

                sentenceObj.words.forEach(wordObj => {
                    const wordSpan = document.createElement('span');
                    wordSpan.className = 'en-word';
                    wordSpan.textContent = wordObj.word;

                    const tooltip = document.createElement('span');
                    tooltip.className = 'word-tooltip';
                    tooltip.textContent = wordObj.gloss;
                    wordSpan.appendChild(tooltip);

                    wordSpan.addEventListener('click', (e) => {
                        e.stopPropagation();
                        speakWord(wordObj.word);
                    });

                    textSpan.appendChild(wordSpan);
                    textSpan.appendChild(document.createTextNode(' '));
                });

                if (textSpan.lastChild && textSpan.lastChild.nodeType === Node.TEXT_NODE) {
                    textSpan.lastChild.textContent = textSpan.lastChild.textContent.replace(/\s+$/, ' ');
                }

                wrapper.appendChild(textSpan);

                const btn = document.createElement('button');
                btn.className = 'btn-speak-sentence';
                btn.innerHTML = '▶️';
                btn.title = '朗讀整句';
                btn.setAttribute('aria-label', '朗讀句子 ' + (idx + 1));

                btn.addEventListener('click', () => {
                    speakSentence(sentenceObj.text, btn);
                });

                wrapper.appendChild(btn);
                englishBlock.appendChild(wrapper);
            });

            // ==================== 语音合成函数 ====================
            function getVoice() {
                return new Promise((resolve) => {
                    const voices = speechSynthesis.getVoices();
                    if (voices.length > 0) {
                        const enVoice = voices.find(v => v.lang.startsWith('en') && v.name.includes('Female')) ||
                            voices.find(v => v.lang.startsWith('en-US')) ||
                            voices.find(v => v.lang.startsWith('en-GB')) ||
                            voices.find(v => v.lang.startsWith('en'));
                        resolve(enVoice || voices[0]);
                    } else {
                        speechSynthesis.onvoiceschanged = () => {
                            const newVoices = speechSynthesis.getVoices();
                            const enVoice = newVoices.find(v => v.lang.startsWith('en') && v.name.includes('Female')) ||
                                newVoices.find(v => v.lang.startsWith('en-US')) ||
                                newVoices.find(v => v.lang.startsWith('en-GB')) ||
                                newVoices.find(v => v.lang.startsWith('en'));
                            resolve(enVoice || newVoices[0]);
                        };
                    }
                });
            }

            async function speakWord(word) {
                speechSynthesis.cancel();
                const voice = await getVoice();
                const utterance = new SpeechSynthesisUtterance(word);
                utterance.voice = voice;
                utterance.lang = 'en-US';
                utterance.rate = 0.9;
                utterance.pitch = 1;
                utterance.volume = 1;
                speechSynthesis.speak(utterance);
            }

            async function speakSentence(text, btnElement) {
                speechSynthesis.cancel();
                const voice = await getVoice();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.voice = voice;
                utterance.lang = 'en-US';
                utterance.rate = 0.85;
                utterance.pitch = 1;
                utterance.volume = 1;

                if (btnElement) {
                    btnElement.classList.add('speaking');
                    utterance.onend = () => {
                        btnElement.classList.remove('speaking');
                    };
                    utterance.onerror = () => {
                        btnElement.classList.remove('speaking');
                    };
                }

                speechSynthesis.speak(utterance);
            }

            speechSynthesis.getVoices();
            if (speechSynthesis.onvoiceschanged !== undefined) {
                speechSynthesis.onvoiceschanged = () => {
                    speechSynthesis.getVoices();
                };
            }

            console.log('✅ 互动文本已更新：汉字字体放大一倍，英文字体放大50%，拼音悬停位置上移');
