<script>
    let currentLang = 'zh';
    
    // ==================== 完整9语单词翻译库 ====================
    const wordTranslationMap = {

        "heißen": { zh:"名叫", en:"are called", fr:"appelons", de:"heißen", es:"llamamos", ar:"ندعى", ru:"зовёмся", ja:"といいます", it:"chiamiamo" },
        "ist": { zh:"是", en:"is", fr:"est", de:"ist", es:"es", ar:"هو", ru:"есть", ja:"です", it:"è" },
        "bin": { zh:"是", en:"am", fr:"suis", de:"bin", es:"soy", ar:"أنا", ru:"есть", ja:"です", it:"sono" },
        "bist": { zh:"是", en:"are", fr:"es", de:"bist", es:"eres", ar:"أنت", ru:"есть", ja:"です", it:"sei" },
        "Name": { zh:"名字", en:"name", fr:"nom", de:"Name", es:"nombre", ar:"اسم", ru:"имя", ja:"名前", it:"nome" },
        "Mein": { zh:"我的", en:"my", fr:"mon", de:"mein", es:"mi", ar:"اسمي", ru:"мой", ja:"私の", it:"mio" },
        "Dein": { zh:"你的", en:"your", fr:"ton", de:"dein", es:"tu", ar:"اسمك", ru:"твой", ja:"あなたの", it:"tuo" },
        "Sein": { zh:"他的", en:"his", fr:"son", de:"sein", es:"su", ar:"اسمه", ru:"его", ja:"彼の", it:"suo" },
        "komme": { zh:"来自", en:"come from", fr:"viens de", de:"komme aus", es:"vengo de", ar:"آتي من", ru:"приезжаю из", ja:"から来る", it:"vengo da" },
        "kommt": { zh:"来自", en:"comes from", fr:"vient de", de:"kommt aus", es:"viene de", ar:"يأتي من", ru:"приезжает из", ja:"から来る", it:"viene da" },
        "aus": { zh:"从...来", en:"from", fr:"de", de:"aus", es:"de", ar:"من", ru:"из", ja:"から", it:"da" },
        "China": { zh:"中国", en:"China", fr:"Chine", de:"China", es:"China", ar:"الصين", ru:"Китай", ja:"中国", it:"Cina" },
        "Berlin": { zh:"柏林", en:"Berlin", fr:"Berlin", de:"Berlin", es:"Berlín", ar:"برلين", ru:"Берлин", ja:"ベルリン", it:"Berlino" },
        "arbeite": { zh:"工作", en:"work", fr:"travaille", de:"arbeite", es:"trabajo", ar:"أعمل", ru:"работаю", ja:"働く", it:"lavoro" },
        "arbeitet": { zh:"工作", en:"works", fr:"travaille", de:"arbeitet", es:"trabaja", ar:"يعمل", ru:"работает", ja:"働く", it:"lavora" },
        "als": { zh:"作为", en:"as", fr:"comme", de:"als", es:"como", ar:"كـ", ru:"как", ja:"として", it:"come" },
        "Lehrer": { zh:"老师", en:"teacher", fr:"enseignant", de:"Lehrer", es:"profesor", ar:"معلم", ru:"учитель", ja:"教師", it:"insegnante" },
        "bei": { zh:"在...公司", en:"at", fr:"chez", de:"bei", es:"en", ar:"في", ru:"в", ja:"で", it:"da" },
        "Siemens": { zh:"西门子", en:"Siemens", fr:"Siemens", de:"Siemens", es:"Siemens", ar:"سيمنز", ru:"Siemens", ja:"シーメンス", it:"Siemens" },
        "wohnen": { zh:"居住", en:"live", fr:"habitent", de:"wohnen", es:"viven", ar:"يسكنون", ru:"живут", ja:"住む", it:"vivono" },
        "in": { zh:"在...里", en:"in", fr:"à", de:"in", es:"en", ar:"في", ru:"в", ja:"に", it:"in" },
        "Köln": { zh:"科隆", en:"Cologne", fr:"Cologne", de:"Köln", es:"Colonia", ar:"كولونيا", ru:"Кёльн", ja:"ケルン", it:"Colonia" },
        "Hamburg": { zh:"汉堡", en:"Hamburg", fr:"Hambourg", de:"Hamburg", es:"Hamburgo", ar:"هامبورغ", ru:"Гамбург", ja:"ハンブルク", it:"Amburgo" },
        "ledig": { zh:"未婚", en:"single", fr:"célibataire", de:"ledig", es:"soltero", ar:"أعزب", ru:"холост", ja:"独身", it:"single" },
        "verheiratet": { zh:"已婚", en:"married", fr:"mariée", de:"verheiratet", es:"casada", ar:"متزوج", ru:"женат", ja:"結婚", it:"sposata" },
        "Wie": { zh:"如何", en:"how", fr:"comment", de:"wie", es:"cómo", ar:"كيف", ru:"как", ja:"どのように", it:"come" },
        "dein": { zh:"你的", en:"your", fr:"ton", de:"dein", es:"tu", ar:"لك", ru:"твой", ja:"あなたの", it:"tuo" },
        "Freund": { zh:"朋友", en:"friend", fr:"ami", de:"Freund", es:"amigo", ar:"صديق", ru:"друг", ja:"友達", it:"amico" },
        "der": { zh:"那个", en:"the", fr:"le", de:"der", es:"el", ar:"الـ", ru:"тот", ja:"その", it:"il" },
        "neue": { zh:"新的", en:"new", fr:"nouveau", de:"neue", es:"nuevo", ar:"جديد", ru:"новый", ja:"新しい", it:"nuovo" },
        "Kollege": { zh:"同事", en:"colleague", fr:"collègue", de:"Kollege", es:"colega", ar:"زميل", ru:"коллега", ja:"同僚", it:"collega" },
        "deine": { zh:"你的", en:"your", fr:"ta", de:"deine", es:"tu", ar:"لك", ru:"твой", ja:"あなたの", it:"tua" },
        "Schwester": { zh:"姐妹", en:"sister", fr:"soeur", de:"Schwester", es:"hermana", ar:"أخت", ru:"сестра", ja:"姉妹", it:"sorella" },
        "Team": { zh:"团队", en:"team", fr:"équipe", de:"Team", es:"equipo", ar:"فريق", ru:"команда", ja:"チーム", it:"squadra" },
        "eure": { zh:"你们的", en:"your", fr:"vos", de:"eure", es:"vuestros", ar:"لكم", ru:"ваши", ja:"あなたたちの", it:"vostri" },
        "Freunde": { zh:"朋友们", en:"friends", fr:"amis", de:"Freunde", es:"amigos", ar:"أصدقاء", ru:"друзья", ja:"友達", it:"amici" },
        "die": { zh:"那些", en:"the", fr:"les", de:"die", es:"los/las", ar:"الـ", ru:"те", ja:"その", it:"i/le" },
        "Nachbarn": { zh:"邻居们", en:"neighbors", fr:"voisins", de:"Nachbarn", es:"vecinos", ar:"الجيران", ru:"соседи", ja:"隣人", it:"vicini" },
        "vollständiger": { zh:"完整的", en:"full", fr:"complet", de:"vollständiger", es:"completo", ar:"كامل", ru:"полный", ja:"完全な", it:"completo" },
        "Vorname": { zh:"名字", en:"first name", fr:"prénom", de:"Vorname", es:"nombre", ar:"الاسم الأول", ru:"имя", ja:"名前", it:"nome" },
        "Nachname": { zh:"姓氏", en:"last name", fr:"nom", de:"Nachname", es:"apellido", ar:"اللقب", ru:"фамилия", ja:"姓", it:"cognome" },
        "Firma": { zh:"公司", en:"company", fr:"entreprise", de:"Firma", es:"empresa", ar:"شركة", ru:"фирма", ja:"会社", it:"azienda" },
        "Beruf": { zh:"职业", en:"profession", fr:"métier", de:"Beruf", es:"profesión", ar:"مهنة", ru:"профессия", ja:"職業", it:"professione" },
        "Familienstand": { zh:"婚姻状况", en:"marital status", fr:"situation familiale", de:"Familienstand", es:"estado civil", ar:"الحالة الاجتماعية", ru:"семейное положение", ja:"婚姻状況", it:"stato civile" }
    };
    
    function getWordTranslation(word) {
        const clean = word.replace(/[.!?,;:]/g, '');
        const entry = wordTranslationMap[clean];
        if (entry && entry[currentLang]) return entry[currentLang];
        if (word.match(/^[.!?]+$/)) return word;
        return word;
    }
    
    function speakGerman(text) { 
        if(window.speechSynthesis){ speechSynthesis.cancel(); let u = new SpeechSynthesisUtterance(text); u.lang='de-DE'; u.rate=0.85; speechSynthesis.speak(u); } 
    }
    function speakTranslated(text, lang) { 
        let map={zh:'zh-CN',en:'en-US',fr:'fr-FR',de:'de-DE',es:'es-ES',ar:'ar-EG',ru:'ru-RU',ja:'ja-JP',it:'it-IT'}; 
        let u=new SpeechSynthesisUtterance(text); u.lang=map[lang]||'de-DE'; u.rate=0.85; speechSynthesis.speak(u); 
    }
    
    let activeFloat = null;
    function closeFloat(){ if(activeFloat){ activeFloat.remove(); activeFloat=null; } }
    function showFloatingCard(content, x, y){
        closeFloat(); 
        const card = document.createElement('div'); 
        card.className = 'floating-card'; 
        card.innerHTML = `<span class="close-float">✖</span><div>${content}</div>`; 
        // 避开顶部菜单栏 (菜单高度约70px)
        let topPos = y + 15;
        if (y < 100) topPos = y + 30;
        card.style.left = (x + 15) + 'px';
        card.style.top = topPos + 'px';
        document.body.appendChild(card); 
        card.querySelector('.close-float').addEventListener('click',()=>card.remove()); 
        activeFloat = card; 
        return card;
    }
    
    // 构建单词行
    function buildWordLine(wordArray, wordClass, transClass) {
        const container = document.createElement('div'); container.className = 'line';
        for(let word of wordArray){
            const wContainer = document.createElement('span'); wContainer.className='word-container';
            const wordSpan = document.createElement('span'); wordSpan.className = wordClass; wordSpan.textContent = word;
            const transSpan = document.createElement('span'); transSpan.className = transClass; transSpan.textContent = getWordTranslation(word);
            wContainer.appendChild(wordSpan); wContainer.appendChild(transSpan); container.appendChild(wContainer);
            let timer, count=0;
            wordSpan.addEventListener('click', (e) => { 
                e.stopPropagation(); count++; 
                if(timer) clearTimeout(timer); 
                if(count===1){ 
                    speakGerman(word); 
                    showFloatingCard(`<strong>${word}</strong><br>${getWordTranslation(word)}`, e.clientX, e.clientY); 
                    timer=setTimeout(()=>{count=0;},300); 
                } else if(count===2){ 
                    showFloatingCard(`<strong>${word}</strong><br>📖 德语词汇<br>📜 单击朗读/翻译`, e.clientX, e.clientY); 
                    count=0; clearTimeout(timer); 
                } 
            });
            transSpan.addEventListener('click', () => speakGerman(word));
        }
        return container;
    }
    
    // 创建区块（原句/问句）- 修复问句整句翻译
    function createBlock(sectionClass, labelText, wordsArray, fullText, translationMap, isQuestion = false) {
        const section = document.createElement('div'); section.className = sectionClass;
        const headerDiv = document.createElement('div'); headerDiv.style.padding = '10px 16px 0 16px';
        const labelSpan = document.createElement('span'); labelSpan.className = 'section-label'; 
        labelSpan.innerHTML = `<i class="fas ${isQuestion ? 'fa-question-circle' : 'fa-book-open'}"></i> ${labelText}`;
        headerDiv.appendChild(labelSpan);
        section.appendChild(headerDiv);
        
        const wordLine = buildWordLine(wordsArray, isQuestion ? 'question-german' : 'german', isQuestion ? 'question-translation' : 'translation');
        section.appendChild(wordLine);
        
        // 整句翻译栏 - 使用传入的 translationMap (问句使用完整的问句文本映射)
        const transBlock = document.createElement('div'); transBlock.className = 'sentence-translation'; transBlock.style.display = 'none';
        const transSpan = document.createElement('span'); 
        const currentTranslation = translationMap[currentLang] || translationMap.zh || fullText;
        transSpan.textContent = `[${currentLang.toUpperCase()}] ${currentTranslation}`;
        const voiceBtn = document.createElement('button'); voiceBtn.className = 'translation-voice-btn'; voiceBtn.innerHTML = '<i class="fas fa-volume-up"></i> 朗读';

    function getSentenceTranslation(s) { return s[`translation_${currentLang}`] || s.translation_zh || s.text; }
    
    function renderAll() {
        const root = document.getElementById('sentences-root');
        root.innerHTML = '';
        let lastGroup = '';
        for(let s of sentencesData){
            if(s.group !== lastGroup){
                lastGroup = s.group;
                const groupMap = { HEIßEN:"📌 heißen (名叫)", NAME:"📌 Name + sein", KOMMEN:"📌 kommen aus", ARBEITEN:"📌 arbeiten", WOHNEN:"📌 wohnen", STATUS:"📌 状态", GEBURTSORT:"📌 出生地", FREIZEIT:"📌 休闲", VERSCHIEDENES:"📌 日常" };
                const sec = document.createElement('div'); sec.className='section-title'; sec.innerText=groupMap[s.group]||"📘 句型"; root.appendChild(sec);
            }
            const sentDiv = document.createElement('div'); sentDiv.className='sentence';
            const numHeader = document.createElement('div'); numHeader.className='sentence-header';
            numHeader.innerHTML = `<div class="sentence-number">${s.id}</div>`;
            sentDiv.appendChild(numHeader);
            
            const origTransMap = { zh:s.zh, en:s.en, fr:s.fr, de:s.de, es:s.es, ar:s.ar, ru:s.ru, ja:s.ja, it:s.it };
            const originalBlock = createBlock('original-section', '原句', s.words, s.text, origTransMap, false);
            sentDiv.appendChild(originalBlock.section);
            
            // 问句整句翻译映射：每种语言显示问句本身（因为问句就是德语原文，翻译时直接显示问句文本）
            const qTransMap = { zh:s.question, en:s.question, fr:s.question, de:s.question, es:s.question, ar:s.question, ru:s.question, ja:s.question, it:s.question };
            const questionBlock = createBlock('question-section', '📌 相关问句', s.qWords, s.question, qTransMap, true);
            sentDiv.appendChild(questionBlock.section);
            
            const answerDiv = document.createElement('div'); answerDiv.className='answer-display';
            answerDiv.innerHTML = `<i class="fas fa-reply-all"></i> 参考答案: ${s.text}`;
            sentDiv.appendChild(answerDiv);
            root.appendChild(sentDiv);
        }
        updateAllTranslations();
    }
    
    function updateAllTranslations() {
        document.querySelectorAll('.original-section, .question-section').forEach(section => {
            const isQuestion = section.classList.contains('question-section');
            const wordSpans = section.querySelectorAll(isQuestion ? '.question-german' : '.german');
            const transSpans = section.querySelectorAll(isQuestion ? '.question-translation' : '.translation');
            wordSpans.forEach((ws, idx) => {
                if(transSpans[idx]) transSpans[idx].textContent = getWordTranslation(ws.textContent);
            });
            // 更新整句翻译栏内容（如果可见）
            const transSpan = section.querySelector('.sentence-translation span:first-child');
            if(transSpan && transSpan.textContent.includes(']')) {
                const labelSpan = section.querySelector('.section-label');
                const isQ = labelSpan?.innerHTML.includes('问句');
                if(isQ) {
                    const questionText = Array.from(section.querySelectorAll(isQuestion ? '.question-german' : '.german')).map(el=>el.textContent).join(' ');
                    transSpan.textContent = `[${currentLang.toUpperCase()}] ${questionText}`;
                } else {
                    const sentDiv = section.closest('.sentence');
                    const numSpan = sentDiv?.querySelector('.sentence-number');
                    if(numSpan) {
                        const id = parseInt(numSpan.innerText);
                        const s = sentencesData.find(d => d.id === id);
                        if(s) transSpan.textContent = `[${currentLang.toUpperCase()}] ${getSentenceTranslation(s)}`;
                    }
                }
            }
        });
    }
    
    function setLanguage(lang){ 
        currentLang=lang; 
        document.querySelectorAll('.lang-btn').forEach(btn=>{ 
            if(btn.dataset.lang===lang) btn.classList.add('active'); 
            else btn.classList.remove('active'); 
        }); 
        updateAllTranslations(); 
    }
    
    document.getElementById('globalLangBar').querySelectorAll('.lang-btn').forEach(btn=>btn.addEventListener('click',()=>setLanguage(btn.dataset.lang)));
    renderAll(); 
    setLanguage('zh');
    console.log("已加载20个核心句型，问句整句翻译完整实现，悬浮窗避开菜单");
</script>
