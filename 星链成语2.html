<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", "Helvetica Neue", sans-serif;
      background: #dac292;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    #game-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #e8dbbd;
      cursor: grab;
      box-shadow: inset 0 0 0 2px #b48b48, inset 0 0 0 6px #ecdcaa;
    }
    #game-wrapper:active { cursor: grabbing; }

    #game-container {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
      will-change: transform;
    }

    #grid-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
      background-image: 
        linear-gradient(to right, #9b7a4c 1.5px, transparent 1.5px),
        linear-gradient(to bottom, #9b7a4c 1.5px, transparent 1.5px);
      background-repeat: repeat;
      opacity: 0.8;
    }

    .star-point {
      position: absolute;
      width: 10px;
      height: 10px;
      background: #b87a3c;
      border-radius: 50%;
      pointer-events: none;
      z-index: 3;
      opacity: 0.8;
      transform: translate(-50%, -50%);
    }

    .stone {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-weight: bold;
      font-family: "KaiTi", "楷体", "Noto Serif SC", serif;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
      z-index: 20;
      transition: transform 0.12s ease, box-shadow 0.1s;
      cursor: pointer;
      transform: translate(-50%, -50%);
    }

    .stone.black-stone {
      background: #2a2a2a;
      color: #f5f0e0;
      border: 1px solid #9b8e6e;
    }

    .stone.white-stone {
      background: #faf5e6;
      color: #2c2418;
      border: 1px solid #b88749;
    }

    .stone.shared {
      box-shadow: 0 0 0 3px #ffd966, 0 4px 8px rgba(0,0,0,0.5);
      border: 1px solid #ffcc44;
    }

    .stone.highlight {
      transform: translate(-50%, -50%) scale(1.12);
      box-shadow: 0 0 0 4px #ffdd99, 0 0 0 8px rgba(255, 200, 80, 0.4);
      z-index: 30;
    }

    .floating-card {
      position: fixed;
      background: rgba(20, 16, 12, 0.98);
      backdrop-filter: blur(16px);
      border-radius: 28px;
      padding: 22px 28px;
      max-width: 520px;
      min-width: 340px;
      box-shadow: 0 20px 35px rgba(0,0,0,0.5), 0 0 0 2px #e7b45a;
      z-index: 1000;
      color: #fff8ec;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      cursor: move;
      pointer-events: auto;
    }
    .floating-card:active { cursor: grabbing; }
    .floating-card .idiom-cn {
      font-size: 42px;
      font-weight: bold;
      color: #ffdf9c;
      font-family: "KaiTi", "楷体", serif;
      margin-bottom: 14px;
      border-left: 6px solid #ffdf9c;
      padding-left: 18px;
      letter-spacing: 2px;
    }
    .floating-card .meaning-cn {
      font-size: 22px;
      line-height: 1.5;
      margin-bottom: 14px;
      color: #f7e9cf;
      font-weight: 500;
    }
    .floating-card .meaning-en {
      font-size: 18px;
      line-height: 1.5;
      color: #e2d4b6;
      border-top: 2px solid #7a623a;
      padding-top: 14px;
      margin-top: 8px;
    }
    .floating-card .close-hint {
      font-size: 13px;
      color: #c2a16b;
      text-align: right;
      margin-top: 16px;
      border-top: 1px solid #5e4a2e;
      padding-top: 10px;
    }

    #zoom-controls {
      position: fixed;
      bottom: 20px;
      right: 18px;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(10px);
      padding: 8px 14px;
      border-radius: 48px;
      display: flex;
      gap: 12px;
      z-index: 200;
      border: 1px solid #e7b45a;
    }
    #zoom-controls button {
      background: #b87a45;
      color: white;
      border: none;
      padding: 6px 18px;
      font-size: 20px;
      font-weight: bold;
      border-radius: 32px;
      cursor: pointer;
      font-family: monospace;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.3), 0 1px 2px black;
    }
    #zoom-controls button:active {
      transform: scale(0.94);
      background: #9b623b;
    }

    @media (max-width: 700px) {
      .floating-card { max-width: 340px; min-width: 280px; padding: 16px 20px; }
      .floating-card .idiom-cn { font-size: 32px; }
      .floating-card .meaning-cn { font-size: 18px; }
      .floating-card .meaning-en { font-size: 15px; }
      #zoom-controls { bottom: 16px; right: 12px; padding: 5px 10px; }
      #zoom-controls button { padding: 4px 14px; font-size: 18px; }
    }
  </style>
</head>

    { idiom: "龙飞凤舞", meaning: "形容气势奔放雄壮。", en: "Lively and vigorous calligraphy." },
    { idiom: "舞文弄墨", meaning: "玩弄文字技巧。", en: "Play with words." },
    { idiom: "墨守成规", meaning: "固执守旧，不肯改进。", en: "Stick to old ways." },
    { idiom: "规行矩步", meaning: "比喻举动合乎规矩。", en: "Follow the rules strictly." },
    { idiom: "步履蹒跚", meaning: "走路缓慢摇摆的样子。", en: "Walk haltingly." },
    { idiom: "姗姗来迟", meaning: "形容来得很晚。", en: "Arrive late; slow in coming." },
    { idiom: "迟暮之年", meaning: "指晚年。", en: "Old age." },
    { idiom: "年富力强", meaning: "年纪轻，精力旺盛。", en: "Young and vigorous." },
    { idiom: "强词夺理", meaning: "本来无理却硬说成有理。", en: "Argue irrationally." },
    { idiom: "理屈词穷", meaning: "理由站不住脚，无话可说。", en: "Have no valid argument." },
    { idiom: "穷途末路", meaning: "形容无路可走。", en: "At the end of the road." },
    { idiom: "路不拾遗", meaning: "形容社会风气好。", en: "Honest people return lost items." },
    { idiom: "遗臭万年", meaning: "坏名声流传很久。", en: "Leave a bad name for posterity." },
    { idiom: "年深日久", meaning: "时间久远。", en: "As the years go by." },
    { idiom: "久别重逢", meaning: "长久分别后再次相逢。", en: "Reunite after long separation." },
    { idiom: "逢凶化吉", meaning: "转危为安。", en: "Turn misfortune into good luck." },
    { idiom: "吉星高照", meaning: "形容好运。", en: "Lucky star shines bright." },
    { idiom: "照本宣科", meaning: "死板地照本子念。", en: "Mechanically follow a script." },
    { idiom: "科班出身", meaning: "受过正规训练。", en: "Regularly trained." },
    { idiom: "身经百战", meaning: "亲身经历过很多战斗。", en: "Battle-hardened." },
    { idiom: "战无不胜", meaning: "打仗没有不胜利的。", en: "Invincible." },
    { idiom: "胜券在握", meaning: "比喻很有把握取得胜利。", en: "Victory is within grasp." },
    { idiom: "握手言和", meaning: "握手和好。", en: "Make peace." },
    { idiom: "和而不同", meaning: "和睦相处但不盲目苟同。", en: "Harmonious but not identical." },
    { idiom: "同舟共济", meaning: "比喻团结互助，共渡难关。", en: "Pull together in times of trouble." }
  ];

  // 汉字映射
  const charToIdioms = {};
  IDIOMS.forEach(item => {
    for (let ch of item.idiom) {
      if (!charToIdioms[ch]) charToIdioms[ch] = [];
      if (!charToIdioms[ch].some(ex => ex.idiom === item.idiom)) {
        charToIdioms[ch].push(item);
      }
    }
  });

  // 为每个成语分配颜色（黑或白），新成语颜色优先交替
  let lastAssignedColor = 'white';
  const idiomColorType = new Map();
  
  function assignIdiomColor(idiomStr) {
    if (idiomColorType.has(idiomStr)) return idiomColorType.get(idiomStr);
    const newColor = lastAssignedColor === 'black' ? 'white' : 'black';
    idiomColorType.set(idiomStr, newColor);
    lastAssignedColor = newColor;
    return newColor;
  }

  // ---------- 游戏配置 ----------
  const wrapper = document.getElementById('game-wrapper');
  const container = document.getElementById('game-container');
  const gridOverlay = document.getElementById('grid-overlay');

  const GRID_SIZE = 140;
  const CELL_SIZE = 58;
  let scale = 1.0;
  let offsetX = 0, offsetY = 0;
  let isDragging = false;
  let dragStartX = 0, dragStartY = 0;
  let lastOffsetX = 0, lastOffsetY = 0;

  const board = new Map();

  function isValid(x, y) { return x >= 0 && x < GRID_SIZE && y >= 0 && y < GRID_SIZE; }

  function initGridAndStars() {
    const totalW = (GRID_SIZE - 1) * CELL_SIZE;
    const totalH = (GRID_SIZE - 1) * CELL_SIZE;
    gridOverlay.style.width = totalW + 'px';
    gridOverlay.style.height = totalH + 'px';
    gridOverlay.style.backgroundSize = `${CELL_SIZE}px ${CELL_SIZE}px`;
    
    const oldStars = document.querySelectorAll('.star-point');
    oldStars.forEach(s => s.remove());
    
    const starPositions = [
      [Math.floor(GRID_SIZE/2), Math.floor(GRID_SIZE/2)],
      [3, 3], [GRID_SIZE-4, 3], [3, GRID_SIZE-4], [GRID_SIZE-4, GRID_SIZE-4],
      [Math.floor(GRID_SIZE/2), 3], [Math.floor(GRID_SIZE/2), GRID_SIZE-4],
      [3, Math.floor(GRID_SIZE/2)], [GRID_SIZE-4, Math.floor(GRID_SIZE/2)]
    ];
    const unique = [];
    starPositions.forEach(([sx, sy]) => {
      if (isValid(sx, sy) && !unique.some(p => p[0]===sx && p[1]===sy)) unique.push([sx, sy]);
    });
    unique.forEach(([sx, sy]) => {
      const star = document.createElement('div');
      star.className = 'star-point';
      star.style.left = (sx * CELL_SIZE) + 'px';
      star.style.top = (sy * CELL_SIZE) + 'px';
      container.appendChild(star);
    });
  }

  function tryPlaceIdiom(idiomStr, anchorX, anchorY, direction, sharedIdx, sharedCoord, colorType) {
    const positions = [];
    for (let i = 0; i < 4; i++) {
      let px = anchorX, py = anchorY;
      if (direction === 'right') { px = anchorX + i; py = anchorY; }
      else if (direction === 'down') { px = anchorX; py = anchorY + i; }
      else if (direction === 'left') { px = anchorX - i; py = anchorY; }
      else if (direction === 'up') { px = anchorX; py = anchorY - i; }
      if (!isValid(px, py)) return false;
      positions.push([px, py]);
    }
    const sharedPos = positions[sharedIdx];
    if (sharedPos[0] !== sharedCoord[0] || sharedPos[1] !== sharedCoord[1]) return false;
    
    const toDeleteKeys = new Set();
    for (let i = 0; i < 4; i++) {
      if (i === sharedIdx) continue;
      const [px, py] = positions[i];
      const key = `${px},${py}`;
      if (board.has(key)) toDeleteKeys.add(key);
    }
    for (let key of toDeleteKeys) board.delete(key);
    
    for (let i = 0; i < 4; i++) {
      const [px, py] = positions[i];
      const key = `${px},${py}`;
      if (i === sharedIdx) {
        const existing = board.get(key);
        if (existing) {
          const linked = existing.linkedIdioms ? [...existing.linkedIdioms] : [existing.idiom];
          if (!linked.includes(idiomStr)) linked.push(idiomStr);
          board.set(key, { 
            char: existing.char, 
            idiom: idiomStr, 
            isShared: true, 
            linkedIdioms: linked,
            colorType: colorType
          });
        } else {
          board.set(key, { char: idiomStr[i], idiom: idiomStr, isShared: true, linkedIdioms: [idiomStr], colorType: colorType });
        }
      } else {
        board.set(key, { char: idiomStr[i], idiom: idiomStr, isShared: false, linkedIdioms: [idiomStr], colorType: colorType });
      }
    }
    return true;
  }

  function getCandidateIdiomsByChar(char, excludeIdiom) {
    const list = charToIdioms[char] || [];
    return list.filter(item => item.idiom !== excludeIdiom);
  }

  function getIdiomOrientation(idiomStr) {
    const positions = [];
    for (let [key, data] of board.entries()) {
      if (data.idiom === idiomStr || (data.linkedIdioms && data.linkedIdioms.includes(idiomStr))) {
        const [x, y] = key.split(',').map(Number);
        positions.push({ x, y });
      }
    }
    if (positions.length !== 4) return null;
    const sameY = positions.every(p => p.y === positions[0].y);
    const sameX = positions.every(p => p.x === positions[0].x);
    if (sameY) return 'horizontal';
    if (sameX) return 'vertical';
    return null;
  }

  function getDirectionPriority(sourceIdiom) {
    const orientation = getIdiomOrientation(sourceIdiom);
    if (orientation === 'vertical') return ['right', 'left', 'down', 'up'];
    if (orientation === 'horizontal') return ['down', 'up', 'right', 'left'];
    return ['down', 'up', 'right', 'left'];
  }

  function speakIdiomWithMeaning(idiomData) {
    if (!window.speechSynthesis) return;
    try {
      window.speechSynthesis.cancel();
      const text = `${idiomData.idiom}，${idiomData.meaning}。${idiomData.en}`;
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'zh-CN';
      utterance.rate = 0.72;
      utterance.pitch = 1.0;
      window.speechSynthesis.speak(utterance);
    } catch(e) {}
  }

  let activeCard = null;
  function closeCard() {
    if (activeCard) { activeCard.remove(); activeCard = null; }
  }
  function showFloatingCard(idiomData, stoneRect) {
    closeCard();
    const card = document.createElement('div');
    card.className = 'floating-card';
    card.innerHTML = `
      <div class="idiom-cn">${idiomData.idiom}</div>
      <div class="meaning-cn">📖 ${idiomData.meaning}</div>
      <div class="meaning-en">🇬🇧 ${idiomData.en}</div>
      <div class="close-hint">✕ 点击窗口外关闭 | 可拖拽移动</div>
    `;
    document.body.appendChild(card);
    const cardRect = card.getBoundingClientRect();
    const viewportW = window.innerWidth, viewportH = window.innerHeight;
    let left = stoneRect.right + 15, top = stoneRect.top - 20;
    if (left + cardRect.width > viewportW - 10) left = stoneRect.left - cardRect.width - 15;
    if (left < 10) left = 10;
    if (top + cardRect.height > viewportH - 20) top = stoneRect.bottom - cardRect.height + 10;
    if (top < 10) top = 10;
    card.style.left = left + 'px';
    card.style.top = top + 'px';
    
    let isDraggingCard = false, cardDragStartX = 0, cardDragStartY = 0, cardLeft = left, cardTop = top;
    card.addEventListener('mousedown', (e) => {
      if (e.target === card || e.target.closest('.floating-card')) {
        e.stopPropagation();
        isDraggingCard = true;
        cardDragStartX = e.clientX - cardLeft;
        cardDragStartY = e.clientY - cardTop;
        card.style.cursor = 'grabbing';
      }
    });
    window.addEventListener('mousemove', (e) => {
      if (!isDraggingCard) return;
      e.preventDefault();
      let newLeft = e.clientX - cardDragStartX, newTop = e.clientY - cardDragStartY;
      newLeft = Math.max(5, Math.min(viewportW - cardRect.width - 5, newLeft));
      newTop = Math.max(5, Math.min(viewportH - cardRect.height - 5, newTop));
      card.style.left = newLeft + 'px';
      card.style.top = newTop + 'px';
      cardLeft = newLeft; cardTop = newTop;
    });
    window.addEventListener('mouseup', () => { if (isDraggingCard) { isDraggingCard = false; card.style.cursor = 'move'; } });
    activeCard = card;
    card.addEventListener('click', (e) => e.stopPropagation());
  }

  function renderBoard() {
    document.querySelectorAll('.stone').forEach(el => el.remove());
    const baseFontSize = Math.max(18, 26 * Math.min(1.6, scale));
    for (let [key, data] of board.entries()) {
      const [x, y] = key.split(',').map(Number);
      const left = x * CELL_SIZE;
      const top = y * CELL_SIZE;
      const stone = document.createElement('div');
      
      const isBlackStone = data.colorType === 'black';
      stone.className = `stone ${isBlackStone ? 'black-stone' : 'white-stone'}`;
      if (data.isShared) stone.classList.add('shared');
      
      stone.innerText = data.char;
      stone.style.left = `${left}px`;
      stone.style.top = `${top}px`;
      stone.style.width = `${CELL_SIZE - 6}px`;
      stone.style.height = `${CELL_SIZE - 6}px`;
      stone.style.fontSize = `${baseFontSize}px`;
      stone.dataset.x = x;
      stone.dataset.y = y;
      container.appendChild(stone);
    }
  }

  function updateTransform() {
    container.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
    renderBoard();
  }

  function zoomAtCenter(deltaScale) {
    let newScale = scale + deltaScale;
    newScale = Math.min(2.2, Math.max(0.5, newScale));
    if (newScale === scale) return;
    const wrapperRect = wrapper.getBoundingClientRect();
    const centerX = wrapperRect.width / 2, centerY = wrapperRect.height / 2;
    const worldX = (centerX - offsetX) / scale, worldY = (centerY - offsetY) / scale;
    scale = newScale;
    offsetX = centerX - worldX * scale;
    offsetY = centerY - worldY * scale;
    updateTransform();
  }

  function resetView() {
    scale = 1.0;
    let sumX = 0, sumY = 0, count = 0;
    for (let [key] of board.entries()) {
      const [x, y] = key.split(',').map(Number);
      sumX += x; sumY += y; count++;
    }
    if (count > 0) {
      const centerX = sumX / count, centerY = sumY / count;
      const rect = wrapper.getBoundingClientRect();
      offsetX = rect.width / 2 - centerX * CELL_SIZE;
      offsetY = rect.height / 2 - centerY * CELL_SIZE;
    } else { offsetX = 0; offsetY = 0; }
    updateTransform();
  }

  function screenToGrid(clientX, clientY) {
    const rect = container.getBoundingClientRect();
    const localX = (clientX - rect.left) / scale;
    const localY = (clientY - rect.top) / scale;
    return { x: Math.round(localX / CELL_SIZE), y: Math.round(localY / CELL_SIZE) };
  }

  function highlightStone(x, y) {
    document.querySelectorAll('.stone').forEach(s => s.classList.remove('highlight'));
    const target = document.querySelector(`.stone[data-x='${x}'][data-y='${y}']`);
    if (target) target.classList.add('highlight');
  }

  async function onStoneClick(clickX, clickY, stoneElement) {
    const key = `${clickX},${clickY}`;
    const cellData = board.get(key);
    if (!cellData) return false;
    
    const char = cellData.char;
    let sourceIdiom = cellData.idiom;
    if (cellData.linkedIdioms && cellData.linkedIdioms.length) sourceIdiom = cellData.linkedIdioms[0];
    
    highlightStone(clickX, clickY);
    
    const candidates = getCandidateIdiomsByChar(char, sourceIdiom);
    if (candidates.length === 0) {
      const dummyData = { idiom: "⚠️ 无可用成语", meaning: `没有找到以“${char}”接龙的新成语`, en: "No idiom found for this character." };
      showFloatingCard(dummyData, stoneElement.getBoundingClientRect());
      return false;
    }
    
    const newItem = candidates[Math.floor(Math.random() * candidates.length)];
    const newIdiom = newItem.idiom;
    const sharedIdx = newIdiom.indexOf(char);
    if (sharedIdx === -1) return false;
    
    const newColorType = assignIdiomColor(newIdiom);
    const priorityDirs = getDirectionPriority(sourceIdiom);
    let success = false;
    
    for (let dir of priorityDirs) {
      let anchorX = clickX, anchorY = clickY;
      if (dir === 'right') anchorX = clickX - sharedIdx;
      else if (dir === 'down') anchorY = clickY - sharedIdx;
      else if (dir === 'left') anchorX = clickX + sharedIdx;
      else if (dir === 'up') anchorY = clickY + sharedIdx;
      
      const tempPositions = [];
      for (let i = 0; i < 4; i++) {
        let px = anchorX, py = anchorY;
        if (dir === 'right') { px = anchorX + i; py = anchorY; }
        else if (dir === 'down') { px = anchorX; py = anchorY + i; }
        else if (dir === 'left') { px = anchorX - i; py = anchorY; }
        else if (dir === 'up') { px = anchorX; py = anchorY - i; }
        if (!isValid(px, py)) { tempPositions.length = 0; break; }
        tempPositions.push([px, py]);
      }
      if (tempPositions.length !== 4) continue;
      const sharedPos = tempPositions[sharedIdx];
      if (sharedPos[0] !== clickX || sharedPos[1] !== clickY) continue;
      
      if (tryPlaceIdiom(newIdiom, anchorX, anchorY, dir, sharedIdx, [clickX, clickY], newColorType)) {
        success = true;
        break;
      }
    }
    
    if (!success) {
      const dummyData = { idiom: "❌ 放置失败", meaning: `成语“${newIdiom}”无法放置，空间不足或路径冲突`, en: "Cannot place idiom: insufficient space or conflict." };
      showFloatingCard(dummyData, stoneElement.getBoundingClientRect());
      return false;
    }
    
    renderBoard();
    showFloatingCard(newItem, stoneElement.getBoundingClientRect());
    speakIdiomWithMeaning(newItem);
    return true;
  }
  
  function handleGlobalClick(e) {
    if (activeCard && !activeCard.contains(e.target)) closeCard();
  }
  
  container.addEventListener('click', (e) => {
    const stone = e.target.closest('.stone');
    if (stone) {
      e.stopPropagation();
      const x = parseInt(stone.dataset.x), y = parseInt(stone.dataset.y);
      if (!isNaN(x) && !isNaN(y)) onStoneClick(x, y, stone);
      return;
    }
    closeCard();
  });
  document.addEventListener('click', handleGlobalClick);

  function initGame() {
    const start = IDIOMS[0];
    const startIdiom = start.idiom;
    const startColor = 'black';
    idiomColorType.set(startIdiom, startColor);
    lastAssignedColor = startColor;
    
    const centerX = Math.floor(GRID_SIZE / 2);
    const centerY = Math.floor(GRID_SIZE / 2);
    for (let i = 0; i < 4; i++) {
      const posX = centerX + i;
      const posY = centerY;
      if (isValid(posX, posY)) {
        board.set(`${posX},${posY}`, {
          char: startIdiom[i],
          idiom: startIdiom,
          isShared: false,
          linkedIdioms: [startIdiom],
          colorType: startColor
        });
      }
    }
    initGridAndStars();
    renderBoard();
    const rect = wrapper.getBoundingClientRect();
    offsetX = rect.width / 2 - (centerX + 1.5) * CELL_SIZE;
    offsetY = rect.height / 2 - centerY * CELL_SIZE;
    updateTransform();
  }

  const zoomInBtn = document.getElementById('zoom-in');
  const zoomOutBtn = document.getElementById('zoom-out');
  const resetBtn = document.getElementById('reset-view');
  zoomInBtn.addEventListener('click', () => zoomAtCenter(0.18));
  zoomOutBtn.addEventListener('click', () => zoomAtCenter(-0.18));
  resetBtn.addEventListener('click', () => resetView());
  
  wrapper.addEventListener('mousedown', (e) => {
    if (e.target.closest('.stone') || e.target.closest('#zoom-controls')) return;
    isDragging = true;
    dragStartX = e.clientX;
    dragStartY = e.clientY;
    lastOffsetX = offsetX;
    lastOffsetY = offsetY;
    wrapper.style.cursor = 'grabbing';
  });
  window.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    const dx = e.clientX - dragStartX, dy = e.clientY - dragStartY;
    offsetX = lastOffsetX + dx;
    offsetY = lastOffsetY + dy;
    updateTransform();
  });
  window.addEventListener('mouseup', () => { if (isDragging) { isDragging = false; wrapper.style.cursor = 'grab'; } });
  wrapper.addEventListener('wheel', (e) => {
    e.preventDefault();
    zoomAtCenter(e.deltaY > 0 ? -0.12 : 0.12);
  }, { passive: false });

  window.addEventListener('load', initGame);
</script>
