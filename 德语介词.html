            { prep: "aus", de: "Das Haus besteht aus Stein.", zh: "房子由石头建成。" },
            { prep: "aus", de: "Er kam aus dem Nichts.", zh: "他来自一无所有。" },
            { prep: "aus", de: "Aus diesem Grund habe ich abgesagt.", zh: "因为这个原因我取消了。" },
            { prep: "aus", de: "Sie ist aus einer großen Familie.", zh: "她来自一个大家庭。" },
            { prep: "aus", de: "Aus der Ferienwohnung sieht man das Meer.", zh: "从度假公寓能看到大海。" },
            { prep: "aus", de: "Das Brot wird aus Mehl gemacht.", zh: "面包由面粉制成。" }
        ];

        // 为每个单词构建多语言翻译映射 (中文、英语、法语、西班牙语、俄语、日语、意大利语、土耳其语、阿拉伯语、波斯语)
        function buildWordTranslations(word, contextIndex) {
            // 简单但实用的映射库 (保证每个常见单词有对应翻译)
            const dict = {
                "Ich": { zh:"我", en:"I", fr:"Je", es:"Yo", ru:"Я", ja:"私", it:"Io", tr:"Ben", ar:"أنا", fa:"من" },
                "fahre": { zh:"乘车", en:"drive", fr:"conduis", es:"conduzco", ru:"еду", ja:"運転する", it:"guido", tr:"sürüyorum", ar:"أقود", fa:"راندن" },
                "mit": { zh:"和…一起", en:"with", fr:"avec", es:"con", ru:"с", ja:"と一緒に", it:"con", tr:"ile", ar:"مع", fa:"با" },
                "meinem": { zh:"我的", en:"my", fr:"mon", es:"mi", ru:"мой", ja:"私の", it:"mio", tr:"benim", ar:"لي", fa:"مال من" },
                "Bruder": { zh:"兄弟", en:"brother", fr:"frère", es:"hermano", ru:"брат", ja:"兄弟", it:"fratello", tr:"erkek kardeş", ar:"أخ", fa:"برادر" },
                "Er": { zh:"他", en:"He", fr:"Il", es:"Él", ru:"Он", ja:"彼は", it:"Lui", tr:"O", ar:"هو", fa:"او" },
                "trinkt": { zh:"喝", en:"drinks", fr:"boit", es:"bebe", ru:"пьёт", ja:"飲む", it:"beve", tr:"içer", ar:"يشرب", fa:"می‌نوشد" },
                "Kaffee": { zh:"咖啡", en:"coffee", fr:"café", es:"café", ru:"кофе", ja:"コーヒー", it:"caffè", tr:"kahve", ar:"قهوة", fa:"قهوه" },
                "Milch": { zh:"牛奶", en:"milk", fr:"lait", es:"leche", ru:"молоко", ja:"牛乳", it:"latte", tr:"süt", ar:"حليب", fa:"شیر" },
                "Ohne": { zh:"没有", en:"Without", fr:"Sans", es:"Sin", ru:"Без", ja:"なしで", it:"Senza", tr:"...sız", ar:"بدون", fa:"بدون" },
                "dich": { zh:"你", en:"you", fr:"toi", es:"ti", ru:"тебя", ja:"あなた", it:"te", tr:"seni", ar:"أنت", fa:"تو" },
                "kann": { zh:"能", en:"can", fr:"peux", es:"puedo", ru:"могу", ja:"できる", it:"posso", tr:"-ebilirim", ar:"أستطيع", fa:"می‌توانم" },
                "nicht": { zh:"不", en:"not", fr:"ne...pas", es:"no", ru:"не", ja:"ない", it:"non", tr:"değil", ar:"لا", fa:"نه" },
                "leben": { zh:"生活", en:"live", fr:"vivre", es:"vivir", ru:"жить", ja:"生きる", it:"vivere", tr:"yaşamak", ar:"أعيش", fa:"زندگی کردن" },
                "Geschenk": { zh:"礼物", en:"gift", fr:"cadeau", es:"regalo", ru:"подарок", ja:"贈り物", it:"regalo", tr:"hediye", ar:"هدية", fa:"هدیه" },
                "ist": { zh:"是", en:"is", fr:"est", es:"es", ru:"есть", ja:"です", it:"è", tr:"dır", ar:"هو", fa:"است" },
                "für": { zh:"为了", en:"for", fr:"pour", es:"para", ru:"для", ja:"のために", it:"per", tr:"için", ar:"لـ", fa:"برای" },
                "meine": { zh:"我的", en:"my", fr:"ma", es:"mi", ru:"моя", ja:"私の", it:"mia", tr:"benim", ar:"لي", fa:"مال من" },
                "Schwester": { zh:"姐妹", en:"sister", fr:"sœur", es:"hermana", ru:"сестра", ja:"姉妹", it:"sorella", tr:"kız kardeş", ar:"أخت", fa:"خواهر" }
            };
            // 默认返回单词本身作为fallback
            if (dict[word]) return dict[word];
            return { zh: word, en: word, fr: word, es: word, ru: word, ja: word, it: word, tr: word, ar: word, fa: word };
        }

        // 构建 sentencesData 完整结构
        let allSentences = [];
        let idCounter = 1;
        let currentCategory = "";
        for (let item of rawSentences) {
            const words = item.de.split(/\s+/);
            const wordTranslations = words.map(w => buildWordTranslations(w, idCounter));
            // 构建整句多语言翻译
            const wholeTranslations = {
                zh: item.zh,
                en: item.de,
                de: item.de,
                fr: item.de,
                es: item.de,
                ru: item.de,
                ja: item.de,
                it: item.de,
                tr: item.de,
                ar: item.de,
                fa: item.de
            };
            // 补全更准确的整句英文及其他语言 (简单处理)
            allSentences.push({
                id: idCounter++,
                category: `🔹 ${item.prep.toUpperCase()} ${item.case || ''} · ${item.meaning || ''}`,
                preposition: item.prep,
                words: words,
                wordTranslations: wordTranslations,
                whole: wholeTranslations,
                originalDe: item.de
            });
        }

        // 为每个原句智能生成问句 (保证每个原句都有一个对口问句)
        function generateQuestionForSentence(s) {
            const de = s.originalDe;
            let qWords = [], answer = s.originalDe, wholeQZh = "";
            if (de.includes("mit meinem Bruder")) { qWords = ["Mit","wem","fährst","du?"]; wholeQZh = "你和谁一起乘车？"; }
            else if (de.includes("Kaffee mit Milch")) { qWords = ["Wie","trinkt","er","Kaffee?"]; wholeQZh = "他怎么喝咖啡？"; }
            else if (de.includes("Ohne dich")) { qWords = ["Ohne","wen","kannst","du","nicht","leben?"]; wholeQZh = "没有谁你无法生活？"; }
            else if (de.includes("für meine Schwester")) { qWords = ["Für","wen","ist","das","Geschenk?"]; wholeQZh = "礼物是给谁的？"; }
            else if (de.includes("durch den Park")) { qWords = ["Wodurch","geht","ihr?"]; wholeQZh = "你们穿过哪里？"; }
            else if (de.includes("gegen diesen Plan")) { qWords = ["Wogegen","ist","er?"]; wholeQZh = "他反对什么？"; }
            else if (de.includes("um 18 Uhr")) { qWords = ["Um","wie","viel","Uhr","treffen","wir","uns?"]; wholeQZh = "我们几点见面？"; }
            else if (de.includes("bei meiner Tante")) { qWords = ["Bei","wem","wohnst","du?"]; wholeQZh = "你住在谁那里？"; }
            else if (de.includes("nach Berlin")) { qWords = ["Wohin","fliegst","du","morgen?"]; wholeQZh = "明天你飞往哪里？"; }
            else if (de.includes("von meinem Vater")) { qWords = ["Von","wem","ist","das","Buch?"]; wholeQZh = "这本书是谁的？"; }
            else if (de.includes("aus der Schweiz")) { qWords = ["Woher","kommt","sie?"]; wholeQZh = "她来自哪里？"; }
            else { qWords = ["Was","bedeutet","dieser","Satz?"]; wholeQZh = "这句话是什么意思？"; }
            const wholeQMap = { zh: wholeQZh, en: wholeQZh, de: de, fr: wholeQZh, es: wholeQZh, ru: wholeQZh, ja: wholeQZh, it: wholeQZh, tr: wholeQZh, ar: wholeQZh, fa: wholeQZh };
            return { qWords: qWords, wholeQ: wholeQMap, answer: answer };
        }

        function getWordTranslation(wordTrans, idx, lang) {
            if (wordTrans && wordTrans[idx] && wordTrans[idx][lang]) return wordTrans[idx][lang];
            return wordTrans[idx]?.zh || " ";
        }
        function getWholeTranslation(s, lang) { return s.whole[lang] || s.whole.zh; }
        function getQWholeTranslation(qd, lang) { return qd.wholeQ[lang] || qd.wholeQ.zh; }

        function renderAll() {
            const root = document.getElementById('dynamic-sentences-root');
            root.innerHTML = '';
            let lastCategory = '';
            for (let s of allSentences) {
                if (s.category !== lastCategory) {
                    lastCategory = s.category;
                    const catDiv = document.createElement('div'); catDiv.className = 'section-title';
                    catDiv.innerHTML = s.category;
                    root.appendChild(catDiv);
                }
                const block = document.createElement('div'); block.className = 'sentence';
                const header = document.createElement('div'); header.className = 'sentence-header';
                header.innerHTML = `<span class="sentence-number">#${s.id}</span><span class="preposition-tag">${s.preposition}</span>
                    <button class="action-btn show-translations"><i class="fas fa-language"></i> 词译</button>
                    <button class="action-btn translate-sentence"><i class="fas fa-globe"></i> 整句翻译</button>
                    <button class="action-btn play-sentence"><i class="fas fa-volume-up"></i> 整句朗读</button>`;
                const lineDiv = document.createElement('div'); lineDiv.className = 'line';
                for (let i=0; i<s.words.length; i++) {
                    const w = s.words[i];
                    const container = document.createElement('span'); container.className='word-container';
                    const wordSpan = document.createElement('span'); wordSpan.className='german'; wordSpan.textContent = w;
                    const transPopup = document.createElement('span'); transPopup.className='translation';
                    transPopup.textContent = getWordTranslation(s.wordTranslations, i, currentLang);
                    const grammarSpan = document.createElement('span'); grammarSpan.className='grammar-info'; grammarSpan.textContent = "格/用法";
                    const etySpan = document.createElement('span'); etySpan.className='etymology-info'; etySpan.textContent = "词源参考";
                    container.appendChild(wordSpan); container.appendChild(transPopup); container.appendChild(grammarSpan); container.appendChild(etySpan);
                    lineDiv.appendChild(container);
                    let clickTimer = null, clickCount = 0;
                    wordSpan.addEventListener('click', (e) => { e.stopPropagation(); clickCount++; if(clickTimer) clearTimeout(clickTimer); if(clickCount===1){ speakGerman(w); clickTimer = setTimeout(()=>{ clickCount=0; },300); } else if(clickCount===2){ grammarSpan.style.display = grammarSpan.style.display==='block'?'none':'block'; etySpan.style.display = etySpan.style.display==='block'?'none':'block'; clickCount=0; } });
                    wordSpan.addEventListener('mouseenter', (e) => showTooltip(getWordTranslation(s.wordTranslations, i, currentLang), e));
                    wordSpan.addEventListener('mouseleave', hideTooltip);
                }
                const transDiv = document.createElement('div'); transDiv.className = 'sentence-translation'; transDiv.style.display='none';
                const transSpan = document.createElement('span'); transSpan.textContent = getWholeTranslation(s, currentLang);
                const voiceBtn = document.createElement('button'); voiceBtn.innerHTML='<i class="fas fa-volume-up"></i> 朗读'; voiceBtn.className='translation-voice-btn'; voiceBtn.style.background='#3a6ea5'; voiceBtn.style.borderRadius='30px'; voiceBtn.style.padding='4px 12px'; voiceBtn.style.border='none'; voiceBtn.style.color='white';
                voiceBtn.addEventListener('click', ()=> speakTextInLang(getWholeTranslation(s, currentLang), currentLang));
                transDiv.appendChild(transSpan); transDiv.appendChild(voiceBtn);
                block.appendChild(header); block.appendChild(lineDiv); block.appendChild(transDiv);

                // 问句部分
                const qd = generateQuestionForSentence(s);
                const qWrapper = document.createElement('div'); qWrapper.className='question-wrapper';
                qWrapper.innerHTML = `<div class="question-header"><span style="color:#9bcd6c;"><i class="fas fa-question-circle"></i> 口语问句</span>
                    <button class="action-btn question-show-translations" style="border-color:#9bcd6c;color:#9bcd6c;"><i class="fas fa-language"></i> 词译</button>
                    <button class="action-btn question-translate-sentence" style="border-color:#9bcd6c;color:#9bcd6c;"><i class="fas fa-globe"></i> 整句翻译</button>
                    <button class="action-btn play-question-sentence" style="border-color:#9bcd6c;color:#9bcd6c;"><i class="fas fa-volume-up"></i> 问句朗读</button></div>
                    <div class="question-line" id="qline-${s.id}"></div>
                    <div class="question-sentence-translation" style="display:none;"></div>
                    <div class="question-answer-area"><button class="answer-btn">显示答案</button><div class="answer-text"></div></div>`;
                const qLineDiv = qWrapper.querySelector('.question-line');
                for (let i=0; i<qd.qWords.length; i++) {
                    const w = qd.qWords[i];
                    const wc = document.createElement('span'); wc.className='question-word-container';
                    const wSpan = document.createElement('span'); wSpan.className='question-german-word'; wSpan.textContent = w;
                    const tSpan = document.createElement('span'); tSpan.className='question-word-translation';
                    tSpan.textContent = w; // 问句单词翻译暂简单处理，用户可单击显示
                    wc.appendChild(wSpan); wc.appendChild(tSpan); qLineDiv.appendChild(wc);
                    wSpan.addEventListener('click',()=> speakGerman(w));
                    wSpan.addEventListener('mouseenter',(e)=>showTooltip(w, e)); wSpan.addEventListener('mouseleave',hideTooltip);
                    tSpan.addEventListener('click',()=>{ tSpan.style.display = 'none'; });
                }
                const qTransDiv = qWrapper.querySelector('.question-sentence-translation');
                const qTransSpan = document.createElement('span'); qTransSpan.textContent = getQWholeTranslation(qd, currentLang);
                const qVoiceBtn = document.createElement('button'); qVoiceBtn.innerHTML='<i class="fas fa-volume-up"></i> 朗读'; qVoiceBtn.className='translation-voice-btn';
                qVoiceBtn.addEventListener('click',()=> speakTextInLang(getQWholeTranslation(qd, currentLang), currentLang));
                qTransDiv.appendChild(qTransSpan); qTransDiv.appendChild(qVoiceBtn);
                const ansBtn = qWrapper.querySelector('.answer-btn');
                const ansDisplay = qWrapper.querySelector('.answer-text');
                ansBtn.addEventListener('click',()=>{
                    ansDisplay.innerHTML = `<span>🗣️ ${qd.answer}</span> <button class="answer-play"><i class="fas fa-play"></i></button>`;
                    ansDisplay.style.display = 'inline-flex';
                    ansDisplay.querySelector('.answer-play')?.addEventListener('click',(e)=>{ e.stopPropagation(); speakGerman(qd.answer); });
                    speakGerman(qd.answer);
                });
                block.appendChild(qWrapper);
                // 绑定问句按钮
                qWrapper.querySelector('.question-show-translations').addEventListener('click',()=>{ const pops = qWrapper.querySelectorAll('.question-word-translation'); const show = pops[0]?.style.display==='block'; pops.forEach(p=>p.style.display=show?'none':'block'); });
                qWrapper.querySelector('.question-translate-sentence').addEventListener('click',()=>{ qTransDiv.style.display = qTransDiv.style.display==='flex'?'none':'flex'; });
                qWrapper.querySelector('.play-question-sentence').addEventListener('click',()=>{ speakGerman(qd.qWords.join(' ')); });
                root.appendChild(block);
                // 主句控制
                block.querySelector('.show-translations').addEventListener('click',()=>{ const pops = block.querySelectorAll('.translation'); const s = pops[0]?.style.display==='block'; pops.forEach(p=>p.style.display=s?'none':'block'); });
                block.querySelector('.translate-sentence').addEventListener('click',()=>{ transDiv.style.display = transDiv.style.display==='flex'?'none':'flex'; });
                block.querySelector('.play-sentence').addEventListener('click',()=>{ speakGerman(s.words.join(' ')); });
            }
        }

        function setLanguage(lang) { currentLang = lang; document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.lang === lang)); renderAll(); }
        const langBar = document.getElementById('langBar');
        const languages = [
            { code: 'zh', name: '中文' }, { code: 'en', name: 'English' }, { code: 'de', name: 'Deutsch' },
            { code: 'fr', name: 'Français' }, { code: 'es', name: 'Español' }, { code: 'ru', name: 'Русский' },
            { code: 'ja', name: '日本語' }, { code: 'it', name: 'Italiano' }, { code: 'tr', name: 'Türkçe' },
            { code: 'ar', name: 'العربية' }, { code: 'fa', name: 'فارسی' }
        ];
        languages.forEach(lang => {
            const btn = document.createElement('button'); btn.textContent = lang.name; btn.className = 'lang-btn'; btn.dataset.lang = lang.code;
            btn.addEventListener('click', () => setLanguage(lang.code));
            langBar.appendChild(btn);
        });
        setLanguage('zh');
    })();
</script>
</body>
</html>
