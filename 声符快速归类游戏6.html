<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>汉字声符快速归类游戏</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: "Microsoft YaHei", "SimSun", serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 25px;
            position: relative;
            overflow: hidden;
        }
        
        .container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, #4CAF50, #2196F3, #FFC107, #E91E63, #9C27B0);
        }
        
        .header {
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid #e0e0e0;
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 2.2rem;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }
        
        .subtitle {
            color: #7f8c8d;
            font-size: 1.1rem;
        }
        
        .game-area {
            display: flex;
            gap: 25px;
            margin-bottom: 25px;
            height: 500px;
        }
        
        .character-display {
            flex: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            border: 1px solid #e0e0e0;
            position: relative;
        }
        
        .current-character {
            font-size: 180px;
            font-weight: bold;
            color: #2c3e50;
            text-align: center;
            margin-bottom: 20px;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }
        
        .character-info {
            text-align: center;
            font-size: 18px;
            color: #666;
            line-height: 1.6;
            min-height: 30px;
        }
        
        .radicals-panel {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            background-color: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            border: 1px solid #e0e0e0;
            max-height: 500px;
            overflow-y: auto;
        }
        
        .radical {
            font-size: 36px;
            padding: 25px 15px;
            background: linear-gradient(135deg, #fff9e6 0%, #ffecb3 100%);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 3px solid #ffe699;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 120px;
        }
        
        .radical:hover {
            background: linear-gradient(135deg, #ffecb3 0%, #ffe082 100%);
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.15);
        }
        
        .radical.selected {
            background: linear-gradient(135deg, #ffcc00 0%, #ffb300 100%);
            border-color: #e6b800;
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(255, 193, 7, 0.5);
        }
        
        .radical.correct {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            border-color: #4CAF50;
        }
        
        .radical.wrong {
            background: linear-gradient(135deg, #f44336 0%, #da190b 100%);
            border-color: #f44336;
        }
        
        .radical-info {
            margin-top: 8px;
            font-size: 14px;
            color: #666;
            line-height: 1.3;
        }
        
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            padding: 20px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            border: 1px solid #e0e0e0;
        }
        
        .progress-container {
            flex: 1;
            margin: 0 25px;
        }
        
        .progress-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
            color: #7f8c8d;
        }
        
        .progress {
            height: 12px;
            background-color: #e0e0e0;
            border-radius: 6px;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #8BC34A);
            width: 0%;
            transition: width 0.5s ease;
            border-radius: 6px;
        }
        
        button {
            padding: 12px 24px;
            font-size: 16px;
            background: linear-gradient(135deg, #2196F3 0%, #1976D2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(33, 150, 243, 0.3);
            font-weight: bold;
        }
        
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(33, 150, 243, 0.4);
        }
        
        button:active {
            transform: translateY(-1px);
        }
        
        button:disabled {
            background: linear-gradient(135deg, #cccccc 0%, #aaaaaa 100%);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .group-info {
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
            background: #f8f9fa;
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid #e9ecef;
        }
        
        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            border: 1px solid #e9ecef;
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #2196F3;
        }
        
        .stat-label {
            font-size: 14px;
            color: #7f8c8d;
        }
        
        .score-display {
            font-size: 20px;
            font-weight: bold;
            color: #E91E63;
            text-align: center;
            margin-top: 10px;
        }
        
        .timer {
            font-size: 20px;
            font-weight: bold;
            color: #FF9800;
            text-align: center;
            margin-top: 10px;
        }
        
        /* 动画效果 */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        .current-character.pulse {
            animation: pulse 0.5s;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-8px); }
            20%, 40%, 60%, 80% { transform: translateX(8px); }
        }
        
        .character-display.shaking {
            animation: shake 0.5s;
        }
        
        @keyframes flash {
            0%, 100% { background-color: transparent; }
            50% { background-color: rgba(76, 175, 80, 0.3); }
        }
        
        .character-display.flash {
            animation: flash 0.5s;
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .game-area {
                flex-direction: column;
                height: auto;
            }
            
            .current-character {
                font-size: 120px;
            }
            
            .radicals-panel {
                grid-template-columns: 1fr 1fr;
            }
            
            .radical {
                font-size: 28px;
                padding: 20px 10px;
            }
            
            .controls {
                flex-direction: column;
                gap: 15px;
            }
            
            .progress-container {
                width: 100%;
                margin: 0;
            }
        }
        
        /* 声音控制 */
        .sound-control {
            position: absolute;
            top: 20px;
            right: 20px;
            background: white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            cursor: pointer;
            border: 1px solid #e0e0e0;
            transition: all 0.3s ease;
        }
        
        .sound-control:hover {
            transform: scale(1.1);
        }
        
        /* 完成动画 */
        @keyframes confetti {
            0% { transform: translateY(0) rotate(0); opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }
        
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background-color: #f00;
            opacity: 0;
            z-index: 1000;
        }
        
        .game-instructions {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #2196F3;
        }
        
        .instructions-title {
            font-weight: bold;
            color: #1976D2;
            margin-bottom: 8px;
        }
        
        .instructions-content {
            color: #555;
            line-height: 1.5;
        }
        
        .group-complete {
            text-align: center;
            font-size: 18px;
            color: #4CAF50;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>

            "垂": { pinyin: "chuí", meaning: "下垂；流传", english: "to hang down; to pass down" }
        };

        // 游戏状态
        let currentGroup = 0;
        let currentRadicals = [];
        let currentCharacters = [];
        let selectedRadical = null;
        let correctCount = 0;
        let totalCount = 0;
        let score = 0;
        let soundEnabled = true;
        let gameStarted = false;
        let gameTimer = null;
        let timeElapsed = 0;
        const totalGroups = Math.ceil(radicalsData.length / 5);

        // 初始化游戏
        function initGame() {
            // 初始化第一组
            loadGroup(0);
            
            // 添加事件监听
            document.getElementById('startBtn').addEventListener('click', startGame);
            document.getElementById('nextGroupBtn').addEventListener('click', nextGroup);
            document.getElementById('soundControl').addEventListener('click', toggleSound);
            
            // 更新统计信息
            updateStats();
        }

        // 开始游戏
        function startGame() {
            gameStarted = true;
            score = 0;
            correctCount = 0;
            totalCount = 0;
            timeElapsed = 0;
            
            document.getElementById('startBtn').disabled = true;
            document.getElementById('nextGroupBtn').disabled = false;
            
            // 开始计时器
            gameTimer = setInterval(() => {
                timeElapsed++;
                document.getElementById('timer').textContent = `时间: ${timeElapsed}s`;
            }, 1000);
            
            // 显示第一个汉字
            showNextCharacter();
            
            updateStats();
        }

        // 加载指定组
        function loadGroup(groupIndex) {
            currentGroup = groupIndex;
            
            // 更新组信息
            document.getElementById('groupInfo').textContent = `第${groupIndex + 1}组/共${totalGroups}组`;
            
            // 更新进度条
            const progressPercent = (groupIndex / totalGroups) * 100;
            document.getElementById('progressBar').style.width = `${progressPercent}%`;
            document.getElementById('progressText').textContent = `${Math.round(progressPercent)}%`;
            
            // 获取当前组的5个声符
            const startIndex = groupIndex * 5;
            currentRadicals = radicalsData.slice(startIndex, startIndex + 5);
            
            // 准备汉字
            prepareCharacters();
            
            // 渲染界面
            renderGame();
        }

        // 准备汉字
        function prepareCharacters() {
            currentCharacters = [];
            
            // 从每个声符中随机选择最多10个汉字
            currentRadicals.forEach(radical => {
                const shuffled = [...radical.characters].sort(() => 0.5 - Math.random());
                const selected = shuffled.slice(0, 10);
                currentCharacters.push(...selected);
            });
            
            // 随机排序所有汉字
            currentCharacters.sort(() => 0.5 - Math.random());
            
            // 限制汉字数量不超过50个
            if (currentCharacters.length > 50) {
                currentCharacters = currentCharacters.slice(0, 50);
            }
        }

        // 渲染游戏界面
        function renderGame() {
            // 渲染声符
            const radicalsPanel = document.getElementById('radicalsPanel');
            radicalsPanel.innerHTML = '';
            
            currentRadicals.forEach(radical => {
                const radicalElement = document.createElement('div');
                radicalElement.className = 'radical';
                radicalElement.textContent = radical.radical;
                radicalElement.dataset.radical = radical.radical;
                
                // 添加声符信息
                const infoElement = document.createElement('div');
                infoElement.className = 'radical-info';
                
                const meaning = radicalMeanings[radical.radical];
                if (meaning) {
                    infoElement.innerHTML = `
                        <div>${meaning.pinyin}</div>
                        <div>${meaning.meaning}</div>
                    `;
                }
                
                radicalElement.addEventListener('click', function() {
                    if (!gameStarted) return;
                    
                    handleRadicalClick(radical.radical);
                });
                
                radicalElement.appendChild(infoElement);
                radicalsPanel.appendChild(radicalElement);
            });
        }

        //处理声符点击
function handleRadicalClick(radical) {
    if (!gameStarted) return;
    
    // 只朗读声符本身
    if (soundEnabled) {
        speakCharacter(radical);
    }
    
    // 检查是否匹配
    const currentChar = document.getElementById('currentCharacter').textContent;
    const radicalData = currentRadicals.find(r => r.radical === radical);
    
    if (radicalData && radicalData.characters.includes(currentChar)) {
        // 匹配成功
        handleCorrectAnswer(radical);
    } else {
        // 匹配失败
        handleWrongAnswer(radical);
    }
}

        // 处理正确答案
        function handleCorrectAnswer(radical) {
            correctCount++;
            totalCount++;
            
            // 计算得分（速度越快得分越高）
            const timeBonus = Math.max(10 - Math.floor(timeElapsed / 10), 1);
            score += 10 * timeBonus;
            
            // 显示正确反馈
            document.getElementById('characterDisplay').classList.add('flash');
            document.querySelector(`.radical[data-radical="${radical}"]`).classList.add('correct');
            
            // 播放正确声音
            if (soundEnabled) {
                playCorrectSound();
            }
            
            // 更新统计信息
            updateStats();
            
            // 显示下一个汉字
            setTimeout(() => {
                document.getElementById('characterDisplay').classList.remove('flash');
                document.querySelector(`.radical[data-radical="${radical}"]`).classList.remove('correct');
                showNextCharacter();
            }, 1000);
        }

        // 处理错误答案
        function handleWrongAnswer(radical) {
            totalCount++;
            score = Math.max(score - 5, 0);
            
            // 显示错误反馈
            document.getElementById('characterDisplay').classList.add('shaking');
            document.querySelector(`.radical[data-radical="${radical}"]`).classList.add('wrong');
            
            // 播放错误声音
            if (soundEnabled) {
                playWrongSound();
            }
            
            // 更新统计信息
            updateStats();
            
            // 恢复状态
            setTimeout(() => {
                document.getElementById('characterDisplay').classList.remove('shaking');
                document.querySelector(`.radical[data-radical="${radical}"]`).classList.remove('wrong');
            }, 1000);
        }

        // 显示下一个汉字
        function showNextCharacter() {
            if (currentCharacters.length === 0) {
                // 本组完成，自动进入下一组
                completeGroup();
                return;
            }
            
            const nextChar = currentCharacters.shift();
            document.getElementById('currentCharacter').textContent = nextChar;
            document.getElementById('currentCharacter').classList.add('pulse');
            
            // 清空汉字信息区域
            document.getElementById('characterInfo').textContent = "";
            
            setTimeout(() => {
                document.getElementById('currentCharacter').classList.remove('pulse');
            }, 500);
        }

        // 完成当前组
        function completeGroup() {
            // 显示完成信息
            document.getElementById('groupComplete').textContent = `本组完成！得分: ${score}`;
            document.getElementById('groupComplete').style.display = 'block';
            
            // 2秒后自动进入下一组
            setTimeout(() => {
                document.getElementById('groupComplete').style.display = 'none';
                if (currentGroup < totalGroups - 1) {
                    nextGroup();
                } else {
                    endGame();
                }
            }, 2000);
        }

        // 结束游戏
        function endGame() {
            gameStarted = false;
            clearInterval(gameTimer);
            
            document.getElementById('startBtn').disabled = false;
            document.getElementById('nextGroupBtn').disabled = true;
            
            createConfetti();
            document.getElementById('characterInfo').textContent = `游戏结束！最终得分: ${score}  准确率: ${((correctCount / totalCount) * 100).toFixed(1)}%`;
        }

        // 朗读汉字
        function speakCharacter(character) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(character);
                utterance.lang = 'zh-CN';
                utterance.rate = 0.8;
                window.speechSynthesis.speak(utterance);
            }
        }

        // 朗读文本
        function speakText(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = text.match(/[a-zA-Z]/) ? 'en-US' : 'zh-CN';
                utterance.rate = 0.7;
                window.speechSynthesis.speak(utterance);
            }
        }

        // 播放正确声音
        function playCorrectSound() {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.setValueAtTime(523.25, audioContext.currentTime);
            oscillator.frequency.setValueAtTime(659.25, audioContext.currentTime + 0.1);
            oscillator.frequency.setValueAtTime(783.99, audioContext.currentTime + 0.2);
            
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.3);
        }

        // 播放错误声音
        function playWrongSound() {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.setValueAtTime(220, audioContext.currentTime);
            oscillator.frequency.setValueAtTime(196, audioContext.currentTime + 0.1);
            oscillator.frequency.setValueAtTime(174.61, audioContext.currentTime + 0.2);
            
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.3);
        }

        // 切换声音
        function toggleSound() {
            soundEnabled = !soundEnabled;
            const soundControl = document.getElementById('soundControl');
            if (soundEnabled) {
                soundControl.style.backgroundColor = '#4CAF50';
            } else {
                soundControl.style.backgroundColor = '#ccc';
            }
        }

        // 更新统计信息
        function updateStats() {
            document.getElementById('score').textContent = score;
            document.getElementById('correctCount').textContent = correctCount;
            document.getElementById('totalCount').textContent = totalCount;
            document.getElementById('scoreDisplay').textContent = `得分: ${score}`;
            
            const accuracy = totalCount > 0 ? (correctCount / totalCount * 100).toFixed(1) : 0;
            document.getElementById('accuracy').textContent = `${accuracy}%`;
        }

        // 创建彩色纸屑效果
        function createConfetti() {
            const colors = ['#f94144', '#f3722c', '#f8961e', '#f9c74f', '#90be6d', '#43aa8b', '#577590'];
            const container = document.querySelector('.container');
            
            for (let i = 0; i < 100; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = `${Math.random() * 100}%`;
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animation = `confetti ${1 + Math.random() * 2}s forwards`;
                confetti.style.animationDelay = `${Math.random() * 0.5}s`;
                container.appendChild(confetti);
                
                setTimeout(() => {
                    confetti.remove();
                }, 3000);
            }
        }

        // 下一组
        function nextGroup() {
            if (currentGroup < totalGroups - 1) {
                loadGroup(currentGroup + 1);
                showNextCharacter();
            } else {
                endGame();
            }
        }

        // 初始化游戏
        document.addEventListener('DOMContentLoaded', initGame);
    </script>
</body>
</html>
