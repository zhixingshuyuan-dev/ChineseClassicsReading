<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>西游记第十四回汉字学习系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            gap: 20px;
        }
        
        /* 左侧汉字卡片区域 */
        .characters-section {
            flex: 1;
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-height: 90vh;
            overflow-y: auto;
        }
        
        /* 右侧正文区域 */
        .text-section {
            flex: 1.2;
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-height: 90vh;
            overflow-y: auto;
        }
        
        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 25px;
            font-size: 2.2rem;
            border-bottom: 3px solid #3498db;
            padding-bottom: 15px;
        }
        
        /* 分组控制栏 */
        .group-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
        }
        
        .group-info {
            font-size: 1.1rem;
            color: #34495e;
        }
        
        .group-nav button {
            padding: 8px 20px;
            margin-left: 10px;
            border: none;
            border-radius: 50px;
            background-color: #3498db;
            color: white;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .group-nav button:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
        }
        
        .group-nav button:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }
        
        /* 汉字网格布局 */
        .characters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(85px, 1fr));
            gap: 12px;
            margin-top: 15px;
        }
        
        .character-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #f8f9fa;
            border-radius: 10px;
            padding: 15px 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            border: 2px solid transparent;
            height: 100px;
        }
        
        .character-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            background-color: #e9ecef;
            border-color: #3498db;
        }
        
        .character-card.highlighted {
            background-color: #fff3cd;
            border-color: #ffc107;
        }
        
        .character-card.active {
            background-color: #d4edda;
            border-color: #28a745;
        }
        
        .char {
            font-size: 2.2rem;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        .pinyin {
            font-size: 0.85rem;
            color: #6c757d;
            margin-bottom: 3px;
        }
        
        .meaning {
            font-size: 0.75rem;
            color: #495057;
            text-align: center;
            line-height: 1.2;
            max-height: 2.4em;
            overflow: hidden;
        }
        
        /* 正文样式 */
        .text-content {
            line-height: 1.8;
            font-size: 2.2rem; /* 放大一倍 */
            text-align: justify;
        }
        
        .text-content p {
            margin-bottom: 30px; /* 增加间距适应更大字号 */
            text-indent: 2em;
            position: relative;
            transition: all 0.3s ease;
            padding: 15px 20px; /* 增加内边距 */
            border-radius: 8px;
        }
        
        .text-content p:hover {
            background-color: #f8f9fa;
        }
        
        /* 句子容器 */
        .sentence-container {
            position: relative;
            margin-bottom: 15px;
            padding: 10px 15px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        
        .sentence-container:hover {
            background-color: #f8f9fa;
        }
        
        .sentence-container.active {
            background-color: #e3f2fd;
            border-left: 4px solid #3498db;
            padding-left: 23px;
        }
        
        /* 正文中的汉字样式 */
        .text-char {
            cursor: pointer;
            padding: 0 2px; /* 增加内边距以适应更大字号 */
            border-radius: 3px;
            transition: all 0.2s ease;
        }
        
        .text-char:hover {
            background-color: #e3f2fd;
            color: #1565c0;
        }
        
        .text-char.highlighted {
            background-color: #fff3cd;
            color: #856404;
            font-weight: bold;
        }
        
        .text-char.active {
            background-color: #d4edda;
            color: #155724;
            font-weight: bold;
        }
        
        /* 句子朗读按钮 */
        .sentence-voice-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px; /* 增大按钮 */
            height: 40px;
            cursor: pointer;
            font-size: 1.2rem; /* 增大图标 */
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.7;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        
        .sentence-voice-btn:hover {
            opacity: 1;
            background-color: #2980b9;
            transform: translateY(-50%) scale(1.1);
        }
        
        /* 进度指示器 */
        .progress-container {
            width: 100%;
            background-color: #ecf0f1;
            border-radius: 10px;
            margin: 20px 0;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 8px;
            background-color: #3498db;
            width: 0%;
            transition: width 0.5s ease;
        }
        
        /* 统计信息 */
        .stats {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            font-size: 1rem;
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #2c3e50;
        }
        
        .stat-label {
            font-size: 0.9rem;
            color: #7f8c8d;
        }
        
        /* 标题样式 */
        .chapter-title {
            text-align: center;
            font-size: 1.8rem;
            color: #2c3e50;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e9ecef;
        }
        
        /* 卡片窗口样式 - 可移动 */
        .card-modal {
            display: none;
            position: fixed;
            top: 100px;
            left: 100px;
            z-index: 1000;
            background: white;
            border-radius: 15px;
            padding: 30px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
            animation: cardAppear 0.3s ease-out;
            cursor: move;
            user-select: none;
        }
        
        .card-modal.active {
            display: block;
        }
        
        .card-modal.dragging {
            opacity: 0.9;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
        }
        
        .card-header {
            padding: 10px 15px;
            background: #3498db;
            color: white;
            border-radius: 10px 10px 0 0;
            cursor: move;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
        }
        
        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(-20px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        
        .close-card {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #7f8c8d;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.3s ease;
            z-index: 1001;
        }
        
        .close-card:hover {
            background-color: #f8f9fa;
            color: #495057;
        }
        
        .card-char {
            font-size: 4rem;
            margin: 20px 0;
            font-weight: bold;
            color: #2c3e50;
        }
        
        .card-pinyin {
            font-size: 1.5rem;
            color: #e74c3c;
            margin-bottom: 10px;
            font-weight: 500;
        }
        
        .card-meaning {
            font-size: 1.2rem;
            color: #34495e;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        
        .card-footer {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }
        
        .voice-btn {
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .voice-btn:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
        }
        
        .learned-btn {
            padding: 10px 20px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        .learned-btn:hover {
            background-color: #218838;
            transform: translateY(-2px);
        }
        
        .learned-btn.active {
            background-color: #6c757d;
        }
        
        /* 语音控制按钮 */
        .voice-control {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 100;
        }
        
        .voice-toggle {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: #3498db;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .voice-toggle:hover {
            background-color: #2980b9;
            transform: scale(1.1);
        }
        
        .voice-toggle.muted {
            background-color: #e74c3c;
        }
        
        /* 响应式设计 */
        @media (max-width: 1100px) {
            .container {
                flex-direction: column;
            }
            
            .characters-section, .text-section {
                max-height: 70vh;
            }
        }
        
        @media (max-width: 768px) {
            .characters-grid {
                grid-template-columns: repeat(auto-fill, minmax(75px, 1fr));
            }
            
            .char {
                font-size: 1.8rem;
            }
            
            h1 {
                font-size: 1.8rem;
            }
            
            .text-content {
                font-size: 1.8rem; /* 响应式调整 */
            }
            
            .card-modal {
                padding: 20px;
                left: 5%;
                top: 50px;
            }
            
            .card-char {
                font-size: 3rem;
            }
            
            .sentence-voice-btn {
                width: 35px;
                height: 35px;
                font-size: 1rem;
            }
        }
        
        @media (max-width: 480px) {
            .characters-grid {
                grid-template-columns: repeat(auto-fill, minmax(65px, 1fr));
            }
            
            .char {
                font-size: 1.6rem;
            }
            
            .character-card {
                height: 90px;
                padding: 10px 3px;
            }
            
            .card-footer {
                flex-direction: column;
                gap: 10px;
            }
            
            .text-content {
                font-size: 1.6rem; /* 响应式调整 */
            }
            
            .sentence-voice-btn {
                width: 30px;
                height: 30px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <!-- 可移动的卡片窗口 -->
    <div class="card-modal" id="card-modal">

        <button class="close-card" id="close-card">×</button>

        <div class="card-pinyin" id="card-pinyin">wù</div>
        <div class="card-meaning" id="card-meaning">to comprehend, awaken</div>
        <div class="card-footer">
            <button class="voice-btn" id="card-voice-btn">
                <span>🔊 朗读</span>
            </button>
            <button class="learned-btn" id="mark-learned-btn">标记为已学习</button>

        </div>
    </div>

            e.preventDefault();
        }
        
        function startDragTouch(e) {
            if (e.touches.length === 1) {
                isDragging = true;
                cardModal.classList.add('dragging');
                
                const rect = cardModal.getBoundingClientRect();
                dragOffsetX = e.touches[0].clientX - rect.left;
                dragOffsetY = e.touches[0].clientY - rect.top;
                
                e.preventDefault();
            }
        }
        
        function handleDrag(e) {
            if (!isDragging) return;
            
            let x = e.clientX - dragOffsetX;
            let y = e.clientY - dragOffsetY;
            
            // 限制在窗口内
            const maxX = window.innerWidth - cardModal.offsetWidth;
            const maxY = window.innerHeight - cardModal.offsetHeight;
            
            x = Math.max(0, Math.min(x, maxX));
            y = Math.max(0, Math.min(y, maxY));
            
            cardModal.style.left = x + 'px';
            cardModal.style.top = y + 'px';
        }
        
        function handleDragTouch(e) {
            if (!isDragging || e.touches.length !== 1) return;
            
            let x = e.touches[0].clientX - dragOffsetX;
            let y = e.touches[0].clientY - dragOffsetY;
            
            // 限制在窗口内
            const maxX = window.innerWidth - cardModal.offsetWidth;
            const maxY = window.innerHeight - cardModal.offsetHeight;
            
            x = Math.max(0, Math.min(x, maxX));
            y = Math.max(0, Math.min(y, maxY));
            
            cardModal.style.left = x + 'px';
            cardModal.style.top = y + 'px';
            
            e.preventDefault();
        }
        
        function stopDrag() {
            isDragging = false;
            cardModal.classList.remove('dragging');
        }
        
        // 显示卡片窗口
        function showCard(char) {
            currentCardChar = char;
            
            // 查找汉字数据
            let charData = null;
            for (let group in characterData) {
                const found = characterData[group].find(item => item.char === char);
                if (found) {
                    charData = found;
                    break;
                }
            }
            
            if (charData) {
                cardCharElement.textContent = charData.char;
                cardPinyinElement.textContent = charData.pinyin;
                cardMeaningElement.textContent = charData.meaning;
                
                // 更新标记按钮状态
                if (learnedChars.has(char)) {
                    markLearnedButton.textContent = '已学习 ✓';
                    markLearnedButton.classList.add('active');
                } else {
                    markLearnedButton.textContent = '标记为已学习';
                    markLearnedButton.classList.remove('active');
                }
                
                // 显示卡片
                cardModal.classList.add('active');
                
                // 朗读汉字
                speakText(char);
            }
        }
        
        // 关闭卡片窗口
        function closeCard() {
            cardModal.classList.remove('active');
            currentCardChar = null;
        }
        
        // 计算总汉字数
        function calculateTotalChars() {
            let total = 0;
            for (let group in characterData) {
                total += characterData[group].length;
            }
            return total;
        }
        
        // 更新统计信息
        function updateStats() {
            const totalChars = calculateTotalChars();
            totalCharsElement.textContent = totalChars;
            learnedCharsElement.textContent = learnedChars.size;
            
            // 更新进度条
            const progress = (learnedChars.size / totalChars) * 100;
            progressBar.style.width = `${progress}%`;
        }
        
        // 渲染汉字卡片
        function renderCharacterCards() {
            charactersContainer.innerHTML = '';
            currentGroupElement.textContent = currentGroup;
            currentGroupDisplayElement.textContent = currentGroup;
            
            const groupData = characterData[currentGroup] || [];
            
            // 创建网格容器
            const grid = document.createElement('div');
            grid.className = 'characters-grid';
            
            groupData.forEach(charData => {
                const card = document.createElement('div');
                card.className = 'character-card';
                if (learnedChars.has(charData.char)) {
                    card.classList.add('active');
                }
                if (activeChar === charData.char) {
                    card.classList.add('highlighted');
                }
                
                card.dataset.char = charData.char;
                
                // 只显示汉字，不显示拼音和释义
                card.innerHTML = `
                    <div class="char">${charData.char}</div>
                `;
                
                // 点击卡片事件
                card.addEventListener('click', () => {
                    handleCharacterClick(charData.char);
                });
                
                grid.appendChild(card);
            });
            
            charactersContainer.appendChild(grid);
            
            // 更新按钮状态
            prevGroupButton.disabled = currentGroup <= 1;
            nextGroupButton.disabled = currentGroup >= Object.keys(characterData).length;
            
            updateStats();
        }
        
        // 处理汉字卡片点击
        function handleCharacterClick(char) {
            activeChar = char;
            renderCharacterCards();
            highlightTextChars(char);
            showCard(char);
            
            // 滚动到正文中该汉字的第一个位置
            if (charPositions[char] && charPositions[char].length > 0) {
                const firstPosition = charPositions[char][0];
                const textCharElement = document.querySelector(`[data-char-index="${firstPosition}"]`);
                if (textCharElement) {
                    textCharElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }
        }
        
        // 渲染正文内容
        function renderTextContent() {
            textContentElement.innerHTML = '';
            charPositions = {};
            
            // 按句子渲染
            textSentences.forEach((sentence, sentenceIndex) => {
                const sentenceContainer = document.createElement('div');
                sentenceContainer.className = 'sentence-container';
                sentenceContainer.dataset.sentenceIndex = sentenceIndex;
                
                // 处理句子中的每个字符
                for (let i = 0; i < sentence.length; i++) {
                    const char = sentence[i];
                    const span = document.createElement('span');
                    span.className = 'text-char';
                    span.textContent = char;
                    span.dataset.char = char;
                    span.dataset.charIndex = `${sentenceIndex}-${i}`;
                    
                    // 存储汉字位置
                    if (!charPositions[char]) {
                        charPositions[char] = [];
                    }
                    charPositions[char].push(`${sentenceIndex}-${i}`);
                    
                    // 点击正文汉字事件
                    span.addEventListener('click', () => {
                        handleTextCharClick(char);
                    });
                    
                    sentenceContainer.appendChild(span);
                }
                
                // 添加朗读按钮
                const voiceButton = document.createElement('button');
                voiceButton.className = 'sentence-voice-btn';
                voiceButton.innerHTML = '🔊';
                voiceButton.title = '朗读此句';
                voiceButton.dataset.sentenceIndex = sentenceIndex;
                
                voiceButton.addEventListener('click', (e) => {
                    e.stopPropagation(); // 防止触发容器点击事件
                    handleSentenceVoiceClick(sentence);
                });
                
                sentenceContainer.appendChild(voiceButton);
                
                // 点击句子容器高亮
                sentenceContainer.addEventListener('click', (e) => {
                    if (!e.target.classList.contains('text-char') && !e.target.classList.contains('sentence-voice-btn')) {
                        // 高亮当前句子
                        const allSentences = document.querySelectorAll('.sentence-container');
                        allSentences.forEach(s => s.classList.remove('active'));
                        sentenceContainer.classList.add('active');
                    }
                });
                
                textContentElement.appendChild(sentenceContainer);
            });
            
            // 如果有活动的汉字，高亮显示
            if (activeChar) {
                highlightTextChars(activeChar);
            }
        }
        
        // 处理句子朗读按钮点击
        function handleSentenceVoiceClick(sentence) {
            speakText(sentence);
        }
        
        // 处理正文汉字点击
        function handleTextCharClick(char) {
            activeChar = char;
            renderCharacterCards();
            highlightTextChars(char);
            showCard(char);
        }
        
        // 高亮正文中的汉字
        function highlightTextChars(char) {
            // 移除所有高亮
            const allTextChars = document.querySelectorAll('.text-char');
            allTextChars.forEach(el => {
                el.classList.remove('highlighted', 'active');
            });
            
            // 高亮当前汉字的所有出现位置
            if (charPositions[char]) {
                charPositions[char].forEach(index => {
                    const element = document.querySelector(`[data-char-index="${index}"]`);
                    if (element) {
                        element.classList.add('highlighted');
                    }
                });
            }
            
            // 高亮活动汉字卡片
            const charCard = document.querySelector(`.character-card[data-char="${char}"]`);
            if (charCard) {
                charCard.classList.add('highlighted');
            }
        }
        
        // 切换到上一组
        function goToPrevGroup() {
            if (currentGroup > 1) {
                currentGroup--;
                activeChar = null;
                renderCharacterCards();
                // 移除正文高亮
                const allTextChars = document.querySelectorAll('.text-char');
                allTextChars.forEach(el => {
                    el.classList.remove('highlighted', 'active');
                });
                // 移除句子高亮
                const allSentences = document.querySelectorAll('.sentence-container');
                allSentences.forEach(s => s.classList.remove('active'));
            }
        }
        
        // 切换到下一组
        function goToNextGroup() {
            const totalGroups = Object.keys(characterData).length;
            if (currentGroup < totalGroups) {
                currentGroup++;
                activeChar = null;
                renderCharacterCards();
                // 移除正文高亮
                const allTextChars = document.querySelectorAll('.text-char');
                allTextChars.forEach(el => {
                    el.classList.remove('highlighted', 'active');
                });
                // 移除句子高亮
                const allSentences = document.querySelectorAll('.sentence-container');
                allSentences.forEach(s => s.classList.remove('active'));
            }
        }
        
        // 标记汉字为已学习
        function markCharAsLearned() {
            if (currentCardChar) {
                if (learnedChars.has(currentCardChar)) {
                    learnedChars.delete(currentCardChar);
                    markLearnedButton.textContent = '标记为已学习';
                    markLearnedButton.classList.remove('active');
                } else {
                    learnedChars.add(currentCardChar);
                    markLearnedButton.textContent = '已学习 ✓';
                    markLearnedButton.classList.add('active');
                }
                updateStats();
                renderCharacterCards();
            }
        }
        
        // 切换语音开关
        function toggleVoice() {
            speechEnabled = !speechEnabled;
            if (speechEnabled) {
                voiceToggle.classList.remove('muted');
                voiceToggle.textContent = '🔊';
                voiceToggle.title = '关闭语音';
            } else {
                voiceToggle.classList.add('muted');
                voiceToggle.textContent = '🔇';
                voiceToggle.title = '开启语音';
                // 停止当前语音
                window.speechSynthesis.cancel();
            }
        }
        
        // 初始化事件监听器
        function initEventListeners() {
            prevGroupButton.addEventListener('click', goToPrevGroup);
            nextGroupButton.addEventListener('click', goToNextGroup);
            closeCardButton.addEventListener('click', closeCard);
            cardVoiceButton.addEventListener('click', () => {
                if (currentCardChar) {
                    speakText(currentCardChar);
                }
            });
            markLearnedButton.addEventListener('click', markCharAsLearned);
            voiceToggle.addEventListener('click', toggleVoice);
            
            // 点击卡片外部关闭卡片
            cardModal.addEventListener('click', (e) => {
                if (e.target === cardModal) {
                    closeCard();
                }
            });
            
            // 键盘导航
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeCard();
                } else if (e.key === 'ArrowLeft') {
                    goToPrevGroup();
                } else if (e.key === 'ArrowRight') {
                    goToNextGroup();
                }
            });
        }
        
        // 初始化应用
        function init() {
            updateStats();
            renderCharacterCards();
            renderTextContent();
            initEventListeners();
            initCardDragging();
            
            // 检查浏览器是否支持语音合成
            if (!('speechSynthesis' in window)) {
                alert('您的浏览器不支持语音合成功能，部分功能可能无法正常使用。');
                voiceToggle.style.display = 'none';
                speechEnabled = false;
            }
        }
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
