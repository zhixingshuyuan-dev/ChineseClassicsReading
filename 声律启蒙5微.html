    <div class="container">

        </header>
        
        <main class="content">

    <script>

            "晚霞舒錦繡，朝露綴珠璣。",
            "夏暑客思欹石枕，秋寒婦念寄邊衣。",
            "春水才深清草岸邊漁父去；夕陽半落綠莎原上牧童歸。",

            "珊瑚對玳瑁，錦繡對珠璣。",
            "桃灼灼，柳依依，綠暗對紅稀。",
            "窗前鶯並語，簾外燕雙飛。",
            "漢致太平三尺劍，周臻大定一戎衣。",
            "吟成賞月之詩只愁月墮；斟滿送春之酒惟憾春歸。",
            "聲對色，飽對飢，虎節對龍旗。",
            "楊花對桂葉，白簡對朱衣。",
            "尨也吠，燕于非，蕩蕩對巍巍。",

        // 加载当前句子
        function loadCurrentSentence() {
            let currentSentence = poemSentences[currentSentenceIndex];
            
            if (!isTraditional) {
                currentSentence = convertToSimplified(currentSentence);
            }
            
            // 过滤出汉字（去除标点、数字、空格和所有非汉字字符）
            currentSentenceChars = currentSentence.split('').filter(char => {
                const code = char.charCodeAt(0);
                return code >= 0x4E00 && code <= 0x9FFF;
            });
            
            currentCharIndex = 0;
            isShowingFullSentence = false;
            isRepeatingSentence = false;
        }

        function updateDisplay() {
            if (currentCharIndex < currentSentenceChars.length && !isShowingFullSentence) {
                // 显示单个汉字
                const currentChar = currentSentenceChars[currentCharIndex];
                charElement.textContent = currentChar;
                charElement.style.display = 'block';
                
                // 隐藏完整句子
                sentenceDisplayElement.textContent = "";
                sentenceDisplayElement.classList.remove('show', 'highlight');
                
                // 更新进度
                const progress = ((currentSentenceIndex + 1) / poemSentences.length) * 100;
                progressBarElement.style.width = `${progress}%`;
                
                currentSentenceElement.textContent = currentSentenceIndex + 1;
                
                if (!isPlaying) {
                    charElement.classList.add('paused');
                } else {
                    charElement.classList.remove('paused');
                }
                
                applyRandomEffects();
                updateButtonStates();
            } else if (isShowingFullSentence) {
                // 显示完整句子
                let currentSentence = poemSentences[currentSentenceIndex];
                
                if (!isTraditional) {
                    currentSentence = convertToSimplified(currentSentence);
                }
                
                sentenceDisplayElement.textContent = currentSentence;
                sentenceDisplayElement.classList.add('show', 'highlight');

                charElement.style.display = 'none';

                updateButtonStates();
            }

                                        isShowingFullSentence = true;
                                        updateDisplay();
                                        
                                        // 整句显示后停顿一下，然后朗读整句（三遍）
                                        setTimeout(() => {
                                            speakCurrentSentenceThreeTimes();
                                        }, 500);
                                    }, speedConfig.charPause);
                                } else {
                                    // 继续显示下一个字
                                    setTimeout(playNextStep, speedConfig.charInterval);
                                }
                            }, speedConfig.charPause);
                        }, 100);
                    }
                }
            }
            
            // 开始播放
            playNextStep();
        }

        // 播放下一个步骤（手动模式下使用）
        function nextStep() {
            if (!isShowingFullSentence) {
                // 显示单个汉字
                if (currentCharIndex < currentSentenceChars.length) {
                    updateDisplay();
                    
                    // 汉字显示后立即朗读
                    setTimeout(() => {
                        speakCurrentChar();
                        
                        currentCharIndex++;
                        
                        if (currentCharIndex >= currentSentenceChars.length) {
                            // 所有字显示完毕，停顿一下后显示完整句子
                            setTimeout(() => {
                                isShowingFullSentence = true;
                                updateDisplay();
                                
                                // 整句显示后停顿一下，然后朗读整句（三遍）
                                setTimeout(() => {
                                    speakCurrentSentenceThreeTimes();
                                }, 500);
                            }, 500);
                        }
                    }, 100);
                }
            } else {
                // 已经显示完整句子，进入下一句
                goToNextSentence();
            }
        }

        // 朗读整句三遍
        function speakCurrentSentenceThreeTimes() {
            if (!isSpeechSupported || !isPlaying || isMuted) return;
            
            isRepeatingSentence = true;
            
            // 添加朗读状态提示
            const statusElement = document.createElement('div');
            statusElement.className = 'repeat-status';
            statusElement.id = 'repeat-status';
            statusElement.textContent = '整句朗读: 第1遍';
            document.querySelector('.content').appendChild(statusElement);
            
            let currentSentence = poemSentences[currentSentenceIndex];
            
            if (!isTraditional) {
                currentSentence = convertToSimplified(currentSentence);
            }
            
            if (utterance) speechSynthesis.cancel();
            
            let repeatCount = 0;
            
            function speakWithRepeat() {
                if (repeatCount >= 3 || !isPlaying || isMuted) {
                    // 朗读完成，移除状态提示
                    const status = document.getElementById('repeat-status');
                    if (status) status.remove();
                    isRepeatingSentence = false;
                    
                    // 如果是自动模式，继续下一句
                    if (displayMode === "auto") {
                        setTimeout(() => {
                            goToNextSentence();
                            // 继续播放
                            if (isPlaying) startAutoPlay();
                        }, speedMap[playSpeed].sentencePause);
                    }
                    return;
                }
                
                // 更新状态提示
                const status = document.getElementById('repeat-status');
                if (status) {
                    status.textContent = `整句朗读: 第${repeatCount + 1}遍`;
                }
                
                utterance = new SpeechSynthesisUtterance(currentSentence);
                utterance.lang = 'zh-CN';
                utterance.rate = 0.8; // 整句朗读速度适中（0.8）
                
                const voices = speechSynthesis.getVoices();
                const chineseVoice = voices.find(voice => voice.lang === 'zh-CN' || voice.lang === 'zh-TW');
                if (chineseVoice) {
                    utterance.voice = chineseVoice;
                }
                
                utterance.onend = function() {
                    repeatCount++;
                    if (repeatCount < 3) {
                        // 每遍之间停顿2秒
                        setTimeout(speakWithRepeat, 2000);
                    } else {
                        // 三遍结束后，更新状态并继续
                        speakWithRepeat();
                    }
                };
                
                speechSynthesis.speak(utterance);
            }
            
            speakWithRepeat();
        }

        // 朗读当前字符（旧版本，保留兼容性）
        function speakCurrentChar() {
            if (!isSpeechSupported || !isPlaying || isMuted) return;
            
            const currentChar = currentSentenceChars[currentCharIndex];
            
            if (utterance) speechSynthesis.cancel();
            
            utterance = new SpeechSynthesisUtterance(currentChar);
            utterance.lang = 'zh-CN';
            utterance.rate = 1.0; // 单字正常语速
            
            const voices = speechSynthesis.getVoices();
            const chineseVoice = voices.find(voice => voice.lang === 'zh-CN' || voice.lang === 'zh-TW');
            if (chineseVoice) {
                utterance.voice = chineseVoice;
            }
            
            speechSynthesis.speak(utterance);
        }

        // 朗读当前句子（旧版本，保留兼容性）
        function speakCurrentSentence() {
            if (!isSpeechSupported || !isPlaying || isMuted) return;
            
            let currentSentence = poemSentences[currentSentenceIndex];
            
            if (!isTraditional) {
                currentSentence = convertToSimplified(currentSentence);
            }
            
            if (utterance) speechSynthesis.cancel();
            
            utterance = new SpeechSynthesisUtterance(currentSentence);
            utterance.lang = 'zh-CN';
            utterance.rate = 0.8; // 整句朗读速度适中（0.8）
            
            const voices = speechSynthesis.getVoices();
            const chineseVoice = voices.find(voice => voice.lang === 'zh-CN' || voice.lang === 'zh-TW');
            if (chineseVoice) {
                utterance.voice = chineseVoice;
            }
            
            speechSynthesis.speak(utterance);
        }

        // 进入下一句
        function goToNextSentence() {
            if (currentSentenceIndex < poemSentences.length - 1) {
                currentSentenceIndex++;
                loadCurrentSentence();
                updateDisplay();
            } else {
                // 已经是最后一句，停止播放
                isPlaying = false;
                playPauseBtn.innerHTML = '<i class="fas fa-play"></i>';
                playPauseBtn.title = "播放";
                charElement.classList.add('paused');
            }
            
            updateButtonStates();
        }

        // 进入上一句
        function prevStep() {
            if (isRepeatingSentence) {
                // 如果正在朗读整句三遍，先停止朗读
                if (speechSynthesis.speaking) {
                    speechSynthesis.cancel();
                }
                const status = document.getElementById('repeat-status');
                if (status) status.remove();
                isRepeatingSentence = false;
            }
            
            if (currentCharIndex > 0 && !isShowingFullSentence) {
                // 回到当前句的上一个字
                currentCharIndex--;
                updateDisplay();
                if (isPlaying && !isMuted) {
                    speakCurrentChar();
                }
            } else if (isShowingFullSentence) {
                // 从完整句子回到单字显示
                isShowingFullSentence = false;
                currentCharIndex = currentSentenceChars.length - 1;
                updateDisplay();
            } else if (currentSentenceIndex > 0) {
                // 回到上一句
                currentSentenceIndex--;
                loadCurrentSentence();
                isShowingFullSentence = true; // 显示上一句的完整句子
                updateDisplay();
                
                // 然后回到单字显示
                setTimeout(() => {
                    isShowingFullSentence = false;
                    currentCharIndex = currentSentenceChars.length - 1;
                    updateDisplay();
                }, 1000);
            }
            
            updateButtonStates();
        }

        // 播放/暂停切换
        function togglePlayPause() {
            isPlaying = !isPlaying;
            
            if (isPlaying) {
                playPauseBtn.innerHTML = '<i class="fas fa-pause"></i>';
                playPauseBtn.title = "暂停";
                charElement.classList.remove('paused');
                
                if (displayMode === "auto") {
                    startAutoPlay();
                } else {
                    if (!speechSynthesis.speaking && !isMuted) {
                        if (isShowingFullSentence && !isRepeatingSentence) {
                            speakCurrentSentenceThreeTimes();
                        } else if (!isShowingFullSentence) {
                            speakCurrentChar();
                        }
                    }
                }
            } else {
                playPauseBtn.innerHTML = '<i class="fas fa-play"></i>';
                playPauseBtn.title = "播放";
                charElement.classList.add('paused');
                
                if (speechSynthesis.speaking) {
                    speechSynthesis.cancel();
                }
                
                if (timer) clearInterval(timer);
            }
        }

        // 静音切换
        function toggleMute() {
            isMuted = !isMuted;
            
            if (isMuted) {
                muteBtn.innerHTML = '<i class="fas fa-volume-mute"></i>';
                muteBtn.title = "取消静音";
                muteBtn.classList.add('muted');
                
                if (speechSynthesis.speaking) {
                    speechSynthesis.cancel();
                }
            } else {
                muteBtn.innerHTML = '<i class="fas fa-volume-up"></i>';
                muteBtn.title = "静音";
                muteBtn.classList.remove('muted');
                
                if (isPlaying && !speechSynthesis.speaking) {
                    if (isShowingFullSentence && !isRepeatingSentence) {
                        speakCurrentSentenceThreeTimes();
                    } else if (!isShowingFullSentence) {
                        speakCurrentChar();
                    }
                }
            }
        }

        // 繁简转换（对调）
        function toggleLanguage() {
            isTraditional = !isTraditional;
            
            if (isTraditional) {
                langBtn.textContent = "繁";
                langBtn.title = "切换到简体字";
            } else {
                langBtn.textContent = "简";
                langBtn.title = "切换到繁体字";
            }
            
            loadCurrentSentence();
            updateDisplay();
            langBtn.classList.toggle('active', isTraditional);
        }

        // 显示设置面板
        function toggleSettings() {
            settingsVisible = !settingsVisible;
            settingsPanel.style.display = settingsVisible ? 'block' : 'none';
            settingsBtn.innerHTML = settingsVisible ? 
                '<i class="fas fa-times"></i>' : 
                '<i class="fas fa-cog"></i>';
            settingsBtn.title = settingsVisible ? "关闭设置" : "设置";
        }

        // 更新播放速度
        function updateSpeed() {
            playSpeed = parseInt(speedSlider.value);
            updateSpeedDisplay();
            
            if (isPlaying && displayMode === "auto") {
                startAutoPlay();
            }
        }

        // 更新速度显示
        function updateSpeedDisplay() {
            const speedConfig = speedMap[playSpeed];
            speedValue.textContent = speedConfig.label;
        }

        // 更新字体大小
        function updateFontSize() {
            fontSize = parseInt(fontSizeSlider.value);
            updateFontSizeDisplay();
            applyRandomEffects(); // 重新应用效果以更新字体大小
        }

        // 更新字体大小显示
        function updateFontSizeDisplay() {
            fontSizeValue.textContent = `${fontSize}vw`;
        }

        // 更新显示模式
        function updateDisplayMode() {
            displayMode = displayModeSelect.value;
            
            if (isPlaying && displayMode === "auto") {
                startAutoPlay();
            } else if (displayMode === "manual") {
                if (timer) clearInterval(timer);
            }
        }

        // 显示汉字解释
        function showExplanation() {
            const currentChar = isShowingFullSentence ? "" : currentSentenceChars[currentCharIndex];
            modalCharElement.textContent = currentChar;
            
            let explanationHTML = "";
            
            const relatedExplanations = [];
            
            for (const [word, explanation] of Object.entries(explanations)) {
                let searchWord = word;
                if (!isTraditional) {
                    searchWord = convertToSimplified(word);
                }
                
                if (searchWord.includes(currentChar)) {
                    relatedExplanations.push({word: searchWord, explanation});
                }
            }
            
            const commonWords = [];
            const simplifiedChar = convertToSimplified(currentChar);
            
            if (commonWordsDefinitions[simplifiedChar]) {
                commonWords.push({
                    word: currentChar,
                    ...commonWordsDefinitions[simplifiedChar]
                });
            }
            
            for (const [word, definition] of Object.entries(commonWordsDefinitions)) {
                if (word.includes(simplifiedChar) && word !== simplifiedChar) {
                    let displayWord = word;
                    if (isTraditional) {
                        displayWord = convertToTraditional(word);
                    }
                    
                    commonWords.push({
                        word: displayWord,
                        ...definition
                    });
                }
            }
            
            if (relatedExplanations.length > 0) {
                explanationHTML += `<div class="definition-section">`;
                explanationHTML += `<div class="definition-title"><i class="fas fa-landmark"></i> 典故解释</div>`;
                
                relatedExplanations.forEach(item => {
                    explanationHTML += `<div class="definition-item">`;
                    explanationHTML += `<strong>${item.word}</strong>：${item.explanation}</div>`;
                });
                
                explanationHTML += `</div>`;
            }
            
            if (commonWords.length > 0) {
                explanationHTML += `<div class="definition-section">`;
                explanationHTML += `<div class="definition-title"><i class="fas fa-book"></i> 一般释义</div>`;
                
                commonWords.forEach(item => {
                    explanationHTML += `<div class="definition-item">`;
                    explanationHTML += `<strong>${item.word}</strong> `;
                    explanationHTML += `<span class="word-type">${item.type}</span><br>`;
                    explanationHTML += `<span class="pinyin">拼音：${item.pinyin}</span><br>`;
                    explanationHTML += `释义：${item.definition}<br>`;
                    explanationHTML += `<div class="example">例词：${item.example}</div>`;
                    explanationHTML += `</div>`;
                });
                
                explanationHTML += `</div>`;
            }
            
            if (explanationHTML === "") {
                explanationHTML = `
                    <div class="no-explanation">
                        <p><i class="fas fa-info-circle" style="font-size: 3rem; color: #ccc; margin-bottom: 15px;"></i></p>
                        <p>未找到该字的详细解释</p>
                        <p>此字为常见汉字，如需了解其含义，请查阅字典。</p>
                    </div>
                `;
            }
            
            explanationElement.innerHTML = explanationHTML;
            charModal.style.display = 'flex';
        }

        // 事件监听
        playPauseBtn.addEventListener('click', togglePlayPause);
        prevBtn.addEventListener('click', prevStep);
        nextBtn.addEventListener('click', nextStep);
        muteBtn.addEventListener('click', toggleMute);
        langBtn.addEventListener('click', toggleLanguage);
        settingsBtn.addEventListener('click', toggleSettings);
        speedSlider.addEventListener('input', updateSpeed);
        fontSizeSlider.addEventListener('input', updateFontSize);
        displayModeSelect.addEventListener('change', updateDisplayMode);
        closeModalBtn.addEventListener('click', () => {
            charModal.style.display = 'none';
        });
        
        charElement.addEventListener('click', showExplanation);
        
        window.addEventListener('click', (e) => {
            if (e.target === charModal) {
                charModal.style.display = 'none';
            }
        });

        // 键盘快捷键
        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case ' ':
                case 'Spacebar':
                    e.preventDefault();
                    togglePlayPause();
                    break;
                case 'ArrowLeft':
                    e.preventDefault();
                    prevStep();
                    break;
                case 'ArrowRight':
                    e.preventDefault();
                    nextStep();
                    break;
                case 'm':
                case 'M':
                    e.preventDefault();
                    toggleMute();
                    break;
                case 'l':
                case 'L':
                    e.preventDefault();
                    toggleLanguage();
                    break;
                case 'Escape':
                    charModal.style.display = 'none';
                    settingsPanel.style.display = 'none';
                    settingsVisible = false;
                    settingsBtn.innerHTML = '<i class="fas fa-cog"></i>';
                    settingsBtn.title = "设置";
                    break;
            }
        });

        // 页面加载时初始化
        window.addEventListener('load', init);
    </script>
</body>
</html>
