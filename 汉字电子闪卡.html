<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>汉字闪卡 - 1000个进阶汉字学习</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            user-select: none;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 2.2rem;
        }
        
        .subtitle {
            color: #7f8c8d;
            font-size: 1.1rem;
            margin-bottom: 20px;
        }
        
        .stats-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-box {
            background: white;
            border-radius: 10px;
            padding: 15px 25px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
            min-width: 140px;
        }
        
        .stat-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: #3498db;
        }
        
        .stat-label {
            font-size: 0.9rem;
            color: #7f8c8d;
            margin-top: 5px;
        }
        
        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }
        
        .card-container {
            perspective: 1000px;
            width: 100%;
            max-width: 500px;
            height: 350px; /* 增加卡片高度以容纳更多内容 */
            position: relative;
        }
        
        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }
        
        .card.flipped {
            transform: rotateY(180deg);
        }
        
        .card.fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1000;
            max-width: 100%;
            perspective: none;
            background: rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .card.fullscreen .card-front,
        .card.fullscreen .card-back {
            width: 90%;
            height: 90%;
            max-width: 600px;
            max-height: 600px;
        }
        
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }
        
        .card-front {
            background: linear-gradient(135deg, #3498db, #2c3e50);
            color: white;
        }
        
        .card-back {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
            transform: rotateY(180deg);
            text-align: center;
        }
        
        .character {
            font-size: 7rem;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }
        
        .card.clicked .character {
            transform: scale(1.05);
        }
        
        .pinyin {
            font-size: 2rem;
            margin-bottom: 15px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .pinyin.show {
            opacity: 0.9;
        }
        
        .meaning {
            font-size: 1.5rem;
            opacity: 0;
            transition: opacity 0.3s ease;
            text-align: center;
            max-width: 85%;
            line-height: 1.4;
            padding: 0 10px;
            margin-bottom: 25px; /* 增大英文释义与使用说明之间的间距 */
        }
        
        .meaning.show {
            opacity: 0.9;
        }
        
        .example {
            font-size: 3.5rem;
            margin: 15px 0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }
        
        .example-pinyin {
            font-size: 1.8rem;
            margin-bottom: 15px;
            opacity: 0.9;
        }
        
        .example-meaning {
            font-size: 1.5rem;
            opacity: 0.9;
            max-width: 85%;
            line-height: 1.4;
            padding: 0 10px;
            margin-bottom: 25px; /* 增大例词释义与使用说明之间的间距 */
        }
        
        .hint {
            position: absolute;
            bottom: 25px;
            font-size: 0.95rem;
            opacity: 0.8;
            text-align: center;
            width: 100%;
            padding: 0 25px;
            line-height: 1.4;
            letter-spacing: 0.3px;
        }
        
        .click-count {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
        }
        
        .navigation {
            position: absolute;
            top: 50%;
            width: 100%;
            display: flex;
            justify-content: space-between;
            transform: translateY(-50%);
            z-index: 10;
            pointer-events: none;
        }
        
        .nav-btn {
            pointer-events: all;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            font-size: 1.2rem;
            color: #2c3e50;
            margin: 0 10px;
        }
        
        .nav-btn:hover {
            background: white;
            transform: scale(1.1);
        }
        
        .nav-btn:active {
            transform: scale(0.95);
        }
        
        .card.fullscreen .nav-btn {
            width: 60px;
            height: 60px;
            font-size: 1.5rem;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            width: 100%;
            max-width: 500px;
        }
        
        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .btn-primary {
            background-color: #3498db;
            color: white;
        }
        
        .btn-secondary {
            background-color: #e74c3c;
            color: white;
        }
        
        .btn-success {
            background-color: #2ecc71;
            color: white;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 8px rgba(0, 0, 0, 0.15);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .progress-container {
            width: 100%;
            max-width: 500px;
            background-color: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
        }
        
        .progress-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        
        .progress-bar {
            height: 12px;
            background-color: #ecf0f1;
            border-radius: 6px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background-color: #2ecc71;
            width: 0%;
            transition: width 0.5s ease;
        }
        
        .settings {
            background-color: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            margin-top: 20px;
        }
        
        .settings h3 {
            margin-bottom: 15px;
            color: #2c3e50;
        }
        
        .settings-options {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .setting-option {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .footer {
            text-align: center;
            margin-top: 40px;
            color: #7f8c8d;
            font-size: 0.9rem;
        }
        
        @media (max-width: 768px) {
            .card-container {
                height: 320px; /* 移动端也增加高度 */
            }
            
            .character {
                font-size: 5.5rem;
                margin-bottom: 8px;
            }
            
            .pinyin {
                font-size: 1.8rem;
                margin-bottom: 12px;
            }
            
            .meaning {
                font-size: 1.3rem;
                margin-bottom: 20px; /* 移动端保持间距 */
            }
            
            .example {
                font-size: 2.5rem;
                margin: 12px 0;
            }
            
            .example-meaning {
                font-size: 1.3rem;
                margin-bottom: 20px; /* 移动端保持间距 */
            }
            
            .btn {
                padding: 12px 20px;
            }
            
            .nav-btn {
                width: 45px;
                height: 45px;
            }
            
            .hint {
                font-size: 0.85rem;
                bottom: 20px;
                padding: 0 20px;
            }
        }
        
        @media (max-width: 480px) {
            .card-container {
                height: 300px; /* 小屏幕保持适当高度 */
            }
            
            .character {
                font-size: 4.5rem;
                margin-bottom: 5px;
            }
            
            .pinyin {
                font-size: 1.6rem;
                margin-bottom: 10px;
            }
            
            .meaning {
                font-size: 1.2rem;
                margin-bottom: 18px; /* 移动端保持间距 */
                max-width: 90%;
            }
            
            .example {
                font-size: 2rem;
                margin: 10px 0;
            }
            
            .example-pinyin {
                font-size: 1.4rem;
                margin-bottom: 12px;
            }
            
            .example-meaning {
                font-size: 1.2rem;
                margin-bottom: 18px; /* 移动端保持间距 */
                max-width: 90%;
            }
            
            .controls {
                flex-direction: column;
                align-items: center;
            }
            
            .btn {
                width: 100%;
                max-width: 250px;
                justify-content: center;
            }
            
            .nav-btn {
                width: 40px;
                height: 40px;
                font-size: 1rem;
            }
            
            .hint {
                font-size: 0.8rem;
                bottom: 18px;
                padding: 0 15px;
            }
        }
        
        @media (max-height: 600px) {
            .card.fullscreen .card-front,
            .card.fullscreen .card-back {
                height: 85%;
            }
            
            .character {
                font-size: 4.5rem;
            }
            
            .example {
                font-size: 2.5rem;
            }
            
            .hint {
                bottom: 15px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>汉字闪卡 - 1000字进阶</h1>
            <p class="subtitle">字频1000-2000进阶汉字 · 通过例词高效学习</p>
        </header>
        
        <div class="stats-container">
            <div class="stat-box">
                <div class="stat-value" id="cards-today">0</div>
                <div class="stat-label">今日学习</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="total-cards">0</div>
                <div class="stat-label">已学汉字</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="streak">0</div>
                <div class="stat-label">连续天数</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="mastery">0%</div>
                <div class="stat-label">掌握程度</div>
            </div>
        </div>
        
        <div class="main-content">
            <div class="card-container">
                <div class="navigation">
                    <button class="nav-btn" id="prev-btn">
                        <i class="fas fa-chevron-left"></i>
                    </button>
                    <button class="nav-btn" id="next-btn">
                        <i class="fas fa-chevron-right"></i>
                    </button>
                </div>
                
                <div class="card" id="flashcard">
                    <div class="click-count" id="click-count">0</div>
                    <div class="card-front">
                        <div class="character" id="hanzi">字</div>
                        <div class="pinyin" id="pinyin">zì</div>
                        <div class="meaning" id="meaning">character, letter</div>
                        <div class="hint">点击卡片：1.朗读 2.拼音 3.释义 4.例词</div>
                    </div>
                    <div class="card-back">
                        <div class="example" id="example">汉字</div>
                        <div class="example-pinyin" id="example-pinyin">hàn zì</div>
                        <div class="example-meaning" id="example-meaning">Chinese character</div>
                        <div class="hint">点击卡片返回或继续点击切换汉字</div>
                    </div>
                </div>
            </div>
            
            <div class="controls">
                <button class="btn btn-secondary" id="again-btn">
                    <i class="fas fa-redo"></i> 复习
                </button>
                <button class="btn btn-primary" id="hard-btn">
                    <i class="fas fa-question-circle"></i> 困难
                </button>
                <button class="btn btn-success" id="easy-btn">
                    <i class="fas fa-check-circle"></i> 容易
                </button>
                <button class="btn" id="skip-btn" style="background-color: #9b59b6; color: white;">
                    <i class="fas fa-forward"></i> 跳过
                </button>
            </div>
            
            <div class="progress-container">
                <div class="progress-header">
                    <span>学习进度</span>
                    <span id="progress-text">0/1000</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
            </div>
            
            <div class="settings">
                <h3>学习设置</h3>
                <div class="settings-options">
                    <div class="setting-option">
                        <input type="checkbox" id="auto-speak" checked>
                        <label for="auto-speak">点击自动朗读</label>
                    </div>
                    <div class="setting-option">
                        <input type="checkbox" id="auto-flip">
                        <label for="auto-flip">自动翻面</label>
                    </div>
                    <div class="setting-option">
                        <label for="voice-speed">语速：</label>
                        <select id="voice-speed">
                            <option value="0.7">慢速</option>
                            <option value="1" selected>正常</option>
                            <option value="1.3">快速</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="footer">
            <p>汉字闪卡 App © 2023 | 专注于1000个进阶汉字学习</p>
            <p>设计用于有效记忆和长期保留</p>
        </div>
    </div>

            { hanzi: "椭", pinyin: "tuǒ", meaning: "oval, elliptical", example: "椭圆", examplePinyin: "tuǒ yuán", exampleMeaning: "ellipse, oval" },
            { hanzi: "拓", pinyin: "tuò", meaning: "expand, open up", example: "开拓", examplePinyin: "kāi tuò", exampleMeaning: "open up, develop" },

        ];

        // 应用状态
        const appState = {
            currentIndex: 0,
            totalCards: hanziData.length,
            cardsToday: 0,
            totalLearned: 0,
            streak: 5,
            mastery: 0,
            sessionCards: [],
            clickCount: 0,
            isFullscreen: false,
            autoSpeak: true,
            autoFlip: false,
            voiceSpeed: 1
        };

        // DOM元素
        const flashcard = document.getElementById('flashcard');
        const hanziElement = document.getElementById('hanzi');
        const pinyinElement = document.getElementById('pinyin');
        const meaningElement = document.getElementById('meaning');
        const exampleElement = document.getElementById('example');
        const examplePinyinElement = document.getElementById('example-pinyin');
        const exampleMeaningElement = document.getElementById('example-meaning');
        const clickCountElement = document.getElementById('click-count');
        const cardsTodayElement = document.getElementById('cards-today');
        const totalCardsElement = document.getElementById('total-cards');
        const streakElement = document.getElementById('streak');
        const masteryElement = document.getElementById('mastery');
        const progressTextElement = document.getElementById('progress-text');
        const progressFillElement = document.getElementById('progress-fill');
        const againBtn = document.getElementById('again-btn');
        const hardBtn = document.getElementById('hard-btn');
        const easyBtn = document.getElementById('easy-btn');
        const skipBtn = document.getElementById('skip-btn');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const autoSpeakCheckbox = document.getElementById('auto-speak');
        const autoFlipCheckbox = document.getElementById('auto-flip');
        const voiceSpeedSelect = document.getElementById('voice-speed');

        // 语音合成
        let speech = null;
        if ('speechSynthesis' in window) {
            speech = window.speechSynthesis;
        }

        // 初始化应用
        function initApp() {
            // 从本地存储加载状态
            const savedState = localStorage.getItem('hanziFlashcardsState');
            if (savedState) {
                const parsedState = JSON.parse(savedState);
                Object.assign(appState, parsedState);
            }
            
            // 更新设置控件
            autoSpeakCheckbox.checked = appState.autoSpeak;
            autoFlipCheckbox.checked = appState.autoFlip;
            voiceSpeedSelect.value = appState.voiceSpeed;
            
            // 更新统计显示
            updateStats();
            
            // 显示第一个汉字
            displayCurrentHanzi();
            
            // 设置事件监听器
            setupEventListeners();
        }

        // 设置事件监听器
        function setupEventListeners() {
            // 卡片点击事件
            flashcard.addEventListener('click', handleCardClick);
            
            // 导航按钮
            prevBtn.addEventListener('click', showPrevCard);
            nextBtn.addEventListener('click', showNextCard);
            
            // 控制按钮
            againBtn.addEventListener('click', () => rateCard('again'));
            hardBtn.addEventListener('click', () => rateCard('hard'));
            easyBtn.addEventListener('click', () => rateCard('easy'));
            skipBtn.addEventListener('click', showNextCard);
            
            // 设置变化
            autoSpeakCheckbox.addEventListener('change', toggleAutoSpeak);
            autoFlipCheckbox.addEventListener('change', toggleAutoFlip);
            voiceSpeedSelect.addEventListener('change', updateVoiceSpeed);
            
            // 键盘快捷键
            document.addEventListener('keydown', handleKeydown);
            
            // 全屏变化
            document.addEventListener('fullscreenchange', handleFullscreenChange);
            document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
            document.addEventListener('mozfullscreenchange', handleFullscreenChange);
            document.addEventListener('MSFullscreenChange', handleFullscreenChange);
        }

        // 显示当前汉字
        function displayCurrentHanzi() {
            const currentHanzi = hanziData[appState.currentIndex];
            
            hanziElement.textContent = currentHanzi.hanzi;
            pinyinElement.textContent = currentHanzi.pinyin;
            meaningElement.textContent = currentHanzi.meaning;
            exampleElement.textContent = currentHanzi.example;
            examplePinyinElement.textContent = currentHanzi.examplePinyin;
            exampleMeaningElement.textContent = currentHanzi.exampleMeaning;
            
            // 重置点击状态
            resetClickState();
            
            // 确保卡片显示正面
            flashcard.classList.remove('flipped');
            
            // 更新进度显示
            updateProgress();
            
            // 如果这是新卡片，添加到今日学习计数
            if (!appState.sessionCards.includes(appState.currentIndex)) {
                appState.sessionCards.push(appState.currentIndex);
                appState.cardsToday++;
                updateStats();
            }
            
            // 自动朗读
            if (appState.autoSpeak) {
                setTimeout(() => speakHanzi(currentHanzi.hanzi), 300);
            }
        }

        // 处理卡片点击
        function handleCardClick(e) {
            // 防止导航按钮触发卡片点击
            if (e.target.closest('.nav-btn')) return;
            
            // 增加点击计数
            appState.clickCount++;
            clickCountElement.textContent = appState.clickCount;
            
            // 添加点击动画
            flashcard.classList.add('clicked');
            setTimeout(() => flashcard.classList.remove('clicked'), 300);
            
            // 根据点击次数执行不同操作
            switch(appState.clickCount) {
                case 1:
                    // 第一次点击：朗读汉字
                    speakHanzi(hanziData[appState.currentIndex].hanzi);
                    break;
                case 2:
                    // 第二次点击：显示拼音
                    pinyinElement.classList.add('show');
                    break;
                case 3:
                    // 第三次点击：显示释义
                    meaningElement.classList.add('show');
                    break;
                case 4:
                    // 第四次点击：翻面显示例词
                    flashcard.classList.add('flipped');
                    // 朗读例词
                    if (appState.autoSpeak) {
                        setTimeout(() => speakHanzi(hanziData[appState.currentIndex].example), 300);
                    }
                    break;
                default:
                    // 超过四次：切换到下一个汉字
                    showNextCard();
            }
        }

        // 重置点击状态
        function resetClickState() {
            appState.clickCount = 0;
            clickCountElement.textContent = '0';
            pinyinElement.classList.remove('show');
            meaningElement.classList.remove('show');
        }

        // 朗读文字
        function speakHanzi(text) {
            if (!speech) return;
            
            // 停止当前语音
            speech.cancel();
            
            // 创建新的语音实例
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-CN';
            utterance.rate = appState.voiceSpeed;
            
            // 播放语音
            speech.speak(utterance);
        }

        // 显示上一个汉字
        function showPrevCard() {
            // 确保卡片翻回正面
            flashcard.classList.remove('flipped');
            
            // 移动到上一个汉字
            appState.currentIndex = (appState.currentIndex - 1 + hanziData.length) % hanziData.length;
            
            // 显示新汉字
            displayCurrentHanzi();
        }

        // 显示下一个汉字
        function showNextCard() {
            // 确保卡片翻回正面
            flashcard.classList.remove('flipped');
            
            // 移动到下一个汉字
            appState.currentIndex = (appState.currentIndex + 1) % hanziData.length;
            
            // 显示新汉字
            displayCurrentHanzi();
        }

        // 评价卡片难度
        function rateCard(difficulty) {
            // 在实际应用中，这里会更新间隔重复算法
            // 现在我们只是简单记录并移动到下一个卡片
            
            // 更新掌握程度
            if (difficulty === 'easy') {
                appState.mastery = Math.min(100, appState.mastery + 1);
            } else if (difficulty === 'hard') {
                appState.mastery = Math.max(0, appState.mastery - 0.5);
            }
            
            // 更新总学习汉字数
            if (!appState.sessionCards.includes(appState.currentIndex)) {
                appState.totalLearned++;
            }
            
            // 保存状态
            saveState();
            
            // 显示下一个卡片
            showNextCard();
        }

        // 更新统计显示
        function updateStats() {
            cardsTodayElement.textContent = appState.cardsToday;
            totalCardsElement.textContent = appState.totalLearned;
            streakElement.textContent = appState.streak;
            masteryElement.textContent = `${appState.mastery.toFixed(1)}%`;
        }

        // 更新进度显示
        function updateProgress() {
            const progress = ((appState.currentIndex + 1) / hanziData.length) * 100;
            progressTextElement.textContent = `${appState.currentIndex + 1}/${hanziData.length}`;
            progressFillElement.style.width = `${progress}%`;
        }

        // 切换自动朗读
        function toggleAutoSpeak() {
            appState.autoSpeak = autoSpeakCheckbox.checked;
        }

        // 切换自动翻面
        function toggleAutoFlip() {
            appState.autoFlip = autoFlipCheckbox.checked;
        }

        // 更新语音速度
        function updateVoiceSpeed() {
            appState.voiceSpeed = parseFloat(voiceSpeedSelect.value);
        }

        // 处理键盘快捷键
        function handleKeydown(e) {
            switch(e.key) {
                case 'ArrowLeft':
                    showPrevCard();
                    break;
                case 'ArrowRight':
                case ' ':
                    showNextCard();
                    break;
                case 'ArrowUp':
                    // 切换到上一个汉字
                    showPrevCard();
                    break;
                case 'ArrowDown':
                    // 切换到下一个汉字
                    showNextCard();
                    break;
                case 'Enter':
                    // 翻转卡片
                    flashcard.classList.toggle('flipped');
                    break;
                case 'Escape':
                    // 退出全屏
                    if (appState.isFullscreen) {
                        exitFullscreen();
                    }
                    break;
            }
        }

        // 处理全屏变化
        function handleFullscreenChange() {
            appState.isFullscreen = !!(document.fullscreenElement || 
                                      document.webkitFullscreenElement || 
                                      document.mozFullScreenElement || 
                                      document.msFullscreenElement);
            
            if (appState.isFullscreen) {
                flashcard.classList.add('fullscreen');
            } else {
                flashcard.classList.remove('fullscreen');
            }
        }

        // 进入全屏
        function enterFullscreen() {
            const elem = flashcard;
            
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) {
                elem.webkitRequestFullscreen();
            } else if (elem.mozRequestFullScreen) {
                elem.mozRequestFullScreen();
            } else if (elem.msRequestFullscreen) {
                elem.msRequestFullscreen();
            }
        }

        // 退出全屏
        function exitFullscreen() {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            } else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            } else if (document.mozCancelFullScreen) {
                document.mozCancelFullScreen();
            } else if (document.msExitFullscreen) {
                document.msExitFullscreen();
            }
        }

        // 保存状态到本地存储
        function saveState() {
            localStorage.setItem('hanziFlashcardsState', JSON.stringify(appState));
        }

        // 初始化应用
        window.addEventListener('DOMContentLoaded', initApp);
        
        // 页面关闭前保存状态
        window.addEventListener('beforeunload', saveState);
        
        // 双击卡片进入/退出全屏
        flashcard.addEventListener('dblclick', function() {
            if (!appState.isFullscreen) {
                enterFullscreen();
            } else {
                exitFullscreen();
            }
        });
    </script>
