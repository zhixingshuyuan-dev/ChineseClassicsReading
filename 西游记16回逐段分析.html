<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>西游记第十六回汉字学习系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            gap: 20px;
        }
        
        /* 左侧汉字卡片区域 */
        .characters-section {
            flex: 1;
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-height: 90vh;
            overflow-y: auto;
        }
        
        /* 右侧正文区域 */
        .text-section {
            flex: 1.2;
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-height: 90vh;
            overflow-y: auto;
        }
        
        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 25px;
            font-size: 2.2rem;
            border-bottom: 3px solid #3498db;
            padding-bottom: 15px;
        }
        
        /* 分组控制栏 */
        .group-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
        }
        
        .group-info {
            font-size: 1.1rem;
            color: #34495e;
        }
        
        .group-nav button {
            padding: 8px 20px;
            margin-left: 10px;
            border: none;
            border-radius: 50px;
            background-color: #3498db;
            color: white;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .group-nav button:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
        }
        
        .group-nav button:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }
        
        /* 汉字网格布局 */
        .characters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(85px, 1fr));
            gap: 12px;
            margin-top: 15px;
        }
        
        .character-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #f8f9fa;
            border-radius: 10px;
            padding: 15px 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            border: 2px solid transparent;
            height: 100px;
        }
        
        .character-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            background-color: #e9ecef;
            border-color: #3498db;
        }
        
        .character-card.highlighted {
            background-color: #fff3cd;
            border-color: #ffc107;
        }
        
        .character-card.active {
            background-color: #d4edda;
            border-color: #28a745;
        }
        
        .char {
            font-size: 2.2rem;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        .pinyin {
            font-size: 0.85rem;
            color: #6c757d;
            margin-bottom: 3px;
        }
        
        .meaning {
            font-size: 0.75rem;
            color: #495057;
            text-align: center;
            line-height: 1.2;
            max-height: 2.4em;
            overflow: hidden;
        }
        
        /* 正文样式 */
        .text-content {
            line-height: 1.8;
            font-size: 1.8rem; /* 稍微调小一点，适应更长文本 */
            text-align: justify;
        }
        
        .text-content p {
            margin-bottom: 30px; /* 增加间距适应更大字号 */
            text-indent: 2em;
            position: relative;
            transition: all 0.3s ease;
            padding: 15px 20px; /* 增加内边距 */
            border-radius: 8px;
        }
        
        .text-content p:hover {
            background-color: #f8f9fa;
        }
        
        /* 句子容器 */
        .sentence-container {
            position: relative;
            margin-bottom: 15px;
            padding: 10px 15px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        
        .sentence-container:hover {
            background-color: #f8f9fa;
        }
        
        .sentence-container.active {
            background-color: #e3f2fd;
            border-left: 4px solid #3498db;
            padding-left: 23px;
        }
        
        .sentence-container.reading {
            background-color: #fff3cd;
            border-left: 4px solid #ffc107;
            padding-left: 23px;
        }
        
        /* 正文中的汉字样式 */
        .text-char {
            cursor: pointer;
            padding: 0 2px; /* 增加内边距以适应更大字号 */
            border-radius: 3px;
            transition: all 0.2s ease;
        }
        
        .text-char:hover {
            background-color: #e3f2fd;
            color: #1565c0;
        }
        
        .text-char.highlighted {
            background-color: #fff3cd;
            color: #856404;
            font-weight: bold;
        }
        
        .text-char.active {
            background-color: #d4edda;
            color: #155724;
            font-weight: bold;
        }
        
        /* 句子朗读按钮 */
        .sentence-voice-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px; /* 增大按钮 */
            height: 40px;
            cursor: pointer;
            font-size: 1.2rem; /* 增大图标 */
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.7;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        
        .sentence-voice-btn:hover {
            opacity: 1;
            background-color: #2980b9;
            transform: translateY(-50%) scale(1.1);
        }
        
        /* 句子白话解释按钮 */
        .sentence-explanation-btn {
            position: absolute;
            right: 60px; /* 放在朗读按钮左边 */
            top: 50%;
            transform: translateY(-50%);
            background-color: #2ecc71; /* 绿色表示解释功能 */
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.7;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        
        .sentence-explanation-btn:hover {
            opacity: 1;
            background-color: #27ae60;
            transform: translateY(-50%) scale(1.1);
        }
        
        /* 逐句朗读控制栏 */
        .reading-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
        }
        
        .reading-info {
            font-size: 1.1rem;
            color: #34495e;
        }
        
        .reading-nav button {
            padding: 8px 20px;
            margin-left: 10px;
            border: none;
            border-radius: 50px;
            background-color: #9b59b6;
            color: white;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .reading-nav button:hover {
            background-color: #8e44ad;
            transform: translateY(-2px);
        }
        
        .reading-nav button:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }
        
        .reading-nav button#play-pause {
            background-color: #e74c3c;
        }
        
        .reading-nav button#play-pause:hover {
            background-color: #c0392b;
        }
        
        .reading-nav button#play-pause.playing {
            background-color: #2ecc71;
        }
        
        .reading-nav button#play-pause.playing:hover {
            background-color: #27ae60;
        }
        
        /* 进度指示器 */
        .progress-container {
            width: 100%;
            background-color: #ecf0f1;
            border-radius: 10px;
            margin: 20px 0;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 8px;
            background-color: #3498db;
            width: 0%;
            transition: width 0.5s ease;
        }
        
        /* 统计信息 */
        .stats {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            font-size: 1rem;
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #2c3e50;
        }
        
        .stat-label {
            font-size: 0.9rem;
            color: #7f8c8d;
        }
        
        /* 标题样式 */
        .chapter-title {
            text-align: center;
            font-size: 1.8rem;
            color: #2c3e50;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e9ecef;
        }
        
        /* 卡片窗口样式 - 可移动 */
        .card-modal {
            display: none;
            position: fixed;
            top: 100px;
            left: 100px;
            z-index: 1000;
            background: white;
            border-radius: 15px;
            padding: 30px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
            animation: cardAppear 0.3s ease-out;
            cursor: move;
            user-select: none;
        }
        
        .card-modal.active {
            display: block;
        }
        
        .card-modal.dragging {
            opacity: 0.9;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
        }
        
        .card-header {
            padding: 10px 15px;
            background: #3498db;
            color: white;
            border-radius: 10px 10px 0 0;
            cursor: move;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
        }
        
        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(-20px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        
        .close-card {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #7f8c8d;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.3s ease;
            z-index: 1001;
        }
        
        .close-card:hover {
            background-color: #f8f9fa;
            color: #495057;
        }
        
        .card-char {
            font-size: 4rem;
            margin: 20px 0;
            font-weight: bold;
            color: #2c3e50;
        }
        
        .card-pinyin {
            font-size: 1.5rem;
            color: #e74c3c;
            margin-bottom: 10px;
            font-weight: 500;
        }
        
        .card-meaning {
            font-size: 1.2rem;
            color: #34495e;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        
        .card-footer {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }
        
        .voice-btn {
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .voice-btn:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
        }
        
        .learned-btn {
            padding: 10px 20px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        .learned-btn:hover {
            background-color: #218838;
            transform: translateY(-2px);
        }
        
        .learned-btn.active {
            background-color: #6c757d;
        }
        
        /* 语音控制按钮 */
        .voice-control {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 100;
        }
        
        .voice-toggle {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: #3498db;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .voice-toggle:hover {
            background-color: #2980b9;
            transform: scale(1.1);
        }
        
        .voice-toggle.muted {
            background-color: #e74c3c;
        }
        
        /* 响应式设计 */
        @media (max-width: 1100px) {
            .container {
                flex-direction: column;
            }
            
            .characters-section, .text-section {
                max-height: 70vh;
            }
        }
        
        @media (max-width: 768px) {
            .characters-grid {
                grid-template-columns: repeat(auto-fill, minmax(75px, 1fr));
            }
            
            .char {
                font-size: 1.8rem;
            }
            
            h1 {
                font-size: 1.8rem;
            }
            
            .text-content {
                font-size: 1.6rem; /* 响应式调整 */
            }
            
            .card-modal {
                padding: 20px;
                left: 5%;
                top: 50px;
            }
            
            .card-char {
                font-size: 3rem;
            }
            
            .sentence-voice-btn, .sentence-explanation-btn {
                width: 35px;
                height: 35px;
                font-size: 1rem;
            }
            
            .sentence-explanation-btn {
                right: 50px;
            }
            
            .reading-nav button {
                padding: 6px 15px;
                font-size: 0.85rem;
                margin-left: 5px;
            }
        }
        
        @media (max-width: 480px) {
            .characters-grid {
                grid-template-columns: repeat(auto-fill, minmax(65px, 1fr));
            }
            
            .char {
                font-size: 1.6rem;
            }
            
            .character-card {
                height: 90px;
                padding: 10px 3px;
            }
            
            .card-footer {
                flex-direction: column;
                gap: 10px;
            }
            
            .text-content {
                font-size: 1.4rem; /* 响应式调整 */
            }
            
            .sentence-voice-btn, .sentence-explanation-btn {
                width: 30px;
                height: 30px;
                font-size: 0.9rem;
            }
            
            .sentence-explanation-btn {
                right: 45px;
            }
            
            .reading-nav button {
                padding: 5px 10px;
                font-size: 0.75rem;
                margin-left: 3px;
            }
            
            .reading-info {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <!-- 可移动的卡片窗口 -->
    <div class="card-modal" id="card-modal">
        <div class="card-header" id="card-header">汉字卡片 (拖拽此处移动)</div>
        <button class="close-card" id="close-card">×</button>
        <div class="card-char" id="card-char">道</div>
        <div class="card-pinyin" id="card-pinyin">dào</div>
        <div class="card-meaning" id="card-meaning">way, path, say</div>
        <div class="card-footer">
            <button class="voice-btn" id="card-voice-btn">
                <span>🔊 朗读</span>
            </button>
            <button class="learned-btn" id="mark-learned-btn">标记为已学习</button>
        </div>
    </div>
    
    <!-- 语音控制 -->
    <div class="voice-control">
        <button class="voice-toggle" id="voice-toggle" title="切换语音开关">
            🔊
        </button>
    </div>
    
    <div class="container">
        <!-- 左侧：汉字卡片区域 -->
        <div class="characters-section">
            <h1>西游记第十六回汉字学习</h1>
            
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-value" id="total-chars">0</div>
                    <div class="stat-label">总汉字数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="learned-chars">0</div>
                    <div class="stat-label">已学习</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="current-group-display">1</div>
                    <div class="stat-label">当前组</div>
                </div>
            </div>
            
            <div class="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            
            <div class="group-controls">
                <div class="group-info">
                    第 <span id="current-group">1</span> 组 / 共 25 组
                </div>
                <div class="group-nav">
                    <button id="prev-group">上一组</button>
                    <button id="next-group">下一组</button>
                </div>
            </div>
            
            <div id="characters-container">
                <!-- 汉字卡片将通过JavaScript动态生成 -->
            </div>
        </div>
        
        <!-- 右侧：正文区域 -->
        <div class="text-section">
            <div class="chapter-title">
                第十六回 观音院僧谋宝贝 黑风山怪窃袈裟
            </div>
            
            <!-- 逐句朗读控制栏 -->
            <div class="reading-controls">
                <div class="reading-info">
                    第 <span id="current-sentence">1</span> 句 / 共 <span id="total-sentences">0</span> 句
                </div>
                <div class="reading-nav">
                    <button id="prev-sentence">上一句</button>
                    <button id="play-pause">播放</button>
                    <button id="next-sentence">下一句</button>
                </div>
            </div>
            
            <div class="text-content" id="text-content">
                <!-- 正文内容将通过JavaScript动态生成 -->
            </div>
        </div>
    </div>

    <script>
        // 第十六回汉字数据（25组）

                {char: '何', pinyin: 'hé', meaning: 'what, how'},
                {char: '说', pinyin: 'shuō', meaning: 'to speak'}
            ],
            2: [
                {char: '禅', pinyin: 'chán', meaning: 'zen, meditation'},
                {char: '着', pinyin: 'zhe', meaning: 'aspect particle'},

            "众僧道：“师祖来了。”唐僧躬身施礼道：“老院主，弟子拜揖。”老僧还了礼，各自坐下。老僧道：“刚才小的们说，东土唐朝来的老爷，我才出来相见。”唐僧道：“冒昧来到宝山，不知好歹，请恕罪！”老僧道：“不敢！不敢！”于是问：“老爷，从东土到这里，有多少路程？”唐僧道：“出长安边界，有五千多里；过两界山，收了一群小徒，一路走来，经过西番哈咇国，用了两个月，又有五六千里，才到了贵处。”老僧道：“也有万里之遥了。我弟子虚度一生，山门也没出去过，真是‘坐井观天’，朽木之辈。”唐僧又问：“老院主高寿多少？”老僧道：“虚长二百七十岁了。”孙悟空听见道：“这还是我万代孙儿呢！”唐僧瞪了他一眼道：“小心说话！不要不识高低，冲撞人。”那和尚就问：“老爷，你有多少年纪了？”孙悟空道：“不敢说。”那老僧也只当是一句疯话，就不介意，也不再问，只叫献茶。有一个小幸童，拿出一个羊脂玉的盘儿，有三个法蓝镶金的茶钟；又一个童子，提一把白铜壶儿，斟了三杯香茶。真是颜色胜过石榴花蕊，味道胜过桂花香。唐僧见了，夸赞不已道：“好物件！好物件！真是美食美器！”那老僧道：“污了您的眼！老爷来自天朝上国，看过无数奇珍异宝，这样的器具，哪里值得夸奖？老爷从上邦来，可有什么宝贝，借给弟子看看？”唐僧道：“可怜！我那东土，没什么宝贝；就算有，路程遥远，也不能带来。”",
            "",
            "孙悟空在旁边道：“师父，我前天在包袱里，看见那件袈裟，不是件宝贝吗？拿给他看看如何？”众僧听说袈裟，一个个冷笑。孙悟空道：“你们笑什么？”院主道：“老爷刚才说袈裟是件宝贝，实在可笑。要说袈裟，像我们这样的，不止二三十件；要说我师祖，在这里做了二百五六十年和尚，足足有七八百件！”叫道：“拿出来看看。”那老和尚，也是他一时卖弄，就叫道人打开库房，头陀抬柜子，就抬出十二个柜子，放在天井中，开了锁，两边设下衣架，四周牵了绳子，将袈裟一件件抖开挂起，请唐僧观看。果然是满堂锦绣，四壁绫罗！",
            "",
            "孙悟空一一观看，都是些穿花纳锦，刺绣销金的东西。笑道：“好，好，好！收起！收起！把我们的也取出来看看。”唐僧拉住孙悟空，悄悄地道：“徒弟，不要与人斗富。你我单身在外，只怕有错。”孙悟空道：“看看袈裟，有什么差错？”唐僧道：“你不懂。古人有话说：‘珍奇玩好之物，不能给贪婪奸诈的人看。’如果一旦看到，必定动心；动了心，必定生出计谋。你是个怕事的，他要你就给他，也就罢了；不然，就会丧命，都从这里开始，事情不小啊。”孙悟空道：“放心！放心！都在老孙身上！”你看他不容分说，急急地走过去，把包袱解开，早有霞光迸发；还有两层油纸包裹，去掉纸，取出袈裟，抖开时，红光满室，彩气满堂。众僧见了，没有一个不心欢口赞。真是好袈裟！上面有：",
            "",
            "千般巧妙明珠坠，万样稀奇佛宝镶。上下龙须铺彩绮，四面锦缎镶边。穿上它能驱除魍魉，披上它能降服妖魔。这是天仙亲手制作，不是真僧不敢穿。",
            "",
            "那老和尚见了这般宝贝，果然动了奸心，走上前，对唐僧跪下，眼中流泪道：“我弟子真是没缘！”唐僧扶起他道：“老院师有什么话说？”他道：“老爷这件宝贝，刚才展开，天色晚了，奈何眼睛昏花，不能看仔细，岂不是没缘！”唐僧道：“掌灯来，让你再看。”那老僧道：“爷爷的宝贝，已经够光亮；再点了灯，更加晃眼，更看不清了。”孙悟空道：“你要怎样看才好？”老僧道：“老爷如果宽恩放心，让弟子拿到后房，细细地看一夜，明早送还老爷西去，不知尊意如何？”唐僧听了，吃了一惊，埋怨孙悟空道：“都是你！都是你！”孙悟空笑道：“怕他什么？等我包起来，让他拿去看。如有差错，全由老孙负责。”唐僧阻挡不住，他把袈裟递给老僧道：“随你看去；只是明早照旧还我，不能损坏一点。”老僧欢欢喜喜，叫幸童把袈裟拿进去，却吩咐众僧，把前面禅堂打扫干净，取两张藤床，铺好被褥，请二位老爷安歇；一面又教安排明早斋饭送行，于是各自散去。师徒们关了禅堂，睡下不提。",
            "",
            "却说那和尚把袈裟骗到手，拿到后房灯下，对着袈裟号啕大哭，慌得本寺僧人都不敢先睡。小幸童也不知为什么，就去报告众僧道：“公公哭到二更时候，还不歇声。”有两个徒孙，是他心爱之人，上前问道：“师公，你哭什么？”老僧道：“我哭没缘，看不到唐僧的宝贝！”小和尚道：“公公年纪大了，糊涂了。他的袈裟，放在你面前，你只要解开看就是了，何必痛哭？”老僧道：“看不长久。我今年二百七十岁，白白积攒了几百件袈裟。怎么能有他这一件？怎么能做个唐僧？”小和尚道：“师公差了。唐僧是个离乡背井的行脚僧。你这样年高，享受也够了，倒要像他做行脚僧，为什么？”老僧道：“我虽然是坐家自在，晚年安乐，却得不到他这件袈裟穿穿。如果能让我穿一天，死了也闭眼，也算我来阳世间做一场和尚！”",
            "",
            "众僧道：“好没正经！你要穿他的，有什么难处？我们明天留他住一天，你就穿他一天；留他住十天，你就穿他十天，就是了。何必这样痛哭？”老僧道：“就算留他住了半年，也只穿得半年，到底也不能长久。他要去时，只能让他去，怎么留得长远？”",
            "",
            "正说话时，有一个小和尚，名叫广智，站出来道：“公公，要得长久，也容易。”老僧听了，就欢喜起来道：“我儿，你有什么高见？”广智道：“那唐僧两个是走路的人，非常辛苦，现在已经睡着了。我们找几个有力气的，拿了枪刀，打开禅堂，把他杀了，把尸首埋在后园，只有我们一家知道，然后谋取他的白马、行李，把那袈裟留下，作为传家之宝，岂不是子孙长久之计？”老和尚听了，满心欢喜，才擦干眼泪道：“好！好！好！此计绝妙！”立即收拾枪刀。",
            "",
            "里面又有一个小和尚，名叫广谋，就是广智的师弟，上前来道：“此计不妙。如果要杀他，须要看看动静。那个白脸的容易对付，那个毛脸的难对付；万一杀不了他，岂不是反招祸患？我有一个不动刀枪的办法，不知您意下如何？”老僧道：“我儿，你有什么办法？”广谋道：“依小孙的意见，现在召集东山大小房头，每人要一捆干柴，舍了那三间禅堂，放起火来，教他们想逃无门，连马一起烧死。就是山前山后人家看见，只说是他们自己不小心，失火了，把我禅堂都烧了。那两个和尚，不都烧死了吗？又好掩人耳目。袈裟岂不是我们传家之宝？”那些和尚听了，无不欢喜。都道：“强！强！强！此计更妙！更妙！”于是教各房头搬柴来。唉！这一计，正是弄得高寿老僧丧了命，观音禅院化成灰！原来他那寺里，有七八十个房头，大小有二百多人。当夜一起搬柴，把禅堂前前后后，四面围得不通，安排放火不提。",
            "",
            "却说唐僧师徒，安歇已定。孙悟空是个灵猴，虽然睡下，只是存神炼气，朦胧着醒眼。忽然听到外面不住地有人走，柴响风生。他心里疑惑道：“此时夜深人静，怎么有人脚步声？莫非是贼盗，谋害我们的？……”他就一骨碌跳起。想要开门出去看，又怕惊醒师父。你看他弄个神通，摇身一变，变做一个蜜蜂儿。真是：",
            "",
            "口甜尾毒，腰细身轻。穿花过柳飞如箭，粘絮寻香似流星。小小身躯能负重，薄薄翅膀会乘风。从屋檐下钻出，看个分明。",
            "",
            "只见那些僧人们，搬柴运草，已经围住禅堂放火。孙悟空暗笑道：“果然像我师父说的！他要害我们性命，谋我的袈裟，所以起了这等毒心。我要是拿棍打他们啊，可怜又不禁打，一顿棍都打死了，师父又怪我行凶。罢，罢，罢！给他个‘顺手牵羊，将计就计’，教他住不成吧！”",
            "",
            "好孙悟空，一个筋斗跳上南天门里，吓得庞、刘、苟、毕躬身，马、赵、温、关控背，都说：“不好了！不好了！那闹天宫的主子又来了！”孙悟空摇手道：“各位免礼，别惊。我来找广目天王的。”话未说完，却遇天王早到，迎着孙悟空道：“久别，久别。前些天听说观音菩萨来见玉帝，借了四值功曹、六丁六甲并揭谛等，保护唐僧往西天取经去，说你给他做了徒弟，今天怎么得闲到这里？”孙悟空道：“先别叙旧。唐僧路上遇到坏人，放火烧他，事情万分紧急，特来找你借‘辟火罩儿’，救他一救。快些拿来用用，马上回去。”天王道：“你错了；既然是坏人放火，只该借水救他，怎么要辟火罩？”孙悟空道：“你不懂内情。借水救火，就烧不起来，倒合了他的意；只是借这个罩子，护住唐僧不受伤害，其余管他，随他烧去。快些！快些！现在恐怕来不及了。别误了我的事！”那天王笑道：“这猴子还是这样起不善之心，只顾了自己，就不管别人。”孙悟空道：“快着！快着！别耍嘴，误了大事！”那天王不敢不借，就把罩儿递给孙悟空。",
            "",
            "孙悟空拿了，驾着云头，径直来到禅堂房脊上，罩住了唐僧与白马、行李。他却去后面老和尚住的方丈房上头坐着，特意保护那袈裟。看那些人放起火来，他转捻诀念咒，向东南方吸一口气吹去，一阵风起，把那火刮得烘烘乱烧。好火！好火！只见：",
            "",
            "黑烟漠漠，红焰腾腾。黑烟漠漠，长空看不见一颗星星；红焰腾腾，大地有光千里通红。起初时，像金蛇狂舞；后来，像血马奔腾。南方火神逞英雄，火神施展法力。干柴烧起烈火，说什么燧人钻木取火；熟油门前飘彩焰，赛过老祖开炉。正是那无情火发，怎禁这有意行凶；不去灭火，反而助火。风随火势，火焰飞有千丈高；火趁风威，灰烬迸上九霄云外。乒乒乓乓，好像残年爆竹；泼泼喇喇，就像军中炮响。烧得那当场佛像无处逃，东院伽蓝无处躲。胜过赤壁夜鏖兵，赛过阿房宫内火！",
            "",
            "这正是星星之火，能烧万顷之田。一会儿，风狂火盛，把一座观音院，处处烧得通红。你看那些和尚，搬箱抬笼，抢桌端锅，满院里叫苦连天。孙悟空护住了后面方丈，辟火罩罩住了前面禅堂，其余前后火光冲天，真是照天红焰辉煌，透壁金光照耀！",
            "",
            "不料火起之时，惊动了一山兽怪。这观音院正南二十里远近，有座黑风山，山中有一个黑风洞，洞中有一个妖精，正在睡醒翻身。只见窗门透亮，只以为是天亮了。起来看时，却是正北下的火光晃亮，妖精大惊道：“呀！这一定是观音院里失火了！这些和尚好不小心！我去看看，救一救他们。”好妖精，纵起云头，即刻来到烟火之下，果然是冲天大火，前面殿宇都空了，两廊烟火正旺。他大步走进去，正呼唤叫取水来，只见后房无火，房脊上有一人放风。他情知有异，急忙进去看时，见方丈中间有些霞光彩气，台案上有一个青毡包袱。他解开一看，见是一件锦襕袈裟，是佛门异宝。正是财宝动人心，他也不救火，他也不叫水，拿着那袈裟，趁乱打劫，驾云回步，径直转回东山黑风洞去了。",
            "",
            "那场火一直烧到五更天明，才熄灭。你看那些僧人们，赤身裸体，啼啼哭哭，都到灰堆里找铜铁，拨腐炭，捡金银。有的在墙筐里，搭窝棚；有的在墙根下，支锅做饭；叫冤叫屈，乱嚷乱闹不提。",
            "",
            "却说孙悟空取了辟火罩，一个筋斗送上南天门，交给广目天王道：“谢借！谢借！”天王收了道：“大圣诚信。我正愁你不还我的宝贝，无处寻找，幸好就送来了。”孙悟空道：“老孙难道是当面骗物的人？这叫做‘好借好还，再借不难。’”天王道：“许久不见，请到宫里坐一会儿，如何？”孙悟空道：“老孙和以前不同了，‘烂板凳，高谈阔论’不行了；如今保唐僧，不得空闲。改天再叙！”急忙辞别坠下云头，又回到太阳星上。径直来到禅堂前，摇身一变，变做个蜜蜂儿，飞进去，现了本像看时，那师父还在沉睡。",
            "",
            "孙悟空叫道：“师父，天亮了，起来吧。”唐僧才醒觉，翻身道：“正是。”穿了衣服，开门出来，忽然抬头，只见倒壁红墙，不见了楼台殿宇。大惊道：“呀！怎么这殿宇都没有了？都是红墙，怎么回事？”孙悟空道：“你还做梦呢！昨夜失火了。”唐僧道：“我怎么不知道？”孙悟空道：“是老孙护了禅堂，见师父睡得很熟，没有惊动。”唐僧道：“你有本事护了禅堂，怎么就不救别房的火？”孙悟空笑道：“好让师父知道。果然像你昨天说的，他爱上了我们的袈裟，算计要烧死我们。要不是老孙察觉，到现在都成灰骨了！”唐僧听了，害怕道：“是他们放的火吗？”孙悟空道：“不是他们是谁？”唐僧道：“莫非是怠慢了你，你干的这个勾当？”孙悟空道：“老孙是这样惫懒的人，干这种不良之事？确实是他家放的。老孙见他心毒，果然没有给他救火，只是给他稍微助了些风。”唐僧道：“天哪！天哪！火起时，只该助水，怎么反而助风？”孙悟空道：“你可知古人有话说：‘人没伤虎心，虎没伤人意。’你不弄火，我怎肯弄风？”唐僧道：“袈裟在哪里？莫非是烧坏了？”孙悟空道：“没事！没事！烧不坏！那放袈裟的方丈没火。”唐僧恨道：“我不管！只要有一点伤损，我就把那咒语念动念动，你就是死了！”孙悟空慌了道：“师父，莫念！莫念！一定还你袈裟就是了。等我去拿来走路。”唐僧就牵着马，孙悟空挑了担，出了禅堂，径往后边方丈去。",

        // 应用状态
        let currentGroup = 1;

        // 语音合成函数
        function speakText(text, lang = 'zh-CN') {
            if (!speechEnabled) return;
            
            // 停止当前语音
            window.speechSynthesis.cancel();
            
            // 创建语音实例
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang;
            utterance.rate = 0.8; // 稍微慢一点，便于学习
            
            // 开始朗读
            window.speechSynthesis.speak(utterance);
        }
        
        // 卡片拖拽功能
        function initCardDragging() {
            cardHeader.addEventListener('mousedown', startDrag);
            document.addEventListener('mousemove', handleDrag);
            document.addEventListener('mouseup', stopDrag);
            
            // 触摸设备支持
            cardHeader.addEventListener('touchstart', startDragTouch);
            document.addEventListener('touchmove', handleDragTouch);
            document.addEventListener('touchend', stopDrag);
        }
        
        function startDrag(e) {
            isDragging = true;
            cardModal.classList.add('dragging');
            
            const rect = cardModal.getBoundingClientRect();
            dragOffsetX = e.clientX - rect.left;
            dragOffsetY = e.clientY - rect.top;
            
            e.preventDefault();
        }
        
        function startDragTouch(e) {
            if (e.touches.length === 1) {
                isDragging = true;
                cardModal.classList.add('dragging');
                
                const rect = cardModal.getBoundingClientRect();
                dragOffsetX = e.touches[0].clientX - rect.left;
                dragOffsetY = e.touches[0].clientY - rect.top;
                
                e.preventDefault();
            }
        }
        
        function handleDrag(e) {
            if (!isDragging) return;
            
            let x = e.clientX - dragOffsetX;
            let y = e.clientY - dragOffsetY;
            
            // 限制在窗口内
            const maxX = window.innerWidth - cardModal.offsetWidth;
            const maxY = window.innerHeight - cardModal.offsetHeight;
            
            x = Math.max(0, Math.min(x, maxX));
            y = Math.max(0, Math.min(y, maxY));
            
            cardModal.style.left = x + 'px';
            cardModal.style.top = y + 'px';
        }
        
        function handleDragTouch(e) {
            if (!isDragging || e.touches.length !== 1) return;
            
            let x = e.touches[0].clientX - dragOffsetX;
            let y = e.touches[0].clientY - dragOffsetY;
            
            // 限制在窗口内
            const maxX = window.innerWidth - cardModal.offsetWidth;
            const maxY = window.innerHeight - cardModal.offsetHeight;
            
            x = Math.max(0, Math.min(x, maxX));
            y = Math.max(0, Math.min(y, maxY));
            
            cardModal.style.left = x + 'px';
            cardModal.style.top = y + 'px';
            
            e.preventDefault();
        }
        
        function stopDrag() {
            isDragging = false;
            cardModal.classList.remove('dragging');
        }
        
        // 显示卡片窗口
        function showCard(char) {
            currentCardChar = char;
            
            // 查找汉字数据
            let charData = null;
            for (let group in characterData) {
                const found = characterData[group].find(item => item.char === char);
                if (found) {
                    charData = found;
                    break;
                }
            }
            
            if (charData) {
                cardCharElement.textContent = charData.char;
                cardPinyinElement.textContent = charData.pinyin;
                cardMeaningElement.textContent = charData.meaning;
                
                // 更新标记按钮状态
                if (learnedChars.has(char)) {
                    markLearnedButton.textContent = '已学习 ✓';
                    markLearnedButton.classList.add('active');
                } else {
                    markLearnedButton.textContent = '标记为已学习';
                    markLearnedButton.classList.remove('active');
                }
                
                // 显示卡片
                cardModal.classList.add('active');
                
                // 朗读汉字
                speakText(char);
            }
        }
        
        // 关闭卡片窗口
        function closeCard() {
            cardModal.classList.remove('active');
            currentCardChar = null;
        }
        
        // 计算总汉字数
        function calculateTotalChars() {
            let total = 0;
            for (let group in characterData) {
                total += characterData[group].length;
            }
            return total;
        }
        
        // 更新统计信息
        function updateStats() {
            const totalChars = calculateTotalChars();
            totalCharsElement.textContent = totalChars;
            learnedCharsElement.textContent = learnedChars.size;
            
            // 更新进度条
            const progress = (learnedChars.size / totalChars) * 100;
            progressBar.style.width = `${progress}%`;
        }
        
        // 渲染汉字卡片
        function renderCharacterCards() {
            charactersContainer.innerHTML = '';
            currentGroupElement.textContent = currentGroup;
            currentGroupDisplayElement.textContent = currentGroup;
            
            const groupData = characterData[currentGroup] || [];
            
            // 创建网格容器
            const grid = document.createElement('div');
            grid.className = 'characters-grid';
            
            groupData.forEach(charData => {
                const card = document.createElement('div');
                card.className = 'character-card';
                if (learnedChars.has(charData.char)) {
                    card.classList.add('active');
                }
                if (activeChar === charData.char) {
                    card.classList.add('highlighted');
                }
                
                card.dataset.char = charData.char;
                
                // 只显示汉字，不显示拼音和释义
                card.innerHTML = `
                    <div class="char">${charData.char}</div>
                `;
                
                // 点击卡片事件
                card.addEventListener('click', () => {
                    handleCharacterClick(charData.char);
                });
                
                grid.appendChild(card);
            });
            
            charactersContainer.appendChild(grid);
            
            // 更新按钮状态
            prevGroupButton.disabled = currentGroup <= 1;
            nextGroupButton.disabled = currentGroup >= Object.keys(characterData).length;
            
            updateStats();
        }
        
        // 处理汉字卡片点击
        function handleCharacterClick(char) {
            activeChar = char;
            renderCharacterCards();
            highlightTextChars(char);
            showCard(char);
            
            // 滚动到正文中该汉字的第一个位置
            if (charPositions[char] && charPositions[char].length > 0) {
                const firstPosition = charPositions[char][0];
                const textCharElement = document.querySelector(`[data-char-index="${firstPosition}"]`);
                if (textCharElement) {
                    textCharElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }

        // 渲染正文内容
        function renderTextContent() {
            textContentElement.innerHTML = '';
            charPositions = {};
            
            // 更新总句子数
            totalSentencesElement.textContent = textSentences.length;
            
            // 按句子渲染
            textSentences.forEach((sentence, sentenceIndex) => {
                const sentenceContainer = document.createElement('div');
                sentenceContainer.className = 'sentence-container';
                if (sentenceIndex === currentSentenceIndex) {
                    sentenceContainer.classList.add('reading');
                }
                sentenceContainer.dataset.sentenceIndex = sentenceIndex;
                
                // 处理句子中的每个字符
                for (let i = 0; i < sentence.length; i++) {
                    const char = sentence[i];
                    const span = document.createElement('span');
                    span.className = 'text-char';
                    span.textContent = char;
                    span.dataset.char = char;
                    span.dataset.charIndex = `${sentenceIndex}-${i}`;
                    
                    // 存储汉字位置
                    if (!charPositions[char]) {
                        charPositions[char] = [];
                    }
                    charPositions[char].push(`${sentenceIndex}-${i}`);
                    
                    // 点击正文汉字事件
                    span.addEventListener('click', () => {
                        handleTextCharClick(char);

                    sentenceContainer.appendChild(span);

                voiceButton.addEventListener('click', (e) => {
                    e.stopPropagation(); // 防止触发容器点击事件
                    handleSentenceVoiceClick(sentenceIndex);
                });
                
                // 添加白话解释按钮

                sentenceContainer.appendChild(explanationButton);

                // 点击句子容器高亮

                renderCharacterCards();
                // 移除正文高亮
                const allTextChars = document.querySelectorAll('.text-char');
                allTextChars.forEach(el => {
                    el.classList.remove('highlighted', 'active');
                });
                // 移除句子高亮
                const allSentences = document.querySelectorAll('.sentence-container');
                allSentences.forEach(s => s.classList.remove('active'));
            }
        }
        
        // 标记汉字为已学习
        function markCharAsLearned() {
            if (currentCardChar) {
                if (learnedChars.has(currentCardChar)) {
                    learnedChars.delete(currentCardChar);
                    markLearnedButton.textContent = '标记为已学习';
                    markLearnedButton.classList.remove('active');
                } else {
                    learnedChars.add(currentCardChar);
                    markLearnedButton.textContent = '已学习 ✓';
                    markLearnedButton.classList.add('active');
                }
                updateStats();
                renderCharacterCards();
            }
        }
        
        // 切换语音开关
        function toggleVoice() {
            speechEnabled = !speechEnabled;
            if (speechEnabled) {
                voiceToggle.classList.remove('muted');
                voiceToggle.textContent = '🔊';
                voiceToggle.title = '关闭语音';
            } else {
                voiceToggle.classList.add('muted');
                voiceToggle.textContent = '🔇';
                voiceToggle.title = '开启语音';
                // 停止当前语音
                window.speechSynthesis.cancel();
                // 停止自动朗读
                stopAutoReading();
            }
        }
        
        // 逐句朗读功能
        
        // 朗读当前句子
        function readCurrentSentence() {
            if (currentSentenceIndex < textSentences.length) {
                const sentence = textSentences[currentSentenceIndex];
                if (sentence.trim() !== '') {
                    speakText(sentence);
                }
            }
        }
        
        // 朗读白话文解释
        function readVernacularExplanation(sentenceIndex) {
            if (sentenceIndex < vernacularExplanations.length) {
                const explanation = vernacularExplanations[sentenceIndex];
                if (explanation && explanation.trim() !== '') {
                    speakText(explanation);
                }
            }
        }
        
        // 切换到上一句
        function goToPrevSentence() {
            if (currentSentenceIndex > 0) {
                currentSentenceIndex--;
                updateCurrentSentenceDisplay();
                readCurrentSentence();
            }
        }
        
        // 切换到下一句
        function goToNextSentence() {
            if (currentSentenceIndex < textSentences.length - 1) {
                currentSentenceIndex++;
                updateCurrentSentenceDisplay();
                readCurrentSentence();
            } else {
                // 如果是最后一句，停止自动朗读
                stopAutoReading();
            }
        }
        
        // 自动朗读函数（逐句朗读原文+白话解释）
        function autoReadNext() {
            if (!isAutoReading || !speechEnabled) return;
            
            // 朗读原文
            const originalSentence = textSentences[currentSentenceIndex];
            if (originalSentence.trim() !== '') {
                speakText(originalSentence);
                
                // 等待朗读完成后再朗读白话解释
                setTimeout(() => {
                    // 朗读白话解释
                    const explanation = vernacularExplanations[currentSentenceIndex];
                    if (explanation && explanation.trim() !== '') {
                        speakText(explanation);
                    }
                    
                    // 移动到下一句
                    setTimeout(() => {
                        if (currentSentenceIndex < textSentences.length - 1) {
                            currentSentenceIndex++;
                            updateCurrentSentenceDisplay();
                            autoReadNext(); // 继续下一句
                        } else {
                            // 如果是最后一句，停止自动朗读
                            stopAutoReading();
                        }
                    }, 1000); // 解释后等待1秒再继续
                    
                }, 2000); // 原文后等待2秒再朗读解释
            } else {
                // 如果是空行，直接跳到下一句
                setTimeout(() => {
                    if (currentSentenceIndex < textSentences.length - 1) {
                        currentSentenceIndex++;
                        updateCurrentSentenceDisplay();
                        autoReadNext(); // 继续下一句
                    } else {
                        stopAutoReading();
                    }
                }, 1000);
            }
        }
        
        // 开始自动朗读
        function startAutoReading() {
            if (isAutoReading) return;
            
            isAutoReading = true;
            playPauseButton.textContent = '暂停';
            playPauseButton.classList.add('playing');
            
            // 开始自动朗读
            autoReadNext();
        }
        
        // 停止自动朗读
        function stopAutoReading() {
            isAutoReading = false;
            playPauseButton.textContent = '播放';
            playPauseButton.classList.remove('playing');
            
            // 停止语音
            window.speechSynthesis.cancel();
        }
        
        // 切换播放/暂停
        function togglePlayPause() {
            if (isAutoReading) {
                stopAutoReading();
            } else {
                startAutoReading();
            }
        }
        
        // 初始化事件监听器
        function initEventListeners() {
            prevGroupButton.addEventListener('click', goToPrevGroup);
            nextGroupButton.addEventListener('click', goToNextGroup);
            closeCardButton.addEventListener('click', closeCard);
            cardVoiceButton.addEventListener('click', () => {
                if (currentCardChar) {
                    speakText(currentCardChar);
                }
            });
            markLearnedButton.addEventListener('click', markCharAsLearned);
            voiceToggle.addEventListener('click', toggleVoice);
            
            // 逐句朗读控制
            prevSentenceButton.addEventListener('click', goToPrevSentence);
            nextSentenceButton.addEventListener('click', goToNextSentence);
            playPauseButton.addEventListener('click', togglePlayPause);
            
            // 点击卡片外部关闭卡片
            cardModal.addEventListener('click', (e) => {
                if (e.target === cardModal) {
                    closeCard();
                }
            });
            
            // 键盘导航
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeCard();
                } else if (e.key === 'ArrowLeft') {
                    if (e.ctrlKey) {
                        goToPrevGroup();
                    } else {
                        goToPrevSentence();
                    }
                } else if (e.key === 'ArrowRight') {
                    if (e.ctrlKey) {
                        goToNextGroup();
                    } else {
                        goToNextSentence();
                    }
                } else if (e.key === ' ') {
                    e.preventDefault();
                    togglePlayPause();
                }
            });
        }
        
        // 初始化应用
        function init() {
            updateStats();
            renderCharacterCards();
            renderTextContent();
            initEventListeners();
            initCardDragging();
            
            // 检查浏览器是否支持语音合成
            if (!('speechSynthesis' in window)) {
                alert('您的浏览器不支持语音合成功能，部分功能可能无法正常使用。');
                voiceToggle.style.display = 'none';
                speechEnabled = false;
            }
        }
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
