<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <title>射雕英雄传第二回 - 辅助阅读</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", "SimSun", serif;
        }
        body {
            background-color: #f5f2e9;
            color: #333;
            line-height: 1.6;
            font-size: 3em;
            padding: 20px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" opacity="0.05"><rect fill="%23333" width="100" height="100"/></svg>');
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            border: 1px solid #d9d2c2;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #c8b090;
        }
        h1 {
            color: #8c2e0b;
            font-size: 1.5em;
            margin-bottom: 10px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }
        h2 {
            color: #5e3a1e;
            font-size: 1.0em;
            margin: 25px 0 15px;
            padding-left: 10px;
            border-left: 4px solid #c8b090;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px;
            background-color: #f9f5ed;
            border-radius: 6px;
            border: 1px solid #e0d6c2;
        }
        .settings {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        select, button {
            padding: 8px 15px;
            border: 1px solid #c8b090;
            border-radius: 4px;
            background-color: #fff;
            font-size: 14px;
            cursor: pointer;
        }
        button {
            background-color: #8c2e0b;
            color: white;
            border: none;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #6d2409;
        }
        .content {
            font-size: 40px;
            line-height: 1.8;
            text-align: justify;
        }
        .sentence {
            margin-bottom: 15px;
            padding: 8px;
            border-radius: 4px;
            transition: background-color 0.2s;
        }
        .sentence:hover {
            background-color: #f9f5ed;
        }
        .char {
            display: inline-block;
            padding: 2px 1px;
            cursor: pointer;
            border-radius: 2px;
            transition: background-color 0.2s;
        }
        .char:hover {
            background-color: #e8dfce;
        }
        .char.highlight {
            background-color: #ffeb3b;
        }
        .play-btn {
            display: inline-block;
            margin-left: 10px;
            padding: 2px 8px;
            font-size: 8px;
            background-color: #5e3a1e;
            color: white;
            border-radius: 3px;
            cursor: pointer;
            vertical-align: middle;
        }
        .play-btn:hover {
            background-color: #4a2d17;
        }
        .selection-info {
            margin-top: 20px;
            padding: 10px;
            background-color: #f0e9db;
            border-radius: 4px;
            border-left: 4px solid #8c2e0b;
            display: none;
        }
        footer {
            margin-top: 30px;
            text-align: center;
            color: #777;
            font-size: 8px;
            padding-top: 15px;
            border-top: 1px solid #e0d6c2;
        }
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }
            h1 {
                font-size: 2.0em;
            }
            .content {
                font-size: 16px;
            }
            .controls {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>

        <div class="controls">

                    <option value="1.2">快速</option>

            </div>
            
            <button id="readAllBtn">朗读全文</button>

    </div>

        const contentText = `第二回　江南七怪

颜烈跨出房门，过道中一个中年士人拖着鞋皮，踢跶踢跶的直响，一路打着哈欠迎面过来。那士人似笑非笑，挤眉弄眼，一副惫懒神气，全身油腻，衣冠不整，满面都是污垢，看来少说也有十多天没洗脸了，拿着一柄破烂的油纸黑扇，边摇边行。

颜烈见这人衣着明明是个斯文士子，却如此肮脏，不禁皱了眉头，加快脚步，只怕沾到了那人身上污秽。突听那人干笑数声，声音刺耳，经过他身旁时，顺手伸出折扇，往他肩头拍落。颜烈一让，竟没避开，不禁大怒，喝道：“干什么？”

那人又是几声干笑，踢跶踢跶的向前去了，只听他走到过道尽头，对店小二道：“喂，伙计啊，你别瞧大爷身上破破烂烂，大爷可有的是银子。有些小子偏邪门着哪，他就是仗着身上光鲜唬人。招摇撞骗，勾引妇女，吃白食，住白店，全是这等小子，你得多留着点儿神。稳稳当当的，让他先交了房饭钱再说。”也不等那店小二答腔，便踢跶踢跶的走了。

颜烈更加心头火起，心想好小子，这话不是冲着我来么？那店小二听那人一说，斜眼向他看了眼，不禁起疑，走到他跟前，哈了哈腰，陪笑道：“您老别见怪，不是小的无礼……”颜烈知他意思，哼了一声道：“把这银子给存在柜上！”伸手往怀里一摸，不禁呆了。他囊里本来放着四五十两银子，一探手，竟已空空如也。店小二见他脸色尴尬，一只手在怀里耽着，摸不出银两，只道穷酸的话不错，神色登时不如适才恭谨，挺腰凸肚的道：“怎么？没带银子么？”

颜烈道：“你等一下，我回房去拿。”他只道匆匆出房，忘拿银两，哪知回入房中打开包裹一看，包里几十两金银尽已不翼而飞。这批金银如何失去，自己竟没半点因头，那倒奇了，寻思：“适才包氏娘子出去解手，我也去了茅房一阵，前后不到一炷香时分，怎地便有人进房来做了手脚？嘉兴府的飞贼倒真厉害。”

店小二在房门口探头探脑的张望，见他银子拿不出来，发作道：“这女娘是你原配妻子吗？要是拐带人口，可要连累我们呢！”包惜弱又羞又急，满脸通红。颜烈一个箭步纵到门口，反手一掌，只打得店小二满脸是血，还打落了几枚牙齿。店小二捧住脸大嚷大叫：“好哇！住店不给钱，还打人哪！”颜烈在他屁股上再加一脚，店小二一个筋斗翻了出去。

包惜弱惊道：“咱们快走吧，不住这店了。”颜烈笑道：“别怕，没了银子问他们拿。”端了张椅子坐在房门口。过不多时，店小二领了十多名泼皮，抡棍使棒，冲进院子来。颜烈哈哈大笑，喝道：“你们想打架？”忽地跃出，顺手抢过一根杆棒，指东打西，转眼间打倒了四五个。那些泼皮平日只靠逞凶使狠，欺压良善，这时见势头不对，抛下棍棒，一窝蜂的挤出院门，躺在地下的连爬带滚，惟恐落后。

包惜弱早吓得脸上全无血色，颤声道：“事情闹大了，只怕惊动了官府。”颜烈笑道：“我正要官府来。”包惜弱不知他用意，只得不言语了。

过不半个时辰，外面人声喧哗，十多名衙役手持铁尺单刀，闯进院子，把铁链抖得当啷当啷乱响，乱嘈嘈的叫道：“拐卖人口，还要行凶，这还了得？凶犯在哪里？”颜烈端坐椅上不动。众衙役见他衣饰华贵，神态俨然，倒也不敢贸然上前。带头的捕快喝道：“喂，你叫什么名字？到嘉兴府来干什么？”颜烈道：“你去叫盖运聪来！”

盖运聪是嘉兴府的府尹，众衙役听他直斥上官姓名，都又惊又怒。那捕快道：“你失心疯了么？乱呼乱叫盖太爷的大号。”颜烈从怀里取出一封信来，往桌上一掷，抬头向着屋顶，说道：“你拿去给盖运聪瞧瞧，看他来是不来？”那捕快取过信件，见了封皮上的字，吃了一惊，但不知真伪，低声对众衙役道：“看着他，别让他跑了。”随即飞奔而出。

包惜弱坐在房中，心里怦怦乱跳，脸色惨白。

过不多时，又涌进数十名衙役，两名官员全身公服，抢上来向颜烈跪倒行礼，禀道：“卑职嘉兴府盖运聪、嘉兴县姜文通，磕见大人。卑职不知大人驾到，未曾远迎，请大人恕罪。”颜烈摆了摆手，微微欠身，说道：“兄弟在贵县失窃了些银子，请两位劳神查一查。”盖运聪忙道：“是，是。”手一摆，两名衙役托过两只盘子，一盘黄澄澄的全是金子，一盘白晃晃的则是银子。

盖运聪道：“卑职治下竟有奸人胆敢盗窃大人使费，全是卑职之罪，这点戋戋之数，先请大人赏收。”颜烈笑着点点头，盖运聪又把那封信恭恭敬敬的呈上，说道：“卑职已打扫了行台，恭请大人与夫人的宪驾。”颜烈道：“还是这里好，我喜欢清清静静的，你们别来打扰啰唆。”说着脸色一沉。盖运聪与姜文通忙道：“是，是！大人还需用什么，请尽管吩咐，好让卑职办来孝敬。”颜烈抬头不答，连连摆手。盖姜二人忙率领衙役退了出去。

那店小二早吓得面无人色，由掌柜的领着过来磕头赔罪，只求饶了一条性命，打多少板子屁股也是心甘。颜烈从盘中取过一锭银子，掷在地上，笑道：“赏你吧，快给我滚。”那店小二还不敢相信，掌柜的见颜烈脸无恶意，怕他不耐烦，忙捡起银子，磕了几个头，拉着店小二出去。

包惜弱兀自心神不定，问道：“这封信是什么法宝？怎地做官的见了，竟怕成这个样子。”颜烈笑道：“本来我又管不着他们，这些做官的自己没用。赵扩手下尽用这些脓包，江山不失，是无天理了。”包惜弱道：“赵扩，那是谁？”颜烈道：“那就是当今的庆元皇帝。” （按：庆元皇帝即后来称为宁宗的南宋第四任皇帝，年号有庆元、嘉泰、开禧、嘉定。） 包惜弱吃了一惊，忙道：“小声！圣上的名字，怎可随便乱叫？”颜烈见她关心自己，很是高兴，笑道：“我叫却是不妨。到了北边，咱们不叫他赵扩叫什么？”包惜弱道：“北边？”颜烈点了点头，正要说话，突然门外蹄声急促，数十骑马停在客店门口。包惜弱雪白的脸颊上本已透出些血色，听到蹄声，立时想起那晚官兵捕拿之事，登时脸色又转苍白。颜烈却眉头一皱，好似颇不乐意。

只听得靴声橐橐，院子里走进数十名锦衣军士，见到颜烈，个个脸有喜色，齐叫：“王爷！”跪下行礼。颜烈微笑说道：“你们终于找来啦。”包惜弱听他们叫他“王爷”，更加惊奇万分。那些大汉站起身来，个个虎背熊腰，甚是剽健。

颜烈摆了摆手道：“都出去吧！”众军士齐声唱喏，鱼贯而出。颜烈转头对包惜弱道：“你瞧我这些下属，跟宋兵比起来怎样？”包惜弱奇道：“难道他们不是宋兵？”颜烈笑道：“现今我对你实说了吧，这些都是大金国的精兵！”说罢纵声长笑，神情得意之极。

包惜弱颤声道：“那么……你……你也是……”

颜烈笑道：“不瞒娘子说，在下的姓氏上还得加多一个‘完’字，名字中加多一个‘洪’字。在下完颜洪烈，大金国六王子，封为赵王的，便是区区了。”

包惜弱自小听父亲说起金国蹂躏我大宋河山之惨、大宋皇帝如何让他们掳去不得归还、北方百姓如何给金兵残杀虐待，自嫁了杨铁心后，丈夫对金国更切齿痛恨，哪知道这几天中与自己朝夕相处的竟是个金国王子，惊骇之余，说不出话来。

完颜洪烈见她脸上变色，笑声顿敛，说道：“我久慕南朝繁华，是以去年求父皇派我到临安来，作为祝贺元旦的使者。再者，宋主尚有几十万两银子的岁贡没依时献上，父皇要我前来追讨。”包惜弱道：“岁贡？”完颜洪烈道：“是啊，宋朝求我国不要进攻，每年进贡银两绢匹，可是他们常说什么税收不足，总不肯爽爽快快的一次缴足。这次我对韩侂胄不客气了，跟他说，如不在一个月之内缴足，我亲自领兵来取，不必再费他心了。”包惜弱道：“韩丞相又怎样说？”完颜洪烈道：“他有什么说的？我人未离临安府，银子绢匹早送过江去啦，哈哈！”包惜弱蹙眉不语。完颜洪烈道：“催索银绢什么的，本来也不须我来，派一个使臣就已足够。我本意是想瞧瞧南朝的山川形胜，人物风俗，想不到竟与娘子相识，还蒙救了性命，真是三生有幸。”包惜弱心头思潮起伏，茫然失措，默然不语。

完颜洪烈道：“我给娘子买衣衫去。”包惜弱低头道：“不用啦。”完颜洪烈笑道：“韩丞相私下另行送给我的金银，如买了衣衫，娘子一千年也穿着不完。娘子别怕，客店四周有我亲兵好好守着，决没歹人敢来伤你。”说着扬长出店。

包惜弱追思自与他相见以来的种种经过，他是大金国王子，对自己一个平民寡妇如此低声下气，多半用意不善。丈夫惨遭非命，撇下自己一个弱女子处此尴尬境地，本来该当脱身离去，但天地茫茫，却又到哪里去？六神无主，只好伏枕痛哭。

完颜洪烈怀了金银，径往闹市走去，见城中居民人物温雅，虽贩夫走卒，形貌亦多俊秀不俗，心中暗暗称羡。

突然间前面蹄声急促，一骑马急奔而来。市街本不宽敞，加之行人拥挤，街旁又摆满了卖物的摊头担子，如何可以驰马？完颜洪烈忙往街边闪让，转眼之间，见一匹黄马从人丛中直窜出来。那马神骏异常，身高膘肥，竟是罕见的良马。完颜洪烈暗暗喝了声采，瞧那马上乘客，不觉哑然。

那马如此神采，骑马之人却是个又矮又胖的猥葸汉子，乘在马上犹如个大肉团一般。此人手短足短，似没脖子，一个头大得出奇，却又缩在双肩之中。说也奇怪，那马在人堆里发足急奔，竟不碰到一人、亦不踢翻一物，只见它出蹄轻盈，纵跃自如，跳过瓷器摊，跨过青菜担，每每在间不容发之际闪让行人而过，闹市疾奔，竟与旷野驰骋无异。完颜洪烈不自禁的喝了一声采：“好！”

那矮胖子听得喝采，回头望了一眼。完颜洪烈见他满脸都是红色的酒糟粒子，一个酒糟鼻又大又圆，就如一只红柿子黏在脸上，心想：“这匹马好极，我出高价买下来吧。”就在这时，街头两个小孩游戏追逐，横过马前。那马出其不意，吃惊提足，眼见左足将要踢到小孩身上，那矮胖子一提缰绳，跃离马鞍，那马身上一轻，倏然跃起，在两个小孩头顶飞越而过，那矮胖子随又轻飘飘的落上马背。

完颜洪烈一呆，心想这矮子骑术如此精绝，我大金国善乘之人虽多，却未有及得上的，真是人不可以貌相。如聘得此人回京教练骑兵，我手下的骑士定可纵横天下。这比之购得一匹骏马又好过万倍了。他这次南来，何处可以驻兵，何处可以渡江，看得仔仔细细，一一暗记在心，甚至各地州县长官的姓名才能，也详为打听。此时见到这矮胖子骑术精妙，心想南人朝政腐败，如此奇士弃而不用，遗诸草野，何不楚材晋用？决意以重金聘他去燕京作教头。

他心意已决，发足疾追，只怕那马脚力太快，追赶不上，正要出声呼叫，见那乘马奔到大街转弯角处，忽然站住。完颜洪烈又觉惊奇，马匹疾驰，必须逐渐放慢脚步方能停止，此马竟能在急行之际陡然收步，实前所未睹，就算武功高明之人，也未必能在发力狂奔之时如此神定气闲的蓦地站定。只见那矮胖子飞身下马，钻入一家店内。

完颜洪烈快步走近，见店中直立一块大木牌，上写“太白遗风”四字，却是一家酒楼，再抬头看，楼头一块极大的金字招牌，写着“醉仙楼”三个大字，字迹劲腴，旁边写着“东坡居士书”五个小字，原来是苏东坡所题。完颜洪烈见这酒楼气派豪华，心想：“他来到酒楼，便先请他大吃大喝一番，乘机结纳，正再好不过。”忽见那矮胖子从楼梯上奔下，手里托着一只酒坛，走到马前。完颜洪烈当即闪在一旁。

那矮胖子站在地下，更加显得臃肿难看，身高不过三尺，膀阔几乎也有三尺，那马偏偏腿长身高，他头顶不过刚齐到马镫。只见他把酒坛放在马前，伸掌在酒坛肩上轻击数掌，随手提起，已把酒坛上面一小半的坛身揭下，那酒坛便如是一个深底的瓦盆。黄马前足扬起，长声欢嘶，俯头饮酒。完颜洪烈闻得酒香，竟是浙江绍兴的名酿女儿红，从这酒香辨来，少说也是十年的陈酒。

那矮胖子转身入内，手一扬，当的一声，将一大锭银子掷在柜上，说道：“给开三桌上等酒菜，两桌荤的，一桌素的。”掌柜的笑道：“是啦，韩三爷。今儿有松江来的四鳃鲈鱼，下酒再好没有。这银子您韩三爷先收着，慢慢再算。”矮胖子白眼一翻，怪声喝道：“怎么？喝酒不用钱？你当韩老三是光棍混混，吃白食么？”掌柜笑嘻嘻的也不以为忤，大声叫道：“伙计们，加把劲给韩三爷整治酒菜哪！”众伙计里里外外一叠连声的答应。

完颜洪烈心想：“这矮胖子穿着平常，出手却甚豪阔，众人对他又如此奉承，看来是嘉兴府一霸。要聘他北上去做马术教头，只怕要费点周折了。且看他请些什么客人，相机行事。”拾级登楼，拣了窗边一个座儿坐下，要了一斤酒，随意点了几样菜。

这醉仙楼正在南湖之旁，湖面轻烟薄雾，几艘小舟荡漾其间，半湖水面都浮着碧油油的菱叶，他放眼观赏，登觉心旷神怡。这嘉兴是古越名城，所产李子甜香如美酒，因此春秋时这地方称为檇李。当年越王勾践曾在此大破吴王阖闾，正是吴越间的来往必经之地。当地南湖中又有一项名产，是绿色的没角菱，菱肉鲜甜嫩滑，清香爽脆，为天下之冠，湖中菱叶特多。其时正当春深，碧水翠叶，宛若一泓碧琉璃上铺满了一片片翡翠。

完颜洪烈正赏玩风景，忽见湖心中一叶渔舟如飞般划来。这渔舟船身狭长，船头高高翘起。完颜洪烈初时也不在意，但转眼之间，只见那渔舟已赶过了远在前头的小船，竟快得出奇。片刻间渔舟渐近，见舟中坐着一人，舟尾划桨的穿了一身蓑衣，却是个女子。她伸桨入水，轻轻巧巧的一扳，渔舟就箭也似的射出一段路，船身几如离水飞跃，看来这一扳之力少说也有一百来斤，女子而有如此劲力已甚奇怪，而一枝木桨又怎受得起如此大力？

只见她又是数扳，渔舟已近酒楼，日光照在桨上，亮晃晃的原来是一柄包黄铜的铁桨。那渔女把渔舟系在酒楼下石级旁的木桩上，轻跃登岸。坐在船舱里的汉子挑了一担粗柴，也跟着上来。两人径上酒楼。渔女向那矮胖子叫了声：“三哥！”在他身旁坐下。矮胖子道：“四弟、七妹，你们来得早！”

完颜洪烈侧眼打量那两人时，见那女子大约十七八岁年纪，身形苗条，大眼睛，长睫毛，皮肤如雪，正是江南水乡的俊美人物。她左手倒提铁桨，右手拿了蓑笠，露出一头乌云般的秀发。完颜洪烈心想：“这姑娘虽不及我那包氏娘子美貌，却另有一般天然风姿。”

那挑柴的汉子二十八九岁年纪，一身青布衣裤，腰里束了条粗草绳，足穿草鞋，粗手大脚，神情木讷。他放下担子，把扁担往桌旁一靠，叽叽数声，一张八仙桌竟给扁担推动了数寸。完颜洪烈一怔，瞧那条扁担也无异状，通身黑油油地，中间微弯，两头各有一个突起的鞘子。这扁担如此沉重，料想必是精钢所铸。那人腰里插了一柄砍柴用的短斧，斧刃上有几个缺口。

两人刚坐定，楼梯上脚步声响，上来两人。那渔女叫道：“五哥、六哥，你们一起来啦。”前面一人身材魁梧，胖大异常，少说也有二百三四十斤，围着一条长围裙，全身油腻，敞开衣襟，露出毛茸茸的胸膛，袖子卷得高高的，手臂上全是寸许长的黑毛，腰间皮带上插着柄尺来长的尖刀，瞧模样是个杀猪宰羊的屠夫。后面那人五短身材，头戴小毡帽，白净面皮，手里提着一杆秤，一个竹篓，似是个小商贩。完颜洪烈暗暗称奇：“瞧头上三人都是身有武功之人，怎么这两个市井小人却又跟他们兄弟相称？”

忽听街上传来一阵登登登之声，似是铁物敲击石板，跟着敲击声响上楼梯，上来一个衣衫褴褛的汉子，右手握着一根粗大铁杖。只见他三十来岁年纪，尖嘴削腮，脸色灰扑扑地，双目翻白，是个盲人。坐在桌边的五人都站了起来，齐叫：“大哥。”渔女在一张椅子上轻轻一拍，道：“大哥，你座位在这里。”那瞎子道：“好。二弟还没来么？”那屠夫模样的人道：“二哥已到了嘉兴，这会儿也该来啦。”渔女笑道：“这不是来了吗？”只听得楼梯上一阵踢跶踢跶拖鞋皮声响。

完颜洪烈一怔，只见楼梯口先探上一柄破烂污秽的油纸扇，先扇了几扇，接着一个穷酸摇头晃脑的踱了上来，正是适才在客店中相遇的那人。完颜洪烈心想：“我的银两必是此人偷了去……”心头正自火冒，那人咧嘴向他一笑，伸伸舌头，装个鬼脸，转头跟众人招呼，原来便是他们的二哥。

完颜洪烈寻思：“看来这些人个个身怀绝技，倘若能收为己用，实是极大臂助。那穷酸偷我金银，小事一桩，不必计较，且瞧一下动静再说。”那穷酸喝了一口酒，摇头摆脑的吟道：“不义之财……放他过，……玉皇大帝……发脾气！”口中高吟，伸手从怀里掏出一锭锭金银，整整齐齐的排在桌上，一共掏出八锭银子、两锭金子。

完颜洪烈瞧那些金银的色泽形状，正是自己所失却的，心下不怒反奇：“他入房去偷我金银倒也不难，但他只用扇子在我肩头一拍，便将我怀中银锭都摸去了，当时我竟一无所觉。这妙手空空之技，确也罕见罕闻。”

看这七人情状，似乎他们作东，邀请两桌客人前来饮酒，因宾客未到，七人只喝清酒，菜肴并不开上席来。但另外两桌上各只摆设一副杯筷，那么客人只有两个了。完颜洪烈寻思：“这七个怪人请客，不知请的又是何等怪客？”

过了一盏茶时分，只听楼下有人念佛：“阿弥陀佛！”那瞎子道：“焦木大师到啦！”站起身来，其余六人也都肃立相迎。又听得一声：“阿弥陀佛！”一个形如槁木的枯瘦和尚上了楼梯。这和尚五十来岁年纪，身穿黄麻僧衣，手里拿着一段木柴，木柴的一头已烧成焦黑，不知有何用处。

和尚向七人打个问讯，那穷酸引他到一桌空席前坐下。和尚欠身道：“那人寻上门来，小僧自知不是他对手，多蒙江南七侠仗义相助，小僧感激之至。”

那瞎子道：“焦木大师不必客气。我七兄弟多承大师平日眷顾，大师有事，我兄弟岂能袖手？何况那人自恃武功了得，无缘无故的来跟大师作对，浑不把江南武林中人放在眼里。就是大师不来通知，我们兄弟知道了也决不能干休……”

话未说完，只听得楼梯格格作响，似是一头庞然巨兽走上楼来，听声音若非巨象，便是数百斤的一头大水牛。

楼下掌柜与众酒保一叠连声的惊叫起来：“喂，这笨家伙不能拿上去！”“楼板要给你踏穿啦。”“快，快，拦住他，叫他下来！”但格格之声更加响了。

完颜洪烈眼前一花，只见一个道人手托一口极大铜缸，迈步走上楼来，定睛看时，只吓得心中突突乱跳，这道人正是长春子丘处机。

完颜洪烈这次奉父皇之命出使宋廷，要乘机阴结宋朝大官，以备日后入侵时作为内应。陪他从中都南来的宋朝使臣王道乾趋炎附势，贪图重贿，已暗中投靠金国，到临安后为他拉拢奔走。不料王道乾突然给一个道人杀死，连心肝首级都不知去向。完颜洪烈大惊之余，生怕自己阴谋已为这道人察觉，当即带同亲随，由临安府的捕快兵役领路，亲自追拿刺客。追到牛家村时与丘处机遭遇，这道人武功极高，完颜洪烈尚未出手，就给他一枝甩手箭打中肩头，所带来的兵役随从给他杀得干干净净。完颜洪烈如不是在混战中及早逃开，又得包惜弱相救，一个金国王子就此葬身在这小村之中了。

完颜洪烈定了定神，见他目光只在自己脸上掠过，便全神贯注的瞧着焦木和那七人，显然并未认出自己，料想那日自己刚从人丛中探身出来，便给他羽箭掷中摔倒，并未看清楚自己面目，便稍宽心，再看他所托的那口大铜缸时，更不禁大吃一惊。

这铜缸是庙宇中常见之物，用来焚烧纸锭表章，直径四尺有余，只怕足足有二百来斤，缸中溢出酒香，显是装了美酒，份量自必更加沉重，但他托在手里，却也不见得如何吃力。他每跨一步，楼板就喀喀乱响。楼下这时早已乱成一片，掌柜、酒保、厨子、打杂的、众酒客纷纷逃出街去，只怕楼板给他压破，砸下来打死了人。

焦木和尚冷然道：“道兄惠然驾临，却何以取来了小庙的烧香化纸铜缸？衲子给你引见江南七侠！”丘处机举起左手为礼，说道：“适才贫道到宝刹奉访，寺里师父言道，大师邀贫道来醉仙楼相会。贫道心下琢磨，大师定是请下好朋友来了，果然如此。久闻江南七侠威名，今日有幸相见，足慰平生之愿。”

焦木和尚向七侠道：“这位是全真派长春子丘道长，各位都是久仰的了。”转过头来，向丘处机道：“这位是七侠之首，飞天蝙蝠柯镇恶柯大侠。”说着伸掌向那瞎子身旁一指，跟着依次引见。完颜洪烈在旁留神倾听，暗自记忆。第二个便是偷他银两的那肮脏穷酸，名叫妙手书生朱聪。最先到酒楼来的骑马矮胖子是马王神韩宝驹，排行第三。挑柴担的乡农排行第四，名叫南山樵子南希仁。第五是那身材粗壮、屠夫模样的大汉，叫作笑弥陀张阿生。那小商贩模样的后生姓全名金发，绰号闹市侠隐。那渔女是越女剑韩小莹，江南七侠中年纪最小。

焦木引见之时，丘处机逐一点首为礼，右手却一直托着铜缸，竟似不感疲累。

酒楼下众人见一时无事，有几个大胆的便悄悄踅上来瞧热闹。

柯镇恶道：“我七兄弟人称‘江南七怪’，不过是怪物而已，‘七侠’什么的，却不敢当。我兄弟久仰全真七子威名，素闻长春子行侠仗义，更是钦慕。这位焦木大师为人最是古道热肠，不知如何无意中得罪了道长？道长要是瞧得起我七兄弟，便让我们做做和事老。两位虽然和尚道士，所拜的菩萨不同，但总都是出家人，又都是武林一脉，大家尽释前愆，一起来喝一杯如何？”

丘处机道：“贫道和焦木大师素不相识，无冤无仇，只要他交出两个人来，改日贫道自会到法华禅寺负荆请罪。”柯镇恶道：“交什么人出来？”丘处机道：“贫道有两个朋友，受了官府和金兵的陷害，不幸死于非命。他们遗下的寡妇孤苦无依。柯大侠，你们说贫道该不该理？”完颜洪烈听了，端在手中的酒杯一晃，泼出了些酒水。只听柯镇恶道：“别说是道长朋友的遗孀，就是素不相识之人，咱们既然知道了，也当量力照顾，那是义不容辞之事。”丘处机大声道：“是呀！我就是要焦木大师交出这两个身世可怜的女子来！他是出家人，却何以将两个寡妇收在寺里，定是不肯交出？七位是侠义之人，请评评这道理看！”

此言一出，不但焦木与江南七怪大吃一惊，完颜洪烈在旁也暗自诧异，心想：“难道他说的不是杨郭二人的妻子，另有旁人？”

焦木本就脸色焦黄，这时更加气得黄中泛黑，一时说不出话来，结结巴巴的道：“你……你……胡言乱道……胡言……”

丘处机大怒，喝道：“你也是武林中知名人物，竟敢如此为非作歹！”右手一送，一口数百斤重的铜缸连酒带缸，向着焦木飞去。焦木纵身跃开避过。

站在楼头瞧热闹的人吓得魂飞天外，你推我拥，一连串骨碌碌的冲下楼去。

笑弥陀张阿生估量这铜缸虽重，自己尽可接得住，抢上一步，运气双臂，叫一声：“好！”待铜缸飞到，双臂运劲，托住缸底，肩背肌肉坟起，竟把铜缸接住了，双臂上挺，将铜缸高举过顶，但脚下使力太巨，喀喇一声，左足在楼板上踏穿了个洞，楼下众人又大叫起来。张阿生上前两步，双臂微曲，一招“推窗送月”，将铜缸向丘处机掷去。

丘处机伸右手接过，笑道：“江南七怪名不虚传！”随即脸色一沉，向焦木喝道：“那两个女子怎样了？你把她两个妇道人家强行收藏在寺，到底是何居心？你这贼和尚只要碰了她们一条头发，我把你拆骨扬灰，把你法华寺烧成白地！”

朱聪扇子一搧，摇头晃脑的道：“焦木大师是有道高僧，怎会做这等无耻之事？道长定是听信小人的谣言了。虚妄之极矣，决不可信也！”

丘处机怒道：“贫道亲眼见到，怎么会假？”江南七怪都是一怔。焦木道：“你就算要到江南来扬万立威，又何必败坏我的名头……你……你……到嘉兴府四下里去打听打听，我焦木和尚岂能做这等歹事？”丘处机冷笑道：“好呀，你邀了帮手，便想倚多取胜。这件事我是管上了，决计放你不过。你清净佛地，窝藏良家妇女，已大大不该，何况这两个女子的丈夫乃忠良之后，惨遭非命。”

柯镇恶道：“道长说焦木大师收藏了那两个女子，而大师却说没有。咱们大伙儿到法华寺去瞧个明白，到底谁是谁非，不就清楚了？兄弟眼睛虽然瞎了，可是别人眼睛不瞎啊。”六兄妹齐声附和。

丘处机冷笑道：“搜寺？贫道早就里里外外搜了个遍，可是明明见到那个女人进去，人却又不见了。无法可想，只有要和尚交出人来。”朱聪道：“原来那两个女子不是人。”丘处机一楞，道：“什么？”朱聪一本正经的道：“她们是仙女，不是会隐身法，就是借土遁遁走啦！”余下六怪听了，都不禁微笑。

丘处机怒道：“好啊，你们消遣贫道来着。江南七怪今日帮和尚帮定了，是不是？”

柯镇恶凛然道：“我们本事低微，在全真派高手看来，自不足一笑。可是我七兄弟在江南也还有点小小名头，知道我们的人，都还肯说一句：江南七怪疯疯颠颠，却不是贪生怕死之徒。我们不敢欺压旁人，可也不能让旁人来欺压了。”

丘处机道：“江南七侠名声不坏，这个贫道早有听闻。各位事不干己，不用赶这趟浑水。我跟和尚的事，让贫道自行跟他了断，现下恕不奉陪了。和尚，跟我走吧。”说着伸左手来拿焦木手腕。焦木手腕斜挥，把他这一拿化解了开去。

马王神韩宝驹见两人动上了手，大声喝道：“道士，你到底讲不讲理？”丘处机道：“韩三爷，怎样？”韩宝驹道：“我们信得过焦木大师，他说没有就是没有。武林中铁铮铮的好汉子，难道谁还能撒谎骗人？”丘处机道：“他不会撒谎，莫非丘某就会没来由的撒谎冤他？丘某亲眼目睹那女子进了他寺庙，倘若看错了人，我挖出这对招子来给你。我找这和尚是找定了。七位插手也是插定了，是不是？”江南七怪齐声道：“不错。”

丘处机道：“好，我敬七位每人一口酒。各位喝了酒再动手吧。”说着右手一沉，放低铜缸，在缸里喝了一大口酒，叫道：“请吧！”手一抖，铜缸又向张阿生飞来。

张阿生心想：“要是再像刚才那样把铜缸举在头顶，怎能喝酒？”当即退后两步，双手挡在胸口，待铜缸飞到，双手向外一分，铜缸正撞在胸口。他生得肥胖，胸口累累的都是肥肉，犹如一个软垫般托住了铜缸，随即运气，胸肌向外弹出，已把铜缸飞来之势挡住，双手合围，紧紧抱住了铜缸，低头在缸里喝了一大口酒，赞道：“好酒！”双手突然缩回，抵在胸前，铜缸尚未下落，已使一招“双掌移山”，把铜缸猛推出去。这一招劲道既足，变招又快，的是外家高明功夫。完颜洪烈在一旁看得暗暗心惊。

丘处机接回铜缸，也喝了一大口，叫道：“贫道敬柯大哥一缸酒！”顺手将铜缸向柯镇恶掷去。

完颜洪烈心想：“这人眼睛瞎了，又如何接得？”却不知柯镇恶位居江南七怪之首，武功也为七人之冠，他听辨细微暗器尚且不差厘毫，这口巨大的铜缸掷来时呼呼生风，自辨得清楚，他意定神闲的坐着，恍如未觉，直至铜缸飞临头顶，这才右手挺举，一根铁杖已顶在缸底。那铜缸在铁杖上的溜溜转得飞快，犹如耍盘子的人用竹棒顶住了瓷盘玩弄一般。突然间铁杖略歪，铜缸微侧，眼见要跌下来打在他头顶，这一下还不打得脑浆迸裂？哪知铜缸稍侧，却不跌落，缸中酒水如一条线般射将下来。柯镇恶张口接住，上面的酒不住倾下，他骨都骨都的大口吞饮，饮了三四口，余酒溅在衣上，铁杖稍挪，又已顶在缸底正中，随即向上挺送，铜缸飞起。他挥杖横击，当的一声巨响，震耳欲聋，那缸便向丘处机飞去，嗡嗡声好一阵不绝。

丘处机笑道：“柯大侠平时一定爱玩顶盘子。”随手接住铜缸。柯镇恶冷冷的道：“小弟幼时家贫，靠这玩意儿做叫化子讨饭。”丘处机道：“贫贱不能移，此之谓大丈夫。我敬南四哥一缸！”低头在缸中喝一口酒，将铜缸向南山樵子南希仁掷去。

南希仁一言不发，待铜缸飞到，举起扁担在空中挡住，当的一声，铜缸在空中受阻，落了下来。南希仁伸手在缸里抄了一口酒，就手吃了，扁担打横，右膝跪倒，扁担搁在左膝之上，右手在扁担一端扳落，扁担另一端托住铜缸之底，扳起铜缸，又飞在空中。

他正待用扁担将铜缸推还给丘处机，闹市侠隐全金发笑道：“兄弟做小生意，爱占小便宜，就不费力的讨口酒吃吧。”抢到南希仁身边，待铜缸再次落下时，也抄一口酒吃了，忽地跃起，双足抵住缸边，空中用力，双脚力撑，身子如箭般向后射出，那铜缸也给他双脚蹬了出去。他和铜缸从相反方向飞出，铜缸径向丘处机飞去。他身子激射到板壁之上，轻轻滑下。妙手书生朱聪摇着折扇，不住口的道：“妙哉，妙哉！”

丘处机接住铜缸，又喝了一大口酒，说道：“妙哉，妙哉！贫道敬朱二哥一缸。”朱聪狂叫起来：“啊哟，使不得，小生手无缚鸡之力，肚无杯酒之量，不压死也要醉死……”呼叫未毕，铜缸已向他当头飞到。朱聪大叫：“压死人啦，救命，救……”伸扇子在缸中一捞，送入口中，倒转扇柄，抵住缸边往外送出，腾的一声，楼板已给他蹬破一个大洞，身子从洞里掉了下去，“救命，救命”之声，不住从洞里传将上来。

众人都知他是装腔作势，谁也不觉惊讶。完颜洪烈见他扇柄稍抵，铜缸便已飞回，小小一柄折扇，所发劲力竟不弱于南希仁那根沉重的钢铁扁担，暗自骇异。

越女剑韩小莹叫道：“我来喝一口！”右足一点，身子如飞燕掠波，倏地在铜缸上空跃过，头一低，已在缸中吸到了一口酒，轻飘飘的落在对面窗格之上。她擅于剑法轻功，膂力却非所长，心想轮到这口笨重已极的铜缸向自己掷来，接挡固是无力，要掷还给这个道士更万万不能，是以乘机施展轻功吸酒。

这时那铜缸仍一股劲的往街外飞出，街上人来人往，落将下来，势必酿成极大灾祸。丘处机暗暗心惊，正拟跃到街上去接住。只听呼的一声，韩宝驹从身旁斜刺掠过，口中一声唿哨，楼下那匹黄马奔到了街口。楼上众人都抢到窗口观看，只见空中一个肉团和铜缸一撞，铜缸下堕之势变为向前斜落，肉团和铜缸双双落上黄马马鞍。那黄马驰出数丈，稍卸重压劲力，转身直奔上楼，虽踏断了不少梯级，却未蹶踬。

马王神韩宝驹身在马腹之下，左足勾住镫子，双手及右足却托住铜缸，使它端端正正的放在马鞍之上，不致倾侧。那黄马跑得又快又稳，上楼如驰平地。韩宝驹翻身上马，探头在缸中喝了一大口酒，左臂一振，把铜缸推落楼板，哈哈大笑，一提缰，那黄马倏地从窗口窜了出去，犹如天马行空，稳稳当当的落在街心。韩宝驹跃下马背，和朱聪挽手上楼。

丘处机道：“江南七侠果然名不虚传！个个武功高强，贫道甚为佩服。冲着七位的金面，贫道再不跟这和尚为难，只要他交出那两个可怜的女子，就此既往不咎。”

柯镇恶道：“丘道长，这就是你的不是了。这位焦木大师数十年清修，乃是有道高僧，我们素来敬佩。法华寺也是嘉兴府有名的佛门善地，怎么会私藏良家妇女？”丘处机道：“天下之大，尽有欺世盗名之辈。”韩宝驹怒道：“如此说来，道长是不信我们的话了？”丘处机道：“我宁可信自己眼睛。”韩宝驹道：“道长要待怎样？”他身子虽矮，但话声响亮，说来自有一股威猛之气。

丘处机道：“此事与七位本来无干，既然横加插手，必然自恃技艺过人。贫道不才，只好和七位见个高下，倘若不敌，听凭各位如何了断便了。”柯镇恶道：“道长既一意如此，就请划下道儿来罢。”

丘处机微一沉吟，说道：“我和各位向无仇怨，江南七怪乃英侠之士，贫道素来敬仰，动刀动拳，不免伤了和气。这样罢——”大声叫道：“酒保，拿十四个大碗来！”

酒保本来躲在楼下，这时见楼上再无动静，听得叫唤，忙不迭的将大碗送上楼来。

丘处机命他把大碗都到铜缸中舀满了酒，在楼上排成两列，向江南七怪说道：“贫道和各位斗斗酒量。各位共喝七碗，贫道一人喝七碗，喝到分出胜负为止。这法儿好不好？”

韩宝驹与张阿生等都是酒量极宏之人，首先说好。柯镇恶却道：“我们以七敌一，胜之不武，道长还是另划道儿吧。”丘处机道：“你怎知一定能胜得了我？”

越女剑韩小莹虽是女子，生性却十分豪爽，亢声说道：“好，先比了酒量再说。这般小觑我们七兄弟的，小妹倒第一次遇上。”说着端起一碗酒来，骨都骨都的便喝了下去。她这碗酒喝得急了，顷刻之间，雪白的脸颊上泛上了桃红。

丘处机道：“韩姑娘真是女中丈夫。大家请罢！”七怪中其余六人各自举碗喝了。丘处机碗到酒干，顷刻间连尽七碗，每一碗酒都只咕的一声，便自口入肚，在咽喉间竟然不稍停留。酒保兴高采烈，大声叫好，忙又装满了十四碗。八人又都喝了。

喝到第三个十四碗时，韩小莹毕竟量窄，喝得半碗，右手微微发颤。张阿生接过她手中半碗酒来，道：“七妹，我代你喝了。”韩小莹道：“道长，这可不可以？”丘处机道：“行，谁喝都一样。”再喝一轮，全金发也败了下去。

七怪见丘处机连喝二十八碗酒，竟面不改色，神态自若，尽皆骇然。完颜洪烈在一旁瞧着，更挢舌不下，心里计较：“最好这老道醉得昏天黑地，那江南七怪乘机便将他杀了。”

全金发心想己方还剩下五人，然而五人个个酒量兼人，每人再喝三四碗酒还可支持，难道对方的肚子里还装得下二十多碗酒？就算他酒量当真无底，肚量却总有限，料想胜算在握，正自高兴，无意中在楼板上一瞥，只见丘处机双足之旁湿了好大一摊，不觉一惊，在朱聪耳边道：“二哥，你瞧这道士的脚。”朱聪一看，低声道：“不好，他是用内功把酒水从脚上逼了出来。”全金发低声道：“不错，想不到他内功这等厉害，那怎么办？”

朱聪寻思：“他既有这门功夫，便再喝一百碗也不打紧。须得另想计较。”退后一步，突然从先前踹破的楼板洞中摔了下去，只听他大叫：“醉了，醉了！”又从洞中跃上。又喝了一巡酒，丘处机足旁全是水渍，犹如有一道清泉从楼板上汩汩流出。这时南希仁、韩宝驹等也都瞧见了，见他内功如此精深，都暗自钦服。

韩宝驹把酒碗往桌上一放，便欲认输。朱聪向他使个眼色，对丘处机道：“道长内功出神入化，我们佩服之极。不过我们五个拼你一个，总似乎不大公平。”丘处机一怔，道：“朱二哥瞧着该怎么办？”朱聪笑道：“还是让兄弟一对一的跟道长较量下去吧。”

此言一出，众人都觉奇怪，眼见五人与他斗酒都已处于必败之地，怎么他反而要独自抵挡？但六怪都知这位兄弟虽言语滑稽，却满肚子是诡计，行事往往高深莫测，他既这么说，必另有诈道，当下都不作声。

丘处机呵呵笑道：“江南七侠当真要强得紧。这样吧，朱二哥陪着我喝干了缸中之酒，只要不分胜败，贫道就算输了，好不好？”

这时铜缸中还剩下小半缸酒，无虑数十大碗，只怕要庙里两个弥勒佛的大肚子，才分装得下。但朱聪毫不在意，笑道：“兄弟酒量虽然不行，但当年南游，却也曾胜过几样厉害家伙，干啊！”他右手挥舞破扇，左手大袖飘扬，一面说，一面喝酒。

丘处机跟着他一碗一碗的喝下去，问道：“什么厉害家伙？”朱聪道：“兄弟有一次到天竺国，天竺王子拉了一头大水牛出来，和我斗饮烈酒，结果居然不分胜败。”

丘处机知他是说笑话骂人，“呸”了一声，但见他指手划脚，胡言乱语，把酒一碗一碗的灌下肚去，手足之上又没酒水渗出，显然不是以内功逼发，但见他腹部隆起了一大块，难道他肚子真能伸缩自如，颇感奇怪，又听他道：“兄弟前年到暹罗国，哈，这一次更加不得了。暹罗宰相牵了一头大白象和我斗酒，这蠢家伙喝了七缸，你道我喝了几缸？”

丘处机明知他是说笑，但见他神态生动，说得酣畅淋漓，不由得随口问了一句：“几缸？”朱聪神色突转严重，压低了声音，正色道：“九缸！”忽然间又放大了声音道：“快喝，快喝！”

但见他手舞足蹈，似醉非醉，如疯非疯，便在片刻之间，与丘处机两人把铜缸中的酒喝到了底。韩宝驹等从来不知他竟有偌大酒量，无不惊喜交集。

丘处机大拇指一翘，说道：“朱兄真是奇人，贫道拜服！”

朱聪笑道：“道长喝酒用的是内功，兄弟用的却是外功，乃体外之功。你请看吧！”说着哈哈大笑，忽地倒翻一个筋斗，手里已提着一只木桶，随手一晃，酒香扑鼻，桶里装的竟是半桶美酒。这许多人个个武功高强，除柯镇恶外，无不眼光锐利，但竟没瞧清楚这木桶是从哪里来的，再看朱聪的肚子时，却已扁平如常，显然这木桶本来是藏在他大袍子底下。江南七怪纵声大笑，丘处机不禁变色。

要知朱聪最善于鸡鸣狗盗、穿窬行窃之技，是以绰号叫做“妙手书生”。他这袍内藏桶之术，一直流传至今。魔术家表演之时，空身走出台来，一个筋斗，手中多了一缸金鱼，再一个筋斗，台上又多了一碗清水，可以变到满台数十碗水，每一碗水中都有一尾金鱼游动，令观众个个看得目瞪口呆，叹为观止，即是师法这门妙术。朱聪第二次摔落楼下，便是将一只木桶藏入了袍底，喝酒时胡言乱语，挥手扬扇，旨在引开丘处机的目光。魔术家变戏法之时，在千百对眼睛的睽睽注视之下，尚且不让人瞧出破绽，那时丘处机丝毫没防到他会使这般手法，竟未看出他使用妙技，将一大碗一大碗的酒都倒入了藏在袍内的木桶之中。

丘处机道：“哼，你这个怎么算是喝酒？”朱聪笑道：“你难道算是喝酒了？我的酒喝在桶内，你的酒喝在地下，那又有什么分别？”

他一面说，一面踱来踱去，忽然一不小心踏在丘处机足旁的酒渍之中，一滑之下，向丘处机身上跌去。丘处机随手扶了他一把。朱聪向后一跃，踱了一个圈子，叫道：“好诗，好诗！自古中秋……月最明，凉风届候……夜弥清。一天……气象沉银汉，四海鱼龙……跃水精……”拖长了声音，朗声念诵起来。

丘处机一怔：“这是我去年中秋写的一首未成律诗，放在身边，拟待续成下面四句，从没给别人看过，他怎知道？”伸手往怀里摸去，录着这半首诗的那张纸笺果真已不知去向。

朱聪笑吟吟的摊开诗笺，放在桌上，笑道：“想不到道长武功盖世，文才也如此隽妙，佩服，佩服。”原来他刚才故意一滑一跌，已施展妙手空空之技，把丘处机衣袋内的这张纸条摸了出来。

丘处机寻思：“适才他伸手到我怀里，我竟丝毫不觉，倘若他不是盗我诗笺，而是用匕首戳上一刀，此刻我哪里还有命在？显然他手下留情了。”言念及此，心意登平，说道：“朱二侠既陪着贫道一起干光了这一缸酒，贫道自当言而有信，甘拜下风。今日醉仙楼之会，是丘处机栽在江南七侠手下了。”

江南七怪齐声笑道：“不敢，不敢。这玩意儿是当不得真的。”朱聪又道：“道长内功深湛，我们万万不及。”

丘处机道：“贫道虽然认输，但两个朋友所遗下的寡妇却不能不救。”举手行礼，托起铜缸，说道：“贫道这就去法华寺要人。”柯镇恶怒道：“你既已认输，怎地又跟焦木大师纠缠不清？”丘处机道：“扶危解困，跟输赢可不相干。柯大侠，倘若你朋友不幸遭难，遗孀受人欺辱，你救是不救？”说到这里，突然变色，叫道：“好家伙，还约了人啦，就算千军万马，你道爷便豁出了性命不要，也不能就此罢手。”

张阿生道：“就是咱们七兄弟，还用得着约什么人？”柯镇恶却也早听到有数十人奔向酒楼而来，还听到他们兵刃弓箭互相碰撞之声，当即站起，喝道：“大家退开，抄家生！”张阿生等抢起兵器，只听得楼梯上脚步声响，数十人抢上楼来。

众人回头看时，见数十名大汉都身穿金兵装束。丘处机本来敬重江南七怪的为人，只道他们为焦木和尚一时欺蒙，是以说话行事始终留了余地，这时忽见大批金兵上来，心头怒极，大叫：“焦木和尚，江南七怪，你们居然去搬金寇，还有脸面自居什么侠义道？”韩宝驹怒道：“谁搬金兵来着？”

那些金兵正是完颜洪烈的侍从。他们见王爷出外良久不归，一路寻来，听说醉仙楼上有人凶杀恶斗，生怕王爷遇险，急急赶到。

丘处机哼了一声，道：“好啊，好啊！贫道恕不奉陪了！这件事咱们可没了没完。”手托铜缸，大踏步走向梯口。

柯镇恶站起身来，叫道：“丘道长，您可别误会！”丘处机边走边道：“我误会？你们是英雄好汉，干么要约金兵来助拳？”柯镇恶道：“我们可没有约。”丘处机道：“我又不是瞎子！”柯镇恶眼睛盲了，生平最忌别人讥讽他这缺陷，铁杖一摆，抢上前去，喝道：“瞎子便怎样？”丘处机更不打话，左手抬起，啪的一掌，正中一名金兵的顶门。那兵登时脑浆迸裂而死。丘处机道：“这便是榜样！”袍袖一拂，径自下楼。

众金兵见打死了同伴，一阵大乱，早有数人挺矛向丘处机后心掷下。他头也不回，就似背后生着眼睛，伸手一一拨落。众金兵正要冲下，完颜洪烈疾忙喝住，转身对柯镇恶道：“这恶道无法无天，各位请过来共饮一杯，商议对付之策如何？”柯镇恶听得他呼喝金兵之声，知他是金兵头脑，喝道：“他妈的，滚开！”完颜洪烈一愕。韩宝驹道：“咱大哥叫你滚开！”右肩耸出，正撞在他左胯之上。完颜洪烈一个踉跄，退开数步。江南七怪和焦木和尚奔跃下楼。

朱聪走在最后，经过完颜洪烈身旁时，伸扇又在他肩头一拍，笑道：“你拐带的女子卖掉了么？卖给我怎样？哈哈！”说着急步下楼。朱聪先前虽不知完颜洪烈的来历，但在客店之中看到他对待包惜弱的模样，已知他二人不是夫妇，又听他自夸豪富，便盗了他金银，小作惩戒。此刻既知他是金兵头脑，不取他的金银，哪里还有天理？

完颜洪烈伸手往怀里一摸，带出来的几锭金银果然又都不翼而飞。他想这些人个个武功惊人，请那矮胖子去做马术教头之事那也免开尊口了，若再给他们发见包氏娘子竟在自己这里，更是天大祸事，幸得此刻丘处机与七怪误会未释，再不快走，连命也得送在这里，赶回客店，带同包惜弱连夜向北，回金国的中都大兴府而去。

原来那日丘处机杀了汉奸王道乾，在牛家村结识郭啸天、杨铁心两人，又将前来追捕的金兵和吏役杀得一个不剩，心下畅快，到得临安后，连日在湖上赏玩风景。西湖边上的葛岭乃晋时葛洪炼丹之处，为道家胜地。丘处机上午到处漫游，下午便在葛岭道观中修练内功，研读道藏。

这日走过清河坊前，忽见数十名官兵在街上狼狈经过，甩盔曳甲，折弓断枪，显见是吃了败仗逃回来的。他心下奇怪，暗想：“此时并没和金国开仗，又没听说左近有盗贼作乱，不知官兵是在哪里吃了这亏？”询问街上百姓，众人也茫然不知。他好奇心起，远远跟随，见众官兵进了威果第六指挥所的营房。

到了夜间，他悄悄摸进指挥所内，抓了一名官兵出来，拖到旁边小巷中喝问。那官兵正睡得胡里胡涂，突然利刃加颈，哪敢有丝毫隐瞒，当即把牛家村捉拿郭、杨二人之事照实说了。丘处机不迭声的叫苦，只听那兵士说，郭啸天已当场格毙，杨铁心身受重伤，不知下落，多半也是不活的了；又说郭杨二人的妻子倒活捉了来，可是走到半路，竟有一彪人马冲出来，胡里胡涂打了一场，官兵吃了老大的亏。丘处机只听得悲愤无已，但想那小兵奉命差遣，身不由己，也不拿他出气，只问：“你们上官是谁？”那小官道：“指挥大人他……他……姓段……官名……官名叫作天德。”丘处机放了小兵，摸到指挥所内去找那段天德，却遍寻不获。

次日一早，指挥所前的竿子上高高挂出一颗首级，号令示众。丘处机看时，赫然便是新交朋友郭啸天的头颅，心中又难过，又气恼，心道：“丘处机啊丘处机，这两位朋友是忠义之后，好意请你饮酒，你却累得他们家破人亡。你若不为他们报仇雪恨，还称得上是什么男子汉大丈夫？”愤恨中拾起一块石头，把指挥所前的旗杆石打得石屑纷飞。

好容易守到半夜，他爬上长竿，把郭啸天的首级取下，奔到西湖边上，挖了一坑，把首级埋了，拜了几拜，洒泪祝祷：“贫道当日答允传授两位后裔武艺，贫道生平言出必践，如不将你们的后人调教为英雄人物，他日黄泉之下，没面目跟两位相见。”心下盘算，首先要找到那段天德，杀了他为郭杨两人报仇，然后去救出两人妻子，妥善安顿，天可怜见生下两个遗腹子来，好给两位好汉留下后代。

他接连两晚暗闯威果第六指挥所，却都未能找到指挥使段天德。想是此人贪图安逸、不守军纪，不宿在营房之中与士卒同甘同苦。第三日辰牌时分，他径到指挥所辕门之外，大声喝道：“段天德在哪里，快给我滚出来！”

段天德为了郭啸天的首级被盗，正在营房中审讯郭啸天的妻子李萍，要她招认丈夫有什么大胆不法的朋友，忽听得营外闹成一片，探头从窗口向外张望，只见一个长大道士威风凛凛的手提两名军士，横扫直劈，只打得众兵丁叫苦连天。军佐一叠连声的喝叫：“放箭！”仓卒之际，众官兵有的找到了弓，寻不着箭，有的拿到了箭，却又不知弓在何处。

段天德大怒，提起腰刀，直抢出去，喝道：“造反了么？”挥刀往丘处机腰里横扫过去。丘处机见是一名军官，抛下手中军士，不闪不架，左手探出，抢前抓住了他手腕，喝问：“段天德这狗贼在哪里？”

段天德手上剧痛，全身酸麻，忙道：“道爷要找段大人么？他……他在西湖船里饮酒，也不知今天回不回来。”丘处机信以为真，松开了手。段天德向两名军士道：“你们快带领这位道爷，到湖边找段指挥去。”两名军士尚未领悟，段天德喝道：“快去，快去，莫惹道爷生气。”两名军士这才会意，转身走出。丘处机跟了出去。

段天德哪里还敢停留，忙带了几名军士，押了李萍，急奔雄节第八指挥所来。那指挥使和他是酒肉至交，闻讯大怒，正要点兵去擒杀恶道，突然营外喧哗声起，报称一个道士打了进来，想必带路的军士受逼不过，将段天德的常到之处说了出来。

段天德是惊弓之鸟，也不多说，带了随从与李萍便走，这次是去投城外全捷第二指挥所。那指挥所地处偏僻，丘处机一时找他不到。段天德惊魂稍定，想起那道人在千百军士中横冲直撞的威势，当真不寒而栗。这时手腕起始剧痛，越肿越高，找了个军营中的跌打医生来一瞧，腕骨竟给捏断了两根。上了夹板敷药之后，当晚不敢回家，便住在全捷第二指挥所内。睡到半夜，营外喧扰起来，说是守岗的军士忽然不见了。

段天德惊跳起来，心知那军士定是给道士掳了去逼问，自己不论躲往何处军营，他总能找上门来，打是打不过，躲又躲不开，那可如何是好？这道士已跟自己朝过了相，只冲着自己一人而来，军营中官兵虽多，却未必能保护周全。惶急中突然想起，伯父在云栖寺出家，他武功了得，不如投奔他去；又想那道士找自己为难，定与郭啸天一案有关，如把李萍带在身边，危急时以她为要挟，那恶道便不敢贸然动手，当下逼迫李萍换上军士装束，拉着她从营房后门溜了出去，黑夜中七高八低的往云栖寺来。

他伯父出家已久，法名枯木，是云栖寺的住持，以前本是军官，武功出自浙闽交界处仙霞派的嫡传，属于少林派旁支。他素来不齿段天德为人，不与交往，见他夤夜狼狈逃来，甚为诧异，冷冷的问道：“你来干什么？”

段天德知道伯父一向痛恨金兵，要是说了实情，自认会同金兵去捕杀郭杨二人，只怕伯父立时便杀了自己，因此在路上早已想妥了一套说辞，见伯父神色不善，忙跪下磕头，连称：“侄儿给人欺侮了，求伯父作主。”

枯木道：“你在营里当官，不去欺侮别人，人家已谢天谢地啦，又有谁敢欺侮你啦？”段天德知道越将自己说得不堪，越易取信，连称：“侄儿该死，该死。前日侄儿和几个朋友，到清冷桥西的瓦子去玩耍……”枯木鼻中哼了一声，脸色登时大为不愉。原来宋朝的妓院称为“瓦舍”，或称“瓦子”，取其“来时瓦合，去时瓦解”之义，意思是说易聚易散。

段天德又道：“侄儿有个素日相好的粉头，这天正在唱曲子陪侄儿饮酒，忽然有个道人进来，说听她曲子唱得好，定要叫她过去相陪……”枯木怫然不悦，道：“胡说！出家人又怎会到这等下流所在去？”段天德道：“是啊，侄儿当下就出言嘲讽，命他出去。那道人凶恶得紧，反骂侄儿指日就要身首异处，却在这里胡闹。”枯木道：“什么身首异处？”段天德道：“他说金兵不日渡江南下，要将咱们大宋官兵杀得干干净净。”

枯木勃然怒道：“他如此说来？”段天德道：“是。也是侄儿脾气不好，跟他争吵，说道金兵倘若渡江南下，我们拼命死战，也未必便输了。”这句话好生迎合枯木的心意，只听得他连连点头，觉得这侄儿自从出得娘胎，惟有这句话最像人话。段天德见他点头，心下暗喜，说道：“两人说到后来，便打将起来，侄儿不是这恶道的敌手。他一路追赶，侄儿无处逃避，只得来向伯父求救。”枯木摇头道：“我是出家人，不来理会你们这些争风吃醋的丑事。”段天德哀求道：“只求伯父救命，以后决不敢了。”

枯木想起兄弟昔日之情，又恼那道人出言无状，便道：“好，你就在寺里客舍住几日避他一避。可不许胡闹。”段天德连连答应。枯木叹道：“一个做军官的，却如此没用。当真金兵渡江来攻，那如何得了？唉，想当年，我……”

李萍受了段天德的挟制威吓，在一旁听着他肆意撒谎，却不敢出一句声。

这天下午申牌时分，知客僧奔进来向枯木禀报：“外面有个道人，大叫大嚷的好不凶恶，口口声声要段……段长官出去。”

枯木把段天德叫来。段天德惊道：“是他，正是他。”枯木道：“这道人如此凶狠，他是哪一门哪一派的？”段天德道：“不知是哪里来的野道士，也不见武功有什么了不起，只不过膂力大些，侄儿无用，抵敌不住。”枯木道：“好，我去会会。”来到大殿。

丘处机正要闯进内殿，监寺拼命拦阻，却拦不住。枯木走上前去，在丘处机臂上轻轻一推，潜用内力，想把他推出殿去，哪知这一推犹如碰在棉花堆里，心知不妙，正想收力，已来不及了，身不由主的直跌出去，蓬的一声，背心撞上供桌，喀喇喇几声响，供桌给撞塌了半边，桌上香炉、烛台纷纷跌落。

枯木大惊，叫道：“道长光临敝寺，有何见教？”丘处机道：“我来找一个姓段的恶贼。”枯木自知不是他敌手，说道：“出家人慈悲为怀，道长何必跟俗人一般见识？”

丘处机不理，大踏步走向殿内。这时段天德早已押着李萍躲入密室。云栖寺香火甚盛，其时正是春天进香季节，四方来的善男信女络绎不绝。丘处机不便强搜，冷笑数声，退了出去。

段天德从隐藏之处出来。枯木怒道：“什么野道士了？如不是他手下容情，我一条老命早不在了。”段天德道：“这恶道多半是金人派来的细作，否则怎么定要跟咱们大宋军官为难？”知客僧回来禀报，说道人已经走了。枯木道：“他说些什么？”知客僧道：“他说本寺若不交出那个……那个段长官，他决不罢休。”

枯木向段天德怒视一眼，说道：“你说话不尽不实，我也难以深究。只是这道人武功实在太强，你若落入他手，性命终究难保。”沉吟半晌，道：“你在这里不能耽了。我师弟焦木禅师功力远胜于我，只有他或能敌得住这道人，你到他那里去避一避吧。”段天德讨了书信，连夜雇船往嘉兴来，投奔法华寺住持焦木大师。

焦木怎知他携带的随从竟是个女子，既有师兄书信，便收留了。哪知丘处机查知踪迹，跟着追来，在法华寺墙外窥向后园，正见到段天德拉着李萍，李萍怒骂，和他厮打，丘处机认出是郭啸天的遗孀，跃进后园要救人时，段天德已将李萍拉入了地窖。丘处机还道包惜弱也给藏在寺内，遍寻不见，定要焦木交出人来。他是亲眼所见，不管焦木如何解说，他总是不信。两人越说越僵，丘处机一显武功，焦木知道难敌，他与江南七怪素来交好，便约丘处机在醉仙楼上见面。丘处机那口大铜缸，便是从法华寺里取来的。待得在醉仙楼头撞到金兵，丘处机误会更深。

焦木于此中实情，所知自甚有限，与江南七怪出得酒楼，同到法华寺，说了师兄枯木禅师荐人前来之事，又道：“素闻全真七子武功了得，已得当年重阳真人真传，其中长春子尤为杰出，果然名不虚传。这人虽鲁莽了些，但看来也不是无理取闹之人，与老衲无怨无仇，中间定有重大误会。”

全金发道：“还是把令师兄荐来的那两人请来，仔细问问。”焦木道：“不错，我也没好好盘问过他们。”正要差人去请段天德，柯镇恶道：“那丘处机性子好不暴躁，一上来便声势汹汹，浑没把咱们江南武林人物瞧在眼里。他全真派在北方称雄，到南方来也想横行霸道，那可不成。这误会要是解说不了，不得不凭武功决胜，咱们一对一的跟他动手，谁也抵挡不住。他是善者不来，来者不善……”朱聪道：“咱们跟他来个一拥齐上！”韩宝驹道：“八人打他一个？未免不是好汉。”全金发道：“咱们又不是要伤他性命，只不过叫他平心静气的听焦木大师说个清楚。”韩小莹道：“江湖上传言出去，说焦木大师和江南七怪以多欺少，岂不是坏了咱们名头？”

八人议论未决，忽听得大殿上震天价一声巨响，似是两口巨钟互相撞击，众人耳中嗡嗡嗡的好一阵不绝。柯镇恶一跃而起，叫道：“来啦！”

八人奔至大殿，又听得一声巨响，还夹着金铁破碎之声。只见丘处机托着铜缸，正在敲撞大殿上悬着的那口铁钟，数击之下，铜缸已出现裂口。那道人胡须戟张，圆睁双眼，怒不可抑。江南七怪不知丘处机本来也非如此蛮不讲理之人，只因他连日追寻段天德不得，怒火与日俱增，更将平素憎恨金兵之情，加在一起。七怪却道他恃强欺人，决意和他大拼一场。全真七子威名越盛，七怪越不肯忍让，倘若丘处机只是个无名之辈，反易于分说了。

韩宝驹叫道：“七妹，咱兄妹先上。”他是韩小莹的堂兄，性子最急，唰的一声，腰间一条金龙鞭已握在手中，一招“风卷云残”，疾往丘处机托着铜缸的右手手腕上卷去。韩小莹也抽出长剑，径往丘处机后心刺到。丘处机前后受敌，右手回转，当的一声，金龙鞭打上铜缸，同时身子略侧，已让过了后心来剑。

古时吴越成仇，越王勾践卧薪尝胆，相图吴国。吴王手下大将伍子胥，联同军师孙武子，训练的士卒精锐异常，指挥得宜，越兵便不敌吴卒。有一日越国忽然来了个美貌少女，剑术精妙，越国大臣范蠡便请她教导越兵剑法，终于以此灭了吴国。嘉兴是当年吴越交兵之处，这套越女剑法就在此流传下来。越国处女当日教给兵卒的剑法旨在上阵决胜，斩将刺马颇为有用，但以之与江湖上武术名家相斗，就嫌不够轻灵翔动。到得唐朝末叶，嘉兴出了一位剑术名家，依据古剑法要旨而再加创新，于锋锐之中另蕴复杂变化。韩小莹从师父处学得了，虽造诣未精，剑招却已颇为不凡，她的外号“越女剑”便由剑法之名而得。

数招一过，丘处机看出她剑法奥妙，当下以快打快。她剑法快，丘处机出手更快，右手以铜缸挡住韩宝驹的金龙鞭，左掌着着抢快，硬打硬拿，要强行夺取韩小莹手中长剑。片刻之间，韩小莹倏遇险招，给逼得退到了佛像之旁。

南山樵子南希仁和笑弥陀张阿生一个手持纯钢扁担，一个挺起屠牛尖刀，上前夹攻。酣战中丘处机突飞左掌，往张阿生面门劈到。张阿生后仰相避，哪知他这一招乃是虚招，右足突然飞出，张阿生手腕一疼，尖刀脱手飞出，他拳术上造诣远胜兵刃，尖刀脱手，竟不在意，左腿略挫，右掌虚晃，呼的一声，左拳猛击而出，劲雄势急。

丘处机赞道：“好！”侧身避开，连叫：“可惜！可惜！”张阿生问道：“可惜什么？”丘处机道：“可惜你一身好功夫，却自甘堕落，既与恶僧为伍，又去作金兵走狗。”张阿生大怒，喝道：“蛮不讲理的贼道士，你才作金兵走狗！”呼呼呼连击三拳。丘处机身子后缩，铜缸斜转，当当两声，张阿生接连两拳都打上了铜缸。

朱聪见己方四人联手，仍处下风，向全金发一招手，二人从两侧攻上。全金发使的是一杆大铁秤，秤杆使的是长枪和杆棒路子，秤钩飞出去可以钩人，犹如飞抓，秤锤则是一个链子锤，一件兵器有三般用途。朱聪擅于点穴之术，破油纸扇的扇骨乃是钢铸，将扇子当作了点穴橛，在各人兵器飞舞中找寻对方穴道。

丘处机的铜缸回旋转侧，宛如一个大盾牌，挡在身前，各人的兵器又怎攻得进去？他左手擒拿劈打，却又乘隙反袭。那沉重的铜缸拿在手中，身法虽难灵动，但以寡敌众，由此而尽挡敌人来招，毕竟利胜于弊。

焦木见众人越打越猛，心想时刻一久，双方必有损伤，急得大叫：“各位住手，请听我一言。”但众人斗发了性，却哪里收得住手？

丘处机喝道：“下流东西，谁来听你胡说？瞧我的！”突然间左手拳掌并用，变化多端，连下杀手，酣斗中蓦地飞出一掌，猛向张阿生肩头劈去，这一掌“天外飞山”去势奇特，迅捷异常，眼见张阿生无法避开。焦木叫道：“道长休下杀手！”

但丘处机与六人拼斗，对方个个都是能手，实已颇感吃力，斗得久了，只怕支持不住，而且对方尚有两人虎视在旁，随时都会杀入，那时自己只怕要葬身在这江南古刹之中了，此刻好容易抓到敌方破绽，岂肯容情，这一掌竟使上了十成力。

张阿生练就了一身铁布衫横练功夫，在屠房里常脱光衣衫，与蛮牛相撞角力为戏，全身又粗又硬，直如包了一层牛皮相似。他知对方这掌劈下来非同小可，但既已闪架不及，运气于肩，猛喝一声：“好！”硬接了他这一掌，只听得喀喇一声，上臂竟给他蕴蓄全真派上乘内功的这一掌生生击断。

朱聪一见大惊，铁骨扇穿出，疾往丘处机“璇玑穴”点去，这招以攻为守，生怕五弟受伤之后，敌人继续追击。

丘处机打伤一人，精神一振，在兵器丛中单掌犹如铁爪般连续进招。全金发“啊哟”声中，秤锤已给他抓住。丘处机回力急夺，全金发力气不及，让他拉近了两尺。丘处机侧过铜缸，挡在南希仁与朱聪面前，左掌发劲，往全金发天灵盖直击下去。

韩宝驹与韩小莹大惊，双双跃起，两般兵刃疾向丘处机头顶击落。丘处机只得闪身避开。全金发乘机窜出，这一下死里逃生，只吓得全身冷汗，但腰眼里还是给踹中了一脚，剧痛彻骨，滚在地上再也站不起来。

焦木本来不想出手，只盼设法和丘处机说明误会，可是眼见邀来相助的朋友纷纷受伤，自己是正主儿，不能不上，卷起袍袖，挺出一段乌焦的短木，往丘处机腋下点去。丘处机心想：“原来这和尚也是个点穴能手，出手不凡。”凝神对付。

柯镇恶听得五弟六弟受伤不轻，挺起铁杖，便要上前助战。全金发叫道：“大哥，发铁菱吧！打‘晋’位，再打‘小过’！”叫声未歇，飕飕两声，两件暗器一先一后往丘处机眉心与右胯飞到。

丘处机吃了一惊，心想目盲之人也会施发暗器，而且打得部位如此之准，真是罕见罕闻，虽有旁人以伏羲六十四卦的方位指点，终究也算甚难，铜缸斜转，当当两声，两只铁菱都落入了缸内。这铁菱是柯镇恶的独门暗器，四面有角，就如菱角一般，但尖角锋锐，可不似他故乡南湖中的没角菱了，这是他双眼未盲之时所练成的绝技，暗器既沉，手法又准。丘处机接了两只铁菱，铜缸竟然晃动，心道：“这瞎子好大手劲！”

这时韩氏兄妹、朱聪、南希仁等都已避在一旁。全金发不住叫唤：“打‘中孚’、打‘离’位！……好，现下道士踏到了‘明夷’……”他这般呼叫方位，跟柯镇恶是多年来练熟了的，以自己一对眼睛代作义兄之眼，六兄妹中也只他一人有此能耐。

柯镇恶闻声发菱，犹如亲见，霎时间接连打出了十几枚铁菱，把丘处机逼得不住倒退招架，再无还手余暇，可是也始终伤他不到。

柯镇恶心念一动：“他听到了六弟的叫喊，先有了防备，自然打他不中了。”这时全金发声音越来越轻，叫声中不住夹着呻吟，想是伤痛甚烈，而张阿生竟一声不作，不知生死如何。只听全金发道：“打……打……他……‘同人’。”柯镇恶这次却不依言，双手一扬，四枚铁菱一齐飞出，两枚分打“同人”之右的“节”位、“损”位，另外两枚分打“同人”之左的“丰”位、“离”位。

丘处机向左跨一大步，避开了“同人”的部位，没料到柯镇恶竟会突然用计，只听两个人同声惊呼。

丘处机右肩中了一菱，另外对准“损”位发出的一菱，却打在韩小莹背心。

柯镇恶又惊又喜，喝道：“七妹，快来！”韩小莹知大哥的暗器喂得有毒，忙抢到他身边。柯镇恶从袋里摸出一颗黄色药丸，塞在她口里，道：“去睡在后园子泥地上，不可动弹，等我来给你治伤。”

        // 初始化函数
        function init() {
            const contentElement = document.getElementById('content');
            const sentences = contentText.split(/(?<=[。！？；\n])/);
            
            sentences.forEach(sentence => {
                if (sentence.trim() === '') return;
                
                const sentenceDiv = document.createElement('div');
                sentenceDiv.className = 'sentence';
                
                // 为每个汉字添加拼音功能
                const chars = Array.from(sentence);
                chars.forEach(char => {
                    const charSpan = document.createElement('span');
                    charSpan.className = 'char';
                    charSpan.textContent = char;
                    
                    // 添加点击事件显示拼音
                    charSpan.addEventListener('click', function() {
                        // 移除其他汉字的高亮
                        document.querySelectorAll('.char.highlight').forEach(el => {
                            el.classList.remove('highlight');
                        });
                        
                        // 高亮当前汉字
                        this.classList.add('highlight');
                        
                        // 获取拼音并朗读
                        const pinyin = pinyinDict[char] || '?';
                        speakText(char, 0.8);
                        
                        // 显示拼音提示
                        showPinyinTooltip(this, pinyin);
                    });
                    
                    sentenceDiv.appendChild(charSpan);
                });
                
                // 添加句子朗读按钮
                const playBtn = document.createElement('span');
                playBtn.className = 'play-btn';
                playBtn.textContent = '🔊';
                playBtn.title = '朗读此句';
                playBtn.addEventListener('click', function() {
                    speakText(sentence, 1);
                });
                
                sentenceDiv.appendChild(playBtn);
                contentElement.appendChild(sentenceDiv);
            });
            
            // 全文朗读按钮
            document.getElementById('readAllBtn').addEventListener('click', function() {
                speakText(contentText, 1);
            });
            
            // 选中内容朗读
            document.getElementById('readSelectionBtn').addEventListener('click', function() {
                const selectedText = document.getElementById('selectedText').textContent;
                if (selectedText) {
                    speakText(selectedText, 1);
                }
            });
            
            // 文本选择事件
            document.addEventListener('selectionchange', function() {
                const selection = window.getSelection();
                const selectedText = selection.toString().trim();
                
                if (selectedText) {
                    document.getElementById('selectedText').textContent = selectedText;
                    document.getElementById('selectionInfo').style.display = 'block';
                } else {
                    document.getElementById('selectionInfo').style.display = 'none';
                }
            });
        }

        // 显示拼音提示
        function showPinyinTooltip(element, pinyin) {
            // 移除现有提示
            const existingTooltip = document.querySelector('.pinyin-tooltip');
            if (existingTooltip) {
                existingTooltip.remove();
            }
            
            // 创建新提示
            const tooltip = document.createElement('div');
            tooltip.className = 'pinyin-tooltip';
            tooltip.textContent = pinyin;
            tooltip.style.position = 'absolute';
            tooltip.style.background = '#333';
            tooltip.style.color = 'white';
            tooltip.style.padding = '5px 10px';
            tooltip.style.borderRadius = '4px';
            tooltip.style.zIndex = '1000';
            tooltip.style.fontSize = '14px';
            
            document.body.appendChild(tooltip);
            
            // 定位提示
            const rect = element.getBoundingClientRect();
            tooltip.style.left = `${rect.left + window.scrollX}px`;
            tooltip.style.top = `${rect.top + window.scrollY - 30}px`;
            
            // 2秒后自动移除提示
            setTimeout(() => {
                tooltip.remove();
            }, 2000);
        }

        // 语音合成函数
        function speakText(text, rate) {
            // 检查浏览器是否支持语音合成
            if (!('speechSynthesis' in window)) {
                alert('您的浏览器不支持语音合成功能，请使用Chrome、Edge或Safari浏览器。');
                return;
            }
            
            // 停止当前语音
            window.speechSynthesis.cancel();
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = document.getElementById('voiceSelect').value;
            utterance.rate = parseFloat(document.getElementById('speedSelect').value) * rate;
            
            // 开始朗读
            window.speechSynthesis.speak(utterance);
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', init);
    </script>
