<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        :root {
            --bg: #f5f0e8;
            --text: #2c2416;
            --accent: #8b4513;
            --hover-bg: #fff8e7;
            --border: #c4a97d;
            --sentence-bg: #fdfaf3;
            --ruby-color: #a0522d;
            --btn-bg: #8b4513;
            --btn-hover: #6b3410;
            --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            --tooltip-bg: #2c2416;
            --tooltip-text: #f5efe0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #f5f0e8 0%, #ede4d3 30%, #f3ece0 60%, #e8ddc8 100%);
            font-family: "Noto Serif SC", "Songti SC", "SimSun", "STSong", "华文宋体", "Georgia", "Times New Roman", serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 2rem 1rem 4rem;
            color: var(--text);
            line-height: 2.2;
        }

        .container {
            max-width: 1100px;
            width: 100%;
            background: rgba(255, 252, 245, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 2.5rem 2rem;
            box-shadow: var(--card-shadow), 0 0 0 1px rgba(180, 140, 100, 0.15);
            border: 1px solid rgba(180, 140, 100, 0.2);
        }

        h1 {
            text-align: center;
            font-size: 1.8rem;
            font-weight: 600;
            color: #5c3a1e;
            margin-bottom: 0.3rem;
            letter-spacing: 0.08em;
            font-family: "Noto Serif SC", "STSong", serif;
        }

        .subtitle {
            text-align: center;
            font-size: 0.95rem;
            color: #8b7355;
            margin-bottom: 2rem;
            letter-spacing: 0.05em;
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            flex-wrap: wrap;
            margin-bottom: 1.8rem;
            font-size: 0.85rem;
            color: #7a6248;
        }
        .legend span {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            background: rgba(255, 248, 235, 0.6);
            padding: 0.35rem 0.9rem;
            border-radius: 20px;
            border: 1px solid #dcc8a8;
        }
        .legend .icon {
            font-style: normal;
            font-size: 1rem;
        }
        .legend .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 2px;
        }
        .dot.chinese {
            background: #b87333;
        }
        .dot.english {
            background: #3a6b8c;
        }

        .divider {
            border: none;
            border-top: 1px dashed #d4bfa0;
            margin: 1.5rem 0;
            opacity: 0.7;
        }
        .divider.thin {
            margin: 1rem 0;
            border-top-style: dotted;
            opacity: 0.5;
        }

        .section-label {
            font-size: 0.9rem;
            font-weight: 600;
            color: #8b6914;
            letter-spacing: 0.1em;
            margin-bottom: 0.8rem;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .section-label::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(to right, #c4a97d, transparent);
        }

        /* ---------- 中文段落（带拼音） ---------- */
        .chinese-block {
            background: rgba(255, 250, 240, 0.7);
            border-radius: 16px;
            padding: 2rem 1.8rem;
            margin-bottom: 2rem;
            border: 1px solid rgba(180, 140, 100, 0.25);
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.03);
            font-size: 1.95rem;
            line-height: 2.8;
            letter-spacing: 0.03em;
            text-align: justify;
        }

        /* ruby 悬停显示拼音 */
        .chinese-block ruby {
            ruby-align: center;
            cursor: default;
            transition: all 0.2s ease;
        }
        .chinese-block ruby rt {
            font-size: 0.85rem;
            font-weight: 400;
            color: var(--ruby-color);
            letter-spacing: 0;
            opacity: 0;
            transition: opacity 0.25s ease, transform 0.25s ease;
            transform: translateY(4px);
            font-family: "Noto Serif SC", "STKaiti", "KaiTi", "楷体", serif;
            user-select: none;
            pointer-events: none;
        }
        .chinese-block ruby:hover rt {
            opacity: 1;
            transform: translateY(0);
        }
        .chinese-block ruby:hover {
            background: rgba(210, 160, 100, 0.12);
            border-radius: 4px;
            padding: 0 2px;
        }

        /* ---------- 英文段落 ---------- */
        .english-block {
            background: rgba(245, 248, 252, 0.55);
            border-radius: 16px;
            padding: 2rem 1.8rem;
            border: 1px solid rgba(120, 150, 180, 0.2);
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.02);
        }

        .sentence-wrapper {
            display: flex;
            align-items: flex-start;
            gap: 0.6rem;
            margin-bottom: 1.2rem;
            padding: 0.8rem 1rem;
            border-radius: 12px;
            background: var(--sentence-bg);
            border: 1px solid rgba(180, 160, 130, 0.15);
            transition: background 0.3s, box-shadow 0.3s;
            flex-wrap: wrap;
        }
        .sentence-wrapper:hover {
            background: #fffdf7;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }
        .sentence-wrapper:last-child {
            margin-bottom: 0;
        }

        .sentence-text {
            flex: 1;
            font-size: 1.55rem;
            line-height: 2;
            color: #3b3b3b;
            min-width: 200px;
        }

        /* 英文单词可点击朗读 + 悬停显示释义 */
        .en-word {
            display: inline;
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 3px;
            padding: 1px 3px;
            margin: 0 1px;
            color: #2c3e50;
            position: relative;
            white-space: nowrap;
        }
        .en-word:hover {
            background: #d4e6f9;
            color: #1a3a5c;
            outline: 1px solid #8bb8d6;
            outline-offset: 1px;
        }
        .en-word:active {
            background: #b8d4f0;
            transform: scale(0.97);
        }
        .en-word::after {
            content: '🔊';
            font-size: 0.55rem;
            opacity: 0;
            margin-left: 2px;
            transition: opacity 0.2s;
            vertical-align: super;
            pointer-events: none;
        }
        .en-word:hover::after {
            opacity: 0.7;
        }

        /* 英文单词释义 tooltip */
        .en-word .word-tooltip {
            position: absolute;
            bottom: calc(100% + 8px);
            left: 50%;
            transform: translateX(-50%);
            background: var(--tooltip-bg);
            color: var(--tooltip-text);
            padding: 0.3rem 0.7rem;
            border-radius: 6px;
            font-size: 0.95rem;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.25s ease, transform 0.25s ease;
            transform: translateX(-50%) translateY(4px);
            z-index: 10;
            font-family: "Noto Serif SC", "STKaiti", "KaiTi", "楷体", serif;
            font-weight: 400;
            letter-spacing: 0.03em;
        }
        .en-word .word-tooltip::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border-width: 5px;
            border-style: solid;
            border-color: var(--tooltip-bg) transparent transparent transparent;
        }
        .en-word:hover .word-tooltip {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* 句子朗读按钮 */
        .btn-speak-sentence {
            flex-shrink: 0;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--btn-bg);
            color: #fff;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
            align-self: center;
            position: relative;
        }
        .btn-speak-sentence:hover {
            background: var(--btn-hover);
            transform: scale(1.08);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
        }
        .btn-speak-sentence:active {
            transform: scale(0.94);
            transition: transform 0.1s;
        }
        .btn-speak-sentence.speaking {
            animation: pulse 0.6s infinite alternate;
            background: #c0392b;
        }
        @keyframes pulse {
            from {
                box-shadow: 0 0 0 0 rgba(180, 60, 40, 0.6);
            }
            to {
                box-shadow: 0 0 0 14px rgba(180, 60, 40, 0);
            }
        }

        /* 工具提示 */
        .tooltip-hint {
            font-size: 0.75rem;
            color: #9b8b7a;
            text-align: center;
            margin-top: 0.8rem;
            font-style: italic;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .container {
                padding: 1.5rem 1rem;
            }
            .chinese-block {
                font-size: 1.1rem;
                padding: 1.5rem 1rem;
                line-height: 2.4;
            }
            .chinese-block ruby rt {
                font-size: 0.5rem;
            }
            .sentence-wrapper {
                flex-direction: column;
                align-items: stretch;
            }
            .btn-speak-sentence {
                align-self: flex-end;
                margin-top: 0.4rem;
            }
            .sentence-text {
                font-size: 0.95rem;
            }
            .en-word .word-tooltip {
                font-size: 0.7rem;
                padding: 0.25rem 0.5rem;
            }
        }

        @media (max-width: 480px) {
            .chinese-block {
                font-size: 1rem;
                line-height: 2.2;
                padding: 1rem 0.8rem;
            }
            h1 {
                font-size: 1.4rem;
            }
        }
    </style>
</head>

                    if (voices.length > 0) {
                        // 优先选择英语女声
                        const enVoice = voices.find(v => v.lang.startsWith('en') && v.name.includes('Female')) ||
                            voices.find(v => v.lang.startsWith('en-US')) ||
                            voices.find(v => v.lang.startsWith('en-GB')) ||
                            voices.find(v => v.lang.startsWith('en'));
                        resolve(enVoice || voices[0]);
                    } else {
                        speechSynthesis.onvoiceschanged = () => {
                            const newVoices = speechSynthesis.getVoices();
                            const enVoice = newVoices.find(v => v.lang.startsWith('en') && v.name.includes(

                                newVoices.find(v => v.lang.startsWith('en-US')) ||
                                newVoices.find(v => v.lang.startsWith('en-GB')) ||
                                newVoices.find(v => v.lang.startsWith('en'));
                            resolve(enVoice || newVoices[0]);
                        };
                    }
                });
            }

            async function speakWord(word) {
                // 取消当前正在播放的语音
                speechSynthesis.cancel();
                const voice = await getVoice();
                const utterance = new SpeechSynthesisUtterance(word);
                utterance.voice = voice;
                utterance.lang = 'en-US';
                utterance.rate = 0.9;
                utterance.pitch = 1;
                utterance.volume = 1;
                speechSynthesis.speak(utterance);
            }

            async function speakSentence(text, btnElement) {
                // 取消当前正在播放的语音
                speechSynthesis.cancel();
                const voice = await getVoice();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.voice = voice;
                utterance.lang = 'en-US';
                utterance.rate = 0.85;
                utterance.pitch = 1;
                utterance.volume = 1;

                // 按钮动画
                if (btnElement) {
                    btnElement.classList.add('speaking');
                    utterance.onend = () => {
                        btnElement.classList.remove('speaking');
                    };
                    utterance.onerror = () => {
                        btnElement.classList.remove('speaking');
                    };
                }

                speechSynthesis.speak(utterance);
            }

            // 预加载语音列表
            speechSynthesis.getVoices();
            if (speechSynthesis.onvoiceschanged !== undefined) {
                speechSynthesis.onvoiceschanged = () => {
                    speechSynthesis.getVoices();
                };
            }

            console.log('✅ 互動文本已就緒：懸停漢字顯示拼音 | 懸停英文單詞顯示釋義 | 點擊單詞或▶️按鈕朗讀');
        })();
    </script>

</body>
</html>
