<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>汉字部首初相识</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        
        body {
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
        }
        
        .container {
            display: flex;
            height: 100vh;
        }
        
        /* 左侧菜单 */
        .sidebar {
            width: 250px;
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            overflow-y: auto;
        }
        
        .category {
            margin-bottom: 20px;
        }
        
        .category-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            padding-bottom: 5px;
            border-bottom: 1px solid #34495e;
            display: flex;
            align-items: center;
        }
        
        .category-title .emoji {
            margin-right: 8px;
            font-size: 20px;
        }
        
        .radicals-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .radical-item {
            background-color: #34495e;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
            font-size: 16px;
        }
        
        .radical-item:hover {
            background-color: #3d566e;
        }
        
        /* 主内容区 */
        .main-content {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        
        /* 学习模式 */
        .learning-mode {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }
        
        .radicals-display {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .radical-card {
            width: 120px;
            height: 120px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.3s;
            position: relative;
            overflow: hidden;
        }
        
        .radical-card:hover {
            transform: translateY(-5px);
        }
        
        .radical-oracle {
            font-size: 48px;
            margin-bottom: 5px;
        }
        
        .radical-name {
            font-size: 16px;
            color: #333;
        }
        
        /* 弹窗 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal-content {
            background-color: white;
            border-radius: 10px;
            width: 600px;
            max-width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            position: relative;
        }
        
        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 28px;
            cursor: pointer;
            color: #7f8c8d;
        }
        
        .radical-info {
            text-align: center;
            margin-bottom: 25px;
        }
        
        .radical-big {
            font-size: 96px;
            margin: 15px 0;
            cursor: pointer;
            transition: transform 0.2s;
            line-height: 1;
        }
        
        .radical-big:hover {
            transform: scale(1.1);
        }
        
        .radical-pinyin {
            font-size: 28px;
            color: #e74c3c;
            margin-bottom: 15px;
        }
        
        .radical-meaning {
            font-size: 22px;
            margin-bottom: 12px;
        }
        
        .radical-meaning-en {
            font-size: 18px;
            color: #555;
            font-style: italic;
            margin-bottom: 20px;
        }
        
        .radical-origin {
            font-size: 18px;
            color: #555;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        
        .example-words {
            margin-top: 30px;
        }
        
        .example-title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #2c3e50;
        }
        
        .words-list {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .word-item {
            font-size: 48px;
            padding: 10px 20px;
            background-color: #f1f1f1;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            text-align: center;
            min-width: 80px;
        }
        
        .word-item:hover {
            background-color: #3498db;
            color: white;
        }
        
        .word-pinyin {
            position: absolute;
            bottom: -30px;
            left: 0;
            right: 0;
            font-size: 18px;
            color: #e74c3c;
            display: none;
            font-weight: bold;
        }
        
        .word-item:hover .word-pinyin {
            display: block;
        }
        
        /* 例字详细信息弹窗 */
        .example-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1001;
            justify-content: center;
            align-items: center;
        }
        
        .example-modal-content {
            background-color: white;
            border-radius: 10px;
            width: 500px;
            max-width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            position: relative;
        }
        
        .example-big {
            font-size: 72px;
            margin: 10px 0;
            cursor: pointer;
            text-align: center;
        }
        
        .example-pinyin {
            font-size: 24px;
            color: #e74c3c;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .example-info-section {
            margin-bottom: 20px;
        }
        
        .example-info-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #2c3e50;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .example-info-content {
            font-size: 16px;
            line-height: 1.6;
            color: #555;
            padding-left: 10px;
        }
        
        .speak-btn {
            cursor: pointer;
            color: #3498db;
            font-size: 20px;
            transition: color 0.3s;
        }
        
        .speak-btn:hover {
            color: #2980b9;
        }
        
        .example-word-item {
            background-color: #f1f1f1;
            padding: 8px 15px;
            border-radius: 6px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .example-word-item:hover {
            background-color: #3498db;
            color: white;
        }
        
        .example-sentence-item {
            background-color: #f9f9f9;
            padding: 10px 15px;
            border-radius: 6px;
            margin-bottom: 10px;
            cursor: pointer;
            border-left: 4px solid #3498db;
            transition: background-color 0.3s;
        }
        
        .example-sentence-item:hover {
            background-color: #ecf0f1;
        }
        
        /* 练习模式 */
        .practice-mode {
            display: none;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }
        
        .practice-area {
            width: 100%;
            max-width: 900px;
            background-color: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 25px;
        }
        
        .target-areas {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 25px;
        }
        
        .target-area {
            flex: 1;
            min-width: 180px;
            background-color: #ecf0f1;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            min-height: 120px;
        }
        
        .target-radical {
            font-size: 48px;
            margin-bottom: 15px;
        }
        
        .target-name {
            font-size: 18px;
            color: #333;
        }
        
        .words-to-sort {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            background-color: #f9f9f9;
            padding: 20px;
            border-radius: 10px;
            min-height: 150px;
        }
        
        .word-to-sort {
            font-size: 36px;
            padding: 12px 20px;
            background-color: #3498db;
            color: white;
            border-radius: 8px;
            cursor: move;
            user-select: none;
        }
        
        .word-to-sort:hover {
            background-color: #2980b9;
        }
        
        .controls {
            display: flex;
            gap: 20px;
            margin-top: 25px;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .btn-primary {
            background-color: #3498db;
            color: white;
        }
        
        .btn-primary:hover {
            background-color: #2980b9;
        }
        
        .btn-success {
            background-color: #2ecc71;
            color: white;
        }
        
        .btn-success:hover {
            background-color: #27ae60;
        }
        
        .btn-warning {
            background-color: #f39c12;
            color: white;
        }
        
        .btn-warning:hover {
            background-color: #d35400;
        }
        
        /* 反馈效果 */
        .feedback {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 96px;
            z-index: 1001;
            display: none;
        }
        
        .correct-feedback {
            color: #2ecc71;
        }
        
        .wrong-feedback {
            color: #e74c3c;
        }
        
        .sun-animation {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 120px;
            z-index: 1001;
            display: none;
            animation: sunPulse 1s ease-out;
        }
        
        @keyframes sunPulse {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
        
        /* 进度条 */
        .progress-container {
            width: 100%;
            max-width: 800px;
            background-color: #ecf0f1;
            border-radius: 10px;
            height: 25px;
            margin-bottom: 25px;
        }
        
        .progress-bar {
            height: 100%;
            border-radius: 10px;
            background-color: #3498db;
            width: 0%;
            transition: width 0.5s;
        }
        
        /* 开始学习按钮 */
        .start-learning-btn {
            margin: 25px 0;
            padding: 15px 30px;
            font-size: 20px;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .start-learning-btn:hover {
            background-color: #27ae60;
        }
        
        /* 响应式调整 */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            
            .sidebar {
                width: 100%;
                height: auto;
                max-height: 200px;
            }
            
            .radical-card {
                width: 90px;
                height: 90px;
            }
            
            .radical-oracle {
                font-size: 40px;
            }
            
            .modal-content {
                padding: 20px;
            }
            
            .radical-big {
                font-size: 72px;
            }
            
            .word-item {
                font-size: 36px;
            }
            
            .word-pinyin {
                bottom: -25px;
                font-size: 16px;
            }
            
            .example-modal-content {
                padding: 20px;
            }
            
            .example-big {
                font-size: 60px;
            }
        }
    </style>
</head>

    <script>
        // 部首数据 - 完整版 (60个常用部首)
        const radicalsData = {
            // 自然类 (20个)
            "日": {
                oracle: "☀️",
                pinyin: "rì",
                meaning: "与太阳、时间相关",
                meaningEn: "Related to sun or time",
                origin: "象形字，像太阳的形状",
                examples: ["晴", "明", "晒", "晨", "晚", "暖", "昨", "时", "晶", "映", "早", "春"]

            "月": {

                meaning: "与月亮相关",

                examples: ["明", "朋", "期", "朗", "朝", "望", "朦胧", "有", "服", "背"]
            },
            "氵": {
                oracle: "💧💧💧",
                pinyin: "shuǐ",

                meaningEn: "Related to water",

                examples: ["河", "湖", "海", "流", "泪", "汗", "洗", "澡", "泳", "漂", "江", "洋"]
            },
            "灬": {
                oracle: "🔥🔥🔥🔥",
                pinyin: "huǒ",

        const radicalExamples = {};
        for (const radical in radicalsData) {

        // 拼音数据

        // 当前学习的部首
        let currentRadicals = [];
        let learnedRadicals = [];
        let totalRadicals = Object.keys(radicalsData).length;
        
        // DOM元素
        const radicalsDisplay = document.getElementById('radicalsDisplay');
        const practiceBtn = document.getElementById('practiceBtn');
        const nextBtn = document.getElementById('nextBtn');
        const practiceMode = document.getElementById('practiceMode');
        const targetAreas = document.getElementById('targetAreas');
        const wordsToSort = document.getElementById('wordsToSort');
        const resetBtn = document.getElementById('resetBtn');
        const checkBtn = document.getElementById('checkBtn');
        const continueBtn = document.getElementById('continueBtn');
        const radicalModal = document.getElementById('radicalModal');
        const closeModal = document.getElementById('closeModal');
        const radicalInfo = document.getElementById('radicalInfo');
        const exampleWords = document.getElementById('exampleWords');
        const correctFeedback = document.getElementById('correctFeedback');
        const wrongFeedback = document.getElementById('wrongFeedback');
        const sunAnimation = document.getElementById('sunAnimation');
        const progressBar = document.getElementById('progressBar');
        const startLearningBtn = document.getElementById('startLearningBtn');
        const radicalItems = document.querySelectorAll('.radical-item');
        const exampleModal = document.getElementById('exampleModal');
        const closeExampleModal = document.getElementById('closeExampleModal');
        const exampleInfo = document.getElementById('exampleInfo');
        
        // 初始化
        function init() {
            // 设置事件监听器
            startLearningBtn.addEventListener('click', () => {
                // 随机选择5个部首开始学习
                selectRandomRadicals(5);
            });
            
            practiceBtn.addEventListener('click', startPractice);
            nextBtn.addEventListener('click', nextStep);
            resetBtn.addEventListener('click', resetPractice);
            checkBtn.addEventListener('click', checkAnswers);
            continueBtn.addEventListener('click', continueLearning);
            closeModal.addEventListener('click', () => {
                radicalModal.style.display = 'none';
            });
            
            closeExampleModal.addEventListener('click', () => {
                exampleModal.style.display = 'none';
            });
            
            // 点击模态框外部关闭
            window.addEventListener('click', (e) => {
                if (e.target === radicalModal) {
                    radicalModal.style.display = 'none';
                }
                if (e.target === exampleModal) {
                    exampleModal.style.display = 'none';
                }
            });
            
            // 点击左侧菜单中的部首
            radicalItems.forEach(item => {
                item.addEventListener('click', () => {
                    const radical = item.dataset.radical;
                    showRadicalInfo(radical);
                    
                    // 如果这个部首还没学过，添加到已学列表
                    if (!learnedRadicals.includes(radical)) {
                        learnedRadicals.push(radical);
                        updateProgress();
                        
                        // 显示学习区域
                        displayRadicals();
                    }
                });
            });
            
            // 更新进度条
            updateProgress();
        }
        
        // 随机选择部首
        function selectRandomRadicals(count) {
            const allRadicals = Object.keys(radicalsData);
            const availableRadicals = allRadicals.filter(r => !learnedRadicals.includes(r));
            
            // 如果已经学完所有部首，重置
            if (availableRadicals.length === 0) {
                learnedRadicals = [];
                return selectRandomRadicals(count);
            }
            
            // 选择不超过剩余部首数量的随机部首
            const selectCount = Math.min(count, availableRadicals.length);
            currentRadicals = [];
            
            for (let i = 0; i < selectCount; i++) {
                const randomIndex = Math.floor(Math.random() * availableRadicals.length);
                currentRadicals.push(availableRadicals[randomIndex]);
                availableRadicals.splice(randomIndex, 1);
            }
            
            displayRadicals();
        }
        
        // 显示部首卡片
        function displayRadicals() {
            radicalsDisplay.innerHTML = '';
            
            currentRadicals.forEach(radical => {
                const card = document.createElement('div');
                card.className = 'radical-card';
                card.innerHTML = `
                    <div class="radical-oracle">${radicalsData[radical].oracle}</div>
                    <div class="radical-name">${radical}</div>
                `;
                
                card.addEventListener('click', () => {
                    showRadicalInfo(radical);
                });
                
                radicalsDisplay.appendChild(card);
            });
            
            // 如果已经学习了3个或更多部首，启用练习按钮
            if (learnedRadicals.length >= 3) {
                practiceBtn.disabled = false;
            }
        }
        
        // 显示部首详细信息
        function showRadicalInfo(radical) {
            const data = radicalsData[radical];
            
            radicalInfo.innerHTML = `
                <div class="radical-big" onclick="speak('${radical}')">${radical}</div>
                <div class="radical-pinyin">${data.pinyin}</div>
                <div class="radical-meaning">${data.meaning}</div>
                <div class="radical-meaning-en">${data.meaningEn}</div>
                <div class="radical-origin">${data.origin}</div>
            `;
            
            // 显示例字
            exampleWords.innerHTML = '';
            data.examples.forEach(word => {
                const wordItem = document.createElement('div');
                wordItem.className = 'word-item';
                wordItem.innerHTML = `
                    ${word}
                    <div class="word-pinyin">${pinyinData[word] || ''}</div>
                `;
                
                // 点击例字显示详细信息
                wordItem.addEventListener('click', () => {
                    showExampleInfo(word);
                });
                
                exampleWords.appendChild(wordItem);
            });
            
            radicalModal.style.display = 'flex';
            
            // 如果这个部首还没学过，添加到已学列表
            if (!learnedRadicals.includes(radical)) {
                learnedRadicals.push(radical);
                updateProgress();
            }
        }
        
        // 显示例字详细信息
        function showExampleInfo(word) {
            // 获取例字数据
            const data = exampleData[word] || {
                pinyin: pinyinData[word] || "未知",
                examples: ["例词1", "例词2"],
                english: "English meaning",
                sentences: ["这是一个例句。", "这是另一个例句。"]
            };
            
            // 生成例词HTML
            const exampleWordsHTML = data.examples.map(example => 
                `<div class="example-word-item" onclick="speak('${example}')">${example}</div>`
            ).join('');
            
            // 生成例句HTML
            const exampleSentencesHTML = data.sentences.map(sentence => 
                `<div class="example-sentence-item" onclick="speak('${sentence}')">${sentence}</div>`
            ).join('');
            
            exampleInfo.innerHTML = `
                <div class="example-big" onclick="speak('${word}')">${word}</div>
                <div class="example-pinyin">${data.pinyin}</div>
                
                <div class="example-info-section">
                    <div class="example-info-title">
                        <span>例词</span>
                        <span class="speak-btn" onclick="speak('${data.examples.join(' ')}')">🔊</span>
                    </div>
                    <div class="example-info-content">
                        ${exampleWordsHTML}
                    </div>
                </div>
                
                <div class="example-info-section">
                    <div class="example-info-title">英文释义</div>
                    <div class="example-info-content">${data.english}</div>
                </div>
                
                <div class="example-info-section">
                    <div class="example-info-title">
                        <span>中文例句</span>
                        <span class="speak-btn" onclick="speak('${data.sentences.join(' ')}')">🔊</span>
                    </div>
                    <div class="example-info-content">
                        ${exampleSentencesHTML}
                    </div>
                </div>
            `;
            
            exampleModal.style.display = 'flex';
        }
        
        // 文本转语音
        function speak(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-CN';
                window.speechSynthesis.speak(utterance);
            } else {
                alert('您的浏览器不支持语音合成功能');
            }
        }
        
        // 开始练习
        function startPractice() {
            // 切换到练习模式
            document.querySelector('.learning-mode').style.display = 'none';
            practiceMode.style.display = 'flex';
            
            // 设置练习内容
            setupPractice();
        }
        
        // 设置练习内容
        function setupPractice() {
            // 清空目标区域和待分类字
            targetAreas.innerHTML = '';
            wordsToSort.innerHTML = '';
            
            // 选择3-5个已学部首进行练习
            const practiceRadicals = learnedRadicals.slice(-5);
            
            // 创建目标区域
            practiceRadicals.forEach(radical => {
                const area = document.createElement('div');
                area.className = 'target-area';
                area.dataset.radical = radical;
                area.innerHTML = `
                    <div class="target-radical">${radical}</div>
                    <div class="target-name">${radicalsData[radical].meaning}</div>
                `;
                
                // 设置拖放目标
                area.addEventListener('dragover', (e) => {
                    e.preventDefault();
                });
                
                area.addEventListener('drop', (e) => {
                    e.preventDefault();
                    const word = e.dataTransfer.getData('text/plain');
                    const radical = e.dataTransfer.getData('radical');
                    
                    // 检查是否正确
                    if (radical === area.dataset.radical) {
                        // 正确
                        area.appendChild(document.getElementById(word));
                        showFeedback(true);
                    } else {
                        // 错误
                        showFeedback(false);
                    }
                });
                
                targetAreas.appendChild(area);
            });
            
            // 收集所有例字
            let allExamples = [];
            practiceRadicals.forEach(radical => {
                const examples = radicalExamples[radical] || [];
                examples.forEach(word => {
                    allExamples.push({ word, radical });
                });
            });
            
            // 随机选择10-15个字进行练习
            const practiceWords = shuffleArray(allExamples).slice(0, 15);
            
            // 创建可拖拽的字
            practiceWords.forEach(item => {
                const wordElement = document.createElement('div');
                wordElement.className = 'word-to-sort';
                wordElement.textContent = item.word;
                wordElement.id = `word-${item.word}`;
                wordElement.draggable = true;
                wordElement.dataset.radical = item.radical;
                
                // 设置拖拽数据
                wordElement.addEventListener('dragstart', (e) => {
                    e.dataTransfer.setData('text/plain', wordElement.id);
                    e.dataTransfer.setData('radical', item.radical);
                });
                
                wordsToSort.appendChild(wordElement);
            });
        }
        
        // 显示反馈
        function showFeedback(isCorrect) {
            if (isCorrect) {
                correctFeedback.style.display = 'block';
                sunAnimation.style.display = 'block';
                
                setTimeout(() => {
                    correctFeedback.style.display = 'none';
                    sunAnimation.style.display = 'none';
                }, 1000);
            } else {
                wrongFeedback.style.display = 'block';
                
                setTimeout(() => {
                    wrongFeedback.style.display = 'none';
                }, 1000);
            }
        }
        
        // 重置练习
        function resetPractice() {
            setupPractice();
        }
        
        // 检查答案
        function checkAnswers() {
            // 检查是否所有字都已分类
            if (wordsToSort.children.length > 0) {
                alert('请将所有汉字分类到相应的部首区域！');
                return;
            }
            
            // 检查分类是否正确
            let allCorrect = true;
            const targetAreas = document.querySelectorAll('.target-area');
            
            targetAreas.forEach(area => {
                const radical = area.dataset.radical;
                const words = area.querySelectorAll('.word-to-sort');
                
                words.forEach(word => {
                    const correctRadical = word.dataset.radical;
                    if (correctRadical !== radical) {
                        allCorrect = false;
                        word.style.backgroundColor = '#e74c3c';
                    }
                });
            });
            
            if (allCorrect) {
                alert('恭喜！所有分类都正确！');
            } else {
                alert('有些分类不正确，请检查红色标记的字！');
            }
        }
        
        // 继续学习
        function continueLearning() {
            // 切换回学习模式
            practiceMode.style.display = 'none';
            document.querySelector('.learning-mode').style.display = 'flex';
            
            // 如果已经学完所有部首，显示完成消息
            if (learnedRadicals.length >= totalRadicals) {
                radicalsDisplay.innerHTML = `
                    <div style="text-align: center; width: 100%;">
                        <h2>恭喜！</h2>
                        <p>您已经完成了所有部首的学习！</p>
                        <div style="font-size: 72px;">🎉</div>
                        <button class="btn btn-primary" onclick="location.reload()">重新开始</button>
                    </div>
                `;
                practiceBtn.style.display = 'none';
                nextBtn.style.display = 'none';
            } else {
                // 选择新的部首学习
                selectRandomRadicals(5);
                nextBtn.style.display = 'none';
            }
        }
        
        // 下一步
        function nextStep() {
            selectRandomRadicals(5);
            nextBtn.style.display = 'none';
        }
        
        // 更新进度条
        function updateProgress() {
            const progress = (learnedRadicals.length / totalRadicals) * 100;
            progressBar.style.width = `${progress}%`;
            
            // 如果学习了足够多的部首，显示下一步按钮
            if (learnedRadicals.length >= 5) {
                nextBtn.style.display = 'block';
            }
        }
        
        // 打乱数组顺序
        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }
        
        // 初始化应用
        init();
        
        // 使speak函数全局可用
        window.speak = speak;
    </script>
