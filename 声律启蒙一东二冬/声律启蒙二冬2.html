<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>声律启蒙 · 二 冬 中</title>
    <style>
        /* 重置与基础样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "SimSun", "宋体", serif;
            background-color: #0f1c2d;
            color: #e0e0e0;
            line-height: 1.6;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background-image: linear-gradient(to bottom, #0f1c2d, #1a3658);
            min-height: 100vh;
            transition: all 0.3s ease;
        }
        
        .container {
            background-color: rgba(0, 0, 0, 0.7);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid #2a4b8d;
        }
        
        header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 2px solid #3a5ccc;
        }
        
        h1 {
            font-size: 2.8em;
            color: #fff;
            text-shadow: 0 0 15px #3a5ccc, 0 0 25px #3a5ccc;
            margin-bottom: 15px;
            letter-spacing: 5px;
        }
        
        .subtitle {
            font-size: 1.2em;
            color: #aac0e0;
            font-style: italic;
        }
        
        .control-panel {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .control-btn {
            padding: 12px 20px;
            background: linear-gradient(to bottom, #3a5ccc, #2a4b8d);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }
        
        .control-btn:hover, .control-btn:focus {
            background: linear-gradient(to bottom, #4a6ce4, #3a5ccc);
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
            outline: none;
        }
        
        .control-btn:active {
            transform: translateY(0);
        }
        
        .control-btn.active {
            background: linear-gradient(to bottom, #ffcc00, #ff9900);
            color: #000;
        }
        
        .section-divider {
            text-align: center;
            margin: 40px 0;
            color: #aac0e0;
            font-style: italic;
            font-size: 1.4em;
            text-shadow: 0 0 10px #3a5ccc;
        }
        
        .sentence {
            background: linear-gradient(to bottom, rgba(30, 45, 70, 0.8), rgba(20, 35, 60, 0.8));
            padding: 25px;
            margin-bottom: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
            border-left: 5px solid #3a5ccc;
        }
        
        .sentence p {
            margin: 0;
            color: #ffffff;
            text-align: justify;
            line-height: 2.2;
            font-size: 1.8em;
        }
        
        .character {
            position: relative;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-block;
            margin: 0 2px;
        }
        
        .character:hover, .character:focus {
            color: #ffcc00;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.7);
            transform: translateY(-3px);
            outline: none;
        }
        
        /* 声旁展示窗口样式 - 缩小10% */
        .radical-window {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(10, 25, 47, 0.95);
            border: 2px solid #ffcc00;
            border-radius: 18px;  /* 缩小10% */
            width: 702px;  /* 缩小10% */
            height: 702px; /* 缩小10% */
            z-index: 2000;
            box-shadow: 0 0 36px rgba(255, 204, 0, 0.4); /* 缩小10% */
            padding: 18px; /* 缩小10% */
        }
        
        .radical-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 117px;  /* 缩小10% */
            height: 117px; /* 缩小10% */
            background: linear-gradient(135deg, #1a1912, #1c1a18);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 4.68em; /* 缩小10% */
            font-weight: bold;
            color: #f1ecec;
            box-shadow: 0 0 36px #7e6d3ccc; /* 缩小10% */
            z-index: 10;
        }
        
        .radical-pinyin {
            font-size: 0.585em; /* 缩小10% */
            margin-top: 4.5px; /* 缩小10% */
            font-weight: bold;
        }
        
        .radical-char {
            position: absolute;
            width: 117px;  /* 缩小10% */
            height: 117px; /* 缩小10% */
            background: linear-gradient(135deg, #2f3545, #171b24);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 3.744em; /* 缩小10% */
            color: #fff;
            transition: all 0.3s;
            border: 2px solid #391685;
            box-shadow: 0 0 13.5px rgba(255, 204, 0, 0.5); /* 缩小10% */
            z-index: 5;
        }
        
        .radical-char:hover {
            background: linear-gradient(135deg, #ffcc00, #ff9900);
            color: #000;
            transform: scale(1.15);
            z-index: 15;
        }
        
        .char-pinyin {
            font-size: 0.468em; /* 缩小10% */
            margin-top: 1.8px; /* 缩小10% */
        }
        
        .char-example {
            font-size: 0.5265em; /* 缩小10% */
            color: #e2e7f0;
            text-align: center;
            margin-top: 1.8px; /* 缩小10% */
            padding: 0 2.7px; /* 缩小10% */
        }
        
        .close-btn {
            position: absolute;
            top: 13.5px; /* 缩小10% */
            right: 18px; /* 缩小10% */
            cursor: pointer;
            font-size: 46.8px; /* 缩小10% */
            color: #ffcc00;
            z-index: 2010;
        }
        
        .close-btn:hover, .close-btn:focus {
            color: #ff9900;
            transform: scale(1.1);
            outline: none;
        }
        
        /* 竖版样式 */
        body.vertical-layout {
            writing-mode: vertical-rl;
            text-orientation: upright;
            max-width: none;
            height: 100vh;
            padding: 20px 40px;
            overflow-x: auto;
            white-space: nowrap;
        }
        
        body.vertical-layout .container {
            display: inline-block;
            vertical-align: top;
            margin-right: 40px;
            margin-bottom: 0;
            width: auto;
            padding: 40px 30px;
        }
        
        body.vertical-layout .sentence {
            display: block;
            margin-bottom: 40px;
            padding: 30px 20px;
        }
        
        body.vertical-layout .sentence p {
            margin: 0;
            text-align: start;
            line-height: 1.8;
        }
        
        body.vertical-layout .control-panel {
            writing-mode: horizontal-tb;
            margin-bottom: 40px;
        }
        
        /* 响应式设计 */
        @media (max-width: 900px) {
            .radical-window {
                width: 90vw;
                height: 90vw;
            }
            
            .radical-center {
                width: 20vw;
                height: 20vw;
                font-size: 3em;
            }
            
            .radical-char {
                width: 15vw;
                height: 15vw;
                font-size: 2em;
            }
            
            .char-pinyin, .char-example {
                font-size: 0.5em;
            }
        }
        
        @media (max-width: 768px) {
            body {
                padding: 10px;
                font-size: 0.9em;
            }
            
            h1 {
                font-size: 2em;
            }
            
            .sentence p {
                font-size: 1.4em;
            }
            
            .char-pinyin, .char-example {
                display: none;
            }
        }
        
        /* 新增内容样式 */
        .additional-content {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #3a5ccc;
        }
        
        /* 键盘导航焦点样式 */
        .character:focus-visible {
            outline: 2px solid #ffcc00;
            outline-offset: 2px;
        }
    </style>
</head>

    <script>
        // 简繁体转换映射表
        const simplifiedToTraditional = {
            // 二冬中部分新增字
            '明': '明', '暗': '暗', '淡': '淡', '浓': '濃', '上': '上', '智': '智', '中': '中', '庸': '庸',
            '镜': '鏡', '奁': '奩', '衣': '衣', '笥': '笥', '野': '野', '杵': '杵', '村': '村', '舂': '舂',
            '花': '花', '灼': '灼', '烁': '爍', '草': '草', '蒙': '蒙', '茸': '茸', '九': '九', '夏': '夏',
            '三': '三', '冬': '冬', '台': '臺', '高': '高', '名': '名', '戏': '戲', '马': '馬', '斋': '齋',
            '小': '小', '号': '號', '蟠': '蟠', '龙': '龍', '手': '手', '擘': '擘', '蟹': '蟹', '螯': '螯',
            '从': '從', '毕': '畢', '卓': '卓', '身': '身', '披': '披', '鹤': '鶴', '氅': '氅', '自': '自',
            '王': '王', '恭': '恭', '五': '五', '老': '老', '峰': '峰', '秀': '秀', '插': '插', '云': '雲',
            '霄': '霄', '如': '如', '玉': '玉', '笔': '筆', '姑': '姑', '石': '石', '大': '大', '响': '響',
            '传': '傳', '风': '風', '雨': '雨', '若': '若', '金': '金', '镛': '鏞',
            // 原有字
            '对': '對', '春': '春', '秋': '秋', '暮': '暮', '鼓': '鼓', '晨': '晨', '钟': '鐘',
            '观': '觀', '山': '山', '玩': '玩', '水': '水', '绿': '綠', '竹': '竹', '苍': '蒼', 
            '松': '松', '冯': '馮', '妇': '婦', '虎': '虎', '叶': '葉', '公': '公', '龙': '龍', 
            '舞': '舞', '蝶': '蝶', '鸣': '鳴', '蛩': '蛩', '衔': '銜', '泥': '泥', '双': '雙', 
            '紫': '紫', '课': '課', '蜜': '蜜', '几': '幾', '黄': '黃', '蜂': '蜂', '园': '園', 
            '莺': '鶯', '恰': '恰', '塞': '塞', '外': '外', '雁': '雁', '雝': '雝', '秦': '秦', 
            '岭': '嶺', '云': '雲', '横': '橫', '迢': '迢', '递': '遞', '八': '八', '远': '遠', 
            '路': '路', '巫': '巫', '洗': '洗', '嵯': '嵯', '峨': '峨', '十': '十', '二': '二', 
            '危': '危', '峰': '峰'
        };

        const traditionalToSimplified = {};
        for (const [simp, trad] of Object.entries(simplifiedToTraditional)) {
            traditionalToSimplified[trad] = simp;
        }

        // 简繁体转换函数
        function convertToSimplified() {
            const elements = document.querySelectorAll('.character');
            elements.forEach(el => {
                const text = el.textContent;
                if (traditionalToSimplified[text]) {
                    el.textContent = traditionalToSimplified[text];
                    // 更新onclick事件中的参数
                    const onclickAttr = el.getAttribute('onclick');
                    if (onclickAttr) {
                        const params = onclickAttr.split("'");
                        if (params.length >= 5) {
                            params[1] = traditionalToSimplified[params[1]] || params[1];
                            params[3] = traditionalToSimplified[params[3]] || params[3];
                            el.setAttribute('onclick', params.join("'"));
                        }
                    }
                }
            });
            
            // 更新按钮状态
            document.getElementById('simplified-btn').classList.add('active');
            document.getElementById('traditional-btn').classList.remove('active');
        }

        function convertToTraditional() {
            const elements = document.querySelectorAll('.character');
            elements.forEach(el => {
                const text = el.textContent;
                if (simplifiedToTraditional[text]) {
                    el.textContent = simplifiedToTraditional[text];

        // 显示声旁窗口
        function showRadical(char, pinyin, simplifiedChar) {
            const window = document.getElementById('radical-window');
            const centerChar = document.getElementById('center-char');
            const centerPinyin = document.getElementById('center-pinyin');
            
            // 设置中心字符
            centerChar.textContent = char;
            centerPinyin.textContent = pinyin;
            
            // 清空之前的内容
            const existingChars = document.querySelectorAll('.radical-char');
            existingChars.forEach(el => el.remove());
            
            // 获取相关字符数据
            const data = radicalData[char];
            if (!data) return;
            
            // 创建相关字符
            const radius = 234; // 半径 - 缩小10%
            const centerX = 351; // 圆心X坐标 - 缩小10%
            const centerY = 351; // 圆心Y坐标 - 缩小10%
            
            data.chars.forEach((charData, index) => {
                const angle = (index / data.chars.length) * 2 * Math.PI;
                const x = centerX + radius * Math.cos(angle);
                const y = centerY + radius * Math.sin(angle);
                
                const charEl = document.createElement('div');
                charEl.className = 'radical-char';
                charEl.style.left = `${x - 58.5}px`; // 调整偏移量以适应缩小
                charEl.style.top = `${y - 58.5}px`;  // 调整偏移量以适应缩小
                
                charEl.innerHTML = `
                    <div>${charData.char}</div>
                    <div class="char-pinyin">${charData.pinyin}</div>
                    <div class="char-example">${charData.example}</div>
                `;
                
                window.appendChild(charEl);
            });
            
            // 显示窗口
            window.style.display = 'block';
        }

        // 关闭声旁窗口
        function closeRadical() {
            document.getElementById('radical-window').style.display = 'none';
        }

        // 点击窗口外部关闭窗口
        document.getElementById('radical-window').addEventListener('click', function(e) {
            if (e.target === this) {
                closeRadical();
            }
        });

        // 键盘导航支持
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeRadical();
            }
        });
    </script>
