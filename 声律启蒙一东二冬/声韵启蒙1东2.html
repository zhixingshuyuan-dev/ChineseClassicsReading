<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>声律启蒙 · 二冬</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "SimSun", "宋体", serif;
            background-color: #0f1c2d;
            color: #e0e0e0;
            line-height: 1.6;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background-image: linear-gradient(to bottom, #0f1c2d, #1a3658);
            min-height: 100vh;
            transition: all 0.3s ease;
        }
        
        .container {
            background-color: rgba(0, 0, 0, 0.7);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid #2a4b8d;
        }
        
        header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 2px solid #3a5ccc;
        }
        
        h1 {
            font-size: 2.8em;
            color: #fff;
            text-shadow: 0 0 15px #3a5ccc, 0 0 25px #3a5ccc;
            margin-bottom: 15px;
            letter-spacing: 5px;
        }
        
        .subtitle {
            font-size: 1.2em;
            color: #aac0e0;
            font-style: italic;
        }
        
        .control-panel {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .control-btn {
            padding: 12px 20px;
            background: linear-gradient(to bottom, #3a5ccc, #2a4b8d);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }
        
        .control-btn:hover {
            background: linear-gradient(to bottom, #4a6ce4, #3a5ccc);
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
        }
        
        .control-btn:active {
            transform: translateY(0);
        }
        
        .control-btn.active {
            background: linear-gradient(to bottom, #ffcc00, #ff9900);
            color: #000;
        }
        
        .section-divider {
            text-align: center;
            margin: 40px 0;
            color: #aac0e0;
            font-style: italic;
            font-size: 1.4em;
            text-shadow: 0 0 10px #3a5ccc;
        }
        
        .sentence {
            background: linear-gradient(to bottom, rgba(30, 45, 70, 0.8), rgba(20, 35, 60, 0.8));
            padding: 25px;
            margin-bottom: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
            border-left: 5px solid #3a5ccc;
        }
        
        .sentence p {
            margin: 0;
            color: #ffffff;
            text-align: justify;
            line-height: 2.2;
            font-size: 1.8em;
        }
        
        .character {
            position: relative;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-block;
            margin: 0 2px;
        }
        
        .character:hover {
            color: #ffcc00;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.7);
            transform: translateY(-3px);
        }
        
        /* 声旁展示窗口样式 */
        .radical-window {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(10, 25, 47, 0.95);
            border: 2px solid #ffcc00;
            border-radius: 20px;
            width: 600px;
            height: 600px;
            z-index: 2000;
            box-shadow: 0 0 40px rgba(255, 204, 0, 0.4);
            padding: 20px;
        }
        
        .radical-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #1a1912, #1c1a18);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 4em;
            font-weight: bold;
            color: #f1ecec;
            box-shadow: 0 0 40px #7e6d3ccc;
            z-index: 10;
        }
        
        .radical-pinyin {
            font-size: 0.5em;
            margin-top: 5px;
            font-weight: bold;
        }
        
        .radical-char {
            position: absolute;
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #2f3545, #171b24);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 3.2em;
            color: #fff;
            transition: all 0.3s;
            border: 2px solid #391685;
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.5);
            z-index: 5;
        }
        
        .radical-char:hover {
            background: linear-gradient(135deg, #ffcc00, #ff9900);
            color: #000;
            transform: scale(1.15);
            z-index: 15;
        }
        
        .char-pinyin {
            font-size: 0.4em;
            margin-top: 2px;
        }
        
        .char-example {
            font-size: 0.45em;
            color: #e2e7f0;
            text-align: center;
            margin-top: 2px;
            padding: 0 3px;
        }
        
        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            cursor: pointer;
            font-size: 40px;
            color: #ffcc00;
            z-index: 2010;
        }
        
        /* 竖版样式 */
        body.vertical-layout {
            writing-mode: vertical-rl;
            text-orientation: upright;
            max-width: none;
            height: 100vh;
            padding: 20px 40px;
            overflow-x: auto;
            white-space: nowrap;
        }
        
        body.vertical-layout .container {
            display: inline-block;
            vertical-align: top;
            margin-right: 40px;
            margin-bottom: 0;
            width: auto;
            padding: 40px 30px;
        }
        
        body.vertical-layout .sentence {
            display: block;
            margin-bottom: 40px;
            padding: 30px 20px;
        }
        
        body.vertical-layout .sentence p {
            margin: 0;
            text-align: start;
            line-height: 1.8;
        }
        
        body.vertical-layout .control-panel {
            writing-mode: horizontal-tb;
            margin-bottom: 40px;
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            body {
                padding: 10px;
                font-size: 0.9em;
            }
            
            h1 {
                font-size: 2em;
            }
            
            .sentence p {
                font-size: 1.4em;
            }
            
            .radical-window {
                width: 90vw;
                height: 90vw;
            }
            
            .radical-center {
                width: 70px;
                height: 70px;
                font-size: 1.5em;
            }
            
            .radical-char {
                width: 50px;
                height: 50px;
                font-size: 1em;
            }
        }
    </style>
</head>

    <script>
        // 简繁体转换映射表
        const simplifiedToTraditional = {
            '云': '雲', '对': '對', '风': '風', '鸟': '鳥', '鸣': '鳴', '虫': '蟲', '剑': '劍',
            '钧': '鈞', '岭': '嶺', '东': '東', '间': '間', '广': '廣', '宫': '宮', '夹': '夾',
            '晓': '曉', '烟': '煙', '杨': '楊', '绿': '綠', '满': '滿', '园': '園', '两': '兩',
            '鬓': '鬢', '边': '邊', '钓': '釣', '异': '異', '黄': '黃', '雾': '霧', '渔': '漁',
            '颜': '顏', '穷': '窮', '辽': '遼', '门': '門', '头': '頭', '讲': '講', '经': '經',
            '汉': '漢', '尘': '塵', '虑': '慮', '萦': '縈', '懒': '懶', '抚': '撫', '绿': '綠',
            '绮': '綺', '华': '華', '炼': '煉', '铜': '銅', '贫': '貧', '齿': '齒', '唇': '唇',
            '红': '紅', '弯': '彎', '树': '樹', '戏': '戲', '纤': '纖', '额': '額', '现': '現',
            '儿': '兒', '气': '氣', '壮': '壯', '万': '萬', '长': '長'
        };

        const traditionalToSimplified = {};
        for (const [simp, trad] of Object.entries(simplifiedToTraditional)) {
            traditionalToSimplified[trad] = simp;
        }

        // 简繁体转换函数
        function convertToSimplified() {
            const elements = document.querySelectorAll('.character');
            elements.forEach(el => {
                const text = el.textContent;
                if (traditionalToSimplified[text]) {
                    el.textContent = traditionalToSimplified[text];
                    // 更新onclick事件中的参数
                    const onclickAttr = el.getAttribute('onclick');
                    if (onclickAttr) {
                        const params = onclickAttr.split("'");
                        if (params.length >= 5) {
                            params[1] = traditionalToSimplified[params[1]] || params[1];
                            params[3] = traditionalToSimplified[params[3]] || params[3];
                            el.setAttribute('onclick', params.join("'"));
                        }
                    }
                }
            });
            
            // 更新按钮状态
            document.getElementById('simplified-btn').classList.add('active');
            document.getElementById('traditional-btn').classList.remove('active');
        }

        function convertToTraditional() {
            const elements = document.querySelectorAll('.character');
            elements.forEach(el => {
                const text = el.textContent;
                if (simplifiedToTraditional[text]) {
                    el.textContent = simplifiedToTraditional[text];
                    // 更新onclick事件中的参数
                    const onclickAttr = el.getAttribute('onclick');
                    if (onclickAttr) {
                        const params = onclickAttr.split("'");
                        if (params.length >= 5) {
                            params[1] = simplifiedToTraditional[params[1]] || params[1];
                            params[3] = simplifiedToTraditional[params[3]] || params[3];
                            el.setAttribute('onclick', params.join("'"));
                        }
                    }
                }
            });
            
            // 更新按钮状态
            document.getElementById('traditional-btn').classList.add('active');
            document.getElementById('simplified-btn').classList.remove('active');
        }

        // 横版/竖版切换
        function toggleLayout() {
            const isVertical = document.body.classList.toggle('vertical-layout');
            const layoutBtn = document.getElementById('layout-btn');
            
            if (isVertical) {
                layoutBtn.textContent = '竖版/横版';
            } else {
                layoutBtn.textContent = '横版/竖版';
            }
        }

        // 声旁数据库（示例数据）
        const radicalData = {

        // 显示声旁窗口
        function showRadical(char, pinyin, simplifiedChar) {
            const radicalWindow = document.getElementById('radical-window');
            const centerChar = document.getElementById('center-char');
            const centerPinyin = document.getElementById('center-pinyin');
            
            // 设置中心字符
            centerChar.textContent = char;
            centerPinyin.textContent = pinyin;
            
            // 清空之前的字符
            const existingChars = document.querySelectorAll('.radical-char');
            existingChars.forEach(el => el.remove());
            
            // 获取声旁数据
            const data = radicalData[simplifiedChar] || radicalData[char];
            
            if (data) {
                // 添加相关字符
                const positions = [
                    { top: '20%', left: '50%' },
                    { top: '30%', left: '20%' },
                    { top: '30%', left: '80%' },
                    { top: '50%', left: '10%' },
                    { top: '50%', left: '90%' },
                    { top: '70%', left: '20%' },
                    { top: '70%', left: '80%' },
                    { top: '80%', left: '50%' }
                ];
                
                data.chars.forEach((charData, index) => {
                    const pos = positions[index % positions.length];
                    const charEl = document.createElement('div');
                    charEl.className = 'radical-char';
                    charEl.style.top = pos.top;
                    charEl.style.left = pos.left;
                    charEl.innerHTML = `
                        <div>${charData.char}</div>
                        <div class="char-pinyin">${charData.pinyin}</div>
                        <div class="char-example">${charData.example}</div>
                    `;
                    radicalWindow.appendChild(charEl);
                });
            }
            
            // 显示窗口
            radicalWindow.style.display = 'block';
        }

        // 关闭声旁窗口
        function closeRadical() {
            document.getElementById('radical-window').style.display = 'none';
        }
    </script>
