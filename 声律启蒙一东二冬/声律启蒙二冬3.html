<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>声律启蒙 · 二 冬 下</title>
    <style>
        /* 重置与基础样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "SimSun", "宋体", serif;
            background-color: #0f1c2d;
            color: #e0e0e0;
            line-height: 1.6;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background-image: linear-gradient(to bottom, #0f1c2d, #1a3658);
            min-height: 100vh;
            transition: all 0.3s ease;
        }
        
        .container {
            background-color: rgba(0, 0, 0, 0.7);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid #2a4b8d;
        }
        
        header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 2px solid #3a5ccc;
        }
        
        h1 {
            font-size: 2.8em;
            color: #fff;
            text-shadow: 0 0 15px #3a5ccc, 0 0 25px #3a5ccc;
            margin-bottom: 15px;
            letter-spacing: 5px;
        }
        
        .subtitle {
            font-size: 1.2em;
            color: #aac0e0;
            font-style: italic;
        }
        
        .control-panel {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .control-btn {
            padding: 12px 20px;
            background: linear-gradient(to bottom, #3a5ccc, #2a4b8d);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }
        
        .control-btn:hover, .control-btn:focus {
            background: linear-gradient(to bottom, #4a6ce4, #3a5ccc);
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
            outline: none;
        }
        
        .control-btn:active {
            transform: translateY(0);
        }
        
        .control-btn.active {
            background: linear-gradient(to bottom, #ffcc00, #ff9900);
            color: #000;
        }
        
        .section-divider {
            text-align: center;
            margin: 40px 0;
            color: #aac0e0;
            font-style: italic;
            font-size: 1.4em;
            text-shadow: 0 0 10px #3a5ccc;
        }
        
        .sentence {
            background: linear-gradient(to bottom, rgba(30, 45, 70, 0.8), rgba(20, 35, 60, 0.8));
            padding: 25px;
            margin-bottom: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
            border-left: 5px solid #3a5ccc;
        }
        
        .sentence p {
            margin: 0;
            color: #ffffff;
            text-align: justify;
            line-height: 2.2;
            font-size: 1.8em;
        }
        
        .character {
            position: relative;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-block;
            margin: 0 2px;
        }
        
        .character:hover, .character:focus {
            color: #ffcc00;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.7);
            transform: translateY(-3px);
            outline: none;
        }
        
        /* 声旁展示窗口样式 - 缩小10% */
        .radical-window {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(10, 25, 47, 0.95);
            border: 2px solid #ffcc00;
            border-radius: 18px;  /* 缩小10% */
            width: 702px;  /* 缩小10% */
            height: 702px; /* 缩小10% */
            z-index: 2000;
            box-shadow: 0 0 36px rgba(255, 204, 0, 0.4); /* 缩小10% */
            padding: 18px; /* 缩小10% */
        }
        
        .radical-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 117px;  /* 缩小10% */
            height: 117px; /* 缩小10% */
            background: linear-gradient(135deg, #1a1912, #1c1a18);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 4.68em; /* 缩小10% */
            font-weight: bold;
            color: #f1ecec;
            box-shadow: 0 0 36px #7e6d3ccc; /* 缩小10% */
            z-index: 10;
        }
        
        .radical-pinyin {
            font-size: 0.585em; /* 缩小10% */
            margin-top: 4.5px; /* 缩小10% */
            font-weight: bold;
        }
        
        .radical-char {
            position: absolute;
            width: 117px;  /* 缩小10% */
            height: 117px; /* 缩小10% */
            background: linear-gradient(135deg, #2f3545, #171b24);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 3.744em; /* 缩小10% */
            color: #fff;
            transition: all 0.3s;
            border: 2px solid #391685;
            box-shadow: 0 0 13.5px rgba(255, 204, 0, 0.5); /* 缩小10% */
            z-index: 5;
        }
        
        .radical-char:hover {
            background: linear-gradient(135deg, #ffcc00, #ff9900);
            color: #000;
            transform: scale(1.15);
            z-index: 15;
        }
        
        .char-pinyin {
            font-size: 0.468em; /* 缩小10% */
            margin-top: 1.8px; /* 缩小10% */
        }
        
        .char-example {
            font-size: 0.5265em; /* 缩小10% */
            color: #e2e7f0;
            text-align: center;
            margin-top: 1.8px; /* 缩小10% */
            padding: 0 2.7px; /* 缩小10% */
        }
        
        .close-btn {
            position: absolute;
            top: 13.5px; /* 缩小10% */
            right: 18px; /* 缩小10% */
            cursor: pointer;
            font-size: 46.8px; /* 缩小10% */
            color: #ffcc00;
            z-index: 2010;
        }
        
        .close-btn:hover, .close-btn:focus {
            color: #ff9900;
            transform: scale(1.1);
            outline: none;
        }
        
        /* 竖版样式 */
        body.vertical-layout {
            writing-mode: vertical-rl;
            text-orientation: upright;
            max-width: none;
            height: 100vh;
            padding: 20px 40px;
            overflow-x: auto;
            white-space: nowrap;
        }
        
        body.vertical-layout .container {
            display: inline-block;
            vertical-align: top;
            margin-right: 40px;
            margin-bottom: 0;
            width: auto;
            padding: 40px 30px;
        }
        
        body.vertical-layout .sentence {
            display: block;
            margin-bottom: 40px;
            padding: 30px 20px;
        }
        
        body.vertical-layout .sentence p {
            margin: 0;
            text-align: start;
            line-height: 1.8;
        }
        
        body.vertical-layout .control-panel {
            writing-mode: horizontal-tb;
            margin-bottom: 40px;
        }
        
        /* 响应式设计 */
        @media (max-width: 900px) {
            .radical-window {
                width: 90vw;
                height: 90vw;
            }
            
            .radical-center {
                width: 20vw;
                height: 20vw;
                font-size: 3em;
            }
            
            .radical-char {
                width: 15vw;
                height: 15vw;
                font-size: 2em;
            }
            
            .char-pinyin, .char-example {
                font-size: 0.5em;
            }
        }
        
        @media (max-width: 768px) {
            body {
                padding: 10px;
                font-size: 0.9em;
            }
            
            h1 {
                font-size: 2em;
            }
            
            .sentence p {
                font-size: 1.4em;
            }
            
            .char-pinyin, .char-example {
                display: none;
            }
        }
        
        /* 新增内容样式 */
        .additional-content {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #3a5ccc;
        }
        
        /* 键盘导航焦点样式 */
        .character:focus-visible {
            outline: 2px solid #ffcc00;
            outline-offset: 2px;
        }
    </style>
</head>

    <script>
        // 简繁体转换映射表
        const simplifiedToTraditional = {
            // 二冬下部分新增字
            '仁': '仁', '义': '義', '让': '讓', '恭': '恭', '禹': '禹', '舜': '舜', '羲': '羲', '农': '農',
            '雪': '雪', '花': '花', '云': '雲', '叶': '葉', '芍': '芍', '药': '藥', '芙': '芙', '蓉': '蓉',
            '陈': '陳', '后': '後', '主': '主', '汉': '漢', '中': '中', '宗': '宗', '绣': '繡', '虎': '虎',
            '雕': '雕', '龙': '龍', '柳': '柳', '塘': '塘', '风': '風', '淡': '淡', '圃': '圃', '月': '月',
            '浓': '濃', '春': '春', '日': '日', '正': '正', '宜': '宜', '朝': '朝', '看': '看', '蝶': '蝶',
            '秋': '秋', '那': '那', '更': '更', '夜': '夜', '闻': '聞', '蛩': '蛩', '战': '戰', '士': '士',
            '邀': '邀', '功': '功', '必': '必', '借': '借', '干': '干', '戈': '戈', '成': '成', '勇': '勇',
            '武': '武', '逸': '逸', '民': '民', '适': '適', '志': '志', '须': '須', '凭': '憑', '诗': '詩',
            '酒': '酒', '养': '養', '疏': '疏', '慵': '慵',
            // 原有字
            '对': '對'
        };

        const traditionalToSimplified = {};
        for (const [simp, trad] of Object.entries(simplifiedToTraditional)) {
            traditionalToSimplified[trad] = simp;
        }

        // 简繁体转换函数
        function convertToSimplified() {
            const elements = document.querySelectorAll('.character');
            elements.forEach(el => {
                const text = el.textContent;
                if (traditionalToSimplified[text]) {
                    el.textContent = traditionalToSimplified[text];
                    // 更新onclick事件中的参数
                    const onclickAttr = el.getAttribute('onclick');
                    if (onclickAttr) {
                        const params = onclickAttr.split("'");
                        if (params.length >= 5) {
                            params[1] = traditionalToSimplified[params[1]] || params[1];
                            params[3] = traditionalToSimplified[params[3]] || params[3];
                            el.setAttribute('onclick', params.join("'"));
                        }
                    }
                }
            });
            
            // 更新按钮状态
            document.getElementById('simplified-btn').classList.add('active');
            document.getElementById('traditional-btn').classList.remove('active');
        }

        function convertToTraditional() {
            const elements = document.querySelectorAll('.character');
            elements.forEach(el => {
                const text = el.textContent;
                if (simplifiedToTraditional[text]) {
                    el.textContent = simplifiedToTraditional[text];
                    // 更新onclick事件中的参数
                    const onclickAttr = el.getAttribute('onclick');
                    if (onclickAttr) {
                        const params = onclickAttr.split("'");
                        if (params.length >= 5) {
                            params[1] = simplifiedToTraditional[params[1]] || params[1];
                            params[3] = simplifiedToTraditional[params[3]] || params[3];
                            el.setAttribute('onclick', params.join("'"));
                        }
                    }
                }
            });
            
            // 更新按钮状态
            document.getElementById('traditional-btn').classList.add('active');
            document.getElementById('simplified-btn').classList.remove('active');
        }

        // 横竖版切换
        function toggleLayout() {
            const isVertical = document.body.classList.toggle('vertical-layout');
            const layoutBtn = document.getElementById('layout-btn');
            
            if (isVertical) {
                layoutBtn.textContent = '竖版/横版';
            } else {
                layoutBtn.textContent = '横版/竖版';
            }
        }

        // 声旁数据库 - 二冬下部分新增字
        const radicalData = {
            '仁': { 'pinyin': 'rén', 'chars': [
                { 'char': '仁', 'pinyin': 'rén', 'example': '仁义' },
                { 'char': '人', 'pinyin': 'rén', 'example': '人民' },
                { 'char': '任', 'pinyin': 'rèn', 'example': '任务' }
            ]},

        // 显示声旁窗口
        function showRadical(char, pinyin, simplifiedChar) {
            const window = document.getElementById('radical-window');
            const centerChar = document.getElementById('center-char');
            const centerPinyin = document.getElementById('center-pinyin');
            
            // 设置中心字符
            centerChar.textContent = char;
            centerPinyin.textContent = pinyin;
            
            // 清空现有字符
            while (window.children.length > 2) {
                window.removeChild(window.lastChild);
            }
            
            // 获取相关字符数据
            const data = radicalData[char] || radicalData[simplifiedChar];
            
            if (data) {
                // 添加相关字符
                const chars = data.chars;
                const totalChars = chars.length;
                const radius = 250; // 半径
                
                chars.forEach((item, index) => {
                    const angle = (index / totalChars) * 2 * Math.PI;
                    const x = Math.cos(angle) * radius;
                    const y = Math.sin(angle) * radius;
                    
                    const charElement = document.createElement('div');
                    charElement.className = 'radical-char';
                    charElement.style.left = `calc(50% + ${x}px - 60px)`;
                    charElement.style.top = `calc(50% + ${y}px - 60px)`;
                    
                    charElement.innerHTML = `
                        <div>${item.char}</div>
                        <div class="char-pinyin">${item.pinyin}</div>
                        <div class="char-example">${item.example}</div>
                    `;
                    
                    window.appendChild(charElement);
                });
            }
            
            // 显示窗口
            window.style.display = 'block';
        }

        // 关闭声旁窗口
        function closeRadical() {
            document.getElementById('radical-window').style.display = 'none';
        }

        // 点击窗口外部关闭窗口
        window.addEventListener('click', function(event) {
            const window = document.getElementById('radical-window');
            if (event.target === window) {
                closeRadical();
            }
        });

        // 添加键盘导航支持
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                closeRadical();
            }
        });
