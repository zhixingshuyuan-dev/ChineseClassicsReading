<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>声律启蒙</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "SimSun", "宋体", serif;
            background-color: #0f1c2d;
            color: #e0e0e0;
            line-height: 1.6;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background-image: linear-gradient(to bottom, #0f1c2d, #1a3658);
            min-height: 100vh;
            transition: all 0.3s ease;
        }
        
        .container {
            background-color: rgba(0, 0, 0, 0.7);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid #2a4b8d;
        }
        
        header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 2px solid #3a5ccc;
        }
        
        h1 {
            font-size: 2.8em;
            color: #fff;
            text-shadow: 0 0 15px #3a5ccc, 0 0 25px #3a5ccc;
            margin-bottom: 15px;
            letter-spacing: 5px;
        }
        
        .subtitle {
            font-size: 1.2em;
            color: #aac0e0;
            font-style: italic;
        }
        
        .control-panel {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .control-btn {
            padding: 12px 20px;
            background: linear-gradient(to bottom, #3a5ccc, #2a4b8d);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }
        
        .control-btn:hover {
            background: linear-gradient(to bottom, #4a6ce4, #3a5ccc);
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
        }
        
        .control-btn:active {
            transform: translateY(0);
        }
        
        .control-btn.active {
            background: linear-gradient(to bottom, #ffcc00, #ff9900);
            color: #000;
        }
        
        .section-divider {
            text-align: center;
            margin: 40px 0;
            color: #aac0e0;
            font-style: italic;
            font-size: 1.4em;
            text-shadow: 0 0 10px #3a5ccc;
        }
        
        .sentence-container {
            margin-bottom: 40px;
        }
        
        .sentence {
            background: linear-gradient(to bottom, rgba(30, 45, 70, 0.8), rgba(20, 35, 60, 0.8));
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
            border-left: 5px solid #3a5ccc;
            margin-bottom: 15px;
        }
        
        .sentence p {
            margin: 0;
            color: #ffffff;
            text-align: justify;
            line-height: 2.2;
            font-size: 1.8em;
        }
        
        .character {
            position: relative;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-block;
            margin: 0 2px;
        }
        
        .character:hover {
            color: #ffcc00;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.7);
            transform: translateY(-3px);
        }
        
        .sentence-controls {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 10px;
        }
        
        .sentence-btn {
            padding: 8px 16px;
            background: linear-gradient(to bottom, #3a5ccc, #2a4b8d);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .sentence-btn:hover {
            background: linear-gradient(to bottom, #4a6ce4, #3a5ccc);
            transform: translateY(-2px);
        }
        
        /* 声旁展示窗口样式 */
        .radical-window {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(10, 25, 47, 0.95);
            border: 2px solid #ffcc00;
            border-radius: 20px;
            width: 600px;
            height: 600px;
            z-index: 2000;
            box-shadow: 0 0 40px rgba(255, 204, 0, 0.4);
            padding: 20px;
            overflow: hidden;
            touch-action: none;
        }
        
        .radical-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #1a1912, #1c1a18);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 4em;
            font-weight: bold;
            color: #f1ecec;
            box-shadow: 0 0 40px #7e6d3ccc;
            z-index: 10;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .radical-center:hover {
            background: linear-gradient(135deg, #ffcc00, #ff9900);
            color: #000;
            transform: translate(-50%, -50%) scale(1.1);
        }
        
        .radical-pinyin {
            font-size: 0.5em;
            margin-top: 5px;
            font-weight: bold;
        }
        
        .radical-char {
            position: absolute;
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #2f3545, #171b24);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 3.2em;
            color: #fff;
            transition: all 0.3s;
            border: 2px solid #391685;
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.5);
            z-index: 5;
            cursor: pointer;
        }
        
        .radical-char:hover {
            background: linear-gradient(135deg, #3a5ccc, #2a4b8d);
            color: #fff;
            transform: scale(1.15);
            z-index: 15;
        }
        
        .char-pinyin {
            font-size: 0.4em;
            margin-top: 2px;
        }
        
        .char-example {
            font-size: 0.45em;
            color: #e2e7f0;
            text-align: center;
            margin-top: 2px;
            padding: 0 3px;
            cursor: pointer;
        }
        
        .char-example:hover {
            color: #ffcc00;
        }
        
        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            cursor: pointer;
            font-size: 40px;
            color: #ffcc00;
            z-index: 2010;
        }
        
        /* 语音控制按钮 */
        .voice-control {
            position: absolute;
            bottom: 20px;
            left: 20px;
            display: flex;
            gap: 10px;
            z-index: 2010;
        }
        
        .voice-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(to bottom, #3a5ccc, #2a4b8d);
            border: none;
            color: white;
            font-size: 1.2em;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        
        .voice-btn:hover {
            background: linear-gradient(to bottom, #ffcc00, #ff9900);
            color: #000;
            transform: scale(1.1);
        }
        
        /* 竖版样式 */
        body.vertical-layout {
            writing-mode: vertical-rl;
            text-orientation: upright;
            max-width: none;
            height: 100vh;
            padding: 20px 40px;
            overflow-x: auto;
            white-space: nowrap;
        }
        
        body.vertical-layout .container {
            display: inline-block;
            vertical-align: top;
            margin-right: 40px;
            margin-bottom: 0;
            width: auto;
            padding: 40px 30px;
        }
        
        body.vertical-layout .sentence {
            display: block;
            margin-bottom: 40px;
            padding: 30px 20px;
        }
        
        body.vertical-layout .sentence p {
            margin: 0;
            text-align: start;
            line-height: 1.8;
        }
        
        body.vertical-layout .control-panel {
            writing-mode: horizontal-tb;
            margin-bottom: 40px;
        }
        
        /* 解释窗口样式 */
        .explanation-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(10, 25, 47, 0.95);
            border: 2px solid #3a5ccc;
            border-radius: 15px;
            width: 80%;
            max-width: 800px;
            max-height: 80vh;
            z-index: 3000;
            box-shadow: 0 0 40px rgba(58, 92, 204, 0.4);
            padding: 25px;
            overflow-y: auto;
            color: #e0e0e0;
        }
        
        .explanation-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #3a5ccc;
            padding-bottom: 10px;
        }
        
        .explanation-title {
            font-size: 1.5em;
            color: #ffcc00;
        }
        
        .explanation-close {
            font-size: 30px;
            color: #ffcc00;
            cursor: pointer;
            background: none;
            border: none;
        }
        
        .explanation-content {
            font-size: 1.1em;
            line-height: 1.8;
        }
        
        .explanation-content p {
            margin-bottom: 15px;
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            body {
                padding: 10px;
                font-size: 0.9em;
            }
            
            h1 {
                font-size: 2em;
            }
            
            .sentence p {
                font-size: 1.4em;
            }
            
            .radical-window {
                width: 90vw;
                height: 90vw;
            }
            
            .radical-center {
                width: 70px;
                height: 70px;
                font-size: 1.5em;
            }
            
            .radical-char {
                width: 50px;
                height: 50px;
                font-size: 1em;
            }
            
            .explanation-modal {
                width: 95%;
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>聲律啟蒙</h1>
            <div class="subtitle">傳統文化經典 · 聲韻汉字啟蒙</div>
        </header>
        
        <div class="control-panel">
            <button id="simplified-btn" class="control-btn" onclick="convertToSimplified()">简体</button>
            <button id="traditional-btn" class="control-btn active" onclick="convertToTraditional()">繁體</button>
            <button id="layout-btn" class="control-btn" onclick="toggleLayout()">横版/竖版</button>
        </div>

        <div class="section-divider">【 卷上 】</div>

        <div class="section-divider">一、東</div>

        <!-- 第一句 -->
        <div class="sentence-container">
            <div class="sentence">
                <p>
                    <span class="character" onclick="showRadical('雲', 'yún', '云')">雲</span>
                    <span class="character" onclick="showRadical('對', 'duì', '对')">對</span>
                    <span class="character" onclick="showRadical('雨', 'yǔ', '雨')">雨</span>，
                    <span class="character" onclick="showRadical('雪', 'xuě', '雪')">雪</span>
                    <span class="character" onclick="showRadical('對', 'duì', '对')">對</span>
                    <span class="character" onclick="showRadical('風', 'fēng', '风')">風</span>，
                    <span class="character" onclick="showRadical('晚', 'wǎn', '晚')">晚</span>
                    <span class="character" onclick="showRadical('照', 'zhào', '照')">照</span>
                    <span class="character" onclick="showRadical('對', 'duì', '对')">對</span>
                    <span class="character" onclick="showRadical('晴', 'qíng', '晴')">晴</span>
                    <span class="character" onclick="showRadical('空', 'kōng', '空')">空</span>。
                    <span class="character" onclick="showRadical('來', 'lái', '来')">來</span>
                    <span class="character" onclick="showRadical('鴻', 'hóng', '鸿')">鴻</span>
                    <span class="character" onclick="showRadical('對', 'duì', '对')">對</span>
                    <span class="character" onclick="showRadical('去', 'qù', '去')">去</span>
                    <span class="character" onclick="showRadical('燕', 'yàn', '燕')">燕</span>，
                    <span class="character" onclick="showRadical('宿', 'sù', '宿')">宿</span>
                    <span class="character" onclick="showRadical('鳥', 'niǎo', '鸟')">鳥</span>
                    <span class="character" onclick="showRadical('對', 'duì', '对')">對</span>
                    <span class="character" onclick="showRadical('鳴', 'míng', '鸣')">鳴</span>
                    <span class="character" onclick="showRadical('蟲', 'chóng', '虫')">蟲</span>。
                </p>
            </div>
            <div class="sentence-controls">
                <button class="sentence-btn" onclick="speakSentence(1)">🔊 朗读本句</button>
                <button class="sentence-btn" onclick="showExplanation(1)">📖 查看解释</button>
            </div>
        </div>

        <!-- 第二句 -->
        <div class="sentence-container">
            <div class="sentence">
                <p>
                    <span class="character" onclick="showRadical('三', 'sān', '三')">三</span>
                    <span class="character" onclick="showRadical('尺', 'chǐ', '尺')">尺</span>
                    <span class="character" onclick="showRadical('劍', 'jiàn', '剑')">劍</span>，
                    <span class="character" onclick="showRadical('六', 'liù', '六')">六</span>
                    <span class="character" onclick="showRadical('鈞', 'jūn', '钧')">鈞</span>
                    <span class="character" onclick="showRadical('弓', 'gōng', '弓')">弓</span>，
                    <span class="character" onclick="showRadical('嶺', 'lǐng', '岭')">嶺</span>
                    <span class="character" onclick="showRadical('北', 'běi', '北')">北</span>
                    <span class="character" onclick="showRadical('對', 'duì', '对')">對</span>
                    <span class="character" onclick="showRadical('江', 'jiāng', '江')">江</span>
                    <span class="character" onclick="showRadical('東', 'dōng', '东')">東</span>。
                    <span class="character" onclick="showRadical('人', 'rén', '人')">人</span>
                    <span class="character" onclick="showRadical('間', 'jiān', '间')">間</span>
                    <span class="character" onclick="showRadical('清', 'qīng', '清')">清</span>
                    <span class="character" onclick="showRadical('暑', 'shǔ', '暑')">暑</span>
                    <span class="character" onclick="showRadical('殿', 'diàn', '殿')">殿</span>，
                    <span class="character" onclick="showRadical('天', 'tiān', '天')">天</span>
                    <span class="character" onclick="showRadical('上', 'shàng', '上')">上</span>
                    <span class="character" onclick="showRadical('廣', 'guǎng', '广')">廣</span>
                    <span class="character" onclick="showRadical('寒', 'hán', '寒')">寒</span>
                    <span class="character" onclick="showRadical('宮', 'gōng', '宫')">宮</span>。
                </p>
            </div>
            <div class="sentence-controls">
                <button class="sentence-btn" onclick="speakSentence(2)">🔊 朗读本句</button>
                <button class="sentence-btn" onclick="showExplanation(2)">📖 查看解释</button>
            </div>
        </div>

        <!-- 第三句 -->
        <div class="sentence-container">
            <div class="sentence">
                <p>
                    <span class="character" onclick="showRadical('夾', 'jiā', '夹')">夾</span>
                    <span class="character" onclick="showRadical('岸', 'àn', '岸')">岸</span>
                    <span class="character" onclick="showRadical('曉', 'xiǎo', '晓')">曉</span>
                    <span class="character" onclick="showRadical('煙', 'yān', '烟')">煙</span>
                    <span class="character" onclick="showRadical('楊', 'yáng', '杨')">楊</span>
                    <span class="character" onclick="showRadical('柳', 'liǔ', '柳')">柳</span>
                    <span class="character" onclick="showRadical('綠', 'lǜ', '绿')">綠</span>；
                    <span class="character" onclick="showRadical('滿', 'mǎn', '满')">滿</span>
                    <span class="character" onclick="showRadical('園', 'yuán', '园')">園</span>
                    <span class="character" onclick="showRadical('春', 'chūn', '春')">春</span>
                    <span class="character" onclick="showRadical('雨', 'yǔ', '雨')">雨</span>
                    <span class="character" onclick="showRadical('杏', 'xìng', '杏')">杏</span>
                    <span class="character" onclick="showRadical('花', 'huā', '花')">花</span>
                    <span class="character" onclick="showRadical('紅', 'hóng', '红')">紅</span>。
                </p>
            </div>
            <div class="sentence-controls">
                <button class="sentence-btn" onclick="speakSentence(3)">🔊 朗读本句</button>
                <button class="sentence-btn" onclick="showExplanation(3)">📖 查看解释</button>
            </div>
        </div>

        <!-- 第四句 -->
        <div class="sentence-container">
            <div class="sentence">
                <p>
                    <span class="character" onclick="showRadical('兩', 'liǎng', '两')">兩</span>
                    <span class="character" onclick="showRadical('鬢', 'bìn', '鬓')">鬢</span>
                    <span class="character" onclick="showRadical('風', 'fēng', '风')">風</span>
                    <span class="character" onclick="showRadical('霜', 'shuāng', '霜')">霜</span>
                    <span class="character" onclick="showRadical('途', 'tú', '途')">途</span>
                    <span class="character" onclick="showRadical('次', 'cì', '次')">次</span>
                    <span class="character" onclick="showRadical('早', 'zǎo', '早')">早</span>
                    <span class="character" onclick="showRadical('行', 'xíng', '行')">行</span>
                    <span class="character" onclick="showRadical('之', 'zhī', '之')">之</span>
                    <span class="character" onclick="showRadical('客', 'kè', '客')">客</span>；
                    <span class="character" onclick="showRadical('一', 'yī', '一')">一</span>
                    <span class="character" onclick="showRadical('蓑', 'suō', '蓑')">蓑</span>
                    <span class="character" onclick="showRadical('煙', 'yān', '烟')">煙</span>
                    <span class="character" onclick="showRadical('雨', 'yǔ', '雨')">雨</span>
                    <span class="character" onclick="showRadical('溪', 'xī', '溪')">溪</span>
                    <span class="character" onclick="showRadical('邊', 'biān', '边')">邊</span>
                    <span class="character" onclick="showRadical('晚', 'wǎn', '晚')">晚</span>
                    <span class="character" onclick="showRadical('釣', 'diào', '钓')">釣</span>
                    <span class="character" onclick="showRadical('之', 'zhī', '之')">之</span>
                    <span class="character" onclick="showRadical('翁', 'wēng', '翁')">翁</span>。
                </p>
            </div>
            <div class="sentence-controls">
                <button class="sentence-btn" onclick="speakSentence(4)">🔊 朗读本句</button>
                <button class="sentence-btn" onclick="showExplanation(4)">📖 查看解释</button>
            </div>
        </div>

        <!-- 声旁窗口 -->
        <div class="radical-window" id="radical-window">
            <span class="close-btn" onclick="closeRadical()">×</span>
            <div class="voice-control">
                <button class="voice-btn" onclick="speakAll()">🔊</button>
                <button class="voice-btn" onclick="stopSpeech()">⏹</button>
            </div>
            <div class="radical-center" id="radical-center" onclick="speakText(document.getElementById('center-char').textContent, document.getElementById('center-pinyin').textContent)">
                <div id="center-char">声</div>
                <div class="radical-pinyin" id="center-pinyin">shēng</div>
            </div>
        </div>

        <!-- 解释窗口 -->

                <div class="explanation-title" id="explanation-title">诗句解释</div>
                <button class="explanation-close" onclick="closeExplanation()">×</button>
            </div>
            <div class="explanation-content" id="explanation-content">
                <!-- 解释内容将通过JavaScript动态插入 -->
            </div>
        </div>
    </div>

    <script>
        // 语音合成对象
        const speech = window.speechSynthesis;
        let currentUtterance = null;
        let isRotating = false;
        let rotationAngle = 0;
        let rotationSpeed = 0;
        let lastMouseX = 0;
        let isMouseDown = false;
        let rotationDirection = 1;
        
        // 简繁体转换映射表
        const simplifiedToTraditional = {
            '云': '雲', '对': '對', '风': '風', '鸟': '鳥', '鸣': '鳴', '虫': '蟲', '剑': '劍',
            '钧': '鈞', '岭': '嶺', '东': '東', '间': '間', '广': '廣', '宫': '宮', '夹': '夾',
            '晓': '曉', '烟': '煙', '杨': '楊', '绿': '綠', '满': '滿', '园': '園', '两': '兩',
            '鬓': '鬢', '边': '邊', '钓': '釣', '异': '異', '黄': '黃', '雾': '霧', '渔': '漁',
            '颜': '顏', '穷': '窮', '辽': '遼', '门': '門', '头': '頭', '讲': '講', '经': '經',
            '汉': '漢', '尘': '塵', '虑': '慮', '萦': '縈', '懒': '懶', '抚': '撫', '绿': '綠',
            '绮': '綺', '华': '華', '炼': '煉', '铜': '銅', '贫': '貧', '齿': '齒', '唇': '唇',
            '红': '紅', '弯': '彎', '树': '樹', '戏': '戲', '纤': '纖', '额': '額', '现': '現',
            '儿': '兒', '气': '氣', '壮': '壯', '万': '萬', '长': '長'
        };




        
        
        const radicalData = {
  // 雲 / 云

                    <p><strong>声韵分析：</strong>这是一组经典的对仗句，体现了汉语声韵之美。"云"与"雨"、"雪"与"风"都是自然现象的对仗；"晚照"与"晴空"是时间与空间的对仗；"来鸿"与"去燕"、"宿鸟"与"鸣虫"是动物行为的对仗。</p>
                    <p><strong>文化内涵：</strong>这几句通过自然景象的对比，展现了天地万物的和谐与平衡，体现了中国传统文化中"天人合一"的哲学思想。</p>
                `

                    <p>2. <strong>六鈞弓：</strong>古代三十斤为一"钧"，六钧弓指的是一种拉力较强的弓。《左傳》记载：定公侵犯齐国时，士兵都坐着排列，说："颜高的弓有六钧"。大家都拿来传看。</p>

        // 简繁体转换函数
        function convertToSimplified() {
            const elements = document.querySelectorAll('.character');
            elements.forEach(el => {
                const text = el.textContent;
                if (traditionalToSimplified[text]) {
                    el.textContent = traditionalToSimplified[text];
                    const onclickAttr = el.getAttribute('onclick');
                    if (onclickAttr) {
                        const params = onclickAttr.split("'");
                        if (params.length >= 5) {
                            params[1] = traditionalToSimplified[params[1]] || params[1];
                            params[3] = traditionalToSimplified[params[3]] || params[3];
                            el.setAttribute('onclick', params.join("'"));
                        }
                    }
                }
            });
            
            document.getElementById('simplified-btn').classList.add('active');
            document.getElementById('traditional-btn').classList.remove('active');
        }

        function convertToTraditional() {
            const elements = document.querySelectorAll('.character');
            elements.forEach(el => {
                const text = el.textContent;
                if (simplifiedToTraditional[text]) {
                    el.textContent = simplifiedToTraditional[text];
                    const onclickAttr = el.getAttribute('onclick');
                    if (onclickAttr) {
                        const params = onclickAttr.split("'");
                        if (params.length >= 5) {
                            params[1] = simplifiedToTraditional[params[1]] || params[1];
                            params[3] = simplifiedToSimplified[params[3]] || params[3];
                            el.setAttribute('onclick', params.join("'"));
                        }
                    }
                }
            });
            
            document.getElementById('traditional-btn').classList.add('active');
            document.getElementById('simplified-btn').classList.remove('active');
        }

        // 横版/竖版切换
        function toggleLayout() {
            const isVertical = document.body.classList.toggle('vertical-layout');
            const layoutBtn = document.getElementById('layout-btn');
            layoutBtn.textContent = isVertical ? '竖版/横版' : '横版/竖版';
        }

        




        // 朗读单句
        function speakSentence(sentenceNum) {
            if (speech.speaking) {
                speech.cancel();
            }
            
            const sentenceElements = document.querySelectorAll('.sentence-container');
            if (sentenceNum <= sentenceElements.length) {
                const sentenceText = sentenceElements[sentenceNum-1].querySelector('.sentence p').textContent;
                const utterance = new SpeechSynthesisUtterance();
                utterance.text = sentenceText;
                utterance.lang = 'zh-CN';
                utterance.rate = 0.8;
                utterance.pitch = 1;
                
                // 高亮当前句子
                highlightSentence(sentenceNum);
                
                utterance.onend = () => {
                    removeSentenceHighlight();
                };
                
                currentUtterance = utterance;
                speech.speak(utterance);
            }
        }

        // 高亮当前朗读的句子
        function highlightSentence(sentenceNum) {
            const sentenceContainers = document.querySelectorAll('.sentence-container');
            sentenceContainers.forEach((container, index) => {
                if (index === sentenceNum - 1) {
                    container.querySelector('.sentence').style.background = 'linear-gradient(to bottom, rgba(58, 92, 204, 0.8), rgba(42, 75, 141, 0.8))';
                    container.querySelector('.sentence').style.borderLeft = '5px solid #ffcc00';
                } else {
                    container.querySelector('.sentence').style.background = 'linear-gradient(to bottom, rgba(30, 45, 70, 0.8), rgba(20, 35, 60, 0.8))';
                    container.querySelector('.sentence').style.borderLeft = '5px solid #3a5ccc';
                }
            });
        }

        // 移除句子高亮
        function removeSentenceHighlight() {
            const sentences = document.querySelectorAll('.sentence');
            sentences.forEach(sentence => {
                sentence.style.background = 'linear-gradient(to bottom, rgba(30, 45, 70, 0.8), rgba(20, 35, 60, 0.8))';
                sentence.style.borderLeft = '5px solid #3a5ccc';
            });
        }

        // 显示解释
        function showExplanation(sentenceNum) {
            const explanation = explanations[sentenceNum];
            if (explanation) {
                document.getElementById('explanation-title').textContent = explanation.title;
                document.getElementById('explanation-content').innerHTML = explanation.content;
                document.getElementById('explanation-modal').style.display = 'block';
                
                // 朗读解释
                speakExplanation(explanation);
            }
        }

        // 朗读解释
        function speakExplanation(explanation) {
            if (speech.speaking) {
                speech.cancel();
            }
            
            // 提取纯文本内容进行朗读
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = explanation.content;
            const textToSpeak = explanation.title + '。' + tempDiv.textContent.replace(/\s+/g, ' ');
            
            const utterance = new SpeechSynthesisUtterance();
            utterance.text = textToSpeak;
            utterance.lang = 'zh-CN';
            utterance.rate = 0.7;
            utterance.pitch = 1;
            
            currentUtterance = utterance;
            speech.speak(utterance);
        }

        // 关闭解释窗口
        function closeExplanation() {
            document.getElementById('explanation-modal').style.display = 'none';
            stopSpeech();
        }

        // 点击文档其他地方关闭解释窗口
        document.addEventListener('click', function(e) {
            const modal = document.getElementById('explanation-modal');
            if (modal.style.display === 'block' && !e.target.closest('.explanation-modal') && 
                !e.target.closest('.sentence-btn') && !e.target.classList.contains('sentence-btn')) {
                closeExplanation();
            }
        });




    </script>
