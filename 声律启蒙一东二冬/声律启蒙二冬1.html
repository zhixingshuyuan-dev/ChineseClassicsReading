<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>声律启蒙 · 二 冬 上</title>
    <style>
        /* 重置与基础样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "SimSun", "宋体", serif;
            background-color: #0f1c2d;
            color: #e0e0e0;
            line-height: 1.6;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background-image: linear-gradient(to bottom, #0f1c2d, #1a3658);
            min-height: 100vh;
            transition: all 0.3s ease;
        }
        
        .container {
            background-color: rgba(0, 0, 0, 0.7);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid #2a4b8d;
        }
        
        header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 2px solid #3a5ccc;
        }
        
        h1 {
            font-size: 2.8em;
            color: #fff;
            text-shadow: 0 0 15px #3a5ccc, 0 0 25px #3a5ccc;
            margin-bottom: 15px;
            letter-spacing: 5px;
        }
        
        .subtitle {
            font-size: 1.2em;
            color: #aac0e0;
            font-style: italic;
        }
        
        .control-panel {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .control-btn {
            padding: 12px 20px;
            background: linear-gradient(to bottom, #3a5ccc, #2a4b8d);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }
        
        .control-btn:hover, .control-btn:focus {
            background: linear-gradient(to bottom, #4a6ce4, #3a5ccc);
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
            outline: none;
        }
        
        .control-btn:active {
            transform: translateY(0);
        }
        
        .control-btn.active {
            background: linear-gradient(to bottom, #ffcc00, #ff9900);
            color: #000;
        }
        
        .section-divider {
            text-align: center;
            margin: 40px 0;
            color: #aac0e0;
            font-style: italic;
            font-size: 1.4em;
            text-shadow: 0 0 10px #3a5ccc;
        }
        
        .sentence {
            background: linear-gradient(to bottom, rgba(30, 45, 70, 0.8), rgba(20, 35, 60, 0.8));
            padding: 25px;
            margin-bottom: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
            border-left: 5px solid #3a5ccc;
        }
        
        .sentence p {
            margin: 0;
            color: #ffffff;
            text-align: justify;
            line-height: 2.2;
            font-size: 1.8em;
        }
        
        .character {
            position: relative;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-block;
            margin: 0 2px;
        }
        
        .character:hover, .character:focus {
            color: #ffcc00;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.7);
            transform: translateY(-3px);
            outline: none;
        }
        
        /* 声旁展示窗口样式 - 放大30% */
        .radical-window {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(10, 25, 47, 0.95);
            border: 2px solid #ffcc00;
            border-radius: 20px;
            width: 780px;  /* 放大30% */
            height: 780px; /* 放大30% */
            z-index: 2000;
            box-shadow: 0 0 40px rgba(255, 204, 0, 0.4);
            padding: 20px;
        }
        
        .radical-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 130px;  /* 放大30% */
            height: 130px; /* 放大30% */
            background: linear-gradient(135deg, #1a1912, #1c1a18);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 5.2em; /* 放大30% */
            font-weight: bold;
            color: #f1ecec;
            box-shadow: 0 0 40px #7e6d3ccc;
            z-index: 10;
        }
        
        .radical-pinyin {
            font-size: 0.65em; /* 放大30% */
            margin-top: 5px;
            font-weight: bold;
        }
        
        .radical-char {
            position: absolute;
            width: 130px;  /* 放大30% */
            height: 130px; /* 放大30% */
            background: linear-gradient(135deg, #2f3545, #171b24);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 4.16em; /* 放大30% */
            color: #fff;
            transition: all 0.3s;
            border: 2px solid #391685;
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.5);
            z-index: 5;
        }
        
        .radical-char:hover {
            background: linear-gradient(135deg, #ffcc00, #ff9900);
            color: #000;
            transform: scale(1.15);
            z-index: 15;
        }
        
        .char-pinyin {
            font-size: 0.52em; /* 放大30% */
            margin-top: 2px;
        }
        
        .char-example {
            font-size: 0.585em; /* 放大30% */
            color: #e2e7f0;
            text-align: center;
            margin-top: 2px;
            padding: 0 3px;
        }
        
        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            cursor: pointer;
            font-size: 52px; /* 放大30% */
            color: #ffcc00;
            z-index: 2010;
        }
        
        .close-btn:hover, .close-btn:focus {
            color: #ff9900;
            transform: scale(1.1);
            outline: none;
        }
        
        /* 竖版样式 */
        body.vertical-layout {
            writing-mode: vertical-rl;
            text-orientation: upright;
            max-width: none;
            height: 100vh;
            padding: 20px 40px;
            overflow-x: auto;
            white-space: nowrap;
        }
        
        body.vertical-layout .container {
            display: inline-block;
            vertical-align: top;
            margin-right: 40px;
            margin-bottom: 0;
            width: auto;
            padding: 40px 30px;
        }
        
        body.vertical-layout .sentence {
            display: block;
            margin-bottom: 40px;
            padding: 30px 20px;
        }
        
        body.vertical-layout .sentence p {
            margin: 0;
            text-align: start;
            line-height: 1.8;
        }
        
        body.vertical-layout .control-panel {
            writing-mode: horizontal-tb;
            margin-bottom: 40px;
        }
        
        /* 响应式设计 */
        @media (max-width: 900px) {
            .radical-window {
                width: 90vw;
                height: 90vw;
            }
            
            .radical-center {
                width: 20vw;
                height: 20vw;
                font-size: 3em;
            }
            
            .radical-char {
                width: 15vw;
                height: 15vw;
                font-size: 2em;
            }
            
            .char-pinyin, .char-example {
                font-size: 0.5em;
            }
        }
        
        @media (max-width: 768px) {
            body {
                padding: 10px;
                font-size: 0.9em;
            }
            
            h1 {
                font-size: 2em;
            }
            
            .sentence p {
                font-size: 1.4em;
            }
            
            .char-pinyin, .char-example {
                display: none;
            }
        }
        
        /* 新增内容样式 */
        .additional-content {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #3a5ccc;
        }
        
        /* 键盘导航焦点样式 */
        .character:focus-visible {
            outline: 2px solid #ffcc00;
            outline-offset: 2px;
        }
    </style>
</head>

        // 简繁体转换函数
        function convertToSimplified() {
            const elements = document.querySelectorAll('.character');

            const centerChar = document.getElementById('center-char');
            const centerPinyin = document.getElementById('center-pinyin');
            
            // 设置中心字符
            centerChar.textContent = char;
            centerPinyin.textContent = pinyin;
            
            // 清空之前的内容
            const existingChars = document.querySelectorAll('.radical-char');
            existingChars.forEach(el => el.remove());
            
            // 获取相关字符数据
            const data = radicalData[char];
            if (!data) return;
            
            // 创建相关字符
            const radius = 260; // 半径 - 放大30%
            const centerX = 390; // 圆心X坐标 - 放大30%
            const centerY = 390; // 圆心Y坐标 - 放大30%
            
            data.chars.forEach((charData, index) => {
                const angle = (index / data.chars.length) * 2 * Math.PI;
                const x = centerX + radius * Math.cos(angle);
                const y = centerY + radius * Math.sin(angle);
                
                const charEl = document.createElement('div');
                charEl.className = 'radical-char';
                charEl.style.left = `${x - 65}px`; // 调整偏移量以适应放大
                charEl.style.top = `${y - 65}px`;  // 调整偏移量以适应放大
                
                charEl.innerHTML = `
                    <div>${charData.char}</div>
                    <div class="char-pinyin">${charData.pinyin}</div>
                    <div class="char-example">${charData.example}</div>
                `;
                
                window.appendChild(charEl);
            });
            
            // 显示窗口
            window.style.display = 'block';
        }

        // 关闭声旁窗口
        function closeRadical() {
            document.getElementById('radical-window').style.display = 'none';
        }

        // 点击窗口外部关闭窗口
        document.getElementById('radical-window').addEventListener('click', function(e) {
            if (e.target === this) {
                closeRadical();
            }
        });

        // 键盘导航支持
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeRadical();
            }
        });
    </script>
</body>
</html>
