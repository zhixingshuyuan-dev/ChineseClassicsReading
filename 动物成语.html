    meaning: "比喻强者轻易制伏弱者。",
    example: "他们的比赛就像猫捉老鼠。",
    english: "A one‑sided contest where the stronger easily defeats the weaker."
  },
  {
    name: "凤鸣朝阳",
    pinyin: "fèng míng zhāo yáng",
    meaning: "比喻贤士出现于盛世。",
    example: "国家盛世，英才辈出，如凤鸣朝阳。",
    english: "Talents emerging during prosperous times."
  },
  {
    name: "龙精虎猛",
    pinyin: "lóng jīng hǔ měng",
    meaning: "形容精神充沛，气势旺盛。",
    example: "队员们龙精虎猛，斗志昂扬。",
    english: "Full of vigor and energy; energetic and strong."
  }



  ];

  /* ============ 分页与弹窗交互 ============ */
  const pageSize = 20;
  let currentPage = 1;
  const totalPages = Math.ceil(idioms.length / pageSize);

  function renderPage() {
    const container = document.getElementById("idiomContainer");
    container.innerHTML = "";
    const start = (currentPage - 1) * pageSize;
    const end = Math.min(start + pageSize, idioms.length);
    idioms.slice(start, end).forEach(i => {
      const card = document.createElement("div");
      card.className = "card";
      card.textContent = i.name;
      card.onclick = () => openModal(i);
      container.appendChild(card);
    });
    document.getElementById("pageInfo").textContent = `${currentPage} / ${totalPages}`;
    document.getElementById("prevBtn").disabled = currentPage === 1;
    document.getElementById("nextBtn").disabled = currentPage === totalPages;
  }

  function openModal(idiom) {
    document.getElementById("modalTitle").textContent = idiom.name;
    document.getElementById("modalPinyin").textContent = idiom.pinyin;
    document.getElementById("modalMeaning").textContent = "释义：" + idiom.meaning;
    document.getElementById("modalExample").textContent = "例句：" + (idiom.example || "——");
    document.getElementById("modalEnglish").textContent = "English: " + (idiom.english || "");
    document.getElementById("idiomModal").classList.add("active");

    // 语音朗读
    document.getElementById("readBtn").onclick = () => {
      const text = `${idiom.name}，${idiom.pinyin}，${idiom.meaning}`;
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "zh-CN";
      u.rate = 0.95;
      speechSynthesis.cancel();
      speechSynthesis.speak(u);
    };
  }

  document.getElementById("closeBtn").onclick = () => {
    document.getElementById("idiomModal").classList.remove("active");
    speechSynthesis.cancel();
  };
  document.getElementById("prevBtn").onclick = () => { if(currentPage>1){ currentPage--; renderPage(); } };
  document.getElementById("nextBtn").onclick = () => { if(currentPage<totalPages){ currentPage++; renderPage(); } };

  renderPage();
  </script>
</body>
</html>
