        // 繁简转换函数
        function convertToTraditional(text) {
            return text.split('').map(char => simplifiedToTraditional[char] || char).join('');
        }
        
        function convertToSimplified(text) {
            const traditionalToSimplified = {};
            for (const [simplified, traditional] of Object.entries(simplifiedToTraditional)) {
                traditionalToSimplified[traditional] = simplified;
            }
            return text.split('').map(char => traditionalToSimplified[char] || char).join('');

        // 更新显示

            const currentChar = allChars[currentIndex];
            charElement.textContent = currentChar;
            currentIndexElement.textContent = currentIndex + 1;
            
            // 更新进度条
            const progress = ((currentIndex + 1) / allChars.length) * 100;
            progressBarElement.style.width = `${progress}%`;
            
            // 如果当前是暂停状态，添加暂停动画
            if (!isPlaying) {
                charElement.classList.add('paused');
            } else {
                charElement.classList.remove('paused');
            }
            
            // 应用随机效果
            applyRandomEffects();
        }

        function applyRandomEffects() {
            const charDisplay = document.querySelector('.char-display');
            const char = document.getElementById('char');
            
            // 1. 随机位置（左中右，上中下）
            const randomPosition = positions[Math.floor(Math.random() * positions.length)];
            charDisplay.style.justifyContent = randomPosition.justifyContent;
            charDisplay.style.alignItems = randomPosition.alignItems;
            
            // 记录当前位置
            const positionKey = `${randomPosition.justifyContent},${randomPosition.alignItems}`;
            currentPosition = positionMap[positionKey] || "随机位置";
            
            // 2. 随机尺寸（从中号到大号）
            const minSize = 10; // 最小vw
            const maxSize = 30; // 最大vw
            const randomSize = Math.floor(Math.random() * (maxSize - minSize + 1)) + minSize;
            char.style.fontSize = `${randomSize}vw`;
            currentSize = `${randomSize}vw`;

            char.style.color = randomColorData.value;
            currentColor = randomColorData.name;

                    nextChar();
                }
            }, 2000); // 2秒切换

            // 停止当前语音
            if (speechSynthesis.speaking) {
                speechSynthesis.cancel();
            }
            
            // 移动到下一个字符
            currentIndex = (currentIndex + 1) % allChars.length;
            updateDisplay();
            
            // 第1秒开始朗读当前字符（因为总时长只有2秒）
            speakCurrentChar();
        }

        // 朗读当前字符
        function speakCurrentChar() {
            if (!isSpeechSupported || !isPlaying || isMuted) return;
            
            const currentChar = allChars[currentIndex];
            
            // 清除之前的定时器
            if (charTimeout) clearTimeout(charTimeout);
            
            // 延迟0.5秒后朗读（第1秒开始朗读，因为总时长只有2秒）
            charTimeout = setTimeout(() => {
                if (utterance) speechSynthesis.cancel();
                
                utterance = new SpeechSynthesisUtterance(currentChar);
                utterance.lang = 'zh-CN';
                utterance.rate = 0.8; // 稍微放慢语速
                
                // 获取中文语音
                const voices = speechSynthesis.getVoices();
                const chineseVoice = voices.find(voice => voice.lang === 'zh-CN' || voice.lang === 'zh-TW');
                if (chineseVoice) {
                    utterance.voice = chineseVoice;
                }
                
                speechSynthesis.speak(utterance);
            }, 500); // 延迟0.5秒
        }

        // 上一个字符
        function prevChar() {
            // 停止当前语音
            if (speechSynthesis.speaking) {
                speechSynthesis.cancel();
            }
            
            currentIndex = (currentIndex - 1 + allChars.length) % allChars.length;
            updateDisplay();
            
            // 立即朗读上一个字符
            if (isPlaying && !isMuted) {
                speakCurrentChar();
            }
        }

                playPauseBtn.title = "暂停";
                charElement.classList.remove('paused');
                
                // 如果当前没有语音在播放，开始朗读
                if (!speechSynthesis.speaking && !isMuted) {
                    speakCurrentChar();
                }
                
                // 重新开始自动播放
                startAutoPlay();
            } else {
                playPauseBtn.innerHTML = '<i class="fas fa-play"></i>';
                playPauseBtn.title = "播放";
                charElement.classList.add('paused');
                
                // 停止语音
                if (speechSynthesis.speaking) {
                    speechSynthesis.cancel();
                }
                
                // 清除定时器
                if (timer) clearInterval(timer);
                if (charTimeout) clearTimeout(charTimeout);
            }

                if (isPlaying) {

                }

            const currentChar = allChars[currentIndex];

            let explanationHTML = "";
            
            // 1. 查找典故解释
            const relatedExplanations = [];
            
            for (const [word, explanation] of Object.entries(explanations)) {

                let searchWord = word;

                    searchWord = convertToSimplified(word);

                if (searchWord.includes(currentChar)) {
                    relatedExplanations.push({word: searchWord, explanation});
                }
            }
            
            // 2. 查找非典故用词解释
            const commonWords = [];
            const simplifiedChar = convertToSimplified(currentChar);
            
            // 首先查找单字
            if (commonWordsDefinitions[simplifiedChar]) {
                commonWords.push({

            for (const [word, definition] of Object.entries(commonWordsDefinitions)) {

                case ' ':
                case 'Spacebar':
                    e.preventDefault();
                    togglePlayPause();
                    break;
                case 'ArrowLeft':
                    e.preventDefault();
                    prevChar();
                    break;
                case 'ArrowRight':
                    e.preventDefault();
                    nextChar();
                    break;
                case 'm':
                case 'M':
                    e.preventDefault();
                    toggleMute();
                    break;
                case 'l':
                case 'L':
                    e.preventDefault();
                    toggleLanguage();
                    break;
                case 'Escape':
                    charModal.style.display = 'none';
                    break;
                case 'i':
                case 'I':
                    e.preventDefault();
                    effectInfoElement.classList.toggle('show');
                    break;
            }
        });

        // 页面加载时初始化
        window.addEventListener('load', init);
    </script>
</body>
</html>
