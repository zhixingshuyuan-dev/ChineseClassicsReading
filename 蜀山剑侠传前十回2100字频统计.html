    // 游戏状态变量
    let currentLevel = 1;
    let currentCharIndex = 0;
    let score = 0;
    let isVoiceRecognitionActive = false;
    let recognition;

    // DOM元素
    const currentCharElement = document.getElementById('currentChar');
    const pinyinDisplayElement = document.getElementById('pinyinDisplay');
    const exampleDisplayElement = document.getElementById('exampleDisplay');
    const englishDisplayElement = document.getElementById('englishDisplay');
    const nextCharBtnElement = document.getElementById('nextCharBtn');
    const levelButtonsElement = document.getElementById('levelButtons');
    const voiceBtnElement = document.getElementById('voiceBtn');
    const voiceStatusElement = document.getElementById('voiceStatus');
    const scoreBoardElement = document.getElementById('scoreBoard');
    const levelIndicatorElement = document.getElementById('levelIndicator');

    // 初始化游戏
    function initGame() {
      // 创建等级按钮
      for (let i = 1; i <= 42; i++) {
        const button = document.createElement('button');
        button.className = `level-btn level-${i}`;
        button.textContent = `第${i}级`;
        button.addEventListener('click', () => selectLevel(i));
        levelButtonsElement.appendChild(button);
      }

      // 初始化语音识别
      initVoiceRecognition();

      // 选择默认等级
      selectLevel(1);

      // 添加事件监听器
      nextCharBtnElement.addEventListener('click', showNextChar);
      currentCharElement.addEventListener('click', showCharInfo);
    }

    // 选择等级
    function selectLevel(level) {
      currentLevel = level;
      currentCharIndex = 0;
      score = 0;
      updateScoreBoard();
      
      // 更新等级指示器
      levelIndicatorElement.textContent = `第${level}级字库`;
      
      // 更新按钮状态
      document.querySelectorAll('.level-btn').forEach(btn => {
        btn.classList.remove('active');
      });
      document.querySelector(`.level-btn.level-${level}`).classList.add('active');
      
      // 显示第一个汉字
      showCurrentChar();
    }

    // 显示当前汉字
    function showCurrentChar() {
      const currentChar = charLevels[currentLevel][currentCharIndex];
      currentCharElement.textContent = currentChar;
      
      // 重置显示区域
      pinyinDisplayElement.textContent = '';
      exampleDisplayElement.textContent = '';
      englishDisplayElement.textContent = '';
    }

    // 显示汉字信息
    function showCharInfo() {
      const currentChar = charLevels[currentLevel][currentCharIndex];
      const charInfo = charData[currentChar];
      
      if (charInfo) {
        pinyinDisplayElement.textContent = charInfo.pinyin;
        exampleDisplayElement.textContent = charInfo.example;
        englishDisplayElement.textContent = charInfo.english;
        
        // 朗读拼音、例词和英文
        speakText(charInfo.pinyin);
        setTimeout(() => speakText(charInfo.example), 1000);
        setTimeout(() => speakText(charInfo.english), 2000);
      }
    }

    // 显示下一个汉字
    function showNextChar() {
      currentCharIndex = (currentCharIndex + 1) % charLevels[currentLevel].length;
      showCurrentChar();
    }

    // 初始化语音识别
    function initVoiceRecognition() {
      if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = false;
        recognition.lang = 'zh-CN';

        recognition.onstart = function() {
          isVoiceRecognitionActive = true;
          voiceBtnElement.classList.add('active');
          voiceStatusElement.textContent = '语音识别中...请朗读汉字';
        };

        recognition.onresult = function(event) {
          const spokenText = event.results[0][0].transcript.trim();
          const currentChar = charLevels[currentLevel][currentCharIndex];
          
          voiceStatusElement.textContent = `识别结果: "${spokenText}"`;
          
          // 检查是否匹配当前汉字
          if (spokenText === currentChar) {
            voiceStatusElement.textContent += ' - 正确！';
            score += 10;
            updateScoreBoard();
            
            // 创建爆炸效果
            createExplosionEffect();
            
            // 延迟后显示下一个汉字
            setTimeout(() => {
              showNextChar();
              voiceStatusElement.textContent = '识别成功！继续朗读汉字';
            }, 1500);
          } else {
            voiceStatusElement.textContent += ' - 不匹配，请重试';
          }
        };

        recognition.onerror = function(event) {
          voiceStatusElement.textContent = '识别错误: ' + event.error;
          isVoiceRecognitionActive = false;
          voiceBtnElement.classList.remove('active');
        };

        recognition.onend = function() {
          isVoiceRecognitionActive = false;
          voiceBtnElement.classList.remove('active');
          if (voiceStatusElement.textContent.indexOf('正确') === -1 && 
              voiceStatusElement.textContent.indexOf('识别成功') === -1) {
            voiceStatusElement.textContent = '语音识别已结束，点击按钮重新开始';
          }
        };

        voiceBtnElement.addEventListener('click', toggleVoiceRecognition);
      } else {
        voiceStatusElement.textContent = '您的浏览器不支持语音识别';
        voiceBtnElement.disabled = true;
      }
    }

    // 切换语音识别
    function toggleVoiceRecognition() {
      if (isVoiceRecognitionActive) {
        recognition.stop();
      } else {
        recognition.start();
      }
    }

    // 创建爆炸效果
    function createExplosionEffect() {
      const explosion = document.createElement('div');
      explosion.className = 'explosion';
      explosion.textContent = currentCharElement.textContent;
      explosion.style.left = currentCharElement.offsetLeft + 'px';
      explosion.style.top = currentCharElement.offsetTop + 'px';
      
      document.getElementById('gameContainer').appendChild(explosion);
      
      // 移除爆炸元素
      setTimeout(() => {
        explosion.remove();
      }, 1500);
    }

    // 更新分数板
    function updateScoreBoard() {
      scoreBoardElement.textContent = `分数: ${score}`;
    }

    // 朗读文本
  
   function speakText(text) {
    if ('speechSynthesis' in window) {
      // 停止任何正在进行的语音
      speechSynthesis.cancel();
      
      const utterance = new SpeechSynthesisUtterance(text);
      
      // 强制设置普通话
      utterance.lang = 'zh-CN';
      utterance.rate = 0.8;
      utterance.pitch = 1;
      
      // 等待语音列表加载完成
      if (speechSynthesis.getVoices().length === 0) {
        speechSynthesis.addEventListener('voiceschanged', function() {
          setChineseVoice(utterance);
          speechSynthesis.speak(utterance);
        });
      } else {
        setChineseVoice(utterance);
        speechSynthesis.speak(utterance);
      }
    }
  }
  
  // 设置中文语音
  function setChineseVoice(utterance) {
    const voices = speechSynthesis.getVoices();
    
    // 优先选择明确标识为普通话的语音
    const preferredVoices = [
      'Google 普通话',
      'Microsoft Kangkang - Chinese (Simplified, PRC)',
      'Microsoft Huihui - Chinese (Simplified, PRC)',
      'Ting-Ting',
      'Chinese (China)',
      'Chinese (PRC)',
      'zh-CN',
      'zh'
    ];
    
    // 查找首选语音
    for (const voiceName of preferredVoices) {
      const voice = voices.find(v => 
        v.name.includes(voiceName) || 
        v.lang === 'zh-CN' ||
        v.lang === 'cmn-CN'
      );
      if (voice) {
        utterance.voice = voice;
        break;
      }
    }
    
    // 如果没有找到首选语音，尝试其他中文语音
    if (!utterance.voice) {
      const chineseVoice = voices.find(voice => 
        voice.lang.startsWith('zh') || 
        voice.lang.includes('Chinese') ||
        voice.name.includes('Chinese')
      );
      if (chineseVoice) {
        utterance.voice = chineseVoice;
      }
    }
  }

  // 修改显示汉字信息函数，确保使用普通话
  function showCharInfo() {
    const currentChar = charLevels[currentLevel][currentCharIndex];
    const charInfo = charData[currentChar];
    
    if (charInfo) {
      pinyinDisplayElement.textContent = charInfo.pinyin;
      exampleDisplayElement.textContent = charInfo.example;
      englishDisplayElement.textContent = charInfo.english;
      
      // 使用普通话朗读拼音和例词
      speakText(charInfo.pinyin);
      setTimeout(() => speakText(charInfo.example), 1200);
      setTimeout(() => {
        // 英文解释使用英文语音
        if ('speechSynthesis' in window) {
          const englishUtterance = new SpeechSynthesisUtterance(charInfo.english);
          englishUtterance.lang = 'en-US';
          englishUtterance.rate = 0.8;
          speechSynthesis.speak(englishUtterance);
        }
      }, 2400);
}
  }

    window.addEventListener('load', initGame);
