幾陣秋風能應候，一犁春雨甚知時。
智伯恩深國士吞變形之炭；羊公德大邑人豎墮淚之碑。

笛韻和諧仙管恰從雲裡降；櫓聲咿軋漁舟正向雪中移。 
戈對甲，鼓對旗，紫燕對黃鸝。酸梅對李苦，青眼對白眉。
三弄笛，一圍棋，雨打對風吹。海棠春睡早，楊柳晝眠遲。
張駿曾為槐樹賦，杜陵不做海棠詩。

        // 繁简转换函数
        function convertToTraditional(text) {
            return text.split('').map(char => simplifiedToTraditional[char] || char).join('');
        }
        
        function convertToSimplified(text) {
            const traditionalToSimplified = {};
            for (const [simplified, traditional] of Object.entries(simplifiedToTraditional)) {
                traditionalToSimplified[traditional] = simplified;
            }
            return text.split('').map(char => traditionalToSimplified[char] || char).join('');
        }

        // 更新显示
        function updateDisplay() {
            const currentChar = allChars[currentIndex];
            charElement.textContent = currentChar;
            currentIndexElement.textContent = currentIndex + 1;
            
            const progress = ((currentIndex + 1) / allChars.length) * 100;
            progressBarElement.style.width = `${progress}%`;
            
            if (!isPlaying) {
                charElement.classList.add('paused');
            } else {
                charElement.classList.remove('paused');
            }
            
            applyRandomEffects();
        }

        // 应用随机效果
        function applyRandomEffects() {
            const charDisplay = document.querySelector('.char-display');
            const char = document.getElementById('char');
            
            const randomPosition = positions[Math.floor(Math.random() * positions.length)];
            charDisplay.style.justifyContent = randomPosition.justifyContent;
            charDisplay.style.alignItems = randomPosition.alignItems;
            
            const positionKey = `${randomPosition.justifyContent},${randomPosition.alignItems}`;
            currentPosition = positionMap[positionKey] || "随机位置";
            
            const minSize = 10;
            const maxSize = 30;
            const randomSize = Math.floor(Math.random() * (maxSize - minSize + 1)) + minSize;
            char.style.fontSize = `${randomSize}vw`;
            currentSize = `${randomSize}vw`;
            
            const randomColorData = darkColors[Math.floor(Math.random() * darkColors.length)];
            char.style.color = randomColorData.value;
            currentColor = randomColorData.name;
            
            const shadowX = Math.floor(Math.random() * 10) - 5;
            const shadowY = Math.floor(Math.random() * 10) - 5;
            const shadowBlur = Math.floor(Math.random() * 10) + 5;
            const shadowColor = `rgba(0, 0, 0, ${Math.random() * 0.5 + 0.2})`;
            char.style.textShadow = `${shadowX}px ${shadowY}px ${shadowBlur}px ${shadowColor}`;
            
            updateEffectInfo();
        }

        function updateEffectInfo() {
            positionInfoElement.textContent = currentPosition;
            sizeInfoElement.textContent = currentSize;
            colorInfoElement.textContent = currentColor;
            
            effectInfoElement.classList.add('show');
            
            clearTimeout(effectInfoElement.timeout);
            effectInfoElement.timeout = setTimeout(() => {
                effectInfoElement.classList.remove('show');
            }, 3000);

        // 开始自动播放（每个字2秒）
        function startAutoPlay() {
            if (timer) clearInterval(timer);
            
            timer = setInterval(() => {
                if (isPlaying) {
                    nextChar();
                }
            }, 2000);
        }

        // 播放下一个字符
        function nextChar() {
            if (speechSynthesis.speaking) {
                speechSynthesis.cancel();
            }
            
            currentIndex = (currentIndex + 1) % allChars.length;
            updateDisplay();
            
            speakCurrentChar();
        }

        // 朗读当前字符
        function speakCurrentChar() {
            if (!isSpeechSupported || !isPlaying || isMuted) return;
            
            const currentChar = allChars[currentIndex];
            
            if (charTimeout) clearTimeout(charTimeout);
            
            charTimeout = setTimeout(() => {
                if (utterance) speechSynthesis.cancel();
                
                utterance = new SpeechSynthesisUtterance(currentChar);
                utterance.lang = 'zh-CN';
                utterance.rate = 0.8;
                
                const voices = speechSynthesis.getVoices();
                const chineseVoice = voices.find(voice => voice.lang === 'zh-CN' || voice.lang === 'zh-TW');
                if (chineseVoice) {
                    utterance.voice = chineseVoice;
                }
                
                speechSynthesis.speak(utterance);
            }, 500);
        }

        // 上一个字符
        function prevChar() {
            if (speechSynthesis.speaking) {
                speechSynthesis.cancel();
            }
            
            currentIndex = (currentIndex - 1 + allChars.length) % allChars.length;
            updateDisplay();
            
            if (isPlaying && !isMuted) {
                speakCurrentChar();
            }
        }

            isPlaying = !isPlaying;
            
            if (isPlaying) {
                playPauseBtn.innerHTML = '<i class="fas fa-pause"></i>';
                playPauseBtn.title = "暂停";
                charElement.classList.remove('paused');
                
                if (!speechSynthesis.speaking && !isMuted) {
                    speakCurrentChar();
                }
                
                startAutoPlay();
            } else {
                playPauseBtn.innerHTML = '<i class="fas fa-play"></i>';
                playPauseBtn.title = "播放";
                charElement.classList.add('paused');
                
                if (speechSynthesis.speaking) {
                    speechSynthesis.cancel();
                }
                
                if (timer) clearInterval(timer);
                if (charTimeout) clearTimeout(charTimeout);
            }
        }

                muteBtn.innerHTML = '<i class="fas fa-volume-mute"></i>';
                muteBtn.title = "取消静音";
                muteBtn.classList.add('muted');
                
                if (speechSynthesis.speaking) {
                    speechSynthesis.cancel();

            } else {
                muteBtn.innerHTML = '<i class="fas fa-volume-up"></i>';
                muteBtn.title = "静音";
                muteBtn.classList.remove('muted');
                
                if (isPlaying) {
                    speakCurrentChar();
                }
            }
        }

            isTraditional = !isTraditional;
            
            if (isTraditional) {
                allChars = originalChars.map(char => convertToTraditional(char));
                langBtn.textContent = "繁";
                langBtn.title = "切换到简体字";
            } else {
                allChars = originalChars.map(char => convertToSimplified(char));
                langBtn.textContent = "简";
                langBtn.title = "切换到繁体字";
            }
            
            updateDisplay();
            
            langBtn.classList.toggle('active', isTraditional);

        // 显示汉字解释
        function showExplanation() {
            const currentChar = allChars[currentIndex];
            modalCharElement.textContent = currentChar;
            
            let explanationHTML = "";
            
            const relatedExplanations = [];
            
            for (const [word, explanation] of Object.entries(explanations)) {
                let searchWord = word;
                if (!isTraditional) {
                    searchWord = convertToSimplified(word);
                }
                
                if (searchWord.includes(currentChar)) {
                    relatedExplanations.push({word: searchWord, explanation});
                }
            }
            
            const commonWords = [];
            const simplifiedChar = convertToSimplified(currentChar);
            
            if (commonWordsDefinitions[simplifiedChar]) {
                commonWords.push({
                    word: currentChar,
                    ...commonWordsDefinitions[simplifiedChar]
                });
            }
            
            for (const [word, definition] of Object.entries(commonWordsDefinitions)) {
                if (word.includes(simplifiedChar) && word !== simplifiedChar) {
                    let displayWord = word;
                    if (isTraditional) {
                        displayWord = convertToTraditional(word);
                    }
                    
                    commonWords.push({
                        word: displayWord,
                        ...definition

                case 'i':
                case 'I':
                    e.preventDefault();
                    effectInfoElement.classList.toggle('show');
                    break;
            }
        });

        // 页面加载时初始化
        window.addEventListener('load', init);
    </script>
</body>
</html>
