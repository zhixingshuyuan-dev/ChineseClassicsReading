<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>汉字声符轰击游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            color: white;
            min-height: 100vh;
            display: flex;
            padding: 20px;
            overflow: auto;
        }
        
        .left-controls, .right-controls {
            width: 200px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 20px;
        }
        
        .game-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 800px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .header h1 {
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            margin-bottom: 10px;
        }
        
        .instructions {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            line-height: 1.5;
        }
        
        .game-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 10px;
        }
        
        .game-area {
            position: relative;
            height: 500px;
            background: rgba(0, 0, 0, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        
        .character-container {
            position: absolute;
            z-index: 5;
        }
        
        .drone {
            width: 40px;
            height: 40px;
            background: #666;
            border-radius: 50% 50% 0 0;
            position: relative;
            margin: 0 auto 5px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .drone::before, .drone::after {
            content: '';
            position: absolute;
            width: 50px;
            height: 8px;
            background: #888;
            border-radius: 4px;
        }
        
        .drone::before {
            top: -4px;
            left: -5px;
        }
        
        .drone::after {
            top: -4px;
            right: -5px;
        }
        
        .drone-light {
            width: 8px;
            height: 8px;
            background: #00ff00;
            border-radius: 50%;
            animation: blink 1s infinite;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        .character {
            font-size: 36px;
            font-weight: bold;
            text-align: center;
            padding: 12px 18px;
            background: rgba(255, 255, 255, 0.95);
            color: #333;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            transition: transform 0.1s;
        }
        
        .radical-selector {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        .radical-btn {
            width: 70px;
            height: 70px;
            background: linear-gradient(to bottom, #4CAF50, #2E7D32);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 3px 5px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        .radical-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.4);
        }
        
        .radical-btn.active {
            background: linear-gradient(to bottom, #FF9800, #e68900);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.7);
        }
        
        .radical-pinyin {
            font-size: 12px;
            margin-top: 2px;
            font-weight: normal;
        }
        
        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        button {
            padding: 12px 20px;
            font-size: 16px;
            background: linear-gradient(to bottom, #4CAF50, #2E7D32);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 3px 5px rgba(0, 0, 0, 0.3);
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 8px rgba(0, 0, 0, 0.4);
        }
        
        button:disabled {
            background: linear-gradient(to bottom, #777, #555);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .score-display, .level-info, .lives {
            font-size: 1.3rem;
            font-weight: bold;
        }
        
        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.85);
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            z-index: 100;
            display: none;
            width: 80%;
            max-width: 400px;
        }
        
        .explosion {
            position: absolute;
            width: 60px;
            height: 60px;
            background: radial-gradient(circle, #ff9900, #ff3300, transparent);
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
            z-index: 15;
        }
        
        .radical-info {
            font-size: 1.1rem;
            margin-top: 10px;
            text-align: center;
        }
        
        .current-character {
            font-size: 1.2rem;
            text-align: center;
            margin-bottom: 10px;
            font-weight: bold;
            color: #ffcc00;
        }
        
        .control-panel {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        
        .control-panel h3 {
            margin-bottom: 10px;
            text-align: center;
            color: #ffcc00;
        }
        
        .voice-message {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 0, 0, 0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 1.2rem;
            font-weight: bold;
            z-index: 20;
            display: none;
        }
        
        .level-selector {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .level-btn {
            padding: 10px;
            background: linear-gradient(to bottom, #2196F3, #0b7dda);
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .level-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 3px 5px rgba(0, 0, 0, 0.3);
        }
        
        .level-btn.active {
            background: linear-gradient(to bottom, #FF9800, #e68900);
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.7);
        }
        
        .character-highlight {
            animation: highlight 0.8s ease-in-out;
        }
        
        @keyframes highlight {
            0% { transform: scale(1); background-color: rgba(255, 255, 255, 0.95); }
            50% { transform: scale(1.2); background-color: rgba(255, 255, 0, 0.9); }
            100% { transform: scale(1); background-color: rgba(255, 255, 255, 0.95); }
        }
        
        .system-speak {
            position: absolute;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 100, 255, 0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 1.2rem;
            font-weight: bold;
            z-index: 20;
            display: none;
        }
    </style>
</head>
<body>
    <div class="left-controls">
        <div class="control-panel">
            <h3>关卡选择</h3>
            <div class="level-selector" id="levelSelector">
                <!-- 关卡按钮将在这里动态生成 -->
            </div>
        </div>
        
        <div class="control-panel">
            <h3>游戏控制</h3>
            <div class="controls">
                <button id="startBtn">开始游戏</button>
                <button id="pauseBtn" disabled>暂停</button>
                <button id="restartBtn">重新开始</button>
            </div>
        </div>
        
        <div class="control-panel">
            <h3>游戏信息</h3>
            <div class="score-display">得分: <span id="score">0</span></div>
            <div class="level-info">关卡: <span id="level">1</span></div>
            <div class="lives">生命值: <span id="lives">3</span></div>
        </div>
    </div>
    
    <div class="game-container">
        <div class="header">
            <h1>汉字声符轰击游戏</h1>
            <p>点击声符击落对应的汉字无人机！</p>
        </div>
        
        <div class="instructions">
            <p>游戏规则：点击声符击落对应声符的汉字无人机。正确击中+10分，错误击中-5分，汉字逃脱-1生命值。</p>
        </div>
        
        <div class="radical-info" id="radicalInfo"></div>
        <div class="current-character" id="currentCharacter"></div>
        
        <div class="game-area" id="gameArea">
            <!-- 汉字无人机将在这里动态生成 -->
            <div class="voice-message" id="voiceMessage">打错人了！</div>
            <div class="system-speak" id="systemSpeak"></div>
        </div>
        
        <div class="radical-selector" id="radicalSelector">
            <!-- 声符选择器将在这里动态生成 -->
        </div>
    </div>
    
    <div class="right-controls">
        <div class="control-panel">
            <h3>关卡控制</h3>
            <div class="controls">
                <button id="nextLevelBtn" disabled>下一关</button>
            </div>
        </div>
        
        <div class="control-panel">
            <h3>游戏说明</h3>
            <p>汉字无人机会左右移动并缓慢下降，点击对应声符击落汉字！</p>
        </div>
        
        <div class="control-panel">
            <h3>游戏技巧</h3>
            <p>• 观察汉字上方的声符提示</p>
            <p>• 瞄准移动中的无人机</p>
            <p>• 不要着急，准确比快速更重要</p>
        </div>
    </div>
    
    <div class="game-over" id="gameOver">
        <h2>游戏结束</h2>
        <p>你的最终得分: <span id="finalScore">0</span></p>
        <button id="playAgainBtn">再玩一次</button>
    </div>

    <script>
        // 游戏数据 - 扩展更多关卡数据，每个关卡5个声符

            { id: 22, radical: "䍃", pinyin: "yáo", characters: ["摇", "遥", "瑶", "谣", "鹞"] },
            { id: 23, radical: "萬", pinyin: "wàn", characters: ["万", "厉", "迈", "励", "砺"] },
            { id: 24, radical: "賁", pinyin: "bēn", characters: ["奔", "喷", "愤", "墳", "豶"] },

            { id: 30, radical: "豈", pinyin: "qǐ", characters: ["岂", "凯", "恺", "皑", "觊"] },
            
            // 关卡7
            { id: 31, radical: "睪", pinyin: "yì", characters: ["睪", "译", "绎", "驿", "铎"] },
            { id: 32, radical: "复", pinyin: "fù", characters: ["复", "腹", "覆", "馥", "蝮"] },
            { id: 33, radical: "𦭝", pinyin: "miè", characters: ["蔑", "篾", "蠛", "懱", "衊"] },
            { id: 34, radical: "奚", pinyin: "xī", characters: ["奚", "溪", "蹊", "雞", "鷄"] },
            { id: 35, radical: "虍", pinyin: "hū", characters: ["虎", "虚", "虏", "虑", "虞"] },
            
            // 关卡8
            { id: 36, radical: "叚", pinyin: "jiǎ", characters: ["假", "暇", "霞", "瑕", "蝦"] },
            { id: 37, radical: "烏", pinyin: "wū", characters: ["乌", "呜", "坞", "邬", "钨"] },
            { id: 38, radical: "需", pinyin: "xū", characters: ["需", "儒", "濡", "懦", "蠕"] },
            { id: 39, radical: "疋", pinyin: "pǐ", characters: ["疋", "胥", "疏", "楚", "蔬"] },
            { id: 40, radical: "青", pinyin: "qīng", characters: ["青", "清", "晴", "情", "请"] },
            
            // 关卡9
            { id: 41, radical: "包", pinyin: "bāo", characters: ["包", "抱", "饱", "胞", "苞"] },
            { id: 42, radical: "方", pinyin: "fāng", characters: ["方", "放", "房", "防", "访"] },
            { id: 43, radical: "分", pinyin: "fēn", characters: ["分", "份", "芬", "纷", "粉"] },
            { id: 44, radical: "工", pinyin: "gōng", characters: ["工", "功", "攻", "贡", "空"] },
            { id: 45, radical: "古", pinyin: "gǔ", characters: ["古", "故", "固", "姑", "估"] },
            
            // 关卡10
            { id: 46, radical: "化", pinyin: "huà", characters: ["化", "花", "华", "货", "哗"] },
            { id: 47, radical: "交", pinyin: "jiāo", characters: ["交", "校", "较", "饺", "狡"] },
            { id: 48, radical: "可", pinyin: "kě", characters: ["可", "河", "何", "哥", "歌"] },
            { id: 49, radical: "良", pinyin: "liáng", characters: ["良", "粮", "狼", "浪", "朗"] },
            { id: 50, radical: "令", pinyin: "lìng", characters: ["令", "铃", "领", "零", "龄"] }
        ];

        // 游戏状态
        let gameState = {
            score: 0,
            level: 1,
            lives: 3,
            isPlaying: false,
            isPaused: false,
            currentRadicals: [],
            currentCharacter: null,
            explosions: [],
            characterInterval: null,
            gameLoopId: null
        };

        // DOM元素
        const gameArea = document.getElementById('gameArea');
        const radicalSelector = document.getElementById('radicalSelector');
        const scoreDisplay = document.getElementById('score');
        const levelDisplay = document.getElementById('level');
        const livesDisplay = document.getElementById('lives');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const nextLevelBtn = document.getElementById('nextLevelBtn');
        const restartBtn = document.getElementById('restartBtn');
        const gameOverScreen = document.getElementById('gameOver');
        const finalScoreDisplay = document.getElementById('finalScore');
        const playAgainBtn = document.getElementById('playAgainBtn');
        const radicalInfo = document.getElementById('radicalInfo');
        const currentCharacterDisplay = document.getElementById('currentCharacter');
        const voiceMessage = document.getElementById('voiceMessage');
        const levelSelector = document.getElementById('levelSelector');
        const systemSpeak = document.getElementById('systemSpeak');

        // 初始化游戏
        function initGame() {
            gameState.score = 0;
            gameState.level = 1;
            gameState.lives = 3;
            gameState.isPlaying = false;
            gameState.isPaused = false;
            gameState.currentRadicals = [];
            gameState.currentCharacter = null;
            gameState.explosions = [];
            
            if (gameState.characterInterval) {
                clearInterval(gameState.characterInterval);
                gameState.characterInterval = null;
            }
            
            if (gameState.gameLoopId) {
                cancelAnimationFrame(gameState.gameLoopId);
                gameState.gameLoopId = null;
            }
            
            updateUI();
            gameOverScreen.style.display = 'none';
            clearGameArea();
            radicalInfo.textContent = "点击'开始游戏'按钮开始游戏";
            currentCharacterDisplay.textContent = "";
            
            // 创建关卡选择按钮
            createLevelButtons();
        }

        // 创建关卡选择按钮
        function createLevelButtons() {
            levelSelector.innerHTML = '';
            
            // 总共10个关卡
            for (let i = 1; i <= 10; i++) {
                const levelBtn = document.createElement('button');
                levelBtn.className = 'level-btn';
                levelBtn.textContent = `关卡 ${i}`;
                levelBtn.dataset.level = i;
                
                if (i === 1) {
                    levelBtn.classList.add('active');
                }
                
                levelBtn.addEventListener('click', () => {
                    // 移除所有按钮的active类
                    document.querySelectorAll('.level-btn').forEach(btn => {
                        btn.classList.remove('active');
                    });
                    
                    // 添加active类到当前按钮
                    levelBtn.classList.add('active');
                    
                    // 设置关卡
                    gameState.level = i;
                    levelDisplay.textContent = i;
                    
                    // 如果不是在游戏中，更新声符
                    if (!gameState.isPlaying) {
                        selectRandomRadicals();
                        createRadicalSelector();
                    }
                });
                
                levelSelector.appendChild(levelBtn);
            }
        }

        // 开始游戏
        function startGame() {
            if (gameState.isPlaying) return;
            
            gameState.isPlaying = true;
            gameState.isPaused = false;
            
            // 选择随机声符
            selectRandomRadicals();
            
            // 创建声符选择器
            createRadicalSelector();
            
            // 开始生成汉字
            generateCharacter();
            
            updateUI();
            
            // 开始游戏循环
            gameLoop();
        }

        // 选择随机声符
        function selectRandomRadicals() {
            // 每关使用5个声符
            const radicalCount = 5;
            
            // 使用关卡号作为随机种子的一部分，确保每关声符不同
            const seed = gameState.level * 123;
            
            // 计算当前关卡应该使用的声符范围
            const startIndex = (gameState.level - 1) * 5;
            const endIndex = startIndex + 5;
            
            // 获取当前关卡的声符
            gameState.currentRadicals = gameData.slice(startIndex, endIndex);
            
            // 更新声符信息
            const radicalNames = gameState.currentRadicals.map(r => `${r.radical}(${r.pinyin})`).join('、');
            radicalInfo.textContent = `当前关卡声符: ${radicalNames}`;
        }

          // 创建声符选择器
    function createRadicalSelector() {
        radicalSelector.innerHTML = '';
        
        gameState.currentRadicals.forEach((radicalData, index) => {
            const radicalBtn = document.createElement('button');
            radicalBtn.className = 'radical-btn';
            
            // 创建声符和拼音的HTML
            radicalBtn.innerHTML = `
                <div>${radicalData.radical}</div>
                <div class="radical-pinyin">${radicalData.pinyin}</div>
            `;
            
            radicalBtn.dataset.radical = radicalData.radical;
            radicalBtn.dataset.index = index;
            
            // 添加点击事件（移除了朗读声符的功能）
            radicalBtn.addEventListener('click', () => {
                // 直接选择声符，不朗读
                selectRadical(index);
            });
            
            radicalSelector.appendChild(radicalBtn);
        });
    }

    // 朗读汉字
    function speakCharacter(character, type) {
        if ('speechSynthesis' in window) {
            const utterance = new SpeechSynthesisUtterance(character);
            utterance.lang = 'zh-CN';
            utterance.rate = 0.8;
            utterance.pitch = 1.0;
            
            // 移除系统朗读时的提示显示
            if (type === "system") {
                // 系统朗读时不显示提示文字
                utterance.onend = function() {
                    // 不需要显示任何内容
                };
            }
            
            speechSynthesis.speak(utterance);
        }
    }

    // 选择声符
    function selectRadical(radicalIndex) {
        if (!gameState.isPlaying || gameState.isPaused || !gameState.currentCharacter) return;
        
        const radicalBtn = document.querySelectorAll('.radical-btn')[radicalIndex];
        const radical = gameState.currentRadicals[radicalIndex].radical;
        
        // 检查声符是否匹配
        if (radical === gameState.currentCharacter.radical) {
            // 正确击中
            gameState.score += 10;
            
            // 先朗读汉字（玩家点击后立即朗读）
            speakCharacter(gameState.currentCharacter.character, "player");
            
            // 添加高亮效果
            gameState.currentCharacter.element.classList.add('character-highlight');
            
            // 激活声符按钮效果
            radicalBtn.classList.add('active');
            
            // 延迟爆炸效果
            setTimeout(() => {
                // 系统朗读汉字（爆炸前朗读）- 不显示提示
                speakCharacter(gameState.currentCharacter.character, "system");
                
                // 延迟爆炸
                setTimeout(() => {
                    createExplosion(gameState.currentCharacter.x + gameState.currentCharacter.width/2, 
                                  gameState.currentCharacter.y + gameState.currentCharacter.height/2);
                    
                    // 播放爆炸音效
                    playExplosionSound();
                    
                    // 移除字符
                    gameArea.removeChild(gameState.currentCharacter.container);
                    gameState.currentCharacter = null;
                    
                    // 移除声符按钮激活效果
                    radicalBtn.classList.remove('active');
                    
                    updateUI();
                    
                    // 生成新字符
                    if (gameState.isPlaying && !gameState.isPaused) {
                        setTimeout(() => {
                            if (gameState.isPlaying && !gameState.isPaused) {
                                generateCharacter();
                            }
                        }, 800);
                    }
                }, 800); // 系统朗读后延迟800ms爆炸
            }, 800); // 玩家朗读后延迟800ms系统朗读
        } else {
            // 错误击中，扣分
            gameState.score = Math.max(0, gameState.score - 5);
            
            // 显示"打错人了"消息
            showVoiceMessage();
            
            // 播放错误音效
            playErrorSound();
            
            // 激活声符按钮效果（红色）
            radicalBtn.style.background = 'linear-gradient(to bottom, #ff3333, #cc0000)';
            
            // 立即移除字符
            gameArea.removeChild(gameState.currentCharacter.container);
            gameState.currentCharacter = null;
            
            // 移除声符按钮激活效果
            setTimeout(() => {
                radicalBtn.style.background = '';
            }, 500);
            
            updateUI();
            
            // 生成新字符
            if (gameState.isPlaying && !gameState.isPaused) {
                setTimeout(() => {
                    if (gameState.isPlaying && !gameState.isPaused) {
                        generateCharacter();
                    }
                }, 800);
            }
        }
        
        // 播放选择音效
        playSelectSound();
    
        }

        // 生成单个汉字
        function generateCharacter() {
            // 清除之前的字符
            if (gameState.currentCharacter && gameState.currentCharacter.container) {
                gameArea.removeChild(gameState.currentCharacter.container);
            }
            
            // 随机选择一个声符
            const radicalIndex = Math.floor(Math.random() * gameState.currentRadicals.length);
            const radicalData = gameState.currentRadicals[radicalIndex];
            
            // 从该声符的汉字中随机选择一个
            const characterIndex = Math.floor(Math.random() * radicalData.characters.length);
            const character = radicalData.characters[characterIndex];
            
            // 创建字符容器
            const charContainer = document.createElement('div');
            charContainer.className = 'character-container';
            
            // 创建无人机图标
            const drone = document.createElement('div');
            drone.className = 'drone';
            const droneLight = document.createElement('div');
            droneLight.className = 'drone-light';
            drone.appendChild(droneLight);
            
            // 创建字符元素
            const charElement = document.createElement('div');
            charElement.className = 'character';
            charElement.textContent = character;
            charElement.dataset.radical = radicalData.radical;
            
            // 将无人机和字符添加到容器
            charContainer.appendChild(drone);
            charContainer.appendChild(charElement);
            
            // 随机初始位置
            const x = Math.random() * (gameArea.offsetWidth - 100) + 50;
            charContainer.style.left = `${x}px`;
            charContainer.style.top = '50px';
            
            gameArea.appendChild(charContainer);
            
            // 随机水平移动方向
            const horizontalDirection = Math.random() > 0.5 ? 1 : -1;
            // 根据关卡调整移动速度
            const horizontalSpeed = 0.3 + (gameState.level * 0.1);
            
            // 添加到游戏状态
            gameState.currentCharacter = {
                container: charContainer,
                element: charElement,
                x: x,
                y: 50,
                radical: radicalData.radical,
                character: character,
                verticalSpeed: 0.3 + (gameState.level * 0.05),
                horizontalSpeed: horizontalSpeed,
                horizontalDirection: horizontalDirection,
                width: 60,
                height: 50
            };
            
            // 更新当前汉字显示
            currentCharacterDisplay.textContent = `当前汉字: ${character}`;
        }

        // 游戏主循环
        function gameLoop() {
            if (!gameState.isPlaying) return;
            
            // 更新字符位置
            updateCharacter();
            
            // 更新爆炸效果
            updateExplosions();
            
            // 检查游戏结束条件
            checkGameOver();
            
            // 继续循环
            if (gameState.isPlaying && !gameState.isPaused) {
                gameState.gameLoopId = requestAnimationFrame(gameLoop);
            }
        }

        // 更新字符位置
        function updateCharacter() {
            if (!gameState.currentCharacter) return;
            
            const char = gameState.currentCharacter;
            
            // 垂直移动（下降）
            char.y += char.verticalSpeed;
            
            // 水平移动 - 简单的左右移动
            char.x += char.horizontalSpeed * char.horizontalDirection;
            
            // 检查边界，碰到边界时改变方向
            if (char.x <= 0 || char.x >= gameArea.offsetWidth - char.width) {
                char.horizontalDirection *= -1;
            }
            
            char.container.style.left = `${char.x}px`;
            char.container.style.top = `${char.y}px`;
            
            // 如果字符超出底部，移除并扣分
            if (char.y > gameArea.offsetHeight) {
                gameArea.removeChild(char.container);
                gameState.currentCharacter = null;
                gameState.lives--;
                updateUI();
                
                // 播放错误音效
                playErrorSound();
                
                // 如果还有生命值，生成新字符
                if (gameState.lives > 0 && gameState.isPlaying) {
                    setTimeout(() => {
                        if (gameState.isPlaying && !gameState.isPaused) {
                            generateCharacter();
                        }
                    }, 1000);
                }
            }
        }

        // 朗读汉字
        function speakCharacter(character, type) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(character);
                utterance.lang = 'zh-CN';
                utterance.rate = 0.8;
                utterance.pitch = 1.0;
                
                if (type === "system") {
                    // 系统朗读时显示提示
                    systemSpeak.textContent = `${character} `;
                    systemSpeak.style.display = 'block';
                    
                    utterance.onend = function() {
                        setTimeout(() => {
                            systemSpeak.style.display = 'none';
                        }, 500);
                    };
                }
                
                speechSynthesis.speak(utterance);
            }
        }

        // 显示"打错人了"消息
        function showVoiceMessage() {
            voiceMessage.style.display = 'block';
            setTimeout(() => {
                voiceMessage.style.display = 'none';
            }, 1500);
            
            // 播放语音
            speakMessage("打错人了");
        }

        // 语音合成
        function speakMessage(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-CN';
                utterance.rate = 1.0;
                utterance.pitch = 1.0;
                speechSynthesis.speak(utterance);
            }
        }

        // 创建爆炸效果
        function createExplosion(x, y) {
            const explosion = document.createElement('div');
            explosion.className = 'explosion';
            explosion.style.left = `${x - 25}px`;
            explosion.style.top = `${y - 25}px`;
            explosion.style.opacity = '1';
            
            gameArea.appendChild(explosion);
            gameState.explosions.push({
                element: explosion,
                opacity: 1,
                size: 50
            });
        }

        // 更新爆炸效果
        function updateExplosions() {
            for (let i = gameState.explosions.length - 1; i >= 0; i--) {
                const explosion = gameState.explosions[i];
                explosion.opacity -= 0.05;
                explosion.size += 5;
                
                explosion.element.style.opacity = explosion.opacity;
                explosion.element.style.width = `${explosion.size}px`;
                explosion.element.style.height = `${explosion.size}px`;
                explosion.element.style.left = `${
                    parseFloat(explosion.element.style.left) - 2.5
                }px`;
                explosion.element.style.top = `${
                    parseFloat(explosion.element.style.top) - 2.5
                }px`;
                
                if (explosion.opacity <= 0) {
                    gameArea.removeChild(explosion.element);
                    gameState.explosions.splice(i, 1);
                }
            }
        }

        // 检查游戏结束条件
        function checkGameOver() {
            if (gameState.lives <= 0) {
                endGame();
            }
            
            // 检查是否应该进入下一关（例如得分达到一定值）
            if (gameState.score >= gameState.level * 100) {
                nextLevelBtn.disabled = false;
            }
        }

        // 进入下一关
        function nextLevel() {
            gameState.level++;
            
            // 更新关卡显示
            levelDisplay.textContent = gameState.level;
            
            // 更新关卡按钮状态
            document.querySelectorAll('.level-btn').forEach(btn => {
                btn.classList.remove('active');
                if (parseInt(btn.dataset.level) === gameState.level) {
                    btn.classList.add('active');
                }
            });
            
            // 清除当前字符
            clearGameArea();
            
            // 选择新的声符
            selectRandomRadicals();
            
            // 更新声符选择器
            createRadicalSelector();
            
            // 生成新字符
            generateCharacter();
            
            updateUI();
        }

        // 结束游戏
        function endGame() {
            gameState.isPlaying = false;
            
            finalScoreDisplay.textContent = gameState.score;
            gameOverScreen.style.display = 'block';
        }

        // 清除游戏区域
        function clearGameArea() {
            // 移除当前字符
            if (gameState.currentCharacter && gameState.currentCharacter.container) {
                gameArea.removeChild(gameState.currentCharacter.container);
                gameState.currentCharacter = null;
            }
            
            // 移除所有爆炸效果
            gameState.explosions.forEach(explosion => {
                if (explosion.element.parentNode) {
                    explosion.element.parentNode.removeChild(explosion.element);
                }
            });
            gameState.explosions = [];
            
            currentCharacterDisplay.textContent = "";
        }

        // 更新UI
        function updateUI() {
            scoreDisplay.textContent = gameState.score;
            levelDisplay.textContent = gameState.level;
            livesDisplay.textContent = gameState.lives;
            
            // 更新按钮状态
            startBtn.disabled = gameState.isPlaying;
            pauseBtn.disabled = !gameState.isPlaying;
            nextLevelBtn.disabled = !gameState.isPlaying || gameState.score < gameState.level * 100;
            pauseBtn.textContent = gameState.isPaused ? '继续' : '暂停';
        }

        // 暂停/继续游戏
        function togglePause() {
            if (!gameState.isPlaying) return;
            
            gameState.isPaused = !gameState.isPaused;
            updateUI();
            
            if (!gameState.isPaused) {
                gameLoop();
            }
        }

        // 音效模拟
        function playSelectSound() {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.value = 600;
                oscillator.type = 'sine';
                
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.2);
            } catch (e) {
                console.log("选择音效");
            }
        }
        
        function playExplosionSound() {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                
                // 创建更悦耳的爆炸音效 - 使用多个振荡器
                const osc1 = audioContext.createOscillator();
                const osc2 = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                osc1.connect(gainNode);
                osc2.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                // 设置振荡器参数
                osc1.frequency.value = 200;
                osc1.type = 'sine';
                
                osc2.frequency.value = 400;
                osc2.type = 'triangle';
                
                // 设置音量包络
                gainNode.gain.setValueAtTime(0.6, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.8);
                
                // 启动振荡器
                osc1.start(audioContext.currentTime);
                osc2.start(audioContext.currentTime);
                
                // 停止振荡器
                osc1.stop(audioContext.currentTime + 0.8);
                osc2.stop(audioContext.currentTime + 0.8);
            } catch (e) {
                console.log("爆炸音效");
            }
        }
        
        function playErrorSound() {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.value = 300;
                oscillator.type = 'square';
                
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.3);
            } catch (e) {
                console.log("错误音效");
            }
        }

        // 事件监听
        startBtn.addEventListener('click', startGame);
        
        pauseBtn.addEventListener('click', togglePause);
        
        nextLevelBtn.addEventListener('click', nextLevel);
        
        restartBtn.addEventListener('click', () => {
            initGame();
        });
        
        playAgainBtn.addEventListener('click', () => {
            initGame();
            startGame();
        });

        // 初始化游戏
        initGame();
    </script>
</body>
</html>
