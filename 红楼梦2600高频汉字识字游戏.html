    .panel-title {

      display: flex;
      align-items: center;

    .panel-title i {

    }

      font-weight: bold;
      color: #4fc3f7;
      box-shadow: 0 0 15px rgba(79, 195, 247, 0.4);
    }
    
    #levelIndicator {
      position: absolute;
      top: 15px;
      right: 15px;
      font-size: 1.2rem;
      z-index: 100;
      background: rgba(0, 0, 0, 0.6);
      padding: 6px 16px;
      border-radius: 30px;
      font-weight: bold;
      color: #ffd700;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
    }
    
    /* 语音识别按钮 */
    .voice-btn {
      background: linear-gradient(to right, #4facfe, #00f2fe);

      border-radius: 8px;
      color: white;
      padding: 12px 15px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 1rem;
    }
    
    .voice-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 10px rgba(0, 0, 0, 0.3);
    }

      background: linear-gradient(to right, #ff416c, #ff4b2b);
      box-shadow: 0 0 15px rgba(255, 100, 100, 0.5);
    }
    
    .voice-status {
      margin-top: 8px;
      font-size: 0.9rem;
      color: #a0d2ff;
      min-height: 20px;
      text-align: center;
    }
    
    /* 爆炸动画效果 */
    .explosion {
      animation: explode 1.5s ease-out forwards;
      position: absolute;
      pointer-events: none;
      z-index: 20;
      font-size: 180px;
      color: #ff0000;
      text-shadow: 0 0 20px #ff0000;
    }
    
    @keyframes explode {
      0% {
        transform: scale(1);
        opacity: 1;
        filter: blur(0);
      }
      30% {
        transform: scale(1.3);
        opacity: 0.8;
        filter: blur(1px);
        color: #ff9900;
      }
      60% {
        transform: scale(1.6);
        opacity: 0.5;
        filter: blur(3px);
        color: #ffff00;
      }
      100% {
        transform: scale(2);
        opacity: 0;
        filter: blur(8px);
        color: #ffffff;
      }
    }

      line-height: 1.5;

      margin: 8px 0;

      box-shadow: 0 6px 10px rgba(0, 0, 0, 0.3);

      cursor: not-allowed;
      transform: none;
      box-shadow: none;

      #currentChar {

<body>
  <div class="container">
    <header>
      <h1>汉字学习游戏 - 语音互动版</h1>
    </header>
    
    <div class="game-area">
      <div id="gameContainer">
        <div id="scoreBoard">分数：0</div>
        <div id="levelIndicator">一级字库</div>
        
        <div class="current-char-container">
          <div id="currentChar">?</div>
          <div id="pinyinDisplay"></div>
          <button id="nextCharBtn" class="next-char-btn">下一个汉字</button>
        </div>
      </div>
      
      <div class="controls">
        <div class="panel">
          <div class="panel-title">
            <i>📚</i> 字库等级选择
          </div>
          <div class="level-buttons" id="levelButtons">
            <!-- 这里将通过JavaScript动态生成52个按钮 -->
          </div>
        </div>
        
        <div class="panel">
          <div class="panel-title">
            <i>🎤</i> 语音互动
          </div>
          <button id="voiceBtn" class="voice-btn">
            <i>🎤</i> 开始语音识别
          </button>
          <div id="voiceStatus" class="voice-status">点击按钮开始语音识别</div>
        </div>
        
        <div class="panel">
          <div class="panel-title">
            <i>❓</i> 游戏说明
          </div>
          <div class="instructions">
            <ul>
              <li><span class="highlight">点击汉字</span>显示拼音并朗读</li>
              <li><span class="highlight">朗读汉字</span>触发爆炸特效</li>
              <li>汉字爆炸消失后点击<span class="highlight">下一个汉字</span></li>
              <li>语音识别成功后自动显示下一个汉字</li>
              <li>一级字库：最常用汉字</li>
              <li>五十二级字库：较生僻汉字</li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </div>

    // 游戏状态
    let gameState = {
      score: 0,
      currentLevel: 1,
      currentCharIndex: 0,
      isVoiceActive: false,
      recognition: null,
      isExploding: false
    };

    // 初始化游戏
    function initGame() {
      createLevelButtons();
      startLevel(1);
      setupVoiceRecognition();
      setupEventListeners();
    }

    // 创建52个等级按钮
    function createLevelButtons() {
      const levelButtonsContainer = document.getElementById('levelButtons');
      levelButtonsContainer.innerHTML = '';
      
      for (let i = 1; i <= 52; i++) {
        const button = document.createElement('button');
        button.className = `level-btn level-${i}`;
        button.textContent = i;
        button.addEventListener('click', () => startLevel(i));
        levelButtonsContainer.appendChild(button);
      }
    }

    // 开始指定等级
    function startLevel(level) {
      gameState.currentLevel = level;
      gameState.currentCharIndex = 0;
      gameState.score = 0;
      
      // 更新UI
      document.getElementById('scoreBoard').textContent = `分数：0`;
      document.getElementById('levelIndicator').textContent = `第${level}级字库`;
      document.querySelectorAll('.level-btn').forEach((btn, index) => {
        if (index + 1 === level) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
      
      // 显示第一个汉字
      showNextChar();
    }

    // 显示下一个汉字
    function showNextChar() {
      const chars = charLevels[gameState.currentLevel];
      
      if (gameState.currentCharIndex >= chars.length) {
        // 当前等级所有汉字已学完，回到第一个
        gameState.currentCharIndex = 0;
      }
      
      const currentChar = chars[gameState.currentCharIndex];
      document.getElementById('currentChar').textContent = currentChar;
      document.getElementById('pinyinDisplay').textContent = '';
      document.getElementById('nextCharBtn').disabled = false;
      gameState.isExploding = false;
      
      // 重置汉字可见性
      document.getElementById('currentChar').style.visibility = 'visible';
    }

    // 处理汉字点击
    function handleCharClick() {
      if (gameState.isExploding) return;
      
      const currentChar = document.getElementById('currentChar').textContent;
      const pinyin = pinyinMap[currentChar] || '?';
      
      // 显示拼音在屏幕中央
      document.getElementById('pinyinDisplay').textContent = pinyin;
      
      // 朗读汉字
      speakChar(currentChar);
    }

    // 朗读汉字
    function speakChar(char) {
      if ('speechSynthesis' in window) {
        // 停止任何正在进行的语音
        speechSynthesis.cancel();
        
        const utterance = new SpeechSynthesisUtterance(char);
        utterance.lang = 'zh-CN';
        utterance.rate = 0.8;
        utterance.pitch = 1;
        utterance.volume = 1;
        
        // 确保语音合成已准备好
        utterance.onstart = function() {
          console.log('开始朗读:', char);
        };
        
        utterance.onerror = function(event) {
          console.error('语音合成错误:', event);
        };
        
        speechSynthesis.speak(utterance);
      } else {
        console.warn('浏览器不支持语音合成');
      }
    }

    // 设置语音识别
    function setupVoiceRecognition() {
      const voiceBtn = document.getElementById('voiceBtn');
      const voiceStatus = document.getElementById('voiceStatus');
      
      // 检查浏览器是否支持语音识别
      if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        gameState.recognition = new SpeechRecognition();
        gameState.recognition.continuous = true;
        gameState.recognition.interimResults = true;
        gameState.recognition.lang = 'zh-CN';
        
        gameState.recognition.onstart = function() {
          voiceStatus.textContent = '语音识别已启动，请朗读汉字...';
          voiceBtn.classList.add('active');
          voiceBtn.innerHTML = '<i>🎤</i> 停止语音识别';
        };
        
        gameState.recognition.onresult = function(event) {
          let finalTranscript = '';
          for (let i = event.resultIndex; i < event.results.length; i++) {
            if (event.results[i].isFinal) {
              finalTranscript += event.results[i][0].transcript;
            }
          }
          
          if (finalTranscript) {
            voiceStatus.textContent = `识别结果: "${finalTranscript}"`;
            checkSpokenChar(finalTranscript.trim());
          }
        };
        
        gameState.recognition.onerror = function(event) {
          console.log('语音识别错误:', event.error);
          voiceStatus.textContent = `识别错误: ${event.error}`;
          voiceBtn.classList.remove('active');
          voiceBtn.innerHTML = '<i>🎤</i> 开始语音识别';
        };
        
        gameState.recognition.onend = function() {
          voiceBtn.classList.remove('active');
          voiceBtn.innerHTML = '<i>🎤</i> 开始语音识别';
          voiceStatus.textContent = '语音识别已停止';
          
          // 如果仍然处于激活状态，重新启动
          if (gameState.isVoiceActive) {
            setTimeout(() => {
              if (gameState.isVoiceActive) {
                gameState.recognition.start();
              }
            }, 100);
          }
        };
        
        voiceBtn.addEventListener('click', () => {
          if (gameState.isVoiceActive) {
            gameState.recognition.stop();
            gameState.isVoiceActive = false;
            voiceStatus.textContent = '语音识别已停止';
          } else {
            try {
              gameState.recognition.start();
              gameState.isVoiceActive = true;
            } catch (error) {
              voiceStatus.textContent = '启动语音识别失败，请重试';
              console.error('语音识别启动错误:', error);
            }
          }
        });
      } else {
        voiceBtn.disabled = true;
        voiceStatus.textContent = '您的浏览器不支持语音识别';
      }
    }

    // 检查朗读的汉字
    function checkSpokenChar(spokenText) {
      if (gameState.isExploding) return;
      
      const currentChar = document.getElementById('currentChar').textContent;
      
      if (spokenText.includes(currentChar)) {
        // 朗读正确，触发爆炸效果
        triggerExplosion();
      }
    }

    // 触发爆炸效果
    function triggerExplosion() {
      if (gameState.isExploding) return;
      
      gameState.isExploding = true;
      const currentChar = document.getElementById('currentChar').textContent;
      
      // 播放爆炸声音
      playExplosionSound();
      
      // 创建爆炸效果
      const explosion = document.createElement('div');
      explosion.className = 'explosion';
      explosion.textContent = currentChar;
      
      const charElement = document.getElementById('currentChar');
      const rect = charElement.getBoundingClientRect();
      const containerRect = document.getElementById('gameContainer').getBoundingClientRect();
      
      explosion.style.left = `${rect.left - containerRect.left + rect.width / 2}px`;
      explosion.style.top = `${rect.top - containerRect.top + rect.height / 2}px`;
      
      document.getElementById('gameContainer').appendChild(explosion);
      
      // 隐藏原汉字
      charElement.style.visibility = 'hidden';
      document.getElementById('pinyinDisplay').textContent = '';
      document.getElementById('nextCharBtn').disabled = true;
      
      // 增加分数
      gameState.score += 10;
      document.getElementById('scoreBoard').textContent = `分数：${gameState.score}`;
      
      // 爆炸结束后显示下一个汉字
      setTimeout(() => {
        explosion.remove();
        gameState.currentCharIndex++;
        showNextChar();
      }, 1500);
    }

    // 播放爆炸声音
    function playExplosionSound() {
      try {
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const duration = 0.5;
        const oscillator = audioContext.createOscillator();
        const gainNode = audioContext.createGain();
        
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(200, audioContext.currentTime);
        oscillator.frequency.exponentialRampToValueAtTime(50, audioContext.currentTime + duration);
        
        gainNode.gain.setValueAtTime(0.5, audioContext.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
        
        oscillator.connect(gainNode);
        gainNode.connect(audioContext.destination);
        
        oscillator.start();
        oscillator.stop(audioContext.currentTime + duration);
      } catch (error) {
        console.warn('无法播放爆炸音效:', error);
      }
    }

    // 设置事件监听器
    function setupEventListeners() {
      // 汉字点击事件
      document.getElementById('currentChar').addEventListener('click', handleCharClick);
      
      // 下一个汉字按钮
      document.getElementById('nextCharBtn').addEventListener('click', () => {
        if (!gameState.isExploding) {
          gameState.currentCharIndex++;
          showNextChar();
        }
      });
    }

    // 启动游戏
    window.onload = initGame;
  </script>
</body>
</html>
