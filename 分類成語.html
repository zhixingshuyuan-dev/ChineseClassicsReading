    // 语音队列管理器
    const speechQueue = {
      queue: [],
      isSpeaking: false,
      currentUtterance: null,
      
      add: function(text, lang) {
        this.queue.push({text, lang});
        if (!this.isSpeaking) {
          this.speakNext();
        }
      },
      
      speakNext: function() {
        if (this.queue.length === 0) {
          this.isSpeaking = false;
          return;
        }
        
        this.isSpeaking = true;
        const {text, lang} = this.queue.shift();
        
        // 停止当前任何语音
        window.speechSynthesis.cancel();
        
        this.currentUtterance = new SpeechSynthesisUtterance(text);
        this.currentUtterance.lang = lang;
        this.currentUtterance.onend = () => {
          setTimeout(() => this.speakNext(), 300); // 添加短暂延迟
        };
        this.currentUtterance.onerror = () => {
          this.speakNext();
        };
        
        window.speechSynthesis.speak(this.currentUtterance);
      },
      
      clear: function() {
        this.queue = [];
        window.speechSynthesis.cancel();
        this.isSpeaking = false;
      }
    };

    let current = 0;
    let step = 0;
    let filteredIdioms = [...idioms];

    // 初始化
    function init() {
      nextIdiom();
      updateCategoryFilter();
    }

    // 更新分类筛选器
    function updateCategoryFilter() {
      const categorySelect = document.getElementById("categorySelect");
      const categories = [...new Set(idioms.map(idiom => idiom.category))];
      
      // 清空现有选项（保留"全部成语"）
      while (categorySelect.options.length > 1) {
        categorySelect.remove(1);
      }
      
      // 添加分类选项
      categories.forEach(category => {
        const option = document.createElement("option");
        option.value = category;
        option.textContent = `${category}类成语`;
        categorySelect.appendChild(option);
      });
    }

    // 筛选成语
    function filterIdioms() {
      const category = document.getElementById("categorySelect").value;
      if (category === "all") {
        filteredIdioms = [...idioms];
      } else {
        filteredIdioms = idioms.filter(idiom => idiom.category === category);
      }
      current = 0;
      if (filteredIdioms.length > 0) {
        nextIdiom();
      } else {
        document.getElementById("idiom").innerText = "该分类暂无成语";
        resetInfo();
      }
    }

    // 显示下一个成语
    function nextIdiom() {
      if (filteredIdioms.length === 0) return;
      
      const idiomBox = document.getElementById("idiom");
      const data = filteredIdioms[current];
      idiomBox.style.backgroundColor = getRandomColor();
      idiomBox.innerHTML = `${data.idiom} <span class="category-tag">${data.category}</span>`;
      idiomBox.className = "colorful";
      resetInfo();
      speechQueue.add(data.idiom, 'zh-CN');
      step = 0;
      current = (current + 1) % filteredIdioms.length;
    }

    // 随机显示一个成语
    function randomIdiom() {
      if (filteredIdioms.length === 0) return;
      
      const randomIndex = Math.floor(Math.random() * filteredIdioms.length);
      current = randomIndex;
      nextIdiom();
    }

    // 重置显示信息
    function resetInfo() {
      document.getElementById("pinyin").style.display = 'none';
      document.getElementById("definition").style.display = 'none';
      document.getElementById("examples").style.display = 'none';
      document.getElementById("translations").style.display = 'none';
      document.getElementById("nextBtn").style.display = 'none';
    }

    // 逐步显示成语信息
    function revealStep() {
      if (filteredIdioms.length === 0) return;
      
      const data = filteredIdioms[(current + filteredIdioms.length - 1) % filteredIdioms.length];
      step++;
      
      if (step === 1) {
        document.getElementById("pinyin").innerText = `${data.pinyin}`;
        document.getElementById("pinyin").style.display = 'block';
      } else if (step === 2) {
        document.getElementById("definition").innerText = `解释：${data.definition}`;
        document.getElementById("definition").style.display = 'block';
        speechQueue.add(data.definition, 'zh-CN');
      } else if (step === 3) {
        const examplesHtml = `<ul>${data.examples.map(example => `<li>${example}</li>`).join('')}</ul>`;
        document.getElementById("examples").innerHTML = examplesHtml;
        document.getElementById("examples").style.display = 'block';
        
        // 使用语音队列依次朗读例句
        data.examples.forEach(example => {
          speechQueue.add(example, 'zh-CN');
        });
      } else if (step === 4) {
        const trEl = document.getElementById("translations");
        trEl.innerHTML = `
          <div class="translation-item">
            <strong>英文:</strong> 
            <span class="translation-text" onclick="speakTranslation('${data.translations.en}', 'en-US')">${data.translations.en}</span>
          </div>
          <div class="translation-item">
            <strong>德文:</strong> 
            <span class="translation-text" onclick="speakTranslation('${data.translations.de}', 'de-DE')">${data.translations.de}</span>
          </div>
          <div class="translation-item">
            <strong>法文:</strong> 
            <span class="translation-text" onclick="speakTranslation('${data.translations.fr}', 'fr-FR')">${data.translations.fr}</span>
          </div>
        `;
        trEl.style.display = 'block';
        speechQueue.add(data.translations.en, 'en-US');
      } else if (step === 5) {
        document.getElementById("nextBtn").style.display = 'inline-block';
      }
    }

    // 搜索成语
    function searchIdioms() {
      const searchText = document.getElementById("searchInput").value.toLowerCase().trim();
      if (!searchText) return;
      
      const results = idioms.filter(idiom => 
        idiom.idiom.toLowerCase().includes(searchText) ||
        idiom.pinyin.toLowerCase().includes(searchText) ||
        idiom.definition.toLowerCase().includes(searchText) ||
        idiom.examples.some(example => example.toLowerCase().includes(searchText)) ||
        Object.values(idiom.translations).some(translation => translation.toLowerCase().includes(searchText))
      );
      
      displaySearchResults(results);
    }

    // 显示搜索结果
    function displaySearchResults(results) {
      const resultsContainer = document.getElementById("searchResults");
      resultsContainer.innerHTML = '';
      
      if (results.length === 0) {
        resultsContainer.innerHTML = '<div class="result-item">未找到匹配的成语</div>';
        resultsContainer.style.display = 'block';
        return;
      }
      
      results.forEach((idiom, index) => {
        const item = document.createElement('div');
        item.className = 'result-item';
        item.innerHTML = `${idiom.idiom} <span class="category-tag">${idiom.category}</span>`;
        item.onclick = () => {
          // 找到该成语在筛选后的列表中的位置
          const foundIndex = filteredIdioms.findIndex(item => item.idiom === idiom.idiom);
          if (foundIndex !== -1) {
            current = foundIndex;
            nextIdiom();
          } else {
            // 如果不在当前筛选列表中，切换到全部成语
            document.getElementById("categorySelect").value = "all";
            filterIdioms();
            // 给一点时间让筛选完成
            setTimeout(() => {
              const newIndex = filteredIdioms.findIndex(item => item.idiom === idiom.idiom);
              if (newIndex !== -1) {
                current = newIndex;
                nextIdiom();
              }
            }, 100);
          }
          resultsContainer.style.display = 'none';
        };
        resultsContainer.appendChild(item);
      });
      
      resultsContainer.style.display = 'block';
    }

    // 朗读翻译
    function speakTranslation(text, lang) {
      speechQueue.add(text, lang);
    }

    // 获取随机颜色
    function getRandomColor() {
      const colors = ["#f9d5cc", "#caf0f8", "#d8e2dc", "#eae4e9", "#fde2e4"];
      return colors[Math.floor(Math.random() * colors.length)];
    }

    // 初始化事件监听
    document.getElementById("categorySelect").addEventListener("change", filterIdioms);
    document.getElementById("searchInput").addEventListener("keyup", function(event) {
      if (event.key === "Enter") {
        searchIdioms();
      }
    });

    // 页面加载时初始化
    window.onload = init;
  </script>
