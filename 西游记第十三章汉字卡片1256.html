<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>西游记第十三回汉字学习系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            gap: 20px;
        }
        
        /* 左侧汉字卡片区域 */
        .characters-section {
            flex: 1;
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-height: 90vh;
            overflow-y: auto;
        }
        
        /* 右侧正文区域 */
        .text-section {
            flex: 1.2;
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-height: 90vh;
            overflow-y: auto;
        }
        
        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 25px;
            font-size: 2.2rem;
            border-bottom: 3px solid #3498db;
            padding-bottom: 15px;
        }
        
        h2 {
            color: #2c3e50;
            margin: 25px 0 15px;
            font-size: 1.6rem;
        }
        
        /* 分组控制栏 */
        .group-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
        }
        
        .group-info {
            font-size: 1.1rem;
            color: #34495e;
        }
        
        .group-nav button {
            padding: 8px 20px;
            margin-left: 10px;
            border: none;
            border-radius: 50px;
            background-color: #3498db;
            color: white;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .group-nav button:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
        }
        
        .group-nav button:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }
        
        /* 汉字网格布局 */
        .characters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(85px, 1fr));
            gap: 12px;
            margin-top: 15px;
        }
        
        .character-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #f8f9fa;
            border-radius: 10px;
            padding: 15px 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            border: 2px solid transparent;
            height: 100px;
        }
        
        .character-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            background-color: #e9ecef;
            border-color: #3498db;
        }
        
        .character-card.highlighted {
            background-color: #fff3cd;
            border-color: #ffc107;
        }
        
        .character-card.active {
            background-color: #d4edda;
            border-color: #28a745;
        }
        
        .char {
            font-size: 2.2rem;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        .pinyin {
            font-size: 0.85rem;
            color: #6c757d;
            margin-bottom: 3px;
        }
        
        .meaning {
            font-size: 0.75rem;
            color: #495057;
            text-align: center;
            line-height: 1.2;
            max-height: 2.4em;
            overflow: hidden;
        }
        
        /* 正文样式 - 字号放大一倍 */
        .text-content {
            line-height: 1.8;
            font-size: 2.2rem; /* 放大一倍 */
            text-align: justify;
        }
        
        .text-content p {
            margin-bottom: 30px; /* 增加间距适应更大字号 */
            text-indent: 2em;
            position: relative;
            transition: all 0.3s ease;
            padding: 15px 20px; /* 增加内边距 */
            border-radius: 8px;
        }
        
        .text-content p:hover {
            background-color: #f8f9fa;
        }
        
        .text-content p.active {
            background-color: #e3f2fd;
            border-left: 4px solid #3498db;
            padding-left: 28px; /* 调整以适应更大的字号 */
        }
        
        /* 句子容器 */
        .sentence-container {
            position: relative;
            margin-bottom: 15px;
            padding: 10px 15px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        
        .sentence-container:hover {
            background-color: #f8f9fa;
        }
        
        .sentence-container.active {
            background-color: #e3f2fd;
            border-left: 4px solid #3498db;
            padding-left: 23px;
        }
        
        /* 正文中的汉字样式 */
        .text-char {
            cursor: pointer;
            padding: 0 2px; /* 增加内边距以适应更大字号 */
            border-radius: 3px;
            transition: all 0.2s ease;
        }
        
        .text-char:hover {
            background-color: #e3f2fd;
            color: #1565c0;
        }
        
        .text-char.highlighted {
            background-color: #fff3cd;
            color: #856404;
            font-weight: bold;
        }
        
        .text-char.active {
            background-color: #d4edda;
            color: #155724;
            font-weight: bold;
        }
        
        /* 句子朗读按钮 */
        .sentence-voice-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px; /* 增大按钮 */
            height: 40px;
            cursor: pointer;
            font-size: 1.2rem; /* 增大图标 */
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.7;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        
        .sentence-voice-btn:hover {
            opacity: 1;
            background-color: #2980b9;
            transform: translateY(-50%) scale(1.1);
        }
        
        .sentence-voice-btn:active {
            transform: translateY(-50%) scale(1);
        }
        
        /* 进度指示器 */
        .progress-container {
            width: 100%;
            background-color: #ecf0f1;
            border-radius: 10px;
            margin: 20px 0;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 8px;
            background-color: #3498db;
            width: 0%;
            transition: width 0.5s ease;
        }
        
        /* 统计信息 */
        .stats {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            font-size: 1rem;
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #2c3e50;
        }
        
        .stat-label {
            font-size: 0.9rem;
            color: #7f8c8d;
        }
        
        /* 标题样式 */
        .chapter-title {
            text-align: center;
            font-size: 1.8rem;
            color: #2c3e50;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e9ecef;
        }
        
        /* 卡片窗口样式 - 修改为可移动 */
        .card-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 420px;
            background: white;
            border-radius: 15px;
            padding: 0;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            animation: cardAppear 0.3s ease-out;
            cursor: move;
            overflow: hidden;
        }
        
        .card-modal.active {
            display: block;
        }
        
        .card-header {
            background-color: #3498db;
            color: white;
            padding: 15px 20px;
            cursor: move;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }
        
        .card-title {
            font-size: 1.2rem;
            font-weight: bold;
        }
        
        .card-content {
            padding: 25px;
            text-align: center;
        }
        
        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }
        
        .close-card {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: white;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.3s ease;
            padding: 0;
        }
        
        .close-card:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }
        
        .card-char {
            font-size: 4rem;
            margin: 20px 0;
            font-weight: bold;
            color: #2c3e50;
        }
        
        .card-pinyin {
            font-size: 1.5rem;
            color: #e74c3c;
            margin-bottom: 10px;
            font-weight: 500;
        }
        
        .card-meaning {
            font-size: 1.2rem;
            color: #34495e;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        
        .card-footer {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 20px;
        }
        
        .voice-btn, .explain-btn {
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 140px;
            justify-content: center;
        }
        
        .explain-btn {
            background-color: #9b59b6;
        }
        
        .explain-btn:hover {
            background-color: #8e44ad;
        }
        
        .voice-btn:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
        }
        
        .voice-btn:active, .explain-btn:active {
            transform: translateY(0);
        }
        
        .learned-btn {
            padding: 10px 20px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
            flex: 1;
            min-width: 140px;
        }
        
        .learned-btn:hover {
            background-color: #218838;
            transform: translateY(-2px);
        }
        
        .learned-btn.active {
            background-color: #6c757d;
        }
        
        .learned-btn.active:hover {
            background-color: #5a6268;
        }
        
        /* 解释内容区域 */
        .explanation-content {
            margin-top: 20px;
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 10px;
            text-align: left;
            max-height: 200px;
            overflow-y: auto;
            display: none;
        }
        
        .explanation-content.active {
            display: block;
        }
        
        .explanation-content h3 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 1.1rem;
            border-bottom: 2px solid #9b59b6;
            padding-bottom: 5px;
        }
        
        .explanation-content p {
            margin-bottom: 10px;
            font-size: 0.95rem;
            line-height: 1.5;
        }
        
        .example-word, .example-sentence {
            padding-left: 15px;
            margin: 8px 0;
            font-size: 0.9rem;
        }
        
        .example-word strong, .example-sentence strong {
            color: #2c3e50;
        }
        
        /* 语音控制按钮 */
        .voice-control {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 100;
        }
        
        .voice-toggle {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: #3498db;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .voice-toggle:hover {
            background-color: #2980b9;
            transform: scale(1.1);
        }
        
        .voice-toggle.muted {
            background-color: #e74c3c;
        }
        
        /* 响应式设计 */
        @media (max-width: 1100px) {
            .container {
                flex-direction: column;
            }
            
            .characters-section, .text-section {
                max-height: 70vh;
            }
        }
        
        @media (max-width: 768px) {
            .characters-grid {
                grid-template-columns: repeat(auto-fill, minmax(75px, 1fr));
            }
            
            .char {
                font-size: 1.8rem;
            }
            
            h1 {
                font-size: 1.8rem;
            }
            
            .text-content {
                font-size: 1.8rem; /* 响应式调整 */
            }
            
            .card-modal {
                width: 90%;
                max-width: 400px;
            }
            
            .card-content {
                padding: 20px;
            }
            
            .card-char {
                font-size: 3rem;
            }
            
            .card-footer {
                flex-direction: column;
            }
            
            .voice-btn, .explain-btn, .learned-btn {
                min-width: 100%;
            }
            
            .sentence-voice-btn {
                width: 35px;
                height: 35px;
                font-size: 1rem;
            }
        }
        
        @media (max-width: 480px) {
            .characters-grid {
                grid-template-columns: repeat(auto-fill, minmax(65px, 1fr));
            }
            
            .char {
                font-size: 1.6rem;
            }
            
            .character-card {
                height: 90px;
                padding: 10px 3px;
            }
            
            .card-footer {
                flex-direction: column;
                gap: 10px;
            }
            
            .text-content {
                font-size: 1.6rem; /* 响应式调整 */
            }
            
            .sentence-voice-btn {
                width: 30px;
                height: 30px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <!-- 卡片窗口 -->
    <div class="card-modal" id="card-modal">
        <div class="card-header" id="card-header">
            <div class="card-title">汉字学习卡片</div>
            <button class="close-card" id="close-card">×</button>
        </div>
        <div class="card-content">
            <div class="card-char" id="card-char">陷</div>
            <div class="card-pinyin" id="card-pinyin">xiàn</div>
            <div class="card-meaning" id="card-meaning">to sink, trap</div>
            
            <div class="explanation-content" id="explanation-content">
                <h3>汉字解释</h3>
                <p id="structure-info"></p>
                <p id="origin-info"></p>
                <div class="example-word" id="example-word"></div>
                <div class="example-sentence" id="example-sentence"></div>
            </div>
            
            <div class="card-footer">
                <button class="voice-btn" id="card-voice-btn">
                    <span>🔊 朗读</span>
                </button>
                <button class="explain-btn" id="explain-btn">
                    <span>📚 解释</span>
                </button>
                <button class="learned-btn" id="mark-learned-btn">标记为已学习</button>
            </div>
        </div>
    </div>
    
    <!-- 语音控制 -->
    <div class="voice-control">
        <button class="voice-toggle" id="voice-toggle" title="切换语音开关">
            🔊
        </button>
    </div>
    
    <div class="container">
        <!-- 左侧：汉字卡片区域 -->
        <div class="characters-section">
            <h1>西游记第十三回汉字学习</h1>
            
            <div class="stats">

                <div class="stat-item">
                    <div class="stat-value" id="current-group-display">1</div>
                    <div class="stat-label">当前组</div>
                </div>
            </div>
            
            <div class="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            
            <div class="group-controls">
                <div class="group-info">
                    第 <span id="current-group">1</span> 组 / 共 25 组
                </div>
                <div class="group-nav">
                    <button id="prev-group">上一组</button>
                    <button id="next-group">下一组</button>
                </div>
            </div>
            
            <div id="characters-container">
                <!-- 汉字卡片将通过JavaScript动态生成 -->
            </div>
        </div>
        
        <!-- 右侧：正文区域 -->
        <div class="text-section">
            <div class="chapter-title">
                第十三回 陷虎穴金星解厄 双叉岭伯钦留僧
            </div>
            
            <div class="text-content" id="text-content">
                <!-- 正文内容将通过JavaScript动态生成 -->
            </div>
        </div>
    </div>

            "三藏答曰：'心生，种种魔生；心灭，种种魔灭。'",
            "'我弟子曾在化生寺对佛说下洪誓大愿，不由我不尽此心。'",
            "'这一去，定要到西天，见佛求经，使我们法轮回转，愿圣主皇图永固。'",
            "众僧闻得此言，人人称羡，个个宣扬，都叫一声'忠心赤胆大阐法师！'",
            "夸赞不尽，请师入榻安寐。",
            "早又是竹敲残月落，鸡唱晓云生。",
            "那众僧起来，收拾茶水早斋。",
            "玄奘遂穿了袈裟，上正殿，佛前礼拜，道：",
            "'弟子陈玄奘，前往西天取经，但肉眼愚迷，不识活佛真形。'",
            "'今愿立誓：路中逢庙烧香，遇佛拜佛，遇塔扫塔。'",
            "'但愿我佛慈悲，早现丈六金身，赐真经，留传东土。'",
            "祝罢，回方丈进斋。",
            "斋毕，那二从者整顿了鞍马，促趱行程。",
            "三藏出了山门，辞别众僧。",
            "众僧不忍分别，直送有十里之遥，噙泪而返。",
            "三藏遂直西前进。正是那季秋天气。但见：",
            "数村木落芦花碎，几树枫扬红叶坠。",
            "路途烟雨故人稀，黄菊丽，山骨细，水寒荷破人憔悴。",
            "白红蓼霜天雪，落霞孤鹜长空坠。",
            "依稀黯淡野云飞，玄鸟去，宾鸿至，嘹嘹呖呖声宵碎。",
            "师徒们行了数日，到了巩州城。",
            "早有巩州合属官吏人等，迎接入城中。",
            "安歇一夜，次早出城前去。",
            "一路饥餐渴饮，夜住晓行。",
            "两三日，又至河州卫。",
            "此乃是大唐的山河边界。",
            "早有镇边的总兵与本处僧道，闻得是钦差御弟法师，上西方见佛，无不恭敬，",
            "接至里面供给了，着僧纲请往福原寺安歇。",
            "本寺僧人，一一参见，安排晚斋。",
            "斋毕，吩咐二从者饱喂马匹，天不明就行。",
            "及鸡方鸣，随唤从者，却又惊动寺僧，整治茶汤斋供。",
            "斋罢，出离边界。",
            "这长老心忙，太起早了。",
            "原来此时秋深时节，鸡鸣得早，只好有四更天气。",
            "一行三人，连马四口，迎着清霜，看着明月，行有数十里远近，",
            "见一山岭，只得拨草寻路，说不尽崎岖难走，又恐走错了路径。",
            "正疑思之间，忽然失足，三人连马都跌落坑坎之中。",
            "三藏心慌，从者胆战。",
            "却才悚惧，又闻得里面哮吼高呼，叫：'拿将来！拿将来！'",
            "只见狂风滚滚，拥出五六十个妖邪，将三藏、从者揪了上去。",
            "这法师战战兢兢的，偷眼观看，上面坐的那魔王，十分凶恶。",
            "真个是：",
            "雄威身凛凛，猛气貌堂堂。",
            "电目飞光艳，雷声振四方。",
            "锯牙舒口外，凿齿露腮旁。",
            "锦绣围身体，文斑裹脊梁。",
            "钢须稀见肉，钩爪利如霜。",
            "东海黄公惧，南山白额王。",
            "唬得个三藏魂飞魄散，二从者骨软筋麻。",
            "魔王喝令绑了，众妖一齐将三人用绳索绑缚。",
            "正要安排吞食，只听得外面喧哗，有人来报：",
            "'熊山君与特处士二位来也。'",
            "三藏闻言，抬头观看，前走的是一条黑汉。",
            "你道他是怎生模样：",
            "雄豪多胆量，轻健夯身躯。",
            "涉水惟凶力，跑林逞怒威。",
            "向来符吉梦，今独露英姿。",
            "绿树能攀折，知寒善谕时。",
            "准灵惟显处，故此号山君。",
            "又见那后边来的是一条胖汉。你道怎生模样：",
            "嵯峨双角冠，端肃耸肩背。",
            "性服青衣稳，蹄步多迟滞。",
            "宗名父作牯，原号母称牸。",
            "能为田者功，因名特处士。",
            "这两个摇摇摆摆，走入里面，慌得那魔王奔出迎接。",
            "熊山君道：'寅将军，一向得意，可贺！可贺！'",
            "特处士道：'寅将军丰姿胜常，真可喜！真可喜！'",
            "魔王道：'二公连日如何？'",
            "山君道：'惟守素耳。'",
            "处士道：'惟随时耳。'",
            "三个叙罢，各坐谈笑。",
            "只见那从者绑得痛切悲啼。",
            "那黑汉道：'此三者何来？'",
            "魔王道：'自送上门来者。'",
            "处士笑云：'可能待客否？'",
            "魔王道：'奉承！奉承！'",
            "山君道：'不可尽用，食其二，留其一可也。'",
            "魔王领诺，即呼左右，将二从者剖腹剜心，剁碎其尸。",
            "将首级与心肝奉献二客，将四肢自食，其余骨肉，分给各妖。",
            "只听得啯啅之声，真似虎啖羊羔。霎时食尽。",
            "把一个长老，几乎唬死。",
            "这才是初出长安第一场苦难。",
            "正怆慌之间，渐渐的东方发白，那二怪至天晓方散。",
            "俱道：'今日厚扰，容日竭诚奉酬。'方一拥而退。",
            "不一时，红日高升。三藏昏昏沉沉，也辨不得东西南北。",
            "正在那不得命处，忽然见一老叟，手持拄杖而来。",
            "走上前，用手一拂，绳索皆断。",
            "对面吹了一口气，三藏方苏。",
            "跪拜于地道：'多谢老公公！搭救贫僧性命！'",
            "老叟答礼道：'你起来。你可曾疏失了什么东西？'",
            "三藏道：'贫僧的从人，已是被怪食了；只不知行李、马匹在于何处？'",
            "老叟用杖指定道：'那厢不是一匹马，两个包袱？'",
            "三藏回头看时，果是他的物件，并不曾失落，心才略放下些。",
            "问老叟曰：'老公公，此处是甚所在？公公何由在此？'",
            "老叟道：'此是双叉岭，乃虎狼巢穴处。你为何堕此？'",
            "三藏道：'贫僧鸡鸣时，出河州卫界，不料起得早了，冒霜拨露，忽失落此地。'",
            "'见一魔王，凶顽太甚。将贫僧与二从者绑了。'",
            "'又见一条黑汉，称是熊山君；一条胖汉，称是特处士；走进来，称那魔王是寅将军。'",
            "'他三个把我二从者吃了，天光才散。'",
            "'不想我是那里有这大缘大分，感得老公公来此救我？'",
            "老叟道：'处士者是个野牛精。山君者是个熊罴精。寅将军者是个老虎精。'",
            "'左右妖邪，尽都是山精树鬼，怪兽苍狼。'",
            "'只因你的本性元明，所以吃不得你。你跟我来，引你上路。'",
            "三藏不胜感激，将包袱捎在马上，牵着缰绳，相随老叟径出了坑坎之中，走上大路。",
            "却将马拴在道旁草头上，转身拜谢那公公，那公公遂化作一阵清风，跨一只朱顶白鹤，腾空而去。",
            "只见风飘飘遗下一张简帖，书上四句颂子。颂子云：",
            "'吾乃西天太白星，特来搭救汝生灵。前行自有神徒助，莫为艰难报怨经。'",
            "三藏看了，对天礼拜道：'多谢金星，度脱此难。'",
            "拜毕，牵了马匹，独自个孤孤凄凄，往前苦进。",
            "这岭上，真个是：",
            "寒飒飒雨林风，响潺潺涧下水。",
            "香馥馥野花开，密丛丛乱石磊。",
            "闹嚷嚷鹿与猿，一队队獐和麂。",
            "喧杂杂鸟声多，静悄悄人事靡。",
            "那长老，战兢兢心不宁；这马儿，力怯怯蹄难举。",
            "三藏舍身拼命。上了那峻岭之间。",
            "行经半日，更不见个人烟村舍。",
            "一则腹中饥了，二则路又不平。",
            "正在危急之际，只见前面有两只猛虎咆哮，后边有几条长蛇盘绕。",
            "左有毒虫，右有怪兽。",
            "三藏孤身无策，只得放下身心，听天所命。",
            "又无奈那马腰软蹄弯，便屎俱下，伏倒在地，打又打不起，牵又牵不动。",
            "苦得个法师衬身无地，真个有万分凄楚，已自分必死，莫可奈何。",
            "却说他虽有灾迍，却有救应。",
            "正在那不得命处，忽然见毒虫奔走，妖兽飞逃，猛虎潜踪，长蛇隐迹。",
            "三藏抬头看时，只见一人，手执钢叉，腰悬弓箭，自那山坡前转出，果然是一条好汉。",
            "你看他：",
            "头上戴一顶，艾叶花斑豹皮帽；",
            "身上穿一领，羊绒织锦叵罗衣；",
            "腰间束一条狮蛮带；脚下一对麂皮靴。",
            "环眼圆睛如吊客，圈须乱扰似河奎。",
            "悬一囊毒药弓，拿一捍点钢大叉。",
            "雷声震破山虫胆，勇猛惊残野雉魂。",
            "三藏见他来得渐近，跪在路旁，合掌高叫道：'大王救命！大王救命！'",
            "那条汉到边前，放下钢叉，用手搀起道：'长老休怕。'",
            "'我不是歹人，我是这山中的猎户，姓刘名伯钦，绰号镇山太保。'",
            "'我才自来，要寻两只山虫食用，不期遇着你，多有冲撞。'",
            "三藏道：'贫僧是大唐驾下钦差往西天拜佛求经的和尚。'",
            "'适间来到此处，遇着些狼虎蛇虫，四边围绕，不能前进。'",
            "'忽见太保来，众兽皆走，救了贫僧性命，多谢！多谢！'",
            "伯钦道：'我在这里住人，专倚打些狼虎为生，捉些蛇虫过活，故此众兽怕我走了。'",
            "'你既是唐朝来的，与我都是乡里。'",
            "'此间还是大唐的地界，我也是唐朝的百姓，我和你同食皇王的水土，诚然是一国之人。'",
            "'你休怕，跟我来。到我舍下歇马，明朝我送你上路。'",
            "三藏闻言，满心欢喜。谢了伯钦，牵马随行。",
            "过了山坡，又听得呼呼风响。",
            "伯钦道：'长老休走，坐在此间。风响处，是个山猫来了，等我拿他家去管待你。'",
            "三藏见说，又胆战心惊，不敢举步。",
            "那太保执了钢叉，拽开步，迎将上去。",
            "只见一只斑斓虎，对面撞见。",
            "他看见伯钦，急回头就走。",
            "这太保霹雳一声，咄道：'那业畜！那里走！'",
            "那虎见赶得急，转身轮爪扑来。",
            "这太保三股叉举手迎敌，唬得个三藏软瘫在草地。",
            "这和尚自出娘肚皮，那曾见这样凶险的勾当？",
            "太保与那虎在那山坡下，人虎相持，果是一场好斗。但见：",
            "怒气纷纷，狂风滚滚。",
            "怒气纷纷，太保冲冠多膂力；狂风滚滚，斑彪逞势喷红尘。",
            "那一个张牙舞爪，这一个转步回身。",
            "三股叉擎天幌日，千花尾扰雾飞云。",
            "这一个当胸乱刺，那一个劈面来吞。",
            "闪过的再生人道，撞着的定见阎君。",
            "只听得那斑彪哮吼，太保声哏。",
            "斑彪哮吼，振裂山川惊鸟兽；太保声哏，喝开天府现星辰。",
            "那一个金睛怒出，这一个壮胆生嗔。",
            "可爱镇山刘太保，堪夸据地兽之君。",
            "人虎贪生争胜负，些儿有慢丧三魂。",
            "他两个斗了有一个时辰，只见那虎爪慢腰松，被太保举叉平胸刺倒，可怜呵，钢叉尖穿透心肝，霎时间血流满地。",
            "揪着耳朵，拖上路来，好男子！气不连喘，面不改色，对三藏道：'造化！造化！这只山猫，够长老食用几日。'",
            "三藏夸赞不尽，道：'太保真山神也！'",
            "伯钦道：'有何本事，敢劳过奖？这个是长老的洪福。去来！赶早儿剥了皮，煮些肉，管待你也。'",
            "他一只手执着叉，一只手拖着虎，在前引路。三藏牵着马，随后而行。",
            "迤逦行过山坡，忽见一座山庄。",
            "那门前真个是：",
            "参天古树，漫路荒藤。",
            "万壑风尘冷，千崖气象奇。",
            "一径野花香袭体，数竿幽竹绿依依。",
            "草门楼，篱笆院，堪描堪画；石板桥，白土壁，真乐真稀。",
            "秋容萧索，爽气孤高。",
            "道傍黄叶落，岭上白云飘。",
            "疏林内山禽聒聒，庄门外细犬嘹嘹。",
            "伯钦到了门首，将死虎掷下，叫：'小的们何在？'",
            "只见走出三四个家僮，都是怪形恶相之类，上前拖拖拉拉，把只虎扛将进去。",
            "伯钦吩咐教：'赶早剥了皮，安排将来待客。'",
            "复回头迎接三藏进内，彼此相见。",
            "三藏又拜谢伯钦厚恩怜悯救命。",
            "伯钦道：'同乡之人，何劳致谢。'",
            "坐定茶罢，有一老妪，领着一个媳妇，对三藏进礼。",
            "伯钦道：'此是家母、山妻。'",
            "三藏道：'请令堂上坐，贫僧奉拜。'",
            "老妪道：'长老远客，各请自珍，不劳拜罢。'",
            "伯钦道：'母亲呵，他是唐王驾下，差往西天见佛求经者。'",
            "'适间在岭头上遇着孩儿，孩儿念一国之人，请他来家歇马，明日送他上路。'",
            "老妪闻言，十分欢喜道：'好！好！好！就是请他，不得这般。'",
            "'恰好明日你父亲周忌，就浼长老做些好事，念卷经文，到后日送他去罢。'",
            "这刘伯钦，虽是一个杀虎手，镇山的太保，他却有些孝顺之心。",
            "闻得母言，就要安排香纸，留住三藏。",
            "说话间，不觉的天色将晚。",
            "小的们排开桌凳，拿几盘烂熟虎肉，热腾腾的放在上面。",
            "伯钦请三藏权用，再另办饭。",
            "三藏合掌当胸道：'善哉！贫僧不瞒太保说，自出娘胎，就做和尚，更不晓得吃荤。'",
            "伯钦闻得此说，沉吟了半晌道：'长老，寒家历代以来，不晓得吃素；'",
            "'就是有些竹笋，采些木耳，寻些干菜，做些豆腐，也都是獐鹿虎豹的油煎，却无甚素处。'",
            "'有两眼锅灶，也都是油腻透了，这等奈何？反是我请长老的不是。'",
            "三藏道：'太保不必多心，请自受用。我贫僧就是三五日不吃饭，也可忍饿，只是不敢破了斋戒。'",
            "伯钦道：'倘或饿死，却如之何？'",
            "三藏道：'感得太保天恩，搭救出虎狼丛里，就是饿死，也强如喂虎。'",
            "伯钦的母亲闻说，叫道：'孩儿不要与长老闲讲，我自有素物，可以管待。'",
            "伯钦道：'素物何来？'",
            "母亲道：'你莫管我，我自有素的。'",
            "叫媳妇：'将小锅取下，着火烧了油腻，刷了又刷，洗了又洗，却仍安在灶上。'",
            "'先放半锅滚水，别用；却又将些山地榆叶子，着水煎作茶汤，'",

            "老母对着三藏道：'长老请斋。这是老身与儿妇，亲自动手整理的些极洁极净的茶饭。'",
            "三藏下来谢了，方才上坐。",
            "那伯钦另设一处，铺排些没盐没酱的老虎肉、香獐肉、蟒蛇肉、狐狸肉、兔肉，点剁鹿肉干巴，满盘满碗的，陪着三藏吃斋。",
            "方坐下，心欲举箸，只见三藏合掌诵经，唬得个伯钦不敢动箸，急起身立在旁边。",
            "三藏念不数句，却教'请斋'。",
            "伯钦道：'你是个念短头经的和尚？'",

        // 应用状态
        let currentGroup = 1;
        let learnedChars = new Set();
        let activeChar = null;
        let charPositions = {};
        let currentCardChar = null;
        let speechEnabled = true;
        let isDragging = false;
        let dragOffset = { x: 0, y: 0 };
        let cardPosition = { x: 0, y: 0 };
        
        // DOM元素
        const charactersContainer = document.getElementById('characters-container');
        const textContentElement = document.getElementById('text-content');
        const currentGroupElement = document.getElementById('current-group');
        const currentGroupDisplayElement = document.getElementById('current-group-display');
        const prevGroupButton = document.getElementById('prev-group');
        const nextGroupButton = document.getElementById('next-group');
        const progressBar = document.getElementById('progress-bar');
        const totalCharsElement = document.getElementById('total-chars');
        const learnedCharsElement = document.getElementById('learned-chars');
        const cardModal = document.getElementById('card-modal');
        const cardHeader = document.getElementById('card-header');
        const closeCardButton = document.getElementById('close-card');
        const cardCharElement = document.getElementById('card-char');
        const cardPinyinElement = document.getElementById('card-pinyin');
        const cardMeaningElement = document.getElementById('card-meaning');
        const cardVoiceButton = document.getElementById('card-voice-btn');
        const explainButton = document.getElementById('explain-btn');
        const markLearnedButton = document.getElementById('mark-learned-btn');
        const voiceToggle = document.getElementById('voice-toggle');
        const explanationContent = document.getElementById('explanation-content');
        const structureInfoElement = document.getElementById('structure-info');
        const originInfoElement = document.getElementById('origin-info');
        const exampleWordElement = document.getElementById('example-word');
        const exampleSentenceElement = document.getElementById('example-sentence');
        
        // 语音合成函数
        function speakText(text, lang = 'zh-CN') {
            if (!speechEnabled) return;
            
            // 停止当前语音
            window.speechSynthesis.cancel();
            
            // 创建语音实例
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang;
            utterance.rate = 0.8; // 稍微慢一点，便于学习
            
            // 开始朗读
            window.speechSynthesis.speak(utterance);
        }
        
        // 初始化卡片拖拽功能
        function initCardDrag() {
            cardHeader.addEventListener('mousedown', startDrag);
            document.addEventListener('mousemove', doDrag);
            document.addEventListener('mouseup', stopDrag);
            
            // 触摸屏支持
            cardHeader.addEventListener('touchstart', startDragTouch);
            document.addEventListener('touchmove', doDragTouch);
            document.addEventListener('touchend', stopDrag);
        }
        
        function startDrag(e) {
            isDragging = true;
            const rect = cardModal.getBoundingClientRect();
            dragOffset.x = e.clientX - rect.left;
            dragOffset.y = e.clientY - rect.top;
            cardModal.style.cursor = 'grabbing';
            e.preventDefault();
        }
        
        function startDragTouch(e) {
            if (e.touches.length === 1) {
                isDragging = true;
                const rect = cardModal.getBoundingClientRect();
                dragOffset.x = e.touches[0].clientX - rect.left;
                dragOffset.y = e.touches[0].clientY - rect.top;
                cardModal.style.cursor = 'grabbing';
                e.preventDefault();
            }
        }
        
        function doDrag(e) {
            if (!isDragging) return;
            
            cardPosition.x = e.clientX - dragOffset.x;
            cardPosition.y = e.clientY - dragOffset.y;
            
            // 限制卡片在视窗内移动
            const maxX = window.innerWidth - cardModal.offsetWidth;
            const maxY = window.innerHeight - cardModal.offsetHeight;
            
            cardPosition.x = Math.max(0, Math.min(cardPosition.x, maxX));
            cardPosition.y = Math.max(0, Math.min(cardPosition.y, maxY));
            
            cardModal.style.left = `${cardPosition.x}px`;
            cardModal.style.top = `${cardPosition.y}px`;
            cardModal.style.transform = 'none';
        }
        
        function doDragTouch(e) {
            if (!isDragging || e.touches.length !== 1) return;
            
            cardPosition.x = e.touches[0].clientX - dragOffset.x;
            cardPosition.y = e.touches[0].clientY - dragOffset.y;
            
            // 限制卡片在视窗内移动
            const maxX = window.innerWidth - cardModal.offsetWidth;
            const maxY = window.innerHeight - cardModal.offsetHeight;
            
            cardPosition.x = Math.max(0, Math.min(cardPosition.x, maxX));
            cardPosition.y = Math.max(0, Math.min(cardPosition.y, maxY));
            
            cardModal.style.left = `${cardPosition.x}px`;
            cardModal.style.top = `${cardPosition.y}px`;
            cardModal.style.transform = 'none';
            
            e.preventDefault();
        }
        
        function stopDrag() {
            isDragging = false;
            cardModal.style.cursor = 'move';
        }
        
        // 显示卡片窗口
        function showCard(char) {
            currentCardChar = char;
            
            // 查找汉字数据
            let charData = null;
            for (let group in characterData) {
                const found = characterData[group].find(item => item.char === char);
                if (found) {
                    charData = found;
                    break;
                }
            }
            
            if (charData) {
                cardCharElement.textContent = charData.char;
                cardPinyinElement.textContent = charData.pinyin;
                cardMeaningElement.textContent = charData.meaning;
                
                // 更新标记按钮状态
                if (learnedChars.has(char)) {
                    markLearnedButton.textContent = '已学习 ✓';
                    markLearnedButton.classList.add('active');
                } else {
                    markLearnedButton.textContent = '标记为已学习';
                    markLearnedButton.classList.remove('active');
                }
                
                // 隐藏解释内容
                explanationContent.classList.remove('active');
                
                // 显示卡片
                cardModal.classList.add('active');
                
                // 初始位置居中
                const rect = cardModal.getBoundingClientRect();
                cardPosition.x = (window.innerWidth - rect.width) / 2;
                cardPosition.y = (window.innerHeight - rect.height) / 2;
                cardModal.style.left = `${cardPosition.x}px`;
                cardModal.style.top = `${cardPosition.y}px`;
                cardModal.style.transform = 'none';
                
                // 朗读汉字
                speakText(char);
            }
        }
        
        // 关闭卡片窗口
        function closeCard() {
            cardModal.classList.remove('active');
            currentCardChar = null;
        }
        
        // 计算总汉字数
        function calculateTotalChars() {
            let total = 0;
            for (let group in characterData) {
                total += characterData[group].length;
            }
            return total;
        }
        
        // 更新统计信息
        function updateStats() {
            const totalChars = calculateTotalChars();
            totalCharsElement.textContent = totalChars;
            learnedCharsElement.textContent = learnedChars.size;
            
            // 更新进度条
            const progress = (learnedChars.size / totalChars) * 100;
            progressBar.style.width = `${progress}%`;
        }
        
        // 渲染汉字卡片
        function renderCharacterCards() {
            charactersContainer.innerHTML = '';
            currentGroupElement.textContent = currentGroup;
            currentGroupDisplayElement.textContent = currentGroup;
            
            const groupData = characterData[currentGroup] || [];
            
            // 创建网格容器
            const grid = document.createElement('div');
            grid.className = 'characters-grid';
            
            groupData.forEach(charData => {
                const card = document.createElement('div');
                card.className = 'character-card';
                if (learnedChars.has(charData.char)) {
                    card.classList.add('active');
                }
                if (activeChar === charData.char) {
                    card.classList.add('highlighted');
                }
                
                card.dataset.char = charData.char;
                
                // 只显示汉字，不显示拼音和释义
                card.innerHTML = `
                    <div class="char">${charData.char}</div>
                `;
                
                // 点击卡片事件
                card.addEventListener('click', () => {
                    handleCharacterClick(charData.char);
                });
                
                grid.appendChild(card);
            });
            
            charactersContainer.appendChild(grid);
            
            // 更新按钮状态
            prevGroupButton.disabled = currentGroup <= 1;
            nextGroupButton.disabled = currentGroup >= 25;
            
            updateStats();
        }
        
        // 处理汉字卡片点击
        function handleCharacterClick(char) {
            activeChar = char;
            renderCharacterCards();
            highlightTextChars(char);
            showCard(char);
            
            // 滚动到正文中该汉字的第一个位置
            if (charPositions[char] && charPositions[char].length > 0) {
                const firstPosition = charPositions[char][0];
                const textCharElement = document.querySelector(`[data-char-index="${firstPosition}"]`);
                if (textCharElement) {
                    textCharElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }
        }
        
        // 渲染正文内容
        function renderTextContent() {
            textContentElement.innerHTML = '';
            charPositions = {};
            
            // 按句子渲染
            textSentences.forEach((sentence, sentenceIndex) => {
                const sentenceContainer = document.createElement('div');
                sentenceContainer.className = 'sentence-container';
                sentenceContainer.dataset.sentenceIndex = sentenceIndex;
                
                // 处理句子中的每个字符
                for (let i = 0; i < sentence.length; i++) {
                    const char = sentence[i];
                    const span = document.createElement('span');
                    span.className = 'text-char';
                    span.textContent = char;
                    span.dataset.char = char;
                    span.dataset.charIndex = `${sentenceIndex}-${i}`;
                    
                    // 存储汉字位置
                    if (!charPositions[char]) {
                        charPositions[char] = [];
                    }
                    charPositions[char].push(`${sentenceIndex}-${i}`);
                    
                    // 点击正文汉字事件
                    span.addEventListener('click', () => {
                        handleTextCharClick(char);
                    });
                    
                    sentenceContainer.appendChild(span);
                }
                
                // 添加朗读按钮
                const voiceButton = document.createElement('button');
                voiceButton.className = 'sentence-voice-btn';
                voiceButton.innerHTML = '🔊';
                voiceButton.title = '朗读此句';
                voiceButton.dataset.sentenceIndex = sentenceIndex;
                
                voiceButton.addEventListener('click', (e) => {
                    e.stopPropagation(); // 防止触发容器点击事件
                    handleSentenceVoiceClick(sentence);
                });
                
                sentenceContainer.appendChild(voiceButton);
                
                // 点击句子容器高亮
                sentenceContainer.addEventListener('click', (e) => {
                    if (!e.target.classList.contains('text-char') && !e.target.classList.contains('sentence-voice-btn')) {
                        // 高亮当前句子
                        const allSentences = document.querySelectorAll('.sentence-container');
                        allSentences.forEach(s => s.classList.remove('active'));
                        sentenceContainer.classList.add('active');
                    }
                });
                
                textContentElement.appendChild(sentenceContainer);
            });
            
            // 如果有活动的汉字，高亮显示
            if (activeChar) {
                highlightTextChars(activeChar);
            }
        }
        
        // 处理句子朗读按钮点击
        function handleSentenceVoiceClick(sentence) {
            speakText(sentence);
        }
        
        // 处理正文汉字点击
        function handleTextCharClick(char) {
            activeChar = char;
            renderCharacterCards();
            highlightTextChars(char);
            showCard(char);
        }
        
        // 高亮正文中的汉字
        function highlightTextChars(char) {
            // 移除所有高亮
            const allTextChars = document.querySelectorAll('.text-char');
            allTextChars.forEach(el => {
                el.classList.remove('highlighted', 'active');
            });
            
            // 高亮当前汉字的所有出现位置
            if (charPositions[char]) {
                charPositions[char].forEach(index => {
                    const element = document.querySelector(`[data-char-index="${index}"]`);
                    if (element) {
                        element.classList.add('highlighted');
                    }
                });
            }
            
            // 高亮活动汉字卡片
            const charCard = document.querySelector(`.character-card[data-char="${char}"]`);
            if (charCard) {
                charCard.classList.add('highlighted');
            }
        }
        
        // 切换到上一组
        function goToPrevGroup() {
            if (currentGroup > 1) {
                currentGroup--;
                activeChar = null;
                renderCharacterCards();
                // 移除正文高亮
                const allTextChars = document.querySelectorAll('.text-char');
                allTextChars.forEach(el => {
                    el.classList.remove('highlighted', 'active');
                });
                // 移除句子高亮
                const allSentences = document.querySelectorAll('.sentence-container');
                allSentences.forEach(s => s.classList.remove('active'));
            }
        }
        
        // 切换到下一组
        function goToNextGroup() {
            if (currentGroup < 25) {
                currentGroup++;
                activeChar = null;
                renderCharacterCards();
                // 移除正文高亮
                const allTextChars = document.querySelectorAll('.text-char');
                allTextChars.forEach(el => {
                    el.classList.remove('highlighted', 'active');
                });
                // 移除句子高亮
                const allSentences = document.querySelectorAll('.sentence-container');
                allSentences.forEach(s => s.classList.remove('active'));
            }
        }
        
        // 标记汉字为已学习
        function markCharAsLearned() {
            if (currentCardChar) {
                if (learnedChars.has(currentCardChar)) {
                    learnedChars.delete(currentCardChar);
                    markLearnedButton.textContent = '标记为已学习';
                    markLearnedButton.classList.remove('active');
                } else {
                    learnedChars.add(currentCardChar);
                    markLearnedButton.textContent = '已学习 ✓';
                    markLearnedButton.classList.add('active');
                }
                updateStats();
                renderCharacterCards();
            }
        }
        
        // 解释汉字
        function explainCharacter() {
            if (!currentCardChar) return;
            
            // 获取解释数据
            const explanation = characterExplanations[currentCardChar] || {
                structure: '结构信息暂缺',
                origin: '字源信息暂缺',
                exampleWords: '例词：暂无',
                exampleSentence: '例句：暂无'
            };
            
            // 更新解释内容
            structureInfoElement.textContent = `结构：${explanation.structure}`;
            originInfoElement.textContent = `字源：${explanation.origin}`;
            exampleWordElement.innerHTML = `<strong>例词：</strong>${explanation.exampleWords}`;
            exampleSentenceElement.innerHTML = `<strong>例句：</strong>${explanation.exampleSentence}`;
            
            // 显示解释区域
            explanationContent.classList.add('active');
            
            // 生成解释文本并朗读
            const explanationText = `${currentCardChar}，拼音${cardPinyinElement.textContent}，${cardMeaningElement.textContent}。${explanation.structure}。${explanation.origin}。例词：${explanation.exampleWords}。例句：${explanation.exampleSentence}`;
            speakText(explanationText);
        }
        
        // 切换语音开关
        function toggleVoice() {
            speechEnabled = !speechEnabled;
            if (speechEnabled) {
                voiceToggle.classList.remove('muted');
                voiceToggle.textContent = '🔊';
                voiceToggle.title = '关闭语音';
            } else {
                voiceToggle.classList.add('muted');
                voiceToggle.textContent = '🔇';
                voiceToggle.title = '开启语音';
                // 停止当前语音
                window.speechSynthesis.cancel();
            }
        }
        
        // 初始化事件监听器
        function initEventListeners() {
            prevGroupButton.addEventListener('click', goToPrevGroup);
            nextGroupButton.addEventListener('click', goToNextGroup);
            closeCardButton.addEventListener('click', closeCard);
            cardVoiceButton.addEventListener('click', () => {
                if (currentCardChar) {
                    speakText(currentCardChar);
                }
            });
            explainButton.addEventListener('click', explainCharacter);
            markLearnedButton.addEventListener('click', markCharAsLearned);
            voiceToggle.addEventListener('click', toggleVoice);
            
            // 点击卡片外部关闭卡片
            cardModal.addEventListener('click', (e) => {
                if (e.target === cardModal) {
                    closeCard();
                }
            });
            
            // 键盘导航
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeCard();
                } else if (e.key === 'ArrowLeft') {
                    goToPrevGroup();
                } else if (e.key === 'ArrowRight') {
                    goToNextGroup();
                }
            });
        }
        
        // 初始化应用
        function init() {
            updateStats();
            renderCharacterCards();
            renderTextContent();
            initEventListeners();
            initCardDrag();
            
            // 检查浏览器是否支持语音合成
            if (!('speechSynthesis' in window)) {
                alert('您的浏览器不支持语音合成功能，部分功能可能无法正常使用。');
                voiceToggle.style.display = 'none';
                speechEnabled = false;
            }
        }
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
